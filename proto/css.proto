syntax = "proto3";

package css;

option go_package = "github.com/accretional/proto-css/proto/pb/css;csspb";

message CssStyleSheet {
  repeated Alt1 alt1 = 1;

  message Alt1 {
    oneof value {
      AtRule at_rule = 1;

      CssRule css_rule = 2;
    }
  }
}

message CssRule {
  ComplexSelectorList complex_selector_list = 1;

  LeftCurlyBracketKeyword left_curly_bracket_keyword = 2;

  RuleBody rule_body = 3;

  RightCurlyBracketKeyword right_curly_bracket_keyword = 4;
}

message RuleBody {
  repeated Alt1 alt1 = 1;

  message Alt1 {
    oneof value {
      CustomPropertyDecl custom_property_decl = 1;

      Property property = 2;

      NestedCssRule nested_css_rule = 3;

      AtRule at_rule = 4;
    }
  }
}

message CustomPropertyDecl {
  DashedIdentType dashed_ident_type = 1;

  ColonKeyword colon_keyword = 2;

  CustomPropertyValue custom_property_value = 3;

  ExclamationMarkImportant exclamation_mark_important = 4;

  SemicolonKeyword semicolon_keyword = 5;

  message ExclamationMarkImportant {
  }
}

message CustomPropertyValue {
  repeated Alt1 alt1 = 1;

  message Alt1 {
    oneof value {
      IdentType ident_type = 1;

      NumberType number_type = 2;

      LengthType length_type = 3;

      PercentageType percentage_type = 4;

      StringType string_type = 5;

      ColorType color_type = 6;

      CommaKeyword comma_keyword = 7;

      SolidusKeyword solidus_keyword = 8;

      LeftParenthesisKeyword left_parenthesis_keyword = 9;

      RightParenthesisKeyword right_parenthesis_keyword = 10;
    }
  }
}

message NestedCssRule {
  NestedComplexSelectorList nested_complex_selector_list = 1;

  LeftCurlyBracketKeyword left_curly_bracket_keyword = 2;

  RuleBody rule_body = 3;

  RightCurlyBracketKeyword right_curly_bracket_keyword = 4;
}

message Digit {
  string value = 1;
}

message WholeNumber {
  Digit digit = 1;

  repeated Digit digit_2 = 2;
}

message Combinator {
  oneof value {
    ChildCombinator child_combinator = 1;

    ColumnCombinator column_combinator = 2;

    NextSiblingCombinator next_sibling_combinator = 3;

    SubsequentSiblingCombinator subsequent_sibling_combinator = 4;
  }
}

message ChildCombinator {
}

message ColumnCombinator {
}

message NextSiblingCombinator {
}

message SubsequentSiblingCombinator {
}

