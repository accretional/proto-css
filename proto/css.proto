  Namespace namespace = 2;

  NamespacePrefixType namespace_prefix_type = 3;

  Alt1 alt1 = 4;

  SemicolonSymbol semicolon_symbol = 5;

  message Alt1 {
    oneof value {
      StringType string_type = 1;

      UrlType url_type = 2;
    }
  }
}

message PseudoPageType {
  ColonSymbol colon_symbol = 1;

  Alt1 alt1 = 2;

  message Alt1 {
    oneof value {
      Left left = 1;

      Right right = 2;

      First first = 3;

      Blank blank = 4;
    }
  }
}

message PageSelectorType {
  oneof value {
    Seq1 seq1 = 1;

    Seq2 seq2 = 2;
  }

  message Seq1 {
    CustomIdentType custom_ident_type = 1;

    repeated PseudoPageType pseudo_page_type = 2;
  }

  message Seq2 {
    PseudoPageType pseudo_page_type = 1;

    repeated PseudoPageType pseudo_page_type_2 = 2;
  }
}

message PageSizeType {
  oneof value {
    A5 a5 = 1;

    A4 a4 = 2;

    A3 a3 = 3;

    B5 b5 = 4;

    B4 b4 = 5;

    JisB5 jis_b5 = 6;

    JisB4 jis_b4 = 7;

    PageLetter page_letter = 8;

    Legal legal = 9;

    Ledger ledger = 10;
  }
}

message PageOrientationType {
  oneof value {
    Upright upright = 1;

    RotateLeft rotate_left = 2;

    RotateRight rotate_right = 3;
  }
}

message PageSizeDescriptorType {
  oneof value {
    Seq1 seq1 = 1;

    Auto auto = 2;

    PageSizeType page_size_type = 3;

    Seq2 seq2 = 4;

    Portrait portrait = 5;

    Landscape landscape = 6;
  }

  message Seq1 {
    LengthType length_type = 1;

    LengthType length_type_2 = 2;
  }

  message Seq2 {
    PageSizeType page_size_type = 1;

    Alt1 alt1 = 2;

    message Alt1 {
      oneof value {
        Portrait portrait = 1;

        Landscape landscape = 2;
      }
    }
  }
}

message AtPageSizeDesc {
  Size size = 1;

  ColonSymbol colon_symbol = 2;

  PageSizeDescriptorType page_size_descriptor_type = 3;

  SemicolonSymbol semicolon_symbol = 4;
}

message AtPageOrientationDesc {
  PageOrientation page_orientation = 1;

  ColonSymbol colon_symbol = 2;

  PageOrientationType page_orientation_type = 3;

  SemicolonSymbol semicolon_symbol = 4;
}

message AtPageMarginBox {
  CommercialAtSymbol commercial_at_symbol = 1;

  IdentType ident_type = 2;

  LeftCurlyBracketSymbol left_curly_bracket_symbol = 3;

  repeated Property property = 4;

  RightCurlyBracketSymbol right_curly_bracket_symbol = 5;
}

message AtPageBlock {
  repeated Alt1 alt1 = 1;

  message Alt1 {
    oneof value {
      Property property = 1;

      AtPageSizeDesc at_page_size_desc = 2;

      AtPageOrientationDesc at_page_orientation_desc = 3;

      AtPageMarginBox at_page_margin_box = 4;
    }
  }
}

message AtPage {
  CommercialAtSymbol commercial_at_symbol = 1;

  Page page = 2;

  Seq1 seq1 = 3;

  LeftCurlyBracketSymbol left_curly_bracket_symbol = 4;

  AtPageBlock at_page_block = 5;

  RightCurlyBracketSymbol right_curly_bracket_symbol = 6;

  message Seq1 {
    PageSelectorType page_selector_type = 1;

    repeated Seq1 seq1 = 2;

    message Seq1 {
      CommaSymbol comma_symbol = 1;

      PageSelectorType page_selector_type = 2;
    }
  }
}

message AtPositionTry {
  CommercialAtSymbol commercial_at_symbol = 1;

  PositionTry position_try = 2;

  DashedIdentType dashed_ident_type = 3;

  LeftCurlyBracketSymbol left_curly_bracket_symbol = 4;

  DeclarationListType declaration_list_type = 5;

  RightCurlyBracketSymbol right_curly_bracket_symbol = 6;
}

message AtPropertySyntaxDesc {
  Syntax syntax = 1;

  ColonSymbol colon_symbol = 2;

  StringType string_type = 3;

  SemicolonSymbol semicolon_symbol = 4;
}

message AtPropertyInheritsDesc {
  Inherits inherits = 1;

  ColonSymbol colon_symbol = 2;

  Alt1 alt1 = 3;

  SemicolonSymbol semicolon_symbol = 4;

  message Alt1 {
    oneof value {
      True true = 1;

      False false = 2;
    }
  }
}

message AtPropertyInitialValueDesc {
  InitialValue initial_value = 1;

  ColonSymbol colon_symbol = 2;

  DeclarationValueTokenType declaration_value_token_type = 3;

  SemicolonSymbol semicolon_symbol = 4;
}

message AtPropertyBlock {
  repeated Alt1 alt1 = 1;

  message Alt1 {
    oneof value {
      Property property = 1;

      AtPropertySyntaxDesc at_property_syntax_desc = 2;

      AtPropertyInheritsDesc at_property_inherits_desc = 3;

      AtPropertyInitialValueDesc at_property_initial_value_desc = 4;
    }
  }
}

message AtProperty {
  CommercialAtSymbol commercial_at_symbol = 1;

  PropertyKw property_kw = 2;

  CustomPropertyNameType custom_property_name_type = 3;

  LeftCurlyBracketSymbol left_curly_bracket_symbol = 4;

  AtPropertyBlock at_property_block = 5;

  RightCurlyBracketSymbol right_curly_bracket_symbol = 6;
}

message AtScope {
  CommercialAtSymbol commercial_at_symbol = 1;

  Scope scope = 2;

  ScopeBoundariesType scope_boundaries_type = 3;

  LeftCurlyBracketSymbol left_curly_bracket_symbol = 4;

  BlockContentsType block_contents_type = 5;

  RightCurlyBracketSymbol right_curly_bracket_symbol = 6;
}

message AtStartingStyle {
  CommercialAtSymbol commercial_at_symbol = 1;

  StartingStyle starting_style = 2;

  LeftCurlyBracketSymbol left_curly_bracket_symbol = 3;

  RuleListType rule_list_type = 4;

  RightCurlyBracketSymbol right_curly_bracket_symbol = 5;
}

message AtSupports {
  CommercialAtSymbol commercial_at_symbol = 1;

  Supports supports = 2;

  SupportsConditionType supports_condition_type = 3;

  LeftCurlyBracketSymbol left_curly_bracket_symbol = 4;

  RuleListType rule_list_type = 5;

  RightCurlyBracketSymbol right_curly_bracket_symbol = 6;
}

message AtViewTransitionNavigationDesc {
  Navigation navigation = 1;

  ColonSymbol colon_symbol = 2;

  Alt1 alt1 = 3;

  SemicolonSymbol semicolon_symbol = 4;

  message Alt1 {
    oneof value {
      Auto auto = 1;

      None none = 2;
    }
  }
}

message AtViewTransitionTypesDesc {
  Types types = 1;

  ColonSymbol colon_symbol = 2;

  Alt1 alt1 = 3;

  SemicolonSymbol semicolon_symbol = 4;

  message Alt1 {
    oneof value {
      None none = 1;

      Seq1 seq1 = 2;
    }

    message Seq1 {
      CustomIdentType custom_ident_type = 1;

      repeated CustomIdentType custom_ident_type_2 = 2;
    }
  }
}

message AtViewTransitionBlock {
  repeated Alt1 alt1 = 1;

  message Alt1 {
    oneof value {
      AtViewTransitionNavigationDesc at_view_transition_navigation_desc = 1;

      AtViewTransitionTypesDesc at_view_transition_types_desc = 2;
    }
  }
}

message AtViewTransition {
  CommercialAtSymbol commercial_at_symbol = 1;

  ViewTransition view_transition = 2;

  LeftCurlyBracketSymbol left_curly_bracket_symbol = 3;

  AtViewTransitionBlock at_view_transition_block = 4;

  RightCurlyBracketSymbol right_curly_bracket_symbol = 5;
}

