syntax = "proto3";

package css;

option go_package = "github.com/accretional/proto-css/proto/pb/css;csspb";

message CssStyleSheet {
  repeated Alt1 alt1 = 1;

  message Alt1 {
    oneof value {
      AtRule at_rule = 1;

      CssRule css_rule = 2;
    }
  }
}

message CssRule {
  ComplexSelectorList complex_selector_list = 1;

  LeftCurlyBracketSymbol left_curly_bracket_symbol = 2;

  RuleBody rule_body = 3;

  RightCurlyBracketSymbol right_curly_bracket_symbol = 4;
}

message RuleBody {
  repeated Alt1 alt1 = 1;

  message Alt1 {
    oneof value {
      CustomPropertyDecl custom_property_decl = 1;

      Property property = 2;

      NestedCssRule nested_css_rule = 3;

      AtRule at_rule = 4;
    }
  }
}

message CustomPropertyDecl {
  DashedIdentType dashed_ident_type = 1;

  ColonSymbol colon_symbol = 2;

  CustomPropertyValue custom_property_value = 3;

  Seq1 seq1 = 4;

  SemicolonSymbol semicolon_symbol = 5;

  message Seq1 {
    ExclamationMarkSymbol exclamation_mark_symbol = 1;

    Important important = 2;
  }
}

message CustomPropertyValue {
  repeated Alt1 alt1 = 1;

  message Alt1 {
    oneof value {
      IdentType ident_type = 1;

      NumberType number_type = 2;

      LengthType length_type = 3;

      PercentageType percentage_type = 4;

      StringType string_type = 5;

      ColorType color_type = 6;

      CommaSymbol comma_symbol = 7;

      SolidusSymbol solidus_symbol = 8;

      LeftParenthesisSymbol left_parenthesis_symbol = 9;

      RightParenthesisSymbol right_parenthesis_symbol = 10;
    }
  }
}

message NestedCssRule {
  NestedComplexSelectorList nested_complex_selector_list = 1;

  LeftCurlyBracketSymbol left_curly_bracket_symbol = 2;

  RuleBody rule_body = 3;

  RightCurlyBracketSymbol right_curly_bracket_symbol = 4;
}

