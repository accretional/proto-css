<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>inset</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 24px; }
    .demo-card {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      width: 200px;
      height: 180px;
      background: #16213e;
      border-radius: 8px;
      position: relative;
      border: 1px dashed #3a3a5e;
    }
    .positioned {
      position: absolute;
      background: linear-gradient(135deg, rgba(233,69,96,0.7), rgba(15,52,96,0.7));
      border: 2px solid #e94560;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-family: monospace;
      color: #fff;
    }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; text-align: center; max-width: 200px; }
  </style>
</head>
<body>
  <h1>Inset</h1>
  <p class="prop-name">inset</p>
  <div class="demos">
    <div class="demo-card">
      <div class="container">
        <div class="positioned" style="inset: 0;">inset: 0</div>
      </div>
      <p class="label">inset: 0</p>
    </div>
    <div class="demo-card">
      <div class="container">
        <div class="positioned" style="inset: 10px;">inset: 10px</div>
      </div>
      <p class="label">inset: 10px</p>
    </div>
    <div class="demo-card">
      <div class="container">
        <div class="positioned" style="inset: 10px 20px;">inset: 10px 20px</div>
      </div>
      <p class="label">inset: 10px 20px</p>
    </div>
    <div class="demo-card">
      <div class="container">
        <div class="positioned" style="inset: 10px 20px 30px 40px;">10 20 30 40</div>
      </div>
      <p class="label">inset: 10px 20px 30px 40px</p>
    </div>
    <div class="demo-card">
      <div class="container">
        <div class="positioned" style="inset: 25%;">inset: 25%</div>
      </div>
      <p class="label">inset: 25%</p>
    </div>
  </div>
</body>
</html>
