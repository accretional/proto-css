<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>offset-anchor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 20px; }
    .demo-box { background: #16213e; border-radius: 10px; padding: 20px; width: 280px; height: 260px; position: relative; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; text-align: center; }
    .path-container { width: 240px; height: 200px; position: relative; margin: 0 auto; }
    .path-visual { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    .mover {
      width: 40px; height: 40px; background: #e94560; border-radius: 4px;
      position: absolute; top: 0; left: 0;
      offset-path: path("M 20,100 C 60,20 180,20 220,100");
      offset-distance: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: bold; color: #fff;
    }
    .anchor-dot { width: 6px; height: 6px; background: #00ff88; border-radius: 50%; position: absolute; }
    .d1 .mover { offset-anchor: auto; }
    .d1 .anchor-dot { display: none; }
    .d2 .mover { offset-anchor: center; }
    .d2 .anchor-dot { top: 50%; left: 50%; transform: translate(-50%,-50%); }
    .d3 .mover { offset-anchor: top left; }
    .d3 .anchor-dot { top: 0; left: 0; }
    .d4 .mover { offset-anchor: 25% 75%; }
    .d4 .anchor-dot { top: 75%; left: 25%; transform: translate(-50%,-50%); }
    .path-line { fill: none; stroke: #3a3a5c; stroke-width: 2; stroke-dasharray: 4 4; }
  </style>
</head>
<body>
  <h1>Offset Anchor</h1>
  <p class="prop-name">offset-anchor</p>
  <div class="demos">
    <div class="demo-box">
      <div class="path-container d1">
        <svg class="path-visual" viewBox="0 0 240 200"><path d="M 20,100 C 60,20 180,20 220,100" class="path-line"/></svg>
        <div class="mover"><div class="anchor-dot"></div></div>
      </div>
      <div class="label">offset-anchor: auto</div>
    </div>
    <div class="demo-box">
      <div class="path-container d2">
        <svg class="path-visual" viewBox="0 0 240 200"><path d="M 20,100 C 60,20 180,20 220,100" class="path-line"/></svg>
        <div class="mover"><div class="anchor-dot"></div></div>
      </div>
      <div class="label">offset-anchor: center</div>
    </div>
    <div class="demo-box">
      <div class="path-container d3">
        <svg class="path-visual" viewBox="0 0 240 200"><path d="M 20,100 C 60,20 180,20 220,100" class="path-line"/></svg>
        <div class="mover"><div class="anchor-dot"></div></div>
      </div>
      <div class="label">offset-anchor: top left</div>
    </div>
    <div class="demo-box">
      <div class="path-container d4">
        <svg class="path-visual" viewBox="0 0 240 200"><path d="M 20,100 C 60,20 180,20 220,100" class="path-line"/></svg>
        <div class="mover"><div class="anchor-dot"></div></div>
      </div>
      <div class="label">offset-anchor: 25% 75%</div>
    </div>
  </div>
</body>
</html>
