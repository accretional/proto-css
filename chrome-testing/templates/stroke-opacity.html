<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>stroke-opacity</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 24px; justify-content: center; }
    .demo { display: flex; flex-direction: column; align-items: center; background: #16213e; border-radius: 12px; padding: 24px 28px; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>Stroke Opacity</h1>
  <p class="prop-name">stroke-opacity</p>
  <div class="demos">
    <div class="demo">
      <svg width="160" height="160">
        <rect x="20" y="20" width="120" height="120" rx="12" fill="#2a2a4e" stroke="#06b6d4" stroke-width="8" stroke-opacity="0"/>
        <circle cx="80" cy="80" r="40" fill="none" stroke="#f43f5e" stroke-width="6" stroke-opacity="0"/>
      </svg>
      <div class="label">stroke-opacity: 0</div>
    </div>
    <div class="demo">
      <svg width="160" height="160">
        <rect x="20" y="20" width="120" height="120" rx="12" fill="#2a2a4e" stroke="#06b6d4" stroke-width="8" stroke-opacity="0.25"/>
        <circle cx="80" cy="80" r="40" fill="none" stroke="#f43f5e" stroke-width="6" stroke-opacity="0.25"/>
      </svg>
      <div class="label">stroke-opacity: 0.25</div>
    </div>
    <div class="demo">
      <svg width="160" height="160">
        <rect x="20" y="20" width="120" height="120" rx="12" fill="#2a2a4e" stroke="#06b6d4" stroke-width="8" stroke-opacity="0.5"/>
        <circle cx="80" cy="80" r="40" fill="none" stroke="#f43f5e" stroke-width="6" stroke-opacity="0.5"/>
      </svg>
      <div class="label">stroke-opacity: 0.5</div>
    </div>
    <div class="demo">
      <svg width="160" height="160">
        <rect x="20" y="20" width="120" height="120" rx="12" fill="#2a2a4e" stroke="#06b6d4" stroke-width="8" stroke-opacity="0.75"/>
        <circle cx="80" cy="80" r="40" fill="none" stroke="#f43f5e" stroke-width="6" stroke-opacity="0.75"/>
      </svg>
      <div class="label">stroke-opacity: 0.75</div>
    </div>
    <div class="demo">
      <svg width="160" height="160">
        <rect x="20" y="20" width="120" height="120" rx="12" fill="#2a2a4e" stroke="#06b6d4" stroke-width="8" stroke-opacity="1"/>
        <circle cx="80" cy="80" r="40" fill="none" stroke="#f43f5e" stroke-width="6" stroke-opacity="1"/>
      </svg>
      <div class="label">stroke-opacity: 1</div>
    </div>
  </div>
</body>
</html>
