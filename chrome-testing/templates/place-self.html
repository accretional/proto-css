<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>place-self</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 28px; }
    .demo-card {
      background: #16213e;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 370px;
    }
    .grid-container {
      width: 310px;
      height: 200px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 4px;
      border: 2px dashed rgba(255,255,255,0.2);
      border-radius: 6px;
    }
    .grid-item {
      background: rgba(255,255,255,0.08);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 500;
      color: #888;
    }
    .highlight {
      background: linear-gradient(135deg, #e94560, #c23066) !important;
      color: #fff !important;
      font-weight: 700;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 13px;
    }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 10px; text-align: center; }
  </style>
</head>
<body>
  <h1>Place Self</h1>
  <p class="prop-name">place-self</p>
  <div class="demos">

    <div class="demo-card">
      <div class="grid-container">
        <div class="grid-item">.</div>
        <div class="grid-item">.</div>
        <div class="grid-item">.</div>
        <div class="grid-item">.</div>
        <div class="highlight" style="place-self: center;">center</div>
        <div class="grid-item">.</div>
      </div>
      <div class="label">place-self: center<br><span style="color:#6b7280; font-size:10px;">centered in its cell</span></div>
    </div>

    <div class="demo-card">
      <div class="grid-container">
        <div class="grid-item">.</div>
        <div class="grid-item">.</div>
        <div class="grid-item">.</div>
        <div class="grid-item">.</div>
        <div class="highlight" style="place-self: start end;">start end</div>
        <div class="grid-item">.</div>
      </div>
      <div class="label">place-self: start end<br><span style="color:#6b7280; font-size:10px;">top of cell, end horizontally</span></div>
    </div>

    <div class="demo-card">
      <div class="grid-container">
        <div class="grid-item">.</div>
        <div class="grid-item">.</div>
        <div class="grid-item">.</div>
        <div class="grid-item">.</div>
        <div class="highlight" style="place-self: stretch; width: auto; height: auto;">stretch</div>
        <div class="grid-item">.</div>
      </div>
      <div class="label">place-self: stretch<br><span style="color:#6b7280; font-size:10px;">fills entire cell</span></div>
    </div>

  </div>
</body>
</html>
