<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>border-width</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 24px; }
    .demo-box { display: flex; flex-direction: column; align-items: center; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; max-width: 200px; text-align: center; }
    .box {
      width: 160px;
      height: 120px;
      background: #0f3460;
      border-style: solid;
      border-color: #e94560;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #9ca3af;
    }
    .w1 { border-width: 4px; }
    .w2 { border-width: 2px 8px; }
    .w3 { border-width: 2px 6px 10px; }
    .w4 { border-width: 2px 4px 8px 12px; }
  </style>
</head>
<body>
  <h1>Border Width</h1>
  <p class="prop-name">border-width</p>
  <div class="demos">
    <div class="demo-box">
      <div class="box w1">all: 4px</div>
      <span class="label">border-width: 4px</span>
    </div>
    <div class="demo-box">
      <div class="box w2">TB: 2px LR: 8px</div>
      <span class="label">border-width: 2px 8px</span>
    </div>
    <div class="demo-box">
      <div class="box w3">T:2 LR:6 B:10</div>
      <span class="label">border-width: 2px 6px 10px</span>
    </div>
    <div class="demo-box">
      <div class="box w4">T:2 R:4 B:8 L:12</div>
      <span class="label">border-width: 2px 4px 8px 12px</span>
    </div>
  </div>
</body>
</html>
