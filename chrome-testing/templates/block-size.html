<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>block-size</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .section-title { font-size: 13px; color: #9ca3af; margin-bottom: 12px; font-family: monospace; }
    .demos { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 28px; }
    .demo-item { display: flex; flex-direction: column; align-items: flex-start; }
    .box {
      width: 140px;
      background: rgba(102, 126, 234, 0.35);
      border: 2px solid #667eea;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: rgba(255,255,255,0.8);
      padding: 8px;
    }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; }
    .container { height: 200px; display: flex; gap: 16px; }
    .container-v { display: flex; gap: 16px; }
    .v-box {
      writing-mode: vertical-rl;
      background: rgba(240, 147, 251, 0.35);
      border: 2px solid #f093fb;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: rgba(255,255,255,0.8);
      padding: 8px;
      width: 80px;
    }
    .b1 { block-size: auto; }
    .b2 { block-size: 100px; }
    .b3 { block-size: 50%; }
    .b4 { block-size: 160px; }
    .vb1 { block-size: auto; }
    .vb2 { block-size: 120px; }
    .vb3 { block-size: 200px; }
  </style>
</head>
<body>
  <h1>Block Size</h1>
  <p class="prop-name">block-size</p>

  <div class="section-title">writing-mode: horizontal-tb (block = vertical)</div>
  <div class="container">
    <div class="demo-item">
      <div class="box b1">auto</div>
      <div class="label">block-size: auto</div>
    </div>
    <div class="demo-item">
      <div class="box b2">100px</div>
      <div class="label">block-size: 100px</div>
    </div>
    <div class="demo-item">
      <div class="box b3">50%</div>
      <div class="label">block-size: 50%</div>
    </div>
    <div class="demo-item">
      <div class="box b4">160px</div>
      <div class="label">block-size: 160px</div>
    </div>
  </div>

  <div class="section-title" style="margin-top: 24px;">writing-mode: vertical-rl (block = horizontal)</div>
  <div class="container-v">
    <div class="demo-item">
      <div class="v-box vb1">auto</div>
      <div class="label">block-size: auto</div>
    </div>
    <div class="demo-item">
      <div class="v-box vb2">120px</div>
      <div class="label">block-size: 120px</div>
    </div>
    <div class="demo-item">
      <div class="v-box vb3">200px</div>
      <div class="label">block-size: 200px</div>
    </div>
  </div>
</body>
</html>
