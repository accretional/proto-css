<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>filter</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .demo-box { background: #16213e; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; align-items: center; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 10px; text-align: center; }
    .sample { width: 100%; height: 120px; border-radius: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
    .sample-content { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 100%; }
    .color-block { width: 40px; height: 80px; border-radius: 6px; }
    .sample-text { font-size: 16px; font-weight: 700; color: #fff; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
    .no-filter .sample-content { filter: none; }
  </style>
</head>
<body>
  <h1>CSS Filters</h1>
  <p class="prop-name">filter</p>
  <div class="demos">

    <div class="demo-box no-filter">
      <div class="sample" style="background: linear-gradient(135deg, #e94560, #533483, #0f3460);">
        <div class="sample-content">
          <div class="color-block" style="background: #e94560;"></div>
          <div class="color-block" style="background: #f0c040;"></div>
          <div class="color-block" style="background: #40c0f0;"></div>
          <div class="color-block" style="background: #40f060;"></div>
        </div>
      </div>
      <div class="label">filter: none<br>(original)</div>
    </div>

    <div class="demo-box">
      <div class="sample" style="background: linear-gradient(135deg, #e94560, #533483, #0f3460); filter: blur(5px);">
        <div class="sample-content">
          <div class="color-block" style="background: #e94560;"></div>
          <div class="color-block" style="background: #f0c040;"></div>
          <div class="color-block" style="background: #40c0f0;"></div>
          <div class="color-block" style="background: #40f060;"></div>
        </div>
      </div>
      <div class="label">filter: blur(5px)</div>
    </div>

    <div class="demo-box">
      <div class="sample" style="background: linear-gradient(135deg, #e94560, #533483, #0f3460); filter: brightness(1.5);">
        <div class="sample-content">
          <div class="color-block" style="background: #e94560;"></div>
          <div class="color-block" style="background: #f0c040;"></div>
          <div class="color-block" style="background: #40c0f0;"></div>
          <div class="color-block" style="background: #40f060;"></div>
        </div>
      </div>
      <div class="label">filter: brightness(1.5)</div>
    </div>

    <div class="demo-box">
      <div class="sample" style="background: linear-gradient(135deg, #e94560, #533483, #0f3460); filter: contrast(2);">
        <div class="sample-content">
          <div class="color-block" style="background: #e94560;"></div>
          <div class="color-block" style="background: #f0c040;"></div>
          <div class="color-block" style="background: #40c0f0;"></div>
          <div class="color-block" style="background: #40f060;"></div>
        </div>
      </div>
      <div class="label">filter: contrast(2)</div>
    </div>

    <div class="demo-box">
      <div class="sample" style="background: linear-gradient(135deg, #e94560, #533483, #0f3460); filter: grayscale(1);">
        <div class="sample-content">
          <div class="color-block" style="background: #e94560;"></div>
          <div class="color-block" style="background: #f0c040;"></div>
          <div class="color-block" style="background: #40c0f0;"></div>
          <div class="color-block" style="background: #40f060;"></div>
        </div>
      </div>
      <div class="label">filter: grayscale(1)</div>
    </div>

    <div class="demo-box">
      <div class="sample" style="background: linear-gradient(135deg, #e94560, #533483, #0f3460); filter: sepia(1);">
        <div class="sample-content">
          <div class="color-block" style="background: #e94560;"></div>
          <div class="color-block" style="background: #f0c040;"></div>
          <div class="color-block" style="background: #40c0f0;"></div>
          <div class="color-block" style="background: #40f060;"></div>
        </div>
      </div>
      <div class="label">filter: sepia(1)</div>
    </div>

    <div class="demo-box">
      <div class="sample" style="background: linear-gradient(135deg, #e94560, #533483, #0f3460); filter: hue-rotate(90deg);">
        <div class="sample-content">
          <div class="color-block" style="background: #e94560;"></div>
          <div class="color-block" style="background: #f0c040;"></div>
          <div class="color-block" style="background: #40c0f0;"></div>
          <div class="color-block" style="background: #40f060;"></div>
        </div>
      </div>
      <div class="label">filter: hue-rotate(90deg)</div>
    </div>

    <div class="demo-box">
      <div class="sample" style="background: linear-gradient(135deg, #e94560, #533483, #0f3460); filter: invert(1);">
        <div class="sample-content">
          <div class="color-block" style="background: #e94560;"></div>
          <div class="color-block" style="background: #f0c040;"></div>
          <div class="color-block" style="background: #40c0f0;"></div>
          <div class="color-block" style="background: #40f060;"></div>
        </div>
      </div>
      <div class="label">filter: invert(1)</div>
    </div>

    <div class="demo-box">
      <div class="sample" style="background: linear-gradient(135deg, #e94560, #533483, #0f3460); filter: saturate(2);">
        <div class="sample-content">
          <div class="color-block" style="background: #e94560;"></div>
          <div class="color-block" style="background: #f0c040;"></div>
          <div class="color-block" style="background: #40c0f0;"></div>
          <div class="color-block" style="background: #40f060;"></div>
        </div>
      </div>
      <div class="label">filter: saturate(2)</div>
    </div>

    <div class="demo-box" style="grid-column: span 3;">
      <div class="sample" style="background: transparent; height: 80px;">
        <div class="sample-content" style="filter: drop-shadow(4px 4px 8px rgba(233, 69, 96, 0.8));">
          <svg width="60" height="60" viewBox="0 0 60 60">
            <polygon points="30,5 37,22 55,22 40,33 46,50 30,40 14,50 20,33 5,22 23,22" fill="#e94560" />
          </svg>
          <svg width="60" height="60" viewBox="0 0 60 60">
            <circle cx="30" cy="30" r="25" fill="#533483" />
          </svg>
          <svg width="60" height="60" viewBox="0 0 60 60">
            <rect x="5" y="5" width="50" height="50" rx="8" fill="#0f3460" />
          </svg>
        </div>
      </div>
      <div class="label">filter: drop-shadow(4px 4px 8px rgba(233, 69, 96, 0.8))</div>
    </div>

  </div>
</body>
</html>
