<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>r</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-end; }
    .demo-card {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 10px; }
    circle { fill: #e2b714; opacity: 0.85; }
  </style>
</head>
<body>
  <h1>SVG Circle Radius</h1>
  <p class="prop-name">r</p>
  <div class="demos">
    <div class="demo-card">
      <svg width="40" height="40" viewBox="0 0 40 40">
        <circle cx="20" cy="20" r="10" />
      </svg>
      <div class="label">r: 10</div>
    </div>
    <div class="demo-card">
      <svg width="70" height="70" viewBox="0 0 70 70">
        <circle cx="35" cy="35" r="25" />
      </svg>
      <div class="label">r: 25</div>
    </div>
    <div class="demo-card">
      <svg width="120" height="120" viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="50" />
      </svg>
      <div class="label">r: 50</div>
    </div>
    <div class="demo-card">
      <svg width="170" height="170" viewBox="0 0 170 170">
        <circle cx="85" cy="85" r="75" />
      </svg>
      <div class="label">r: 75</div>
    </div>
    <div class="demo-card">
      <svg width="220" height="220" viewBox="0 0 220 220">
        <circle cx="110" cy="110" r="100" />
      </svg>
      <div class="label">r: 100</div>
    </div>
  </div>
</body>
</html>
