<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>border-bottom-right-radius</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 20px; }
    .demo-box {
      width: 140px;
      height: 140px;
      background: #3498db;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #fff;
      border: 3px solid #5dade2;
    }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; }
    .demo-item { display: flex; flex-direction: column; align-items: center; }
  </style>
</head>
<body>
  <h1>Border Bottom Right Radius</h1>
  <p class="prop-name">border-bottom-right-radius</p>
  <div class="demos">
    <div class="demo-item">
      <div class="demo-box" style="border-bottom-right-radius: 0;">0</div>
      <p class="label">border-bottom-right-radius: 0</p>
    </div>
    <div class="demo-item">
      <div class="demo-box" style="border-bottom-right-radius: 10px;">10px</div>
      <p class="label">border-bottom-right-radius: 10px</p>
    </div>
    <div class="demo-item">
      <div class="demo-box" style="border-bottom-right-radius: 25px;">25px</div>
      <p class="label">border-bottom-right-radius: 25px</p>
    </div>
    <div class="demo-item">
      <div class="demo-box" style="border-bottom-right-radius: 50px;">50px</div>
      <p class="label">border-bottom-right-radius: 50px</p>
    </div>
    <div class="demo-item">
      <div class="demo-box" style="border-bottom-right-radius: 50%;">50%</div>
      <p class="label">border-bottom-right-radius: 50%</p>
    </div>
  </div>
</body>
</html>
