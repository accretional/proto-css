<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>offset-position</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 20px; }
    .demo-box { background: #16213e; border-radius: 10px; padding: 20px; width: 280px; height: 300px; position: relative; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; text-align: center; position: absolute; bottom: 12px; left: 0; right: 0; }
    .grid-area {
      width: 240px; height: 240px; position: relative; margin: 0 auto;
      background: repeating-linear-gradient(0deg, transparent, transparent 59px, #2a2a4a 59px, #2a2a4a 60px),
                  repeating-linear-gradient(90deg, transparent, transparent 59px, #2a2a4a 59px, #2a2a4a 60px);
    }
    .start-marker {
      width: 16px; height: 16px; background: #00ff88; border-radius: 50%;
      position: absolute;
      box-shadow: 0 0 10px rgba(0,255,136,0.6);
    }
    .mover {
      width: 24px; height: 24px; background: #e94560; border-radius: 4px;
      position: absolute;
      offset-path: path("M 0,0 L 80,0");
      offset-distance: 100%;
      box-shadow: 0 0 10px rgba(233,69,96,0.5);
    }
    .d1 .start-marker { top: 0; left: 0; }
    .d1 .mover { offset-position: auto; top: 0; left: 0; }
    .d2 .start-marker { top: calc(50% - 8px); left: calc(50% - 8px); }
    .d2 .mover { offset-position: 50% 50%; }
    .d3 .start-marker { top: 0; left: 0; }
    .d3 .mover { offset-position: 0% 0%; }
    .d4 .start-marker { bottom: 0; right: 0; }
    .d4 .mover { offset-position: 100% 100%; }
    .crosshair { position: absolute; width: 100%; height: 100%; top: 0; left: 0; pointer-events: none; }
    .ch { stroke: #4a4a6a; stroke-width: 1; stroke-dasharray: 3 3; }
  </style>
</head>
<body>
  <h1>Offset Position</h1>
  <p class="prop-name">offset-position</p>
  <div class="demos">
    <div class="demo-box">
      <div class="grid-area d1">
        <div class="start-marker"></div>
        <div class="mover"></div>
      </div>
      <div class="label">offset-position: auto</div>
    </div>
    <div class="demo-box">
      <div class="grid-area d2">
        <svg class="crosshair" viewBox="0 0 240 240">
          <line x1="120" y1="0" x2="120" y2="240" class="ch"/>
          <line x1="0" y1="120" x2="240" y2="120" class="ch"/>
        </svg>
        <div class="start-marker"></div>
        <div class="mover"></div>
      </div>
      <div class="label">offset-position: 50% 50%</div>
    </div>
    <div class="demo-box">
      <div class="grid-area d3">
        <svg class="crosshair" viewBox="0 0 240 240">
          <line x1="0" y1="0" x2="0" y2="240" class="ch"/>
          <line x1="0" y1="0" x2="240" y2="0" class="ch"/>
        </svg>
        <div class="start-marker"></div>
        <div class="mover"></div>
      </div>
      <div class="label">offset-position: 0% 0%</div>
    </div>
    <div class="demo-box">
      <div class="grid-area d4">
        <svg class="crosshair" viewBox="0 0 240 240">
          <line x1="240" y1="0" x2="240" y2="240" class="ch"/>
          <line x1="0" y1="240" x2="240" y2="240" class="ch"/>
        </svg>
        <div class="start-marker"></div>
        <div class="mover"></div>
      </div>
      <div class="label">offset-position: 100% 100%</div>
    </div>
  </div>
</body>
</html>
