<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>border-left</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 20px; }
    .demo-box {
      width: 180px;
      height: 100px;
      background: #16213e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #c0c0c0;
      border-radius: 4px;
    }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; }
    .demo-item { display: flex; flex-direction: column; align-items: flex-start; }
  </style>
</head>
<body>
  <h1>Border Left</h1>
  <p class="prop-name">border-left</p>
  <div class="demos">
    <div class="demo-item">
      <div class="demo-box" style="border-left: 4px solid #e74c3c;">Content</div>
      <span class="label">border-left: 4px solid #e74c3c</span>
    </div>
    <div class="demo-item">
      <div class="demo-box" style="border-left: 6px dashed #3498db;">Content</div>
      <span class="label">border-left: 6px dashed #3498db</span>
    </div>
    <div class="demo-item">
      <div class="demo-box" style="border-left: 3px dotted #2ecc71;">Content</div>
      <span class="label">border-left: 3px dotted #2ecc71</span>
    </div>
    <div class="demo-item">
      <div class="demo-box" style="border-left: 6px double #f39c12;">Content</div>
      <span class="label">border-left: 6px double #f39c12</span>
    </div>
    <div class="demo-item">
      <div class="demo-box" style="border-left: 8px solid #9b59b6;">Content</div>
      <span class="label">border-left: 8px solid #9b59b6</span>
    </div>
    <div class="demo-item">
      <div class="demo-box" style="border-left: 5px groove #7f8c8d;">Content</div>
      <span class="label">border-left: 5px groove #7f8c8d</span>
    </div>
  </div>
</body>
</html>
