<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>text-combine-upright</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 28px; }
    .demo-card { background: #16213e; border-radius: 12px; padding: 24px; min-width: 240px; flex: 1; display: flex; flex-direction: column; align-items: center; }
    .vertical-text { writing-mode: vertical-rl; font-size: 24px; line-height: 1.8; height: 420px; padding: 16px; background: #0f1a30; border-radius: 8px; border: 1px solid #2a2a4a; }
    .vertical-text .combine { color: #f59e0b; font-weight: bold; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 12px; text-align: center; }
  </style>
</head>
<body>
  <h1>Text Combine Upright</h1>
  <p class="prop-name">text-combine-upright</p>
  <div class="demos">
    <div class="demo-card">
      <div class="vertical-text">
        令和<span class="combine" style="text-combine-upright: none;">6</span>年<span class="combine" style="text-combine-upright: none;">12</span>月<span class="combine" style="text-combine-upright: none;">25</span>日
      </div>
      <p class="label">text-combine-upright: none</p>
    </div>
    <div class="demo-card">
      <div class="vertical-text">
        令和<span class="combine" style="text-combine-upright: all;">6</span>年<span class="combine" style="text-combine-upright: all;">12</span>月<span class="combine" style="text-combine-upright: all;">25</span>日
      </div>
      <p class="label">text-combine-upright: all</p>
    </div>
    <div class="demo-card">
      <div class="vertical-text">
        令和<span class="combine" style="text-combine-upright: digits 2;">6</span>年<span class="combine" style="text-combine-upright: digits 2;">12</span>月<span class="combine" style="text-combine-upright: digits 2;">25</span>日
      </div>
      <p class="label">text-combine-upright: digits 2</p>
    </div>
  </div>
</body>
</html>
