<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>text-emphasis-color</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 20px; }
    .demo-card { background: #16213e; border-radius: 12px; padding: 24px; min-width: 260px; flex: 1; }
    .sample { font-size: 28px; padding: 24px 16px; background: #0f1a30; border-radius: 8px; border: 1px solid #2a2a4a; line-height: 2; text-emphasis-style: filled dot; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>Text Emphasis Color</h1>
  <p class="prop-name">text-emphasis-color</p>
  <div class="demos">
    <div class="demo-card">
      <div class="sample" style="text-emphasis-color: #ef4444;">Emphasis Color</div>
      <p class="label">text-emphasis-color: red</p>
    </div>
    <div class="demo-card">
      <div class="sample" style="text-emphasis-color: #3b82f6;">Emphasis Color</div>
      <p class="label">text-emphasis-color: blue</p>
    </div>
    <div class="demo-card">
      <div class="sample" style="text-emphasis-color: #10b981;">Emphasis Color</div>
      <p class="label">text-emphasis-color: green</p>
    </div>
    <div class="demo-card">
      <div class="sample" style="text-emphasis-color: #f59e0b;">Emphasis Color</div>
      <p class="label">text-emphasis-color: gold</p>
    </div>
    <div class="demo-card">
      <div class="sample" style="text-emphasis-color: #ec4899;">Emphasis Color</div>
      <p class="label">text-emphasis-color: pink</p>
    </div>
  </div>
</body>
</html>
