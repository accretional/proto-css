<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>fill-opacity</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; gap: 20px; justify-content: center; }
    .demo-box { background: #16213e; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; align-items: center; flex: 1; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 12px; text-align: center; }
  </style>
</head>
<body>
  <h1>SVG Fill Opacity</h1>
  <p class="prop-name">fill-opacity</p>
  <div class="demos">

    <div class="demo-box">
      <svg width="140" height="160" viewBox="0 0 140 160">
        <!-- Checkerboard background to show transparency -->
        <defs>
          <pattern id="checker0" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
            <rect width="10" height="10" fill="#2a2a4a"/>
            <rect x="10" y="10" width="10" height="10" fill="#2a2a4a"/>
            <rect x="10" width="10" height="10" fill="#1a1a3a"/>
            <rect y="10" width="10" height="10" fill="#1a1a3a"/>
          </pattern>
        </defs>
        <rect width="140" height="160" fill="url(#checker0)" rx="8"/>
        <circle cx="70" cy="80" r="55" fill="#e94560" fill-opacity="0" />
        <text x="70" y="150" text-anchor="middle" fill="#6b7280" font-size="11" font-family="monospace">invisible</text>
      </svg>
      <div class="label">fill-opacity: 0</div>
    </div>

    <div class="demo-box">
      <svg width="140" height="160" viewBox="0 0 140 160">
        <defs>
          <pattern id="checker1" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
            <rect width="10" height="10" fill="#2a2a4a"/>
            <rect x="10" y="10" width="10" height="10" fill="#2a2a4a"/>
            <rect x="10" width="10" height="10" fill="#1a1a3a"/>
            <rect y="10" width="10" height="10" fill="#1a1a3a"/>
          </pattern>
        </defs>
        <rect width="140" height="160" fill="url(#checker1)" rx="8"/>
        <circle cx="70" cy="80" r="55" fill="#e94560" fill-opacity="0.25" />
      </svg>
      <div class="label">fill-opacity: 0.25</div>
    </div>

    <div class="demo-box">
      <svg width="140" height="160" viewBox="0 0 140 160">
        <defs>
          <pattern id="checker2" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
            <rect width="10" height="10" fill="#2a2a4a"/>
            <rect x="10" y="10" width="10" height="10" fill="#2a2a4a"/>
            <rect x="10" width="10" height="10" fill="#1a1a3a"/>
            <rect y="10" width="10" height="10" fill="#1a1a3a"/>
          </pattern>
        </defs>
        <rect width="140" height="160" fill="url(#checker2)" rx="8"/>
        <circle cx="70" cy="80" r="55" fill="#e94560" fill-opacity="0.5" />
      </svg>
      <div class="label">fill-opacity: 0.5</div>
    </div>

    <div class="demo-box">
      <svg width="140" height="160" viewBox="0 0 140 160">
        <defs>
          <pattern id="checker3" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
            <rect width="10" height="10" fill="#2a2a4a"/>
            <rect x="10" y="10" width="10" height="10" fill="#2a2a4a"/>
            <rect x="10" width="10" height="10" fill="#1a1a3a"/>
            <rect y="10" width="10" height="10" fill="#1a1a3a"/>
          </pattern>
        </defs>
        <rect width="140" height="160" fill="url(#checker3)" rx="8"/>
        <circle cx="70" cy="80" r="55" fill="#e94560" fill-opacity="0.75" />
      </svg>
      <div class="label">fill-opacity: 0.75</div>
    </div>

    <div class="demo-box">
      <svg width="140" height="160" viewBox="0 0 140 160">
        <defs>
          <pattern id="checker4" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
            <rect width="10" height="10" fill="#2a2a4a"/>
            <rect x="10" y="10" width="10" height="10" fill="#2a2a4a"/>
            <rect x="10" width="10" height="10" fill="#1a1a3a"/>
            <rect y="10" width="10" height="10" fill="#1a1a3a"/>
          </pattern>
        </defs>
        <rect width="140" height="160" fill="url(#checker4)" rx="8"/>
        <circle cx="70" cy="80" r="55" fill="#e94560" fill-opacity="1" />
      </svg>
      <div class="label">fill-opacity: 1</div>
    </div>

  </div>
</body>
</html>
