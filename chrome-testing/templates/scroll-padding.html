<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>scroll-padding</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; gap: 24px; flex-wrap: wrap; }
    .demo-card { flex: 1; min-width: 220px; }
    .scroll-wrapper {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
    }
    .scroll-container {
      width: 100%;
      height: 260px;
      overflow-y: auto;
      border: 2px solid #333;
      border-radius: 10px;
      background: #16213e;
      scroll-snap-type: y mandatory;
    }
    .sp0 { scroll-padding: 0px; }
    .sp10 { scroll-padding: 10px; }
    .sp30 { scroll-padding: 30px; }
    .sp50 { scroll-padding: 50px; }

    .snap-item {
      height: 130px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      scroll-snap-align: start;
      border-bottom: 1px solid #2a2a4a;
    }
    .snap-item:nth-child(1) { background: linear-gradient(135deg, #6366f1, #8b5cf6); }
    .snap-item:nth-child(2) { background: #22224a; }
    .snap-item:nth-child(3) { background: linear-gradient(135deg, #ec4899, #f43f5e); }
    .snap-item:nth-child(4) { background: #22224a; }
    .snap-item:nth-child(5) { background: linear-gradient(135deg, #14b8a6, #06b6d4); }

    .padding-overlay {
      position: absolute;
      background: rgba(251, 191, 36, 0.1);
      border: 1px dashed #fbbf24;
      pointer-events: none;
      z-index: 2;
      top: 0; left: 0; right: 0;
    }

    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; margin-bottom: 8px; }
    .note { font-size: 10px; color: #6b7280; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>Scroll Padding</h1>
  <p class="prop-name">scroll-padding</p>
  <div class="demos">
    <div class="demo-card">
      <p class="label">scroll-padding: 0px</p>
      <div class="scroll-wrapper">
        <div class="scroll-container sp0">
          <div class="snap-item">1</div>
          <div class="snap-item">2</div>
          <div class="snap-item">3</div>
          <div class="snap-item">4</div>
          <div class="snap-item">5</div>
        </div>
      </div>
      <p class="note">Snap aligns flush to edge</p>
    </div>
    <div class="demo-card">
      <p class="label">scroll-padding: 10px</p>
      <div class="scroll-wrapper">
        <div class="padding-overlay" style="height:10px;"></div>
        <div class="scroll-container sp10">
          <div class="snap-item">1</div>
          <div class="snap-item">2</div>
          <div class="snap-item">3</div>
          <div class="snap-item">4</div>
          <div class="snap-item">5</div>
        </div>
      </div>
      <p class="note">10px inset on all sides</p>
    </div>
    <div class="demo-card">
      <p class="label">scroll-padding: 30px</p>
      <div class="scroll-wrapper">
        <div class="padding-overlay" style="height:30px;"></div>
        <div class="scroll-container sp30">
          <div class="snap-item">1</div>
          <div class="snap-item">2</div>
          <div class="snap-item">3</div>
          <div class="snap-item">4</div>
          <div class="snap-item">5</div>
        </div>
      </div>
      <p class="note">30px inset on all sides</p>
    </div>
    <div class="demo-card">
      <p class="label">scroll-padding: 50px</p>
      <div class="scroll-wrapper">
        <div class="padding-overlay" style="height:50px;"></div>
        <div class="scroll-container sp50">
          <div class="snap-item">1</div>
          <div class="snap-item">2</div>
          <div class="snap-item">3</div>
          <div class="snap-item">4</div>
          <div class="snap-item">5</div>
        </div>
      </div>
      <p class="note">50px inset on all sides</p>
    </div>
  </div>
</body>
</html>
