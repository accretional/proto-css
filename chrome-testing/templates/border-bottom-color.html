<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>border-bottom-color</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 20px; }
    .demo-box {
      width: 180px;
      height: 100px;
      background: #16213e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #c0c0c0;
      border-bottom-style: solid;
      border-bottom-width: 5px;
    }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; }
    .demo-item { display: flex; flex-direction: column; align-items: center; }
  </style>
</head>
<body>
  <h1>Border Bottom Color</h1>
  <p class="prop-name">border-bottom-color</p>
  <div class="demos">
    <div class="demo-item">
      <div class="demo-box" style="border-bottom-color: #e94560;">Content</div>
      <p class="label">border-bottom-color: #e94560</p>
    </div>
    <div class="demo-item">
      <div class="demo-box" style="border-bottom-color: #3498db;">Content</div>
      <p class="label">border-bottom-color: #3498db</p>
    </div>
    <div class="demo-item">
      <div class="demo-box" style="border-bottom-color: #2ecc71;">Content</div>
      <p class="label">border-bottom-color: #2ecc71</p>
    </div>
    <div class="demo-item">
      <div class="demo-box" style="border-bottom-color: #f39c12;">Content</div>
      <p class="label">border-bottom-color: #f39c12</p>
    </div>
    <div class="demo-item">
      <div class="demo-box" style="border-bottom-color: #9b59b6;">Content</div>
      <p class="label">border-bottom-color: #9b59b6</p>
    </div>
    <div class="demo-item">
      <div class="demo-box" style="border-bottom-color: #1abc9c;">Content</div>
      <p class="label">border-bottom-color: #1abc9c</p>
    </div>
  </div>
</body>
</html>
