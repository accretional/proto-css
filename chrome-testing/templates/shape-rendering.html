<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>shape-rendering</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px 40px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
    .demo-card {
      background: #16213e;
      border-radius: 12px;
      padding: 20px;
      border: 1px solid #2a2a4a;
      text-align: center;
    }
    .label { font-size: 11px; font-family: monospace; color: #a78bfa; margin-bottom: 16px; background: #1a1a2e; display: inline-block; padding: 3px 8px; border-radius: 4px; }
    svg { display: block; margin: 0 auto; }
    .note { font-size: 10px; color: #6b7280; margin-top: 12px; }
  </style>
</head>
<body>
  <h1>Shape Rendering</h1>
  <p class="prop-name">shape-rendering</p>
  <div class="demos">
    <div class="demo-card">
      <div class="label">shape-rendering: auto</div>
      <svg width="220" height="520" viewBox="0 0 220 520">
        <circle cx="110" cy="60" r="45" fill="none" stroke="#8b5cf6" stroke-width="2" shape-rendering="auto"/>
        <rect x="40" y="130" width="140" height="80" rx="4" fill="none" stroke="#6366f1" stroke-width="2" shape-rendering="auto"/>
        <polygon points="110,240 160,320 60,320" fill="none" stroke="#a78bfa" stroke-width="2" shape-rendering="auto"/>
        <ellipse cx="110" cy="380" rx="70" ry="40" fill="none" stroke="#7c3aed" stroke-width="2" shape-rendering="auto"/>
        <line x1="30" y1="450" x2="190" y2="510" stroke="#c4b5fd" stroke-width="2" shape-rendering="auto"/>
        <path d="M30,470 Q110,430 190,470" fill="none" stroke="#ddd6fe" stroke-width="2" shape-rendering="auto"/>
      </svg>
      <p class="note">Browser chooses best tradeoff</p>
    </div>
    <div class="demo-card">
      <div class="label">shape-rendering: optimizeSpeed</div>
      <svg width="220" height="520" viewBox="0 0 220 520">
        <circle cx="110" cy="60" r="45" fill="none" stroke="#8b5cf6" stroke-width="2" shape-rendering="optimizeSpeed"/>
        <rect x="40" y="130" width="140" height="80" rx="4" fill="none" stroke="#6366f1" stroke-width="2" shape-rendering="optimizeSpeed"/>
        <polygon points="110,240 160,320 60,320" fill="none" stroke="#a78bfa" stroke-width="2" shape-rendering="optimizeSpeed"/>
        <ellipse cx="110" cy="380" rx="70" ry="40" fill="none" stroke="#7c3aed" stroke-width="2" shape-rendering="optimizeSpeed"/>
        <line x1="30" y1="450" x2="190" y2="510" stroke="#c4b5fd" stroke-width="2" shape-rendering="optimizeSpeed"/>
        <path d="M30,470 Q110,430 190,470" fill="none" stroke="#ddd6fe" stroke-width="2" shape-rendering="optimizeSpeed"/>
      </svg>
      <p class="note">Speed over quality; aliased edges</p>
    </div>
    <div class="demo-card">
      <div class="label">shape-rendering: crispEdges</div>
      <svg width="220" height="520" viewBox="0 0 220 520">
        <circle cx="110" cy="60" r="45" fill="none" stroke="#8b5cf6" stroke-width="2" shape-rendering="crispEdges"/>
        <rect x="40" y="130" width="140" height="80" rx="4" fill="none" stroke="#6366f1" stroke-width="2" shape-rendering="crispEdges"/>
        <polygon points="110,240 160,320 60,320" fill="none" stroke="#a78bfa" stroke-width="2" shape-rendering="crispEdges"/>
        <ellipse cx="110" cy="380" rx="70" ry="40" fill="none" stroke="#7c3aed" stroke-width="2" shape-rendering="crispEdges"/>
        <line x1="30" y1="450" x2="190" y2="510" stroke="#c4b5fd" stroke-width="2" shape-rendering="crispEdges"/>
        <path d="M30,470 Q110,430 190,470" fill="none" stroke="#ddd6fe" stroke-width="2" shape-rendering="crispEdges"/>
      </svg>
      <p class="note">Crisp pixel-aligned edges, no AA</p>
    </div>
    <div class="demo-card">
      <div class="label">shape-rendering: geometricPrecision</div>
      <svg width="220" height="520" viewBox="0 0 220 520">
        <circle cx="110" cy="60" r="45" fill="none" stroke="#8b5cf6" stroke-width="2" shape-rendering="geometricPrecision"/>
        <rect x="40" y="130" width="140" height="80" rx="4" fill="none" stroke="#6366f1" stroke-width="2" shape-rendering="geometricPrecision"/>
        <polygon points="110,240 160,320 60,320" fill="none" stroke="#a78bfa" stroke-width="2" shape-rendering="geometricPrecision"/>
        <ellipse cx="110" cy="380" rx="70" ry="40" fill="none" stroke="#7c3aed" stroke-width="2" shape-rendering="geometricPrecision"/>
        <line x1="30" y1="450" x2="190" y2="510" stroke="#c4b5fd" stroke-width="2" shape-rendering="geometricPrecision"/>
        <path d="M30,470 Q110,430 190,470" fill="none" stroke="#ddd6fe" stroke-width="2" shape-rendering="geometricPrecision"/>
      </svg>
      <p class="note">Best geometric accuracy</p>
    </div>
  </div>
</body>
</html>
