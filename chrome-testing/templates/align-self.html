<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>align-self</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 20px; }
    .demo-box {
      background: #16213e;
      border-radius: 12px;
      padding: 16px;
      width: 220px;
    }
    .flex-container {
      display: flex;
      align-items: flex-start;
      width: 180px;
      height: 160px;
      background: #0f3460;
      border-radius: 8px;
      gap: 8px;
      padding: 8px;
    }
    .flex-container .item {
      width: 36px;
      height: 40px;
      background: #4a5568;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: #aaa;
    }
    .flex-container .highlight {
      background: #e94560;
      color: #fff;
      font-weight: bold;
    }
    .as-auto .highlight { align-self: auto; }
    .as-start .highlight { align-self: flex-start; }
    .as-center .highlight { align-self: center; }
    .as-end .highlight { align-self: flex-end; }
    .as-stretch .highlight { align-self: stretch; height: auto; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>Align Self</h1>
  <p class="prop-name">align-self</p>
  <div class="demos">
    <div class="demo-box">
      <div class="flex-container as-auto">
        <div class="item">A</div><div class="item highlight">B</div><div class="item">C</div><div class="item">D</div>
      </div>
      <div class="label">align-self: auto</div>
    </div>
    <div class="demo-box">
      <div class="flex-container as-start">
        <div class="item">A</div><div class="item highlight">B</div><div class="item">C</div><div class="item">D</div>
      </div>
      <div class="label">align-self: flex-start</div>
    </div>
    <div class="demo-box">
      <div class="flex-container as-center">
        <div class="item">A</div><div class="item highlight">B</div><div class="item">C</div><div class="item">D</div>
      </div>
      <div class="label">align-self: center</div>
    </div>
    <div class="demo-box">
      <div class="flex-container as-end">
        <div class="item">A</div><div class="item highlight">B</div><div class="item">C</div><div class="item">D</div>
      </div>
      <div class="label">align-self: flex-end</div>
    </div>
    <div class="demo-box">
      <div class="flex-container as-stretch">
        <div class="item">A</div><div class="item highlight">B</div><div class="item">C</div><div class="item">D</div>
      </div>
      <div class="label">align-self: stretch</div>
    </div>
  </div>
</body>
</html>
