<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>letter-spacing</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-direction: column; gap: 16px; }
    .demo-card { background: #16213e; border-radius: 12px; padding: 18px 24px; display: flex; align-items: center; gap: 24px; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; min-width: 200px; text-align: right; }
    .sample-text { font-size: 22px; color: #fff; font-weight: 500; }
  </style>
</head>
<body>
  <h1>Letter Spacing</h1>
  <p class="prop-name">letter-spacing</p>
  <div class="demos">
    <div class="demo-card">
      <div class="label">letter-spacing: -1px</div>
      <div class="sample-text" style="letter-spacing: -1px;">The quick brown fox</div>
    </div>
    <div class="demo-card">
      <div class="label">letter-spacing: normal</div>
      <div class="sample-text" style="letter-spacing: normal;">The quick brown fox</div>
    </div>
    <div class="demo-card">
      <div class="label">letter-spacing: 1px</div>
      <div class="sample-text" style="letter-spacing: 1px;">The quick brown fox</div>
    </div>
    <div class="demo-card">
      <div class="label">letter-spacing: 3px</div>
      <div class="sample-text" style="letter-spacing: 3px;">The quick brown fox</div>
    </div>
    <div class="demo-card">
      <div class="label">letter-spacing: 5px</div>
      <div class="sample-text" style="letter-spacing: 5px;">The quick brown fox</div>
    </div>
    <div class="demo-card">
      <div class="label">letter-spacing: 10px</div>
      <div class="sample-text" style="letter-spacing: 10px;">The quick brown fox</div>
    </div>
  </div>
</body>
</html>
