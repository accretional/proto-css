<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>scroll-margin-inline-start</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-direction: column; gap: 20px; }
    .demo-card { }
    .scroll-container {
      width: 100%;
      height: 120px;
      overflow-x: auto;
      overflow-y: hidden;
      border: 2px solid #333;
      border-radius: 10px;
      background: #16213e;
      scroll-snap-type: x mandatory;
      display: flex;
      position: relative;
    }
    .snap-item {
      min-width: 300px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 700;
      scroll-snap-align: start;
      flex-shrink: 0;
    }
    .snap-item:nth-child(odd) { background: linear-gradient(135deg, #06b6d4, #14b8a6); }
    .snap-item:nth-child(even) { background: #22224a; }

    .smis0 .snap-item { scroll-margin-inline-start: 0px; }
    .smis15 .snap-item { scroll-margin-inline-start: 15px; }
    .smis30 .snap-item { scroll-margin-inline-start: 30px; }
    .smis50 .snap-item { scroll-margin-inline-start: 50px; }

    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; margin-bottom: 6px; }
    .indicator-left {
      position: absolute;
      top: 0;
      bottom: 0;
      border-left: 2px dashed #fbbf24;
      pointer-events: none;
      z-index: 2;
    }
  </style>
</head>
<body>
  <h1>Scroll Margin Inline Start</h1>
  <p class="prop-name">scroll-margin-inline-start</p>
  <div class="demos">
    <div class="demo-card">
      <p class="label">scroll-margin-inline-start: 0px</p>
      <div class="scroll-container smis0">
        <div class="snap-item">1</div>
        <div class="snap-item">2</div>
        <div class="snap-item">3</div>
        <div class="snap-item">4</div>
        <div class="snap-item">5</div>
      </div>
    </div>
    <div class="demo-card">
      <p class="label">scroll-margin-inline-start: 15px</p>
      <div class="scroll-container smis15">
        <div class="indicator-left" style="left:15px;"></div>
        <div class="snap-item">1</div>
        <div class="snap-item">2</div>
        <div class="snap-item">3</div>
        <div class="snap-item">4</div>
        <div class="snap-item">5</div>
      </div>
    </div>
    <div class="demo-card">
      <p class="label">scroll-margin-inline-start: 30px</p>
      <div class="scroll-container smis30">
        <div class="indicator-left" style="left:30px;"></div>
        <div class="snap-item">1</div>
        <div class="snap-item">2</div>
        <div class="snap-item">3</div>
        <div class="snap-item">4</div>
        <div class="snap-item">5</div>
      </div>
    </div>
    <div class="demo-card">
      <p class="label">scroll-margin-inline-start: 50px</p>
      <div class="scroll-container smis50">
        <div class="indicator-left" style="left:50px;"></div>
        <div class="snap-item">1</div>
        <div class="snap-item">2</div>
        <div class="snap-item">3</div>
        <div class="snap-item">4</div>
        <div class="snap-item">5</div>
      </div>
    </div>
  </div>
</body>
</html>
