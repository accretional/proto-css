<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>font-palette</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 24px; }
    .demo-card {
      background: #16213e; border-radius: 12px; padding: 28px; flex: 1; min-width: 340px;
      border: 1px solid #2a2a4a; text-align: center;
    }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 12px; }
    .tag {
      display: inline-block; background: #7c3aed33; color: #a78bfa; font-size: 11px;
      font-family: monospace; padding: 2px 8px; border-radius: 4px; margin-bottom: 14px;
    }
    .demo-text {
      font-size: 52px; line-height: 1.3; color: #fff;
    }
    .pal-normal { font-palette: normal; }
    .pal-light { font-palette: light; }
    .pal-dark { font-palette: dark; }
    .color-swatch {
      display: flex; gap: 6px; justify-content: center; margin-top: 12px;
    }
    .swatch {
      width: 24px; height: 24px; border-radius: 6px; border: 1px solid #3a3a5a;
    }
    .note { font-size: 11px; color: #6b7280; margin-top: 8px; font-style: italic; }
  </style>
</head>
<body>
  <h1>Font Palette</h1>
  <p class="prop-name">font-palette</p>
  <div class="demos">
    <div class="demo-card">
      <div class="tag">normal</div>
      <div class="demo-text pal-normal">🎨 Abc</div>
      <div class="color-swatch">
        <div class="swatch" style="background: #e0e0e0;"></div>
        <div class="swatch" style="background: #a0a0a0;"></div>
        <div class="swatch" style="background: #606060;"></div>
      </div>
      <p class="label">font-palette: normal</p>
      <p class="note">Default color palette of the font</p>
    </div>
    <div class="demo-card">
      <div class="tag">light</div>
      <div class="demo-text pal-light">🎨 Abc</div>
      <div class="color-swatch">
        <div class="swatch" style="background: #f8f8f8;"></div>
        <div class="swatch" style="background: #d0d0d0;"></div>
        <div class="swatch" style="background: #b0b0b0;"></div>
      </div>
      <p class="label">font-palette: light</p>
      <p class="note">Light palette suitable for light backgrounds</p>
    </div>
    <div class="demo-card">
      <div class="tag">dark</div>
      <div class="demo-text pal-dark">🎨 Abc</div>
      <div class="color-swatch">
        <div class="swatch" style="background: #404040;"></div>
        <div class="swatch" style="background: #606060;"></div>
        <div class="swatch" style="background: #808080;"></div>
      </div>
      <p class="label">font-palette: dark</p>
      <p class="note">Dark palette suitable for dark backgrounds</p>
    </div>
  </div>
</body>
</html>
