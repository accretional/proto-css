<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>scale</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 32px; align-items: center; justify-content: center; }
    .demo-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 170px;
      height: 200px;
      justify-content: center;
    }
    .box-wrapper {
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .box-wrapper::before {
      content: '';
      position: absolute;
      width: 80px;
      height: 80px;
      border: 1px dashed #444;
      border-radius: 8px;
    }
    .box {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
    }
    .s-none { scale: none; }
    .s-half { scale: 0.5; }
    .s-1 { scale: 1; }
    .s-1-5 { scale: 1.5; }
    .s-2 { scale: 2; }
    .s-non-uniform { scale: 0.5 1.5; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 16px; text-align: center; }
  </style>
</head>
<body>
  <h1>Scale</h1>
  <p class="prop-name">scale</p>
  <div class="demos">
    <div class="demo-card">
      <div class="box-wrapper"><div class="box s-none">A</div></div>
      <p class="label">scale: none</p>
    </div>
    <div class="demo-card">
      <div class="box-wrapper"><div class="box s-half">A</div></div>
      <p class="label">scale: 0.5</p>
    </div>
    <div class="demo-card">
      <div class="box-wrapper"><div class="box s-1">A</div></div>
      <p class="label">scale: 1</p>
    </div>
    <div class="demo-card">
      <div class="box-wrapper"><div class="box s-1-5">A</div></div>
      <p class="label">scale: 1.5</p>
    </div>
    <div class="demo-card">
      <div class="box-wrapper"><div class="box s-2">A</div></div>
      <p class="label">scale: 2</p>
    </div>
    <div class="demo-card">
      <div class="box-wrapper"><div class="box s-non-uniform">A</div></div>
      <p class="label">scale: 0.5 1.5</p>
    </div>
  </div>
</body>
</html>
