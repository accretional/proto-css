<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>border-block-style</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 20px; }
    .demo-box {
      width: 180px;
      height: 100px;
      background: #16213e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #c0c0c0;
      border-block-color: #e94560;
      border-block-width: 4px;
      border-inline: none;
    }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; }
    .demo-item { display: flex; flex-direction: column; align-items: center; }
  </style>
</head>
<body>
  <h1>Border Block Style</h1>
  <p class="prop-name">border-block-style</p>
  <div class="demos">
    <div class="demo-item">
      <div class="demo-box" style="border-block-style: solid;">Content</div>
      <p class="label">border-block-style: solid</p>
    </div>
    <div class="demo-item">
      <div class="demo-box" style="border-block-style: dashed;">Content</div>
      <p class="label">border-block-style: dashed</p>
    </div>
    <div class="demo-item">
      <div class="demo-box" style="border-block-style: dotted;">Content</div>
      <p class="label">border-block-style: dotted</p>
    </div>
    <div class="demo-item">
      <div class="demo-box" style="border-block-style: double; border-block-width: 6px;">Content</div>
      <p class="label">border-block-style: double</p>
    </div>
    <div class="demo-item">
      <div class="demo-box" style="border-block-style: groove; border-block-width: 6px;">Content</div>
      <p class="label">border-block-style: groove</p>
    </div>
    <div class="demo-item">
      <div class="demo-box" style="border-block-style: ridge; border-block-width: 6px;">Content</div>
      <p class="label">border-block-style: ridge</p>
    </div>
  </div>
</body>
</html>
