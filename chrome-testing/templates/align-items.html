<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>align-items</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 20px; }
    .demo-box {
      background: #16213e;
      border-radius: 12px;
      padding: 16px;
      width: 220px;
    }
    .flex-container {
      display: flex;
      width: 180px;
      height: 160px;
      background: #0f3460;
      border-radius: 8px;
      gap: 8px;
      padding: 8px;
    }
    .flex-container .item {
      width: 36px;
      background: #e94560;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: bold;
      color: #fff;
    }
    .flex-container .item:nth-child(1) { height: 40px; }
    .flex-container .item:nth-child(2) { height: 70px; }
    .flex-container .item:nth-child(3) { height: 55px; }
    .flex-container .item:nth-child(4) { height: 90px; }
    .ai-start { align-items: flex-start; }
    .ai-center { align-items: center; }
    .ai-end { align-items: flex-end; }
    .ai-stretch { align-items: stretch; }
    .ai-stretch .item { height: auto !important; }
    .ai-baseline { align-items: baseline; }
    .ai-baseline .item { padding-top: 8px; }
    .ai-baseline .item:nth-child(1) { padding-top: 4px; }
    .ai-baseline .item:nth-child(2) { padding-top: 20px; }
    .ai-baseline .item:nth-child(3) { padding-top: 10px; }
    .ai-baseline .item:nth-child(4) { padding-top: 30px; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>Align Items</h1>
  <p class="prop-name">align-items</p>
  <div class="demos">
    <div class="demo-box">
      <div class="flex-container ai-start">
        <div class="item">1</div><div class="item">2</div><div class="item">3</div><div class="item">4</div>
      </div>
      <div class="label">align-items: flex-start</div>
    </div>
    <div class="demo-box">
      <div class="flex-container ai-center">
        <div class="item">1</div><div class="item">2</div><div class="item">3</div><div class="item">4</div>
      </div>
      <div class="label">align-items: center</div>
    </div>
    <div class="demo-box">
      <div class="flex-container ai-end">
        <div class="item">1</div><div class="item">2</div><div class="item">3</div><div class="item">4</div>
      </div>
      <div class="label">align-items: flex-end</div>
    </div>
    <div class="demo-box">
      <div class="flex-container ai-stretch">
        <div class="item">1</div><div class="item">2</div><div class="item">3</div><div class="item">4</div>
      </div>
      <div class="label">align-items: stretch</div>
    </div>
    <div class="demo-box">
      <div class="flex-container ai-baseline">
        <div class="item">1</div><div class="item">2</div><div class="item">3</div><div class="item">4</div>
      </div>
      <div class="label">align-items: baseline</div>
    </div>
  </div>
</body>
</html>
