<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>stroke-width</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 24px; justify-content: center; }
    .demo { display: flex; flex-direction: column; align-items: center; background: #16213e; border-radius: 12px; padding: 24px 28px; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>Stroke Width</h1>
  <p class="prop-name">stroke-width</p>
  <div class="demos">
    <div class="demo">
      <svg width="160" height="160">
        <circle cx="80" cy="80" r="55" fill="none" stroke="#06b6d4" stroke-width="1"/>
        <line x1="30" y1="140" x2="130" y2="140" stroke="#f43f5e" stroke-width="1"/>
      </svg>
      <div class="label">stroke-width: 1</div>
    </div>
    <div class="demo">
      <svg width="160" height="160">
        <circle cx="80" cy="80" r="55" fill="none" stroke="#06b6d4" stroke-width="2"/>
        <line x1="30" y1="140" x2="130" y2="140" stroke="#f43f5e" stroke-width="2"/>
      </svg>
      <div class="label">stroke-width: 2</div>
    </div>
    <div class="demo">
      <svg width="160" height="160">
        <circle cx="80" cy="80" r="55" fill="none" stroke="#06b6d4" stroke-width="4"/>
        <line x1="30" y1="140" x2="130" y2="140" stroke="#f43f5e" stroke-width="4"/>
      </svg>
      <div class="label">stroke-width: 4</div>
    </div>
    <div class="demo">
      <svg width="160" height="160">
        <circle cx="80" cy="80" r="50" fill="none" stroke="#06b6d4" stroke-width="8"/>
        <line x1="30" y1="145" x2="130" y2="145" stroke="#f43f5e" stroke-width="8"/>
      </svg>
      <div class="label">stroke-width: 8</div>
    </div>
    <div class="demo">
      <svg width="160" height="160">
        <circle cx="80" cy="80" r="45" fill="none" stroke="#06b6d4" stroke-width="16"/>
        <line x1="30" y1="148" x2="130" y2="148" stroke="#f43f5e" stroke-width="16"/>
      </svg>
      <div class="label">stroke-width: 16</div>
    </div>
  </div>
</body>
</html>
