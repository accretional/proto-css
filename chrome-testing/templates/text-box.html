<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>text-box</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 24px; }
    .demo-card { background: #16213e; border-radius: 12px; padding: 24px; flex: 1; min-width: 350px; }
    .text-wrapper { background: #0f1a30; border-radius: 8px; padding: 0; display: inline-block; border: 2px solid #3b82f6; }
    .text-wrapper span { font-size: 48px; line-height: 1.4; display: block; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 12px; }
    .note { font-size: 12px; color: #6b7280; margin-top: 6px; }
  </style>
</head>
<body>
  <h1>Text Box</h1>
  <p class="prop-name">text-box</p>
  <div class="demos">
    <div class="demo-card">
      <p class="note">Default (no trimming)</p>
      <div style="margin-top: 12px;">
        <div class="text-wrapper">
          <span style="text-box: normal;">Typography Ag</span>
        </div>
      </div>
      <p class="label">text-box: normal</p>
    </div>
    <div class="demo-card">
      <p class="note">Trim start: cap, alphabetic</p>
      <div style="margin-top: 12px;">
        <div class="text-wrapper" style="border-color: #10b981;">
          <span style="text-box: trim-start cap alphabetic;">Typography Ag</span>
        </div>
      </div>
      <p class="label">text-box: trim-start cap alphabetic</p>
    </div>
    <div class="demo-card">
      <p class="note">Trim both: cap, alphabetic</p>
      <div style="margin-top: 12px;">
        <div class="text-wrapper" style="border-color: #f59e0b;">
          <span style="text-box: trim-both cap alphabetic;">Typography Ag</span>
        </div>
      </div>
      <p class="label">text-box: trim-both cap alphabetic</p>
    </div>
  </div>
</body>
</html>
