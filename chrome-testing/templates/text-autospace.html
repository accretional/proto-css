<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>text-autospace</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 20px; }
    .demo-card { background: #16213e; border-radius: 12px; padding: 24px; flex: 1; min-width: 340px; }
    .sample-text { font-size: 22px; line-height: 1.6; padding: 16px; background: #0f1a30; border-radius: 8px; border: 1px solid #2a2a4a; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 12px; }
  </style>
</head>
<body>
  <h1>Text Autospace</h1>
  <p class="prop-name">text-autospace</p>
  <div class="demos">
    <div class="demo-card">
      <div class="sample-text" style="text-autospace: normal;">
        CSS是Cascading Style Sheets的縮寫，用於Web開發
      </div>
      <p class="label">text-autospace: normal</p>
    </div>
    <div class="demo-card">
      <div class="sample-text" style="text-autospace: no-autospace;">
        CSS是Cascading Style Sheets的縮寫，用於Web開發
      </div>
      <p class="label">text-autospace: no-autospace</p>
    </div>
    <div class="demo-card">
      <div class="sample-text" style="text-autospace: ideograph-alpha;">
        CSS是Cascading Style Sheets的縮寫，用於Web開發
      </div>
      <p class="label">text-autospace: ideograph-alpha</p>
    </div>
  </div>
</body>
</html>
