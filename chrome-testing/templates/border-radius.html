<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>border-radius</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 20px; }
    .demo-box {
      width: 150px;
      height: 150px;
      background: #e74c3c;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: #fff;
      font-weight: 600;
    }
    .pill {
      width: 220px;
      height: 60px;
    }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; max-width: 220px; }
    .demo-item { display: flex; flex-direction: column; align-items: flex-start; }
  </style>
</head>
<body>
  <h1>Border Radius</h1>
  <p class="prop-name">border-radius</p>
  <div class="demos">
    <div class="demo-item">
      <div class="demo-box" style="border-radius: 0;">0</div>
      <span class="label">border-radius: 0</span>
    </div>
    <div class="demo-item">
      <div class="demo-box" style="border-radius: 8px;">8px</div>
      <span class="label">border-radius: 8px</span>
    </div>
    <div class="demo-item">
      <div class="demo-box" style="border-radius: 20px;">20px</div>
      <span class="label">border-radius: 20px</span>
    </div>
    <div class="demo-item">
      <div class="demo-box" style="border-radius: 50%;">50%</div>
      <span class="label">border-radius: 50%</span>
    </div>
    <div class="demo-item">
      <div class="demo-box" style="border-radius: 30px 0 30px 0;">30px 0</div>
      <span class="label">border-radius: 30px 0 30px 0</span>
    </div>
    <div class="demo-item">
      <div class="demo-box pill" style="border-radius: 9999px;">Pill</div>
      <span class="label">border-radius: 9999px (pill)</span>
    </div>
  </div>
</body>
</html>
