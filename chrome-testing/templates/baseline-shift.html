<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>baseline-shift</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-direction: column; gap: 28px; }
    .demo-item { display: flex; flex-direction: column; gap: 6px; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; }
    svg {
      background: #2d2d4e;
      border-radius: 8px;
      border: 2px solid rgba(255,255,255,0.1);
    }
    .baseline-line { stroke: rgba(255,255,255,0.15); stroke-width: 1; stroke-dasharray: 4 3; }
  </style>
</head>
<body>
  <h1>Baseline Shift</h1>
  <p class="prop-name">baseline-shift</p>
  <div class="demos">
    <div class="demo-item">
      <div class="label">baseline-shift: sub</div>
      <svg width="580" height="80" viewBox="0 0 580 80">
        <line class="baseline-line" x1="0" y1="50" x2="580" y2="50" />
        <text x="20" y="50" fill="#e0e0e0" font-size="28" font-family="system-ui">Normal text
          <tspan baseline-shift="sub" fill="#ff6b6b" font-size="20">subscript</tspan>
          continues
        </text>
      </svg>
    </div>
    <div class="demo-item">
      <div class="label">baseline-shift: super</div>
      <svg width="580" height="80" viewBox="0 0 580 80">
        <line class="baseline-line" x1="0" y1="50" x2="580" y2="50" />
        <text x="20" y="50" fill="#e0e0e0" font-size="28" font-family="system-ui">Normal text
          <tspan baseline-shift="super" fill="#48dbfb" font-size="20">superscript</tspan>
          continues
        </text>
      </svg>
    </div>
    <div class="demo-item">
      <div class="label">baseline-shift: 50%</div>
      <svg width="580" height="80" viewBox="0 0 580 80">
        <line class="baseline-line" x1="0" y1="50" x2="580" y2="50" />
        <text x="20" y="50" fill="#e0e0e0" font-size="28" font-family="system-ui">Normal text
          <tspan baseline-shift="50%" fill="#feca57" font-size="20">shifted 50%</tspan>
          continues
        </text>
      </svg>
    </div>
    <div class="demo-item">
      <div class="label">baseline-shift: -25%</div>
      <svg width="580" height="80" viewBox="0 0 580 80">
        <line class="baseline-line" x1="0" y1="50" x2="580" y2="50" />
        <text x="20" y="50" fill="#e0e0e0" font-size="28" font-family="system-ui">Normal text
          <tspan baseline-shift="-25%" fill="#a29bfe" font-size="20">shifted -25%</tspan>
          continues
        </text>
      </svg>
    </div>
  </div>
</body>
</html>
