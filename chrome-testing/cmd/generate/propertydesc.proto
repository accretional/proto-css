syntax = "proto3";
package cssgen;
option go_package = "github.com/accretional/proto-css-new/chrome-testing/cmd/generate";

message PropertyDescriptor {
  string expr_type = 1;    // e.g. "AccentColorExpr"
  string demo_type = 2;    // "box", "text", "flex", "grid", "margin"
  string context = 3;      // extra CSS for the demo element, e.g. "background: cornflowerblue;"
  int32 num_values = 4;    // how many values to generate (default 8 if 0)
}

message PropertyDescriptors {
  repeated PropertyDescriptor properties = 1;
}
