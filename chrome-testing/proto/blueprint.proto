syntax = "proto3";

package cssgen;

option go_package = "github.com/accretional/proto-css/chrome-testing/proto";

// TemplateBlueprint defines the demo shape for a single CSS property.
// The generator reads this + grammar values to produce the final HTML page.
message TemplateBlueprint {
  enum DemoType {
    BOX = 0;        // single div target
    TEXT = 1;        // paragraph of text as target
    FLEX = 2;        // flex container with child items
    GRID = 3;        // grid container with child items
    TABLE = 4;       // table element
    SVG = 5;         // SVG element with shapes
    POSITION = 6;    // positioned element with siblings
    INLINE = 7;      // inline/span element within text flow
    MULTICOL = 8;    // multi-column layout
    LIST = 9;        // list element (ul/ol)
    IMAGE = 10;      // img or element with background-image
    SCROLL = 11;     // scrollable container
  }

  DemoType demo_type = 1;

  // Display title for the page, e.g. "Flex Direction"
  string title = 2;

  // HTML tag for the demo target element (default: "div")
  string target_tag = 3;

  // Inner HTML content of the target element
  string target_inner_html = 4;

  // Base inline CSS on the target element, besides the property being tested.
  // e.g. "display: flex; gap: 8px; background: darkslategray;"
  string target_base_style = 5;

  // HTML for sibling elements rendered before the target
  repeated string siblings_before = 6;

  // HTML for sibling elements rendered after the target
  repeated string siblings_after = 7;

  // CSS applied to the .demo-area wrapper around the target
  string wrapper_style = 8;

  // HTML for child elements inside the target (used for flex/grid/position demos)
  repeated string child_elements = 9;

  // Maximum number of values to show (default: 36)
  int32 max_values = 10;

  // Extra CSS rules to include in the <style> block (for .item, .flow-box, etc.)
  string extra_css = 11;

  // Name of the screenshot mode textproto template (e.g. "static", "temporal",
  // "scroll", "hover", "focus", "selection"). Maps to a file in
  // chrome-testing/screenshots/textproto/{name}.textproto.
  // Default: "static" (single screenshot).
  string screenshot_textproto = 12;
}
