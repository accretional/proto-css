<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>border-inline-end</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; }
    .demo-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .box {
      width: 200px;
      height: 100px;
      background: #16213e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #ccc;
      font-family: monospace;
      text-align: center;
      line-height: 1.5;
    }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; text-align: center; max-width: 240px; }
  </style>
</head>
<body>
  <h1>Border Inline End</h1>
  <p class="prop-name">border-inline-end</p>
  <div class="demos">
    <div class="demo-item">
      <div class="box" style="border-inline-end: none;">none</div>
      <div class="label">border-inline-end: none</div>
    </div>
    <div class="demo-item">
      <div class="box" style="border-inline-end: 1px solid red;">1px solid red</div>
      <div class="label">border-inline-end: 1px solid red</div>
    </div>
    <div class="demo-item">
      <div class="box" style="border-inline-end: 2px dashed blue;">2px dashed blue</div>
      <div class="label">border-inline-end: 2px dashed blue</div>
    </div>
  </div>
</body>
</html>
