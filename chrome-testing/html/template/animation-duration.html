<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>animation-duration</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-direction: column; gap: 16px; }
    .demo-row {
      display: flex;
      align-items: center;
      gap: 16px;
      background: #16213e;
      border-radius: 10px;
      padding: 16px 24px;
    }
    .row-label {
      font-size: 12px;
      font-family: monospace;
      color: #9ca3af;
      width: 240px;
      flex-shrink: 0;
    }
    .track {
      flex: 1;
      height: 50px;
      background: #0f3460;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
    }
    .progress-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 12px;
      font-size: 11px;
      font-weight: bold;
      color: #fff;
    }
    @keyframes fillTrack {
      from { width: 0%; }
      to { width: 100%; }
    }
    .dur-05 {
      background: #e94560;
      animation: fillTrack 0.5s linear;
      
      animation-delay: -0.25s;
      /* At 50% progress = 50% width */
    }
    .dur-1 {
      background: #f39c12;
      animation: fillTrack 1s linear;
      
      animation-delay: -0.25s;
      /* At 25% progress = 25% width */
    }
    .dur-2 {
      background: #3498db;
      animation: fillTrack 2s linear;
      
      animation-delay: -0.25s;
      /* At 12.5% progress */
    }
    .dur-4 {
      background: #2ecc71;
      animation: fillTrack 4s linear;
      
      animation-delay: -0.25s;
      /* At 6.25% progress */
    }
    .time-ref {
      font-size: 12px;
      color: #6b7280;
      margin-top: 16px;
      font-style: italic;
      text-align: center;
    }
    .time-scale {
      display: flex;
      justify-content: space-between;
      padding: 0 280px 0 280px;
      margin-top: 8px;
    }
    .tick { font-size: 10px; font-family: monospace; color: #4a5568; }
  </style>
</head>
<body>
  <h1>Animation Duration</h1>
  <p class="prop-name">animation-duration</p>
  <div class="demos">
    <div class="demo-row">
      <div class="row-label">animation-duration: 0.5s<br><span style="color:#6b7280;font-size:10px;">Progress at t=0.25s: 50%</span></div>
      <div class="track">
        <div class="progress-fill dur-05">50%</div>
      </div>
    </div>
    <div class="demo-row">
      <div class="row-label">animation-duration: 1s<br><span style="color:#6b7280;font-size:10px;">Progress at t=0.25s: 25%</span></div>
      <div class="track">
        <div class="progress-fill dur-1">25%</div>
      </div>
    </div>
    <div class="demo-row">
      <div class="row-label">animation-duration: 2s<br><span style="color:#6b7280;font-size:10px;">Progress at t=0.25s: 12.5%</span></div>
      <div class="track">
        <div class="progress-fill dur-2"></div>
      </div>
    </div>
    <div class="demo-row">
      <div class="row-label">animation-duration: 4s<br><span style="color:#6b7280;font-size:10px;">Progress at t=0.25s: 6.25%</span></div>
      <div class="track">
        <div class="progress-fill dur-4"></div>
      </div>
    </div>
  </div>
</body>
</html>
