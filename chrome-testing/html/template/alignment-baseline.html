<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>alignment-baseline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 20px; }
    .demo-box {
      background: #16213e;
      border-radius: 12px;
      padding: 20px;
      width: 200px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    svg { background: #0f3460; border-radius: 8px; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 10px; text-align: center; }
  </style>
</head>
<body>
  <h1>Alignment Baseline</h1>
  <p class="prop-name">alignment-baseline</p>
  <div class="demos">
    <div class="demo-box">
      <svg width="170" height="150" viewBox="0 0 170 150">
        <line x1="5" y1="80" x2="165" y2="80" stroke="#e94560" stroke-width="1" stroke-dasharray="4"/>
        <text x="5" y="80" font-size="48" fill="#e94560" font-family="serif">Hg</text>
        <text x="85" y="80" font-size="20" fill="#3498db" font-family="serif" alignment-baseline="auto">Tx</text>
        <rect x="85" y="78" width="40" height="2" fill="#3498db" opacity="0.3"/>
      </svg>
      <div class="label">auto</div>
    </div>
    <div class="demo-box">
      <svg width="170" height="150" viewBox="0 0 170 150">
        <line x1="5" y1="80" x2="165" y2="80" stroke="#e94560" stroke-width="1" stroke-dasharray="4"/>
        <text x="5" y="80" font-size="48" fill="#e94560" font-family="serif">Hg</text>
        <text x="85" y="80" font-size="20" fill="#3498db" font-family="serif" alignment-baseline="baseline">Tx</text>
        <rect x="85" y="78" width="40" height="2" fill="#3498db" opacity="0.3"/>
      </svg>
      <div class="label">baseline</div>
    </div>
    <div class="demo-box">
      <svg width="170" height="150" viewBox="0 0 170 150">
        <line x1="5" y1="80" x2="165" y2="80" stroke="#e94560" stroke-width="1" stroke-dasharray="4"/>
        <text x="5" y="80" font-size="48" fill="#e94560" font-family="serif">Hg</text>
        <text x="85" y="80" font-size="20" fill="#2ecc71" font-family="serif" alignment-baseline="middle">Tx</text>
        <rect x="85" y="78" width="40" height="2" fill="#2ecc71" opacity="0.3"/>
      </svg>
      <div class="label">middle</div>
    </div>
    <div class="demo-box">
      <svg width="170" height="150" viewBox="0 0 170 150">
        <line x1="5" y1="80" x2="165" y2="80" stroke="#e94560" stroke-width="1" stroke-dasharray="4"/>
        <text x="5" y="80" font-size="48" fill="#e94560" font-family="serif">Hg</text>
        <text x="85" y="80" font-size="20" fill="#f39c12" font-family="serif" alignment-baseline="text-top">Tx</text>
        <rect x="85" y="78" width="40" height="2" fill="#f39c12" opacity="0.3"/>
      </svg>
      <div class="label">text-top</div>
    </div>
    <div class="demo-box">
      <svg width="170" height="150" viewBox="0 0 170 150">
        <line x1="5" y1="80" x2="165" y2="80" stroke="#e94560" stroke-width="1" stroke-dasharray="4"/>
        <text x="5" y="80" font-size="48" fill="#e94560" font-family="serif">Hg</text>
        <text x="85" y="80" font-size="20" fill="#9b59b6" font-family="serif" alignment-baseline="text-bottom">Tx</text>
        <rect x="85" y="78" width="40" height="2" fill="#9b59b6" opacity="0.3"/>
      </svg>
      <div class="label">text-bottom</div>
    </div>
    <div class="demo-box">
      <svg width="170" height="150" viewBox="0 0 170 150">
        <line x1="5" y1="80" x2="165" y2="80" stroke="#e94560" stroke-width="1" stroke-dasharray="4"/>
        <text x="5" y="80" font-size="48" fill="#e94560" font-family="serif">Hg</text>
        <text x="85" y="80" font-size="20" fill="#1abc9c" font-family="serif" alignment-baseline="central">Tx</text>
        <rect x="85" y="78" width="40" height="2" fill="#1abc9c" opacity="0.3"/>
      </svg>
      <div class="label">central</div>
    </div>
  </div>
</body>
</html>
