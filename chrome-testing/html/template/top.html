<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>top</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 20px; }
    .demo-card {
      display: flex; flex-direction: column; align-items: center;
    }
    .container {
      width: 160px; height: 160px; background: #16213e; border-radius: 10px;
      position: relative; border: 1px dashed #394867;
    }
    .box {
      width: 50px; height: 50px; background: #e94560; border-radius: 6px;
      position: relative;
    }
    .guide {
      position: absolute; top: 0; left: 0; right: 0;
      border-top: 1px dashed #3a7bd5; pointer-events: none;
    }
    .offset-line {
      position: absolute; left: 80px; width: 1px; background: #34d399;
      opacity: 0.5;
    }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; }
    .t1 { top: 0; }
    .t2 { top: 10px; }
    .t3 { top: 50px; }
    .t4 { top: auto; }
    .t5 { top: 50%; }
  </style>
</head>
<body>
  <h1>Top</h1>
  <p class="prop-name">top</p>
  <div class="demos">
    <div class="demo-card">
      <div class="container">
        <div class="guide"></div>
        <div class="box t1"></div>
      </div>
      <span class="label">top: 0</span>
    </div>
    <div class="demo-card">
      <div class="container">
        <div class="guide"></div>
        <div class="box t2"></div>
        <div class="offset-line" style="top: 0; height: 10px;"></div>
      </div>
      <span class="label">top: 10px</span>
    </div>
    <div class="demo-card">
      <div class="container">
        <div class="guide"></div>
        <div class="box t3"></div>
        <div class="offset-line" style="top: 0; height: 50px;"></div>
      </div>
      <span class="label">top: 50px</span>
    </div>
    <div class="demo-card">
      <div class="container">
        <div class="guide"></div>
        <div class="box t4"></div>
      </div>
      <span class="label">top: auto</span>
    </div>
    <div class="demo-card">
      <div class="container">
        <div class="guide"></div>
        <div class="box t5"></div>
        <div class="offset-line" style="top: 0; height: 80px;"></div>
      </div>
      <span class="label">top: 50%</span>
    </div>
  </div>
</body>
</html>
