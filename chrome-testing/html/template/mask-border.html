<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>mask-border</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .demo-card { background: #16213e; border-radius: 10px; padding: 20px; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 10px; text-align: center; line-height: 1.5; }
    .box {
      width: 100%;
      height: 120px;
      background: linear-gradient(135deg, #e94560, #0f3460, #00d2ff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #fff;
      border-radius: 4px;
    }
    /* Simulated with mask since mask-border has limited support */
    .sim-none {
      /* no mask-border */
    }
    .sim-border {
      -webkit-mask:
        linear-gradient(to right, transparent 0%, #000 15%, #000 85%, transparent 100%),
        linear-gradient(to bottom, transparent 0%, #000 15%, #000 85%, transparent 100%);
      -webkit-mask-composite: destination-in;
      mask:
        linear-gradient(to right, transparent 0%, #000 15%, #000 85%, transparent 100%),
        linear-gradient(to bottom, transparent 0%, #000 15%, #000 85%, transparent 100%);
      mask-composite: intersect;
    }
  </style>
</head>
<body>
  <h1>Mask Border</h1>
  <p class="prop-name">mask-border</p>
  <div class="demos">

    <div class="demo-card">
      <div class="box sim-none">Content Area</div>
      <div class="label">mask-border: none</div>
    </div>

    <div class="demo-card">
      <div class="box sim-border">Content Area</div>
      <div class="label">mask-border: url(border.png)<br>30 round</div>
    </div>

  </div>
</body>
</html>
