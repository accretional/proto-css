<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>border-right-style</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .demo-item { display: flex; flex-direction: column; align-items: center; }
    .box {
      width: 180px;
      height: 100px;
      background: #16213e;
      border-right-color: #e94560;
      border-right-width: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: rgba(255,255,255,0.7);
    }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; text-align: center; }
  </style>
</head>
<body>
  <h1>Border Right Style</h1>
  <p class="prop-name">border-right-style</p>
  <div class="demos">
    <div class="demo-item">
      <div class="box" style="border-right-style: none;">none</div>
      <div class="label">border-right-style: none</div>
    </div>
    <div class="demo-item">
      <div class="box" style="border-right-style: solid;">solid</div>
      <div class="label">border-right-style: solid</div>
    </div>
    <div class="demo-item">
      <div class="box" style="border-right-style: dashed;">dashed</div>
      <div class="label">border-right-style: dashed</div>
    </div>
    <div class="demo-item">
      <div class="box" style="border-right-style: dotted;">dotted</div>
      <div class="label">border-right-style: dotted</div>
    </div>
    <div class="demo-item">
      <div class="box" style="border-right-style: double;">double</div>
      <div class="label">border-right-style: double</div>
    </div>
    <div class="demo-item">
      <div class="box" style="border-right-style: groove;">groove</div>
      <div class="label">border-right-style: groove</div>
    </div>
  </div>
</body>
</html>
