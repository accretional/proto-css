<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>border-block-end</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
    .demo-item { display: flex; flex-direction: column; align-items: center; }
    .box {
      width: 200px;
      height: 100px;
      background: #16213e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: rgba(255,255,255,0.7);
    }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; text-align: center; }
  </style>
</head>
<body>
  <h1>Border Block End</h1>
  <p class="prop-name">border-block-end</p>
  <div class="demos">
    <div class="demo-item">
      <div class="box" style="border-block-end: none;">none</div>
      <div class="label">border-block-end: none</div>
    </div>
    <div class="demo-item">
      <div class="box" style="border-block-end: 1px solid red;">1px solid red</div>
      <div class="label">border-block-end: 1px solid red</div>
    </div>
    <div class="demo-item">
      <div class="box" style="border-block-end: 2px dashed blue;">2px dashed blue</div>
      <div class="label">border-block-end: 2px dashed blue</div>
    </div>
  </div>
</body>
</html>
