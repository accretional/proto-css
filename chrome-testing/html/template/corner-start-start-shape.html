<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>corner-start-start-shape</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 4px; }
    .experimental { font-size: 12px; color: #e94560; font-family: monospace; margin-bottom: 24px; }
    .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 10px; text-align: center; }
    .demo-card { text-align: center; }
  </style>
</head>
<body>
  <h1>Corner Start-Start Shape</h1>
  <p class="prop-name">corner-start-start-shape</p>
  <p class="experimental">Experimental &mdash; logical corner (block-start + inline-start = top-left in LTR)</p>
  <div class="grid">
    <!-- round -->
    <div class="demo-card">
      <svg width="140" height="140" viewBox="0 0 140 140" fill="none">
        <path d="M28 3 H137 V137 H3 V28 Q3 3 28 3 Z" fill="#16213e" stroke="#e94560" stroke-width="3"/>
        <circle cx="3" cy="3" r="6" fill="#e94560"/>
        <text x="80" y="80" fill="#e0e0e0" text-anchor="middle" font-size="13" font-family="system-ui">round</text>
      </svg>
      <p class="label">round</p>
    </div>

    <!-- scoop -->
    <div class="demo-card">
      <svg width="140" height="140" viewBox="0 0 140 140" fill="none">
        <path d="M28 3 H137 V137 H3 V28 Q28 28 28 3 Z" fill="#16213e" stroke="#00d2ff" stroke-width="3"/>
        <circle cx="3" cy="3" r="6" fill="#00d2ff"/>
        <text x="80" y="80" fill="#e0e0e0" text-anchor="middle" font-size="13" font-family="system-ui">scoop</text>
      </svg>
      <p class="label">scoop</p>
    </div>

    <!-- bevel -->
    <div class="demo-card">
      <svg width="140" height="140" viewBox="0 0 140 140" fill="none">
        <path d="M28 3 H137 V137 H3 V28 L28 3 Z" fill="#16213e" stroke="#10b981" stroke-width="3"/>
        <circle cx="3" cy="3" r="6" fill="#10b981"/>
        <text x="80" y="80" fill="#e0e0e0" text-anchor="middle" font-size="13" font-family="system-ui">bevel</text>
      </svg>
      <p class="label">bevel</p>
    </div>

    <!-- notch -->
    <div class="demo-card">
      <svg width="140" height="140" viewBox="0 0 140 140" fill="none">
        <path d="M3 3 H137 V137 H3 V15 H15 V3 Z" fill="#16213e" stroke="#f59e0b" stroke-width="3"/>
        <circle cx="3" cy="3" r="6" fill="#f59e0b"/>
        <text x="80" y="80" fill="#e0e0e0" text-anchor="middle" font-size="13" font-family="system-ui">notch</text>
      </svg>
      <p class="label">notch</p>
    </div>

    <!-- square -->
    <div class="demo-card">
      <svg width="140" height="140" viewBox="0 0 140 140" fill="none">
        <rect x="3" y="3" width="134" height="134" fill="#16213e" stroke="#a855f7" stroke-width="3"/>
        <circle cx="3" cy="3" r="6" fill="#a855f7"/>
        <text x="70" y="80" fill="#e0e0e0" text-anchor="middle" font-size="13" font-family="system-ui">square</text>
      </svg>
      <p class="label">square</p>
    </div>
  </div>
</body>
</html>
