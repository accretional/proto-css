<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>corner-right-shape</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 4px; }
    .experimental { font-size: 12px; color: #e94560; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 36px; align-items: flex-start; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 10px; text-align: center; }
    .demo-card { text-align: center; }

    .shape-box {
      width: 170px;
      height: 170px;
      background: linear-gradient(90deg, #0f3460, #16213e);
      border: 3px solid #f97316;
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .dot {
      position: absolute;
      width: 16px;
      height: 16px;
      border-radius: 50%;
    }
    .on { background: #f97316; box-shadow: 0 0 8px #f9731688; }
    .off { background: #444; opacity: 0.3; }
  </style>
</head>
<body>
  <h1>Corner Right Shape</h1>
  <p class="prop-name">corner-right-shape</p>
  <p class="experimental">Experimental property &mdash; affects both right corners (top-right + bottom-right)</p>
  <div class="demos">
    <div class="demo-card">
      <div class="shape-box">
        <span style="font-size:14px;color:#c0c0c0;">round</span>
        <div class="dot off" style="top:-8px;left:-8px;"></div>
        <div class="dot on" style="top:-8px;right:-8px;"></div>
        <div class="dot off" style="bottom:-8px;left:-8px;"></div>
        <div class="dot on" style="bottom:-8px;right:-8px;"></div>
      </div>
      <p class="label">corner-right-shape: round</p>
    </div>

    <div class="demo-card">
      <svg width="170" height="170" viewBox="0 0 170 170" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M30 3 H140 Q140 30 167 30 V140 Q140 140 140 167 H30 Q3 167 3 140 V30 Q3 3 30 3Z" fill="#0f3460" stroke="#f97316" stroke-width="3"/>
        <text x="80" y="90" fill="#c0c0c0" text-anchor="middle" font-size="14" font-family="system-ui">scoop</text>
        <circle cx="167" cy="3" r="7" fill="#f97316"/>
        <circle cx="167" cy="167" r="7" fill="#f97316"/>
        <circle cx="3" cy="3" r="6" fill="#444" opacity="0.3"/>
        <circle cx="3" cy="167" r="6" fill="#444" opacity="0.3"/>
      </svg>
      <p class="label">corner-right-shape: scoop</p>
    </div>

    <div class="demo-card">
      <div style="background:#16213e; border-radius:10px; padding:16px; width: 240px; text-align: left;">
        <p style="font-size:12px; color:#f97316; margin-bottom:8px; font-family:monospace; font-weight:bold;">Physical property:</p>
        <p style="font-size:11px; color:#7b8794; font-family:monospace; line-height:1.8;">
          Targets the right edge corners<br>
          (top-right + bottom-right)
        </p>
        <svg width="200" height="110" viewBox="0 0 200 110" style="margin-top:10px;">
          <rect x="10" y="10" width="180" height="90" rx="4" fill="none" stroke="#444" stroke-width="1" stroke-dasharray="4"/>
          <rect x="145" y="10" width="45" height="40" fill="#f9731622" stroke="#f97316" stroke-width="2" rx="3"/>
          <rect x="145" y="60" width="45" height="40" fill="#f9731622" stroke="#f97316" stroke-width="2" rx="3"/>
          <text x="167" y="35" fill="#f97316" text-anchor="middle" font-size="9" font-family="monospace">TR</text>
          <text x="167" y="85" fill="#f97316" text-anchor="middle" font-size="9" font-family="monospace">BR</text>
          <text x="32" y="35" fill="#666" text-anchor="middle" font-size="9" font-family="monospace">TL</text>
          <text x="32" y="85" fill="#666" text-anchor="middle" font-size="9" font-family="monospace">BL</text>
          <!-- right edge highlight -->
          <line x1="190" y1="15" x2="190" y2="95" stroke="#f97316" stroke-width="3"/>
        </svg>
      </div>
    </div>
  </div>
</body>
</html>
