<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>border</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .demo-item { display: flex; flex-direction: column; align-items: center; }
    .box {
      width: 200px;
      height: 120px;
      background: #16213e;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: rgba(255,255,255,0.7);
    }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; text-align: center; }
  </style>
</head>
<body>
  <h1>Border</h1>
  <p class="prop-name">border</p>
  <div class="demos">
    <div class="demo-item">
      <div class="box" style="border: none;">none</div>
      <div class="label">border: none</div>
    </div>
    <div class="demo-item">
      <div class="box" style="border: 1px solid red;">1px solid red</div>
      <div class="label">border: 1px solid red</div>
    </div>
    <div class="demo-item">
      <div class="box" style="border: 2px dashed blue;">2px dashed blue</div>
      <div class="label">border: 2px dashed blue</div>
    </div>
    <div class="demo-item">
      <div class="box" style="border: 3px dotted green;">3px dotted green</div>
      <div class="label">border: 3px dotted green</div>
    </div>
    <div class="demo-item">
      <div class="box" style="border: medium double orange;">medium double orange</div>
      <div class="label">border: medium double orange</div>
    </div>
    <div class="demo-item">
      <div class="box" style="border: thick groove purple;">thick groove purple</div>
      <div class="label">border: thick groove purple</div>
    </div>
  </div>
</body>
</html>
