<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>border-block-start-color</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .demo-item { display: flex; flex-direction: column; align-items: center; }
    .box {
      width: 200px;
      height: 100px;
      background: #16213e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: rgba(255,255,255,0.7);
      border-block-start-style: solid;
      border-block-start-width: 6px;
    }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; text-align: center; }
  </style>
</head>
<body>
  <h1>Border Block Start Color</h1>
  <p class="prop-name">border-block-start-color</p>
  <div class="demos">
    <div class="demo-item">
      <div class="box" style="border-block-start-color: #e94560;">#e94560</div>
      <div class="label">border-block-start-color: #e94560</div>
    </div>
    <div class="demo-item">
      <div class="box" style="border-block-start-color: #00b4d8;">#00b4d8</div>
      <div class="label">border-block-start-color: #00b4d8</div>
    </div>
    <div class="demo-item">
      <div class="box" style="border-block-start-color: #533483;">#533483</div>
      <div class="label">border-block-start-color: #533483</div>
    </div>
    <div class="demo-item">
      <div class="box" style="border-block-start-color: #4ade80;">#4ade80</div>
      <div class="label">border-block-start-color: #4ade80</div>
    </div>
    <div class="demo-item">
      <div class="box" style="border-block-start-color: #fbbf24;">#fbbf24</div>
      <div class="label">border-block-start-color: #fbbf24</div>
    </div>
  </div>
</body>
</html>
