<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>border-block-start-width</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .demo-item { display: flex; flex-direction: column; align-items: center; }
    .box {
      width: 180px;
      height: 90px;
      background: #16213e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: rgba(255,255,255,0.7);
      border-block-start-style: solid;
      border-block-start-color: #e94560;
    }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; text-align: center; }
  </style>
</head>
<body>
  <h1>Border Block Start Width</h1>
  <p class="prop-name">border-block-start-width</p>
  <div class="demos">
    <div class="demo-item">
      <div class="box" style="border-block-start-width: 0;">0</div>
      <div class="label">border-block-start-width: 0</div>
    </div>
    <div class="demo-item">
      <div class="box" style="border-block-start-width: 1px;">1px</div>
      <div class="label">border-block-start-width: 1px</div>
    </div>
    <div class="demo-item">
      <div class="box" style="border-block-start-width: 2px;">2px</div>
      <div class="label">border-block-start-width: 2px</div>
    </div>
    <div class="demo-item">
      <div class="box" style="border-block-start-width: 4px;">4px</div>
      <div class="label">border-block-start-width: 4px</div>
    </div>
    <div class="demo-item">
      <div class="box" style="border-block-start-width: thin;">thin</div>
      <div class="label">border-block-start-width: thin</div>
    </div>
    <div class="demo-item">
      <div class="box" style="border-block-start-width: medium;">medium</div>
      <div class="label">border-block-start-width: medium</div>
    </div>
    <div class="demo-item">
      <div class="box" style="border-block-start-width: thick;">thick</div>
      <div class="label">border-block-start-width: thick</div>
    </div>
  </div>
</body>
</html>
