<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>caret-color</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 20px; }
    .demo-card {
      background: #16213e;
      border-radius: 10px;
      padding: 20px;
      width: 230px;
    }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-bottom: 12px; }
    input {
      width: 100%;
      padding: 12px 14px;
      background: #0f3460;
      border: 2px solid #1a4a8a;
      border-radius: 8px;
      color: #e0e0e0;
      font-size: 15px;
      outline: none;
      font-family: system-ui, sans-serif;
    }
    input:focus { border-color: #4a6fa5; }
    .swatch {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      display: inline-block;
      vertical-align: middle;
      margin-right: 6px;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .c-auto input { caret-color: auto; }
    .c-red input { caret-color: red; }
    .c-blue input { caret-color: #3b82f6; }
    .c-green input { caret-color: #22c55e; }
    .c-transparent input { caret-color: transparent; }
  </style>
</head>
<body>
  <h1>Caret Color</h1>
  <p class="prop-name">caret-color</p>
  <div class="demos">
    <div class="demo-card c-auto">
      <div class="label"><span class="swatch" style="background: currentColor;"></span>caret-color: auto</div>
      <input type="text" value="Click to focus" autofocus />
    </div>
    <div class="demo-card c-red">
      <div class="label"><span class="swatch" style="background: red;"></span>caret-color: red</div>
      <input type="text" value="Click to focus" />
    </div>
    <div class="demo-card c-blue">
      <div class="label"><span class="swatch" style="background: #3b82f6;"></span>caret-color: #3b82f6</div>
      <input type="text" value="Click to focus" />
    </div>
    <div class="demo-card c-green">
      <div class="label"><span class="swatch" style="background: #22c55e;"></span>caret-color: #22c55e</div>
      <input type="text" value="Click to focus" />
    </div>
    <div class="demo-card c-transparent">
      <div class="label"><span class="swatch" style="background: repeating-conic-gradient(#666 0% 25%, #999 0% 50%) 0/8px 8px;"></span>caret-color: transparent</div>
      <input type="text" value="Click to focus" />
    </div>
  </div>
</body>
</html>
