<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>caret-color</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }
    .demo-card {
      background: #16213e;
      border-radius: 10px;
      padding: 20px;
    }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-bottom: 12px; }
    .swatch {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      display: inline-block;
      vertical-align: middle;
      margin-right: 6px;
      border: 1px solid rgba(255,255,255,0.15);
    }
    input {
      width: 100%;
      padding: 12px 14px;
      background: #0f3460;
      border: 2px solid #1a4a8a;
      border-radius: 8px;
      color: #e0e0e0;
      font-size: 15px;
      outline: none;
      font-family: system-ui, sans-serif;
    }
    input:focus { border-color: #4a6fa5; }
  </style>
</head>
<body>
  <h1>Caret Color</h1>
  <p class="prop-name">caret-color</p>
  <div class="demos">
    <div class="demo-card">
      <div class="label"><span class="swatch" style="background: currentColor;"></span>caret-color: auto</div>
      <input type="text" style="caret-color: auto;" value="Click to focus" autofocus />
    </div>
    <div class="demo-card">
      <div class="label"><span class="swatch" style="background: red;"></span>caret-color: red</div>
      <input type="text" style="caret-color: red;" value="Click to focus" />
    </div>
    <div class="demo-card">
      <div class="label"><span class="swatch" style="background: blue;"></span>caret-color: blue</div>
      <input type="text" style="caret-color: blue;" value="Click to focus" />
    </div>
    <div class="demo-card">
      <div class="label"><span class="swatch" style="background: #3498db;"></span>caret-color: #3498db</div>
      <input type="text" style="caret-color: #3498db;" value="Click to focus" />
    </div>
    <div class="demo-card">
      <div class="label"><span class="swatch" style="background: currentColor;"></span>caret-color: currentcolor</div>
      <input type="text" style="caret-color: currentcolor;" value="Click to focus" />
    </div>
  </div>
</body>
</html>
