<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>corner-top-shape</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 4px; }
    .experimental { font-size: 12px; color: #e94560; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 36px; align-items: flex-start; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 10px; text-align: center; }
    .demo-card { text-align: center; }

    .shape-box {
      width: 180px;
      height: 170px;
      background: linear-gradient(0deg, #16213e, #0f3460);
      border: 3px solid #facc15;
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .dot {
      position: absolute;
      width: 16px;
      height: 16px;
      border-radius: 50%;
    }
    .active { background: #facc15; box-shadow: 0 0 8px #facc1588; }
    .inactive { background: #444; opacity: 0.3; }
  </style>
</head>
<body>
  <h1>Corner Top Shape</h1>
  <p class="prop-name">corner-top-shape</p>
  <p class="experimental">Experimental property &mdash; affects both top corners</p>
  <div class="demos">
    <div class="demo-card">
      <div class="shape-box">
        <span style="font-size:14px;color:#c0c0c0;">round</span>
        <div class="dot active" style="top:-8px;left:-8px;"></div>
        <div class="dot active" style="top:-8px;right:-8px;"></div>
        <div class="dot inactive" style="bottom:-8px;left:-8px;"></div>
        <div class="dot inactive" style="bottom:-8px;right:-8px;"></div>
      </div>
      <p class="label">corner-top-shape: round</p>
    </div>

    <div class="demo-card">
      <svg width="180" height="170" viewBox="0 0 180 170" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M28 3 H152 Q152 28 177 28 V142 Q177 167 152 167 H28 Q3 167 3 142 V28 Q28 28 28 3Z" fill="#16213e" stroke="#facc15" stroke-width="3"/>
        <text x="90" y="95" fill="#c0c0c0" text-anchor="middle" font-size="14" font-family="system-ui">scoop</text>
        <circle cx="3" cy="3" r="7" fill="#facc15"/>
        <circle cx="177" cy="3" r="7" fill="#facc15"/>
        <circle cx="3" cy="167" r="6" fill="#444" opacity="0.3"/>
        <circle cx="177" cy="167" r="6" fill="#444" opacity="0.3"/>
      </svg>
      <p class="label">corner-top-shape: scoop</p>
    </div>

    <div class="demo-card">
      <div style="background:#16213e; border-radius:10px; padding:16px; width: 240px; text-align: left;">
        <p style="font-size:12px; color:#facc15; margin-bottom:8px; font-family:monospace; font-weight:bold;">Physical property:</p>
        <p style="font-size:11px; color:#7b8794; font-family:monospace; line-height:1.8;">
          Affects both top corners<br>
          (top-left + top-right)
        </p>
        <svg width="200" height="110" viewBox="0 0 200 110" style="margin-top:10px;">
          <rect x="10" y="10" width="180" height="90" rx="4" fill="none" stroke="#444" stroke-width="1" stroke-dasharray="4"/>
          <rect x="10" y="10" width="45" height="40" fill="#facc1522" stroke="#facc15" stroke-width="2" rx="3"/>
          <rect x="145" y="10" width="45" height="40" fill="#facc1522" stroke="#facc15" stroke-width="2" rx="3"/>
          <rect x="10" y="60" width="45" height="40" fill="none" stroke="#444" stroke-width="1" opacity="0.3"/>
          <rect x="145" y="60" width="45" height="40" fill="none" stroke="#444" stroke-width="1" opacity="0.3"/>
          <text x="32" y="35" fill="#facc15" text-anchor="middle" font-size="9" font-family="monospace">TL</text>
          <text x="167" y="35" fill="#facc15" text-anchor="middle" font-size="9" font-family="monospace">TR</text>
          <text x="32" y="85" fill="#666" text-anchor="middle" font-size="9" font-family="monospace">BL</text>
          <text x="167" y="85" fill="#666" text-anchor="middle" font-size="9" font-family="monospace">BR</text>
          <!-- top edge highlight -->
          <line x1="15" y1="10" x2="185" y2="10" stroke="#facc15" stroke-width="3"/>
        </svg>
      </div>
    </div>
  </div>
</body>
</html>
