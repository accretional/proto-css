<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>font-variant-alternates</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .demo-block {
      background: #16213e;
      border-radius: 8px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; }
    .sample {
      font-size: 28px;
      color: #fff;
      line-height: 1.4;
    }
    .sample-small {
      font-size: 16px;
      color: #a0a0b0;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <h1>Font Variant Alternates</h1>
  <p class="prop-name">font-variant-alternates</p>
  <div class="demos">
    <div class="demo-block">
      <div class="label">font-variant-alternates: normal</div>
      <div class="sample" style="font-variant-alternates: normal;">The quick brown fox jumps over the lazy dog</div>
      <div class="sample-small" style="font-variant-alternates: normal;">abcdefghijklmnopqrstuvwxyz 0123456789</div>
    </div>
    <div class="demo-block">
      <div class="label">font-variant-alternates: historical-forms</div>
      <div class="sample" style="font-variant-alternates: historical-forms;">The quick brown fox jumps over the lazy dog</div>
      <div class="sample-small" style="font-variant-alternates: historical-forms;">abcdefghijklmnopqrstuvwxyz 0123456789</div>
    </div>
  </div>
</body>
</html>
