<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>animation-play-state</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; gap: 40px; }
    .demo-box { background: #16213e; border-radius: 12px; padding: 32px 40px; display: flex; flex-direction: column; align-items: center; flex: 1; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 16px; text-align: center; }
    .status { font-size: 13px; font-weight: 600; margin-bottom: 20px; padding: 4px 12px; border-radius: 20px; }
    .status-running { background: #064e3b; color: #6ee7b7; }
    .status-paused { background: #78350f; color: #fcd34d; }

    .track { width: 100%; height: 60px; background: #0f3460; border-radius: 8px; position: relative; overflow: hidden; }
    .ball { width: 50px; height: 50px; background: #e94560; border-radius: 50%; position: absolute; top: 5px; left: 0; }

    @keyframes moveAcross {
      0% { left: 0; }
      100% { left: calc(100% - 50px); }
    }

    .running .ball {
      animation: moveAcross 2s ease-in-out infinite alternate;
      
      animation-delay: -1.5s;
    }
    .paused .ball {
      animation: moveAcross 2s ease-in-out infinite alternate;

      animation-delay: -0.3s;
    }
    .replay-btn {
      display: inline-flex; align-items: center; gap: 6px;
      background: #0f3460; color: #e0e0e0; border: 1px solid #1a4a8a;
      border-radius: 6px; padding: 6px 14px; font-size: 12px;
      font-family: monospace; cursor: pointer; margin-bottom: 16px;
    }
    .replay-btn:hover { background: #1a4a8a; }
  </style>
</head>
<body>
  <h1>Animation Play State</h1>
  <p class="prop-name">animation-play-state</p>
  <button class="replay-btn" onclick="replayAnimations()">&#9654; Replay</button>
  <div class="demos">
    <div class="demo-box">
      <span class="status status-running">Running</span>
      <div class="track running">
        <div class="ball"></div>
      </div>
      <p class="label">animation-play-state: running</p>
    </div>
    <div class="demo-box">
      <span class="status status-paused">Paused</span>
      <div class="track paused">
        <div class="ball"></div>
      </div>
      <p class="label">animation-play-state: paused</p>
    </div>
  </div>
  <script>
    function replayAnimations() {
      var animated = [];
      document.querySelectorAll('*').forEach(function(el) {
        if (getComputedStyle(el).animationName !== 'none') {
          animated.push(el);
          el.style.animation = 'none';
        }
      });
      void document.body.offsetHeight;
      animated.forEach(function(el) { el.style.animation = ''; });
    }
  </script>
</body>
</html>
