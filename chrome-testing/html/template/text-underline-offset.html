<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>text-underline-offset</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 20px; }
    .demo-card {
      background: #16213e; border-radius: 10px; padding: 24px 28px;
      min-width: 180px; display: flex; flex-direction: column; align-items: center;
    }
    .demo-text {
      font-size: 28px; font-weight: 600; color: #fff;
      text-decoration: underline;
      text-decoration-color: #e94560;
      text-decoration-thickness: 3px;
      margin-bottom: 12px;
    }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; }
    .t1 { text-underline-offset: auto; }
    .t2 { text-underline-offset: 0px; }
    .t3 { text-underline-offset: 3px; }
    .t4 { text-underline-offset: 5px; }
    .t5 { text-underline-offset: 10px; }
    .t6 { text-underline-offset: -3px; }
  </style>
</head>
<body>
  <h1>Text Underline Offset</h1>
  <p class="prop-name">text-underline-offset</p>
  <div class="demos">
    <div class="demo-card">
      <span class="demo-text t1">Offset</span>
      <span class="label">text-underline-offset: auto</span>
    </div>
    <div class="demo-card">
      <span class="demo-text t2">Offset</span>
      <span class="label">text-underline-offset: 0</span>
    </div>
    <div class="demo-card">
      <span class="demo-text t3">Offset</span>
      <span class="label">text-underline-offset: 3px</span>
    </div>
    <div class="demo-card">
      <span class="demo-text t4">Offset</span>
      <span class="label">text-underline-offset: 5px</span>
    </div>
    <div class="demo-card">
      <span class="demo-text t5">Offset</span>
      <span class="label">text-underline-offset: 10px</span>
    </div>
    <div class="demo-card">
      <span class="demo-text t6">Offset</span>
      <span class="label">text-underline-offset: -3px</span>
    </div>
  </div>
</body>
</html>
