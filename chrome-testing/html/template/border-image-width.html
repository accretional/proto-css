<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>border-image-width</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
    .demo-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .box {
      width: 170px;
      height: 120px;
      background: #16213e;
      border: 20px solid transparent;
      border-image-source: linear-gradient(135deg, #e94560, #a855f7, #53d8fb);
      border-image-slice: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: #ccc;
      font-family: monospace;
    }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; text-align: center; }
  </style>
</head>
<body>
  <h1>Border Image Width</h1>
  <p class="prop-name">border-image-width</p>
  <div class="demos">
    <div class="demo-item">
      <div class="box" style="border-image-width: auto;">auto</div>
      <div class="label">border-image-width: auto</div>
    </div>
    <div class="demo-item">
      <div class="box" style="border-image-width: 1;">1</div>
      <div class="label">border-image-width: 1</div>
    </div>
    <div class="demo-item">
      <div class="box" style="border-image-width: 10px;">10px</div>
      <div class="label">border-image-width: 10px</div>
    </div>
    <div class="demo-item">
      <div class="box" style="border-image-width: 10%;">10%</div>
      <div class="label">border-image-width: 10%</div>
    </div>
    <div class="demo-item">
      <div class="box" style="border-image-width: 10px 20px;">10px 20px</div>
      <div class="label">border-image-width: 10px 20px</div>
    </div>
  </div>
</body>
</html>
