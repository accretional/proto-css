<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>border-right</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
    .demo-box {
      width: 180px;
      height: 100px;
      background: #16213e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #c0c0c0;
      border-radius: 4px;
    }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; }
    .demo-item { display: flex; flex-direction: column; align-items: flex-start; }
  </style>
</head>
<body>
  <h1>Border Right</h1>
  <p class="prop-name">border-right</p>
  <div class="demos">
    <div class="demo-item">
      <div class="demo-box" style="border-right: none;">Content</div>
      <span class="label">border-right: none</span>
    </div>
    <div class="demo-item">
      <div class="demo-box" style="border-right: 1px solid red;">Content</div>
      <span class="label">border-right: 1px solid red</span>
    </div>
    <div class="demo-item">
      <div class="demo-box" style="border-right: 2px dashed blue;">Content</div>
      <span class="label">border-right: 2px dashed blue</span>
    </div>
    <div class="demo-item">
      <div class="demo-box" style="border-right: 3px dotted green;">Content</div>
      <span class="label">border-right: 3px dotted green</span>
    </div>
  </div>
</body>
</html>
