<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>animation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 24px; }
    .demo-box {
      background: #16213e;
      border-radius: 12px;
      padding: 24px;
      width: 280px;
      height: 240px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .anim-box {
      width: 60px;
      height: 60px;
      border-radius: 8px;
    }
    @keyframes slideRotate {
      0% { transform: translateX(-60px) rotate(0deg); background: #e94560; }
      50% { transform: translateX(60px) rotate(180deg); background: #3498db; }
      100% { transform: translateX(-60px) rotate(360deg); background: #e94560; }
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.5); opacity: 0.5; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); border-radius: 8px; }
      50% { transform: translateY(-40px); border-radius: 50%; }
    }
    @keyframes colorShift {
      0% { background: #e94560; transform: rotate(0deg); }
      33% { background: #f39c12; transform: rotate(120deg); }
      66% { background: #2ecc71; transform: rotate(240deg); }
      100% { background: #e94560; transform: rotate(360deg); }
    }
    .box1 {
      animation: slideRotate 2s ease-in-out infinite;
      background: #e94560;
    }
    .box2 {
      animation: pulse 1.5s ease-in-out infinite;
      background: #3498db;
    }
    .box3 {
      animation: bounce 1s cubic-bezier(0.36, 0, 0.66, -0.56) infinite;
      background: #2ecc71;
    }
    .box4 {
      animation: colorShift 3s linear infinite;
      background: #9b59b6;
    }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; text-align: center; line-height: 1.4; }
  </style>
</head>
<body>
  <h1>Animation (Shorthand)</h1>
  <p class="prop-name">animation</p>
  <div class="demos">
    <div class="demo-box">
      <div class="anim-box box1"></div>
      <div class="label">animation: slideRotate 2s<br>ease-in-out infinite</div>
    </div>
    <div class="demo-box">
      <div class="anim-box box2"></div>
      <div class="label">animation: pulse 1.5s<br>ease-in-out infinite</div>
    </div>
    <div class="demo-box">
      <div class="anim-box box3"></div>
      <div class="label">animation: bounce 1s<br>cubic-bezier(.36,0,.66,-.56) infinite</div>
    </div>
    <div class="demo-box">
      <div class="anim-box box4"></div>
      <div class="label">animation: colorShift 3s<br>linear infinite</div>
    </div>
  </div>
</body>
</html>
