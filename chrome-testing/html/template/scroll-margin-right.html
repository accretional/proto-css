<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>scroll-margin-right</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-direction: column; gap: 20px; }
    .demo-card { }
    .scroll-container {
      width: 100%;
      height: 120px;
      overflow-x: auto;
      overflow-y: hidden;
      border: 2px solid #333;
      border-radius: 10px;
      background: #16213e;
      scroll-snap-type: x mandatory;
      display: flex;
      position: relative;
    }
    .snap-item {
      min-width: 280px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 700;
      scroll-snap-align: end;
      flex-shrink: 0;
    }
    .snap-item:nth-child(1) { background: linear-gradient(135deg, #14b8a6, #06b6d4); }
    .snap-item:nth-child(2) { background: #22224a; }
    .snap-item:nth-child(3) { background: linear-gradient(135deg, #f59e0b, #f97316); }
    .snap-item:nth-child(4) { background: #22224a; }
    .snap-item:nth-child(5) { background: linear-gradient(135deg, #6366f1, #8b5cf6); }

    .smr0 .snap-item { scroll-margin-right: 0px; }
    .smr15 .snap-item { scroll-margin-right: 15px; }
    .smr30 .snap-item { scroll-margin-right: 30px; }
    .smr50 .snap-item { scroll-margin-right: 50px; }

    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; margin-bottom: 6px; }
    .indicator {
      position: absolute;
      top: 0;
      bottom: 0;
      border-right: 2px dashed #fbbf24;
      pointer-events: none;
      z-index: 2;
    }
  </style>
</head>
<body>
  <h1>Scroll Margin Right</h1>
  <p class="prop-name">scroll-margin-right</p>
  <div class="demos">
    <div class="demo-card">
      <p class="label">scroll-margin-right: 0px</p>
      <div class="scroll-container smr0">
        <div class="snap-item">1</div>
        <div class="snap-item">2</div>
        <div class="snap-item">3</div>
        <div class="snap-item">4</div>
        <div class="snap-item">5</div>
      </div>
    </div>
    <div class="demo-card">
      <p class="label">scroll-margin-right: 15px</p>
      <div class="scroll-container smr15">
        <div class="indicator" style="right:15px;"></div>
        <div class="snap-item">1</div>
        <div class="snap-item">2</div>
        <div class="snap-item">3</div>
        <div class="snap-item">4</div>
        <div class="snap-item">5</div>
      </div>
    </div>
    <div class="demo-card">
      <p class="label">scroll-margin-right: 30px</p>
      <div class="scroll-container smr30">
        <div class="indicator" style="right:30px;"></div>
        <div class="snap-item">1</div>
        <div class="snap-item">2</div>
        <div class="snap-item">3</div>
        <div class="snap-item">4</div>
        <div class="snap-item">5</div>
      </div>
    </div>
    <div class="demo-card">
      <p class="label">scroll-margin-right: 50px</p>
      <div class="scroll-container smr50">
        <div class="indicator" style="right:50px;"></div>
        <div class="snap-item">1</div>
        <div class="snap-item">2</div>
        <div class="snap-item">3</div>
        <div class="snap-item">4</div>
        <div class="snap-item">5</div>
      </div>
    </div>
  </div>
</body>
</html>
