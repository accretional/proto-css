<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>stroke-dashoffset</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 32px; justify-content: center; }
    .demo { display: flex; flex-direction: column; align-items: center; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 10px; }
    svg circle { fill: none; stroke: #06b6d4; stroke-width: 5; stroke-dasharray: 30 10; }
    .ghost { stroke: #2a2a4e !important; stroke-dasharray: none !important; stroke-width: 2 !important; }
  </style>
</head>
<body>
  <h1>Stroke Dash Offset</h1>
  <p class="prop-name">stroke-dashoffset</p>
  <div class="demos">
    <div class="demo">
      <svg width="160" height="160">
        <circle class="ghost" cx="80" cy="80" r="60"/>
        <circle cx="80" cy="80" r="60" stroke-dashoffset="0"/>
      </svg>
      <div class="label">stroke-dashoffset: 0</div>
    </div>
    <div class="demo">
      <svg width="160" height="160">
        <circle class="ghost" cx="80" cy="80" r="60"/>
        <circle cx="80" cy="80" r="60" stroke-dashoffset="10"/>
      </svg>
      <div class="label">stroke-dashoffset: 10</div>
    </div>
    <div class="demo">
      <svg width="160" height="160">
        <circle class="ghost" cx="80" cy="80" r="60"/>
        <circle cx="80" cy="80" r="60" stroke-dashoffset="25"/>
      </svg>
      <div class="label">stroke-dashoffset: 25</div>
    </div>
    <div class="demo">
      <svg width="160" height="160">
        <circle class="ghost" cx="80" cy="80" r="60"/>
        <circle cx="80" cy="80" r="60" stroke-dashoffset="50"/>
      </svg>
      <div class="label">stroke-dashoffset: 50</div>
    </div>
  </div>
</body>
</html>
