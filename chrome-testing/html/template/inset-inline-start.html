<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>inset-inline-start</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-direction: column; gap: 16px; }
    .demo-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .container {
      width: 650px;
      height: 56px;
      background: #16213e;
      border-radius: 8px;
      position: relative;
      border: 1px dashed #3a3a5e;
    }
    .positioned {
      position: absolute;
      top: 8px;
      bottom: 8px;
      width: 120px;
      background: linear-gradient(90deg, rgba(233,69,96,0.8), rgba(15,52,96,0.8));
      border: 2px solid #e94560;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-family: monospace;
      color: #fff;
    }
    .start-edge {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 2px;
      background: #53a653;
    }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; min-width: 260px; text-align: right; }
  </style>
</head>
<body>
  <h1>Inset Inline Start</h1>
  <p class="prop-name">inset-inline-start</p>
  <div class="demos">
    <div class="demo-row">
      <p class="label">inset-inline-start: 0</p>
      <div class="container">
        <div class="start-edge"></div>
        <div class="positioned" style="inset-inline-start: 0;">start: 0</div>
      </div>
    </div>
    <div class="demo-row">
      <p class="label">inset-inline-start: 10px</p>
      <div class="container">
        <div class="start-edge"></div>
        <div class="positioned" style="inset-inline-start: 10px;">start: 10px</div>
      </div>
    </div>
    <div class="demo-row">
      <p class="label">inset-inline-start: 40px</p>
      <div class="container">
        <div class="start-edge"></div>
        <div class="positioned" style="inset-inline-start: 40px;">start: 40px</div>
      </div>
    </div>
    <div class="demo-row">
      <p class="label">inset-inline-start: 100px</p>
      <div class="container">
        <div class="start-edge"></div>
        <div class="positioned" style="inset-inline-start: 100px;">start: 100px</div>
      </div>
    </div>
    <div class="demo-row">
      <p class="label">inset-inline-start: 50%</p>
      <div class="container">
        <div class="start-edge"></div>
        <div class="positioned" style="inset-inline-start: 50%;">start: 50%</div>
      </div>
    </div>
  </div>
</body>
</html>
