<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>border-bottom-left-radius</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .demo-item { display: flex; flex-direction: column; align-items: center; }
    .box {
      width: 120px;
      height: 120px;
      background: #16213e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #fff;
      border: 4px solid #e94560;
    }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; text-align: center; }
  </style>
</head>
<body>
  <h1>Border Bottom Left Radius</h1>
  <p class="prop-name">border-bottom-left-radius</p>
  <div class="demos">
    <div class="demo-item">
      <div class="box" style="border-bottom-left-radius: 0;">0</div>
      <div class="label">border-bottom-left-radius: 0</div>
    </div>
    <div class="demo-item">
      <div class="box" style="border-bottom-left-radius: 10px;">10px</div>
      <div class="label">border-bottom-left-radius: 10px</div>
    </div>
    <div class="demo-item">
      <div class="box" style="border-bottom-left-radius: 30px;">30px</div>
      <div class="label">border-bottom-left-radius: 30px</div>
    </div>
    <div class="demo-item">
      <div class="box" style="border-bottom-left-radius: 50px;">50px</div>
      <div class="label">border-bottom-left-radius: 50px</div>
    </div>
    <div class="demo-item">
      <div class="box" style="border-bottom-left-radius: 50%;">50%</div>
      <div class="label">border-bottom-left-radius: 50%</div>
    </div>
  </div>
</body>
</html>
