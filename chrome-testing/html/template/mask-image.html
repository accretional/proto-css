<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>mask-image</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .demo-card { background: #16213e; border-radius: 10px; padding: 20px; }
    .demo-card h3 { font-size: 13px; color: #e2e8f0; margin-bottom: 12px; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 10px; line-height: 1.5; }
    .box {
      width: 100%;
      height: 120px;
      background: linear-gradient(135deg, #e94560, #a855f7, #00d2ff, #4ade80);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
    }
    .m-none {
      /* no mask applied */
    }
    .m-url {
      /* url(mask.png) would be used here -- simulated with radial gradient */
      -webkit-mask-image: radial-gradient(ellipse 100px 50px at center, black 60%, transparent 80%);
      mask-image: radial-gradient(ellipse 100px 50px at center, black 60%, transparent 80%);
    }
    .m-linear {
      -webkit-mask-image: linear-gradient(black, transparent);
      mask-image: linear-gradient(black, transparent);
    }
  </style>
</head>
<body>
  <h1>Mask Image</h1>
  <p class="prop-name">mask-image</p>
  <div class="demos">

    <div class="demo-card">
      <h3>none</h3>
      <div class="box m-none">HELLO</div>
      <p class="label">mask-image: none</p>
    </div>

    <div class="demo-card">
      <h3>url(mask.png)</h3>
      <div class="box m-url">HELLO</div>
      <p class="label">mask-image: url(mask.png)</p>
    </div>

    <div class="demo-card">
      <h3>linear-gradient(black, transparent)</h3>
      <div class="box m-linear">HELLO</div>
      <p class="label">mask-image:<br>linear-gradient(black, transparent)</p>
    </div>

  </div>
</body>
</html>
