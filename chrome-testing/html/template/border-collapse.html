<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>border-collapse</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 48px; }
    .demo-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    table {
      border: 4px solid #e94560;
      border-spacing: 10px;
    }
    td {
      border: 3px solid #53d8fb;
      padding: 14px 22px;
      background: #16213e;
      font-size: 14px;
      color: #ccc;
    }
    th {
      border: 3px solid #53d8fb;
      padding: 12px 22px;
      background: #0a1628;
      font-size: 13px;
      color: #fbbf24;
      font-weight: 600;
    }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 12px; text-align: center; }
  </style>
</head>
<body>
  <h1>Border Collapse</h1>
  <p class="prop-name">border-collapse</p>
  <div class="demos">
    <div class="demo-item">
      <table style="border-collapse: separate; border-spacing: 10px;">
        <tr><th>A</th><th>B</th><th>C</th></tr>
        <tr><td>1</td><td>2</td><td>3</td></tr>
        <tr><td>4</td><td>5</td><td>6</td></tr>
      </table>
      <div class="label">border-collapse: separate</div>
    </div>
    <div class="demo-item">
      <table style="border-collapse: collapse;">
        <tr><th>A</th><th>B</th><th>C</th></tr>
        <tr><td>1</td><td>2</td><td>3</td></tr>
        <tr><td>4</td><td>5</td><td>6</td></tr>
      </table>
      <div class="label">border-collapse: collapse</div>
    </div>
  </div>
</body>
</html>
