<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>list-style-image</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 20px; }
    .demo-card { background: #16213e; border-radius: 12px; padding: 16px; width: 350px; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 10px; text-align: center; }
    .list-box { background: #0f3460; border-radius: 8px; padding: 16px 16px 16px 44px; }
    ul { font-size: 14px; line-height: 2.2; color: #e0e0e0; }
  </style>
</head>
<body>
  <h1>List Style Image</h1>
  <p class="prop-name">list-style-image</p>
  <div class="demos">
    <div class="demo-card">
      <div class="list-box">
        <ul style="list-style-image: none;">
          <li>Default bullet</li>
          <li>No custom image</li>
          <li>Falls back to type</li>
        </ul>
      </div>
      <div class="label">list-style-image: none</div>
    </div>
    <div class="demo-card">
      <div class="list-box">
        <ul style="list-style-image: url('data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2214%22 height=%2214%22 viewBox=%220 0 14 14%22><circle cx=%227%22 cy=%227%22 r=%226%22 fill=%22%23e94560%22/></svg>');">
          <li>Custom image bullet</li>
          <li>SVG data URI used</li>
          <li>Replaces default marker</li>
        </ul>
      </div>
      <div class="label">list-style-image: url(bullet.png)</div>
    </div>
  </div>
</body>
</html>
