<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>grid-auto-flow</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 24px; }
    .demo-box { background: #16213e; border-radius: 8px; padding: 16px; width: 280px; }
    .demo-box h3 { font-size: 13px; color: #e0e0e0; margin-bottom: 10px; }
    .cell { background: #0f3460; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #e94560; font-weight: 600; padding: 6px; }
    .cell.wide { grid-column: span 2; background: #e94560; color: #fff; }
    .cell.tall { grid-row: span 2; background: #e94560; color: #fff; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; }

    .g-row { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 50px); grid-auto-flow: row; gap: 5px; }
    .g-col { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 50px); grid-auto-flow: column; gap: 5px; }
    .g-dense { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 50px); grid-auto-flow: dense; gap: 5px; }
    .g-row-dense { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 50px); grid-auto-flow: row dense; gap: 5px; }
  </style>
</head>
<body>
  <h1>Grid Auto Flow</h1>
  <p class="prop-name">grid-auto-flow</p>
  <div class="demos">
    <div class="demo-box">
      <h3>row (default)</h3>
      <div class="g-row">
        <div class="cell">1</div>
        <div class="cell wide">2 (span 2)</div>
        <div class="cell">3</div>
        <div class="cell">4</div>
        <div class="cell">5</div>
        <div class="cell">6</div>
        <div class="cell">7</div>
      </div>
      <p class="label">grid-auto-flow: row</p>
    </div>
    <div class="demo-box">
      <h3>column</h3>
      <div class="g-col">
        <div class="cell">1</div>
        <div class="cell tall">2 (span 2)</div>
        <div class="cell">3</div>
        <div class="cell">4</div>
        <div class="cell">5</div>
        <div class="cell">6</div>
        <div class="cell">7</div>
      </div>
      <p class="label">grid-auto-flow: column</p>
    </div>
    <div class="demo-box">
      <h3>dense</h3>
      <div class="g-dense">
        <div class="cell wide">1 (span 2)</div>
        <div class="cell wide">2 (span 2)</div>
        <div class="cell">3</div>
        <div class="cell">4</div>
        <div class="cell">5</div>
        <div class="cell">6</div>
      </div>
      <p class="label">grid-auto-flow: dense</p>
    </div>
    <div class="demo-box">
      <h3>row dense</h3>
      <div class="g-row-dense">
        <div class="cell wide">1 (span 2)</div>
        <div class="cell wide">2 (span 2)</div>
        <div class="cell">3</div>
        <div class="cell">4</div>
        <div class="cell">5</div>
        <div class="cell">6</div>
      </div>
      <p class="label">grid-auto-flow: row dense</p>
    </div>
  </div>
</body>
</html>
