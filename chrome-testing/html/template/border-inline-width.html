<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>border-inline-width</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .demo-box {
      width: 200px;
      height: 100px;
      background: #16213e;
      border-inline-style: solid;
      border-inline-color: #3498db;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #c0c0c0;
      border-radius: 4px;
    }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; }
    .demo-item { display: flex; flex-direction: column; align-items: flex-start; }
  </style>
</head>
<body>
  <h1>Border Inline Width</h1>
  <p class="prop-name">border-inline-width</p>
  <div class="demos">
    <div class="demo-item">
      <div class="demo-box" style="border-inline-width: 0;">Content</div>
      <span class="label">border-inline-width: 0</span>
    </div>
    <div class="demo-item">
      <div class="demo-box" style="border-inline-width: 1px;">Content</div>
      <span class="label">border-inline-width: 1px</span>
    </div>
    <div class="demo-item">
      <div class="demo-box" style="border-inline-width: 2px;">Content</div>
      <span class="label">border-inline-width: 2px</span>
    </div>
    <div class="demo-item">
      <div class="demo-box" style="border-inline-width: thin;">Content</div>
      <span class="label">border-inline-width: thin</span>
    </div>
    <div class="demo-item">
      <div class="demo-box" style="border-inline-width: medium;">Content</div>
      <span class="label">border-inline-width: medium</span>
    </div>
    <div class="demo-item">
      <div class="demo-box" style="border-inline-width: thick;">Content</div>
      <span class="label">border-inline-width: thick</span>
    </div>
  </div>
</body>
</html>
