<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>flex-direction</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .demo-block { display: flex; flex-direction: column; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-bottom: 6px; }
    .container {
      display: flex;
      background: #16213e;
      border-radius: 8px;
      padding: 14px;
      gap: 10px;
      min-height: 260px;
    }
    .item {
      background: #0f3460;
      border: 2px solid #00b4d8;
      border-radius: 6px;
      width: 70px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
      color: #00b4d8;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <h1>Flex Direction</h1>
  <p class="prop-name">flex-direction</p>
  <div class="demos">
    <div class="demo-block">
      <div class="label">flex-direction: row</div>
      <div class="container" style="flex-direction: row; align-items: flex-start;">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
      </div>
    </div>
    <div class="demo-block">
      <div class="label">flex-direction: row-reverse</div>
      <div class="container" style="flex-direction: row-reverse; align-items: flex-start;">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
      </div>
    </div>
    <div class="demo-block">
      <div class="label">flex-direction: column</div>
      <div class="container" style="flex-direction: column; align-items: flex-start;">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
      </div>
    </div>
    <div class="demo-block">
      <div class="label">flex-direction: column-reverse</div>
      <div class="container" style="flex-direction: column-reverse; align-items: flex-start;">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
      </div>
    </div>
  </div>
</body>
</html>
