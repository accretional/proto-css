<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>margin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 18px; }
    .demo-card { background: #16213e; border-radius: 12px; padding: 16px; width: 370px; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 10px; text-align: center; }
    .outer { background: #0f3460; border-radius: 8px; padding: 0; overflow: hidden; }
    .margin-area { background: rgba(233, 69, 96, 0.15); }
    .inner { background: #e94560; border-radius: 4px; padding: 14px; font-size: 12px; font-weight: 600; color: #fff; text-align: center; }
    .note { font-size: 10px; color: #6b7280; text-align: center; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>Margin</h1>
  <p class="prop-name">margin</p>
  <div class="demos">
    <div class="demo-card">
      <div class="outer">
        <div class="margin-area">
          <div class="inner" style="margin: 0;">Content</div>
        </div>
      </div>
      <div class="label">margin: 0</div>
    </div>
    <div class="demo-card">
      <div class="outer">
        <div class="margin-area">
          <div class="inner" style="margin: 10px;">Content</div>
        </div>
      </div>
      <div class="label">margin: 10px</div>
    </div>
    <div class="demo-card">
      <div class="outer">
        <div class="margin-area">
          <div class="inner" style="margin: 20px;">Content</div>
        </div>
      </div>
      <div class="label">margin: 20px</div>
    </div>
    <div class="demo-card">
      <div class="outer">
        <div class="margin-area">
          <div class="inner" style="margin: 0 auto; width: 60%;">Content</div>
        </div>
      </div>
      <div class="label">margin: 0 auto (centered)</div>
      <div class="note">Horizontally centered with auto left/right</div>
    </div>
    <div class="demo-card">
      <div class="outer">
        <div class="margin-area">
          <div class="inner" style="margin: 10px 20px 30px 40px;">Content</div>
        </div>
      </div>
      <div class="label">margin: 10px 20px 30px 40px</div>
      <div class="note">top: 10, right: 20, bottom: 30, left: 40</div>
    </div>
  </div>
</body>
</html>
