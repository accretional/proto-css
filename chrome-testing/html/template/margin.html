<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>margin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .demo-card { background: #16213e; border-radius: 12px; padding: 16px; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 10px; text-align: center; }
    .outer { background: #0f3460; border-radius: 8px; padding: 0; overflow: hidden; }
    .margin-area { background: rgba(233, 69, 96, 0.15); }
    .inner { background: #e94560; border-radius: 4px; padding: 14px; font-size: 12px; font-weight: 600; color: #fff; text-align: center; }
  </style>
</head>
<body>
  <h1>Margin</h1>
  <p class="prop-name">margin</p>
  <div class="demos">
    <div class="demo-card">
      <div class="outer">
        <div class="margin-area">
          <div class="inner" style="margin: 0;">Content</div>
        </div>
      </div>
      <div class="label">margin: 0</div>
    </div>
    <div class="demo-card">
      <div class="outer">
        <div class="margin-area">
          <div class="inner" style="margin: 10px;">Content</div>
        </div>
      </div>
      <div class="label">margin: 10px</div>
    </div>
    <div class="demo-card">
      <div class="outer">
        <div class="margin-area">
          <div class="inner" style="margin: auto; width: 60%;">Content</div>
        </div>
      </div>
      <div class="label">margin: auto</div>
    </div>
    <div class="demo-card">
      <div class="outer">
        <div class="margin-area">
          <div class="inner" style="margin: 10px 20px;">Content</div>
        </div>
      </div>
      <div class="label">margin: 10px 20px</div>
    </div>
    <div class="demo-card">
      <div class="outer">
        <div class="margin-area">
          <div class="inner" style="margin: 10px auto; width: 60%;">Content</div>
        </div>
      </div>
      <div class="label">margin: 10px auto</div>
    </div>
    <div class="demo-card">
      <div class="outer">
        <div class="margin-area">
          <div class="inner" style="margin: 10px 20px 30px 40px;">Content</div>
        </div>
      </div>
      <div class="label">margin: 10px 20px 30px 40px</div>
    </div>
  </div>
</body>
</html>
