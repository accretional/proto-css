<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>bottom</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: grid; grid-template-columns: repeat(5, 1fr); gap: 24px; }
    .demo-box { display: flex; flex-direction: column; align-items: center; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; text-align: center; }
    .container {
      width: 160px;
      height: 220px;
      background: #16213e;
      border: 2px solid #333;
      position: relative;
    }
    .guide {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: #333;
      border-top: 1px dashed #555;
    }
    .item {
      width: 60px;
      height: 40px;
      background: #e94560;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: bold;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>Bottom</h1>
  <p class="prop-name">bottom</p>
  <div class="demos">
    <div class="demo-box">
      <div class="container">
        <div class="guide"></div>
        <div class="item" style="bottom: auto; top: 0;">auto</div>
      </div>
      <span class="label">bottom: auto</span>
    </div>
    <div class="demo-box">
      <div class="container">
        <div class="guide"></div>
        <div class="item" style="bottom: 0;">0</div>
      </div>
      <span class="label">bottom: 0</span>
    </div>
    <div class="demo-box">
      <div class="container">
        <div class="guide"></div>
        <div class="item" style="bottom: 20px;">20px</div>
      </div>
      <span class="label">bottom: 20px</span>
    </div>
    <div class="demo-box">
      <div class="container">
        <div class="guide"></div>
        <div class="item" style="bottom: 60px;">60px</div>
      </div>
      <span class="label">bottom: 60px</span>
    </div>
    <div class="demo-box">
      <div class="container">
        <div class="guide"></div>
        <div class="item" style="bottom: 50%;">50%</div>
      </div>
      <span class="label">bottom: 50%</span>
    </div>
  </div>
</body>
</html>
