<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>inset-inline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-direction: column; gap: 20px; }
    .demo-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .container {
      width: 700px;
      height: 60px;
      background: #16213e;
      border-radius: 8px;
      position: relative;
      border: 1px dashed #3a3a5e;
    }
    .positioned {
      position: absolute;
      top: 10px;
      bottom: 10px;
      background: linear-gradient(90deg, rgba(233,69,96,0.8), rgba(15,52,96,0.8));
      border: 2px solid #e94560;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-family: monospace;
      color: #fff;
    }
    .left-edge {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 2px;
      background: #53a653;
    }
    .right-edge {
      position: absolute;
      top: 0;
      bottom: 0;
      right: 0;
      width: 2px;
      background: #f5c542;
    }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; min-width: 240px; text-align: right; }
  </style>
</head>
<body>
  <h1>Inset Inline</h1>
  <p class="prop-name">inset-inline</p>
  <div class="demos">
    <div class="demo-row">
      <p class="label">inset-inline: auto</p>
      <div class="container">
        <div class="left-edge"></div>
        <div class="right-edge"></div>
        <div class="positioned" style="inset-inline: auto; left: 10px; width: 120px;">auto</div>
      </div>
    </div>
    <div class="demo-row">
      <p class="label">inset-inline: 0</p>
      <div class="container">
        <div class="left-edge"></div>
        <div class="right-edge"></div>
        <div class="positioned" style="inset-inline: 0;">inset-inline: 0</div>
      </div>
    </div>
    <div class="demo-row">
      <p class="label">inset-inline: 10px</p>
      <div class="container">
        <div class="left-edge"></div>
        <div class="right-edge"></div>
        <div class="positioned" style="inset-inline: 10px;">inset-inline: 10px</div>
      </div>
    </div>
    <div class="demo-row">
      <p class="label">inset-inline: 10px 20px</p>
      <div class="container">
        <div class="left-edge"></div>
        <div class="right-edge"></div>
        <div class="positioned" style="inset-inline: 10px 20px;">inset-inline: 10px 20px</div>
      </div>
    </div>
  </div>
</body>
</html>
