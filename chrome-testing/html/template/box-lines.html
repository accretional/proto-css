<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>box-lines</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 32px; }
    .demo-box { display: flex; flex-direction: column; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; }
    .container {
      display: -webkit-box;
      -webkit-box-orient: horizontal;
      width: 300px;
      height: 180px;
      background: #16213e;
      border: 2px solid #333;
    }
    .child {
      width: 80px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: bold;
      color: #fff;
      margin: 4px;
      border-radius: 4px;
    }
    .child:nth-child(1) { background: #e94560; }
    .child:nth-child(2) { background: #0f3460; }
    .child:nth-child(3) { background: #53d769; color: #1a1a2e; }
    .child:nth-child(4) { background: #fbbf24; color: #1a1a2e; }
    .child:nth-child(5) { background: #c084fc; }
    .child:nth-child(6) { background: #00d2ff; color: #1a1a2e; }
    .single { -webkit-box-lines: single; }
    .multiple { -webkit-box-lines: multiple; }
    .note {
      font-size: 12px;
      color: #7b8794;
      margin-top: 16px;
      font-style: italic;
      max-width: 700px;
    }
  </style>
</head>
<body>
  <h1>Box Lines (deprecated)</h1>
  <p class="prop-name">box-lines / -webkit-box-lines</p>
  <div class="demos">
    <div class="demo-box">
      <div class="container single">
        <div class="child">1</div>
        <div class="child">2</div>
        <div class="child">3</div>
        <div class="child">4</div>
        <div class="child">5</div>
        <div class="child">6</div>
      </div>
      <span class="label">-webkit-box-lines: single</span>
    </div>
    <div class="demo-box">
      <div class="container multiple">
        <div class="child">1</div>
        <div class="child">2</div>
        <div class="child">3</div>
        <div class="child">4</div>
        <div class="child">5</div>
        <div class="child">6</div>
      </div>
      <span class="label">-webkit-box-lines: multiple</span>
    </div>
  </div>
  <p class="note">Note: box-lines is a deprecated property with very limited browser support. 'single' keeps items on one line (default), 'multiple' allows wrapping.</p>
</body>
</html>
