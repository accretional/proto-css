<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>height</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-end; }
    .demo-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 120px;
    }
    .wrapper {
      width: 100px;
      height: 250px;
      background: #16213e;
      border-radius: 8px;
      padding: 8px;
      display: flex;
      align-items: flex-end;
    }
    .box {
      width: 100%;
      background: linear-gradient(135deg, #e94560, #0f3460);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-family: monospace;
      color: #fff;
      overflow: hidden;
    }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; text-align: center; }
  </style>
</head>
<body>
  <h1>Height</h1>
  <p class="prop-name">height</p>
  <div class="demos">
    <div class="demo-card">
      <div class="wrapper">
        <div class="box" style="height: auto;">auto</div>
      </div>
      <p class="label">height: auto</p>
    </div>
    <div class="demo-card">
      <div class="wrapper">
        <div class="box" style="height: 0;"></div>
      </div>
      <p class="label">height: 0</p>
    </div>
    <div class="demo-card">
      <div class="wrapper">
        <div class="box" style="height: 50px;"></div>
      </div>
      <p class="label">height: 50px</p>
    </div>
    <div class="demo-card">
      <div class="wrapper">
        <div class="box" style="height: 100px;"></div>
      </div>
      <p class="label">height: 100px</p>
    </div>
    <div class="demo-card">
      <div class="wrapper">
        <div class="box" style="height: 200px;"></div>
      </div>
      <p class="label">height: 200px</p>
    </div>
    <div class="demo-card">
      <div class="wrapper">
        <div class="box" style="height: 50%;"></div>
      </div>
      <p class="label">height: 50%</p>
    </div>
    <div class="demo-card">
      <div class="wrapper">
        <div class="box" style="height: 100%;"></div>
      </div>
      <p class="label">height: 100%</p>
    </div>
    <div class="demo-card">
      <div class="wrapper">
        <div class="box" style="height: min-content;">min</div>
      </div>
      <p class="label">height: min-content</p>
    </div>
    <div class="demo-card">
      <div class="wrapper">
        <div class="box" style="height: max-content;">max</div>
      </div>
      <p class="label">height: max-content</p>
    </div>
    <div class="demo-card">
      <div class="wrapper">
        <div class="box" style="height: fit-content;">fit</div>
      </div>
      <p class="label">height: fit-content</p>
    </div>
    <div class="demo-card">
      <div class="wrapper">
        <div class="box" style="height: stretch;"></div>
      </div>
      <p class="label">height: stretch</p>
    </div>
    <div class="demo-card">
      <div class="wrapper">
        <div class="box" style="height: contain;">con</div>
      </div>
      <p class="label">height: contain</p>
    </div>
  </div>
</body>
</html>
