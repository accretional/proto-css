<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>outline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 28px; justify-content: center; }
    .demo-box { background: #16213e; border-radius: 10px; padding: 24px; width: 220px; text-align: center; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 16px; }
    .outlined {
      width: 140px; height: 100px; background: #0f3460; border-radius: 8px;
      margin: 16px auto 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; color: #c0c0d0;
    }
    .d1 .outlined { outline: 2px solid #e94560; }
    .d2 .outlined { outline: 3px dashed #0077ff; }
    .d3 .outlined { outline: 4px dotted #00cc66; }
    .d4 .outlined { outline: 3px double #f5a623; }
    .d5 .outlined { outline: 4px groove #7b68ee; }
    .d6 .outlined { outline: 4px ridge #00d2ff; }
  </style>
</head>
<body>
  <h1>Outline Shorthand</h1>
  <p class="prop-name">outline</p>
  <div class="demos">
    <div class="demo-box d1">
      <div class="outlined">Box</div>
      <div class="label">outline: 2px solid red</div>
    </div>
    <div class="demo-box d2">
      <div class="outlined">Box</div>
      <div class="label">outline: 3px dashed blue</div>
    </div>
    <div class="demo-box d3">
      <div class="outlined">Box</div>
      <div class="label">outline: 4px dotted green</div>
    </div>
    <div class="demo-box d4">
      <div class="outlined">Box</div>
      <div class="label">outline: 3px double orange</div>
    </div>
    <div class="demo-box d5">
      <div class="outlined">Box</div>
      <div class="label">outline: 4px groove purple</div>
    </div>
    <div class="demo-box d6">
      <div class="outlined">Box</div>
      <div class="label">outline: 4px ridge cyan</div>
    </div>
  </div>
</body>
</html>
