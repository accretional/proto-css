<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>grid-template</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 24px; }
    .demo-box { background: #16213e; border-radius: 8px; padding: 16px; width: 380px; }
    .demo-box h3 { font-size: 13px; color: #e0e0e0; margin-bottom: 10px; }
    .cell { background: #0f3460; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #e94560; font-weight: 600; padding: 6px; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }

    .g1 { display: grid; grid-template: none; gap: 6px; }
    .g2 { display: grid; grid-template: 100px / 1fr 2fr; gap: 6px; }
    .g3 {
      display: grid;
      grid-template:
        "a a" 50px
        "b b" 50px
        / 1fr 2fr;
      gap: 6px;
    }
    .g3 .c-a { grid-area: a; background: #e94560; color: #fff; }
    .g3 .c-b { grid-area: b; background: #533483; color: #fff; }
  </style>
</head>
<body>
  <h1>Grid Template</h1>
  <p class="prop-name">grid-template</p>
  <div class="demos">
    <div class="demo-box">
      <h3>none</h3>
      <div class="g1">
        <div class="cell">1</div>
        <div class="cell">2</div>
        <div class="cell">3</div>
      </div>
      <p class="label">grid-template: none</p>
    </div>
    <div class="demo-box">
      <h3>100px / 1fr 2fr</h3>
      <div class="g2">
        <div class="cell">1fr</div>
        <div class="cell">2fr</div>
      </div>
      <p class="label">grid-template: 100px / 1fr 2fr</p>
    </div>
    <div class="demo-box">
      <h3>"a a" 50px "b b" 50px / 1fr 2fr</h3>
      <div class="g3">
        <div class="cell c-a">a</div>
        <div class="cell c-b">b</div>
      </div>
      <p class="label">grid-template: "a a" 50px "b b" 50px / 1fr 2fr</p>
    </div>
  </div>
</body>
</html>
