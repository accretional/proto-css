<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>box-flex</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-direction: column; gap: 24px; }
    .demo-box { display: flex; flex-direction: column; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; }
    .container {
      display: -webkit-box;
      -webkit-box-orient: horizontal;
      width: 100%;
      max-width: 900px;
      height: 80px;
      background: #16213e;
      border: 2px solid #333;
    }
    .child {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: bold;
      color: #fff;
      border-right: 2px solid #1a1a2e;
    }
    .c1 { background: #e94560; }
    .c2 { background: #0f3460; }
    .c3 { background: #53d769; color: #1a1a2e; }
    .c4 { background: #c084fc; }
  </style>
</head>
<body>
  <h1>Box Flex (deprecated)</h1>
  <p class="prop-name">box-flex / -webkit-box-flex</p>
  <div class="demos">
    <div class="demo-box">
      <div class="container">
        <div class="child c1" style="-webkit-box-flex: 0; min-width: 80px;">flex: 0</div>
        <div class="child c2" style="-webkit-box-flex: 1;">flex: 1</div>
        <div class="child c3" style="-webkit-box-flex: 1;">flex: 1</div>
      </div>
      <span class="label">box-flex: 0 | 1 | 1</span>
    </div>
    <div class="demo-box">
      <div class="container">
        <div class="child c1" style="-webkit-box-flex: 0.5;">flex: 0.5</div>
        <div class="child c2" style="-webkit-box-flex: 1;">flex: 1</div>
        <div class="child c3" style="-webkit-box-flex: 0.5;">flex: 0.5</div>
      </div>
      <span class="label">box-flex: 0.5 | 1 | 0.5</span>
    </div>
    <div class="demo-box">
      <div class="container">
        <div class="child c1" style="-webkit-box-flex: 1;">flex: 1</div>
        <div class="child c2" style="-webkit-box-flex: 1;">flex: 1</div>
        <div class="child c3" style="-webkit-box-flex: 1;">flex: 1</div>
      </div>
      <span class="label">box-flex: 1 | 1 | 1</span>
    </div>
    <div class="demo-box">
      <div class="container">
        <div class="child c1" style="-webkit-box-flex: 1;">flex: 1</div>
        <div class="child c2" style="-webkit-box-flex: 2;">flex: 2</div>
        <div class="child c3" style="-webkit-box-flex: 1;">flex: 1</div>
      </div>
      <span class="label">box-flex: 1 | 2 | 1</span>
    </div>
  </div>
</body>
</html>
