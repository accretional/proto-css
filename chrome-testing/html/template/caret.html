<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>caret</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .demo-card {
      background: #16213e;
      border-radius: 10px;
      padding: 20px;
    }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-bottom: 12px; }
    input {
      width: 100%;
      padding: 12px 14px;
      background: #0f3460;
      border: 2px solid #1a4a8a;
      border-radius: 8px;
      color: #e0e0e0;
      font-size: 15px;
      outline: none;
      font-family: system-ui, sans-serif;
    }
    input:focus { border-color: #e94560; }
    .note { font-size: 10px; color: #6b7280; margin-top: 8px; font-style: italic; }
  </style>
</head>
<body>
  <h1>Caret</h1>
  <p class="prop-name">caret</p>
  <div class="demos">
    <div class="demo-card">
      <div class="label">caret: auto</div>
      <input type="text" style="caret: auto;" value="Click to see caret" autofocus />
      <p class="note">Browser default caret</p>
    </div>
    <div class="demo-card">
      <div class="label">caret: red bar</div>
      <input type="text" style="caret: red bar;" value="Click to see caret" />
      <p class="note">Red color, bar shape</p>
    </div>
    <div class="demo-card">
      <div class="label">caret: blue block</div>
      <input type="text" style="caret: blue block;" value="Click to see caret" />
      <p class="note">Blue color, block shape</p>
    </div>
    <div class="demo-card">
      <div class="label">caret: green underscore</div>
      <input type="text" style="caret: green underscore;" value="Click to see caret" />
      <p class="note">Green color, underscore shape</p>
    </div>
  </div>
</body>
</html>
