<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>border-top-right-radius</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: grid; grid-template-columns: repeat(5, 1fr); gap: 24px; }
    .demo-box { display: flex; flex-direction: column; align-items: center; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; text-align: center; }
    .box {
      width: 120px;
      height: 120px;
      background: #0f3460;
      border: 4px solid #e94560;
    }
    .r0 { border-top-right-radius: 0; }
    .r10 { border-top-right-radius: 10px; }
    .r30 { border-top-right-radius: 30px; }
    .r50 { border-top-right-radius: 50px; }
    .r50p { border-top-right-radius: 50%; }
  </style>
</head>
<body>
  <h1>Border Top Right Radius</h1>
  <p class="prop-name">border-top-right-radius</p>
  <div class="demos">
    <div class="demo-box">
      <div class="box r0"></div>
      <span class="label">border-top-right-radius: 0</span>
    </div>
    <div class="demo-box">
      <div class="box r10"></div>
      <span class="label">border-top-right-radius: 10px</span>
    </div>
    <div class="demo-box">
      <div class="box r30"></div>
      <span class="label">border-top-right-radius: 30px</span>
    </div>
    <div class="demo-box">
      <div class="box r50"></div>
      <span class="label">border-top-right-radius: 50px</span>
    </div>
    <div class="demo-box">
      <div class="box r50p"></div>
      <span class="label">border-top-right-radius: 50%</span>
    </div>
  </div>
</body>
</html>
