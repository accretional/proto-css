<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>marker-start</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .demo-card { background: #16213e; border-radius: 10px; padding: 20px; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; text-align: center; }
    svg { display: block; margin: 0 auto; }
  </style>
</head>
<body>
  <h1>Marker Start</h1>
  <p class="prop-name">marker-start</p>
  <div class="demos">

    <div class="demo-card">
      <svg width="340" height="80" viewBox="0 0 340 80">
        <path d="M 20,40 C 100,10 240,70 320,40" fill="none" stroke="#6b7280" stroke-width="2.5"/>
      </svg>
      <div class="label">marker-start: none</div>
    </div>

    <div class="demo-card">
      <svg width="340" height="80" viewBox="0 0 340 80">
        <defs>
          <marker id="startArrow" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#e94560"/>
          </marker>
        </defs>
        <path d="M 30,40 C 100,10 240,70 320,40" fill="none" stroke="#e94560" stroke-width="2.5" marker-start="url(#startArrow)"/>
      </svg>
      <div class="label">marker-start: url(#arrow)</div>
    </div>

  </div>
</body>
</html>
