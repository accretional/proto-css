<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>animation-delay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-direction: column; gap: 16px; }
    .demo-row {
      display: flex;
      align-items: center;
      gap: 16px;
      background: #16213e;
      border-radius: 10px;
      padding: 16px 24px;
    }
    .row-label {
      font-size: 12px;
      font-family: monospace;
      color: #9ca3af;
      width: 200px;
      flex-shrink: 0;
    }
    .track {
      flex: 1;
      height: 48px;
      background: #0f3460;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
    }
    .track-marker {
      position: absolute;
      left: 0;
      top: 0;
      width: 48px;
      height: 48px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: bold;
      color: #fff;
    }
    @keyframes slideAcross {
      from { left: 0; }
      to { left: calc(100% - 48px); }
    }
    .delay-0 {
      background: #e94560;
      animation: slideAcross 4s linear infinite;
      
      animation-delay: 0s;
    }
    .delay-05 {
      background: #f39c12;
      animation: slideAcross 4s linear infinite;
      
      animation-delay: -0.5s;
    }
    .delay-1 {
      background: #3498db;
      animation: slideAcross 4s linear infinite;
      
      animation-delay: -1s;
    }
    .delay-15 {
      background: #2ecc71;
      animation: slideAcross 4s linear infinite;
      
      animation-delay: -1.5s;
    }
    .delay-2 {
      background: #9b59b6;
      animation: slideAcross 4s linear infinite;
      
      animation-delay: -2s;
    }
    .time-axis {
      display: flex;
      justify-content: space-between;
      padding: 4px 24px;
      margin-top: 4px;
    }
    .time-tick {
      font-size: 10px;
      font-family: monospace;
      color: #4a5568;
    }
    .explanation {
      font-size: 12px;
      color: #6b7280;
      margin-top: 8px;
      font-style: italic;
    }
  </style>
</head>
<body>
  <h1>Animation Delay</h1>
  <p class="prop-name">animation-delay</p>
  <div class="demos">
    <div class="demo-row">
      <div class="row-label">animation-delay: 0s</div>
      <div class="track">
        <div class="track-marker delay-0">0s</div>
      </div>
    </div>
    <div class="demo-row">
      <div class="row-label">animation-delay: 0.5s</div>
      <div class="track">
        <div class="track-marker delay-05">0.5s</div>
      </div>
    </div>
    <div class="demo-row">
      <div class="row-label">animation-delay: 1s</div>
      <div class="track">
        <div class="track-marker delay-1">1s</div>
      </div>
    </div>
    <div class="demo-row">
      <div class="row-label">animation-delay: 1.5s</div>
      <div class="track">
        <div class="track-marker delay-15">1.5s</div>
      </div>
    </div>
    <div class="demo-row">
      <div class="row-label">animation-delay: 2s</div>
      <div class="track">
        <div class="track-marker delay-2">2s</div>
      </div>
    </div>
  </div>
  <p class="explanation">Negative delays start the animation partway through. Each box begins at a different point in the timeline.</p>
</body>
</html>
