<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>border-image-source</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 32px; }
    .demo-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .box {
      width: 200px;
      height: 150px;
      background: #16213e;
      border: 14px solid #e94560;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #ccc;
      font-family: monospace;
      text-align: center;
      line-height: 1.5;
    }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; text-align: center; max-width: 240px; }
  </style>
</head>
<body>
  <h1>Border Image Source</h1>
  <p class="prop-name">border-image-source</p>
  <div class="demos">
    <div class="demo-item">
      <div class="box" style="border-image-source: none;">none<br>(solid border)</div>
      <div class="label">border-image-source: none</div>
    </div>
    <div class="demo-item">
      <div class="box" style="border-image-source: linear-gradient(45deg, #e94560, #53d8fb); border-image-slice: 1;">linear-gradient<br>45deg</div>
      <div class="label">border-image-source:<br>linear-gradient(45deg, ...)</div>
    </div>
    <div class="demo-item">
      <div class="box" style="border-image-source: radial-gradient(circle, #4ade80, #a855f7); border-image-slice: 1;">radial-gradient<br>circle</div>
      <div class="label">border-image-source:<br>radial-gradient(circle, ...)</div>
    </div>
    <div class="demo-item">
      <div class="box" style="border-image-source: conic-gradient(#e94560, #fbbf24, #53d8fb, #e94560); border-image-slice: 1;">conic-gradient</div>
      <div class="label">border-image-source:<br>conic-gradient(...)</div>
    </div>
  </div>
</body>
</html>
