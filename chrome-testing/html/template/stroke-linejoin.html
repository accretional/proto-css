<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>stroke-linejoin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 40px; justify-content: center; }
    .demo { display: flex; flex-direction: column; align-items: center; background: #16213e; border-radius: 12px; padding: 28px 36px; }
    .label { font-size: 12px; font-family: monospace; color: #9ca3af; margin-top: 14px; }
  </style>
</head>
<body>
  <h1>Stroke Line Join</h1>
  <p class="prop-name">stroke-linejoin</p>
  <div class="demos">
    <div class="demo">
      <svg width="280" height="220">
        <!-- Zigzag polyline to show joins clearly -->
        <polyline points="30,180 80,40 140,180 200,40 250,180"
          fill="none" stroke="#06b6d4" stroke-width="20" stroke-linejoin="miter" stroke-linecap="butt"/>
        <!-- Thin outline to show the path -->
        <polyline points="30,180 80,40 140,180 200,40 250,180"
          fill="none" stroke="#f43f5e" stroke-width="1" stroke-dasharray="4 3"/>
      </svg>
      <div class="label">stroke-linejoin: miter</div>
    </div>
    <div class="demo">
      <svg width="280" height="220">
        <polyline points="30,180 80,40 140,180 200,40 250,180"
          fill="none" stroke="#06b6d4" stroke-width="20" stroke-linejoin="round" stroke-linecap="butt"/>
        <polyline points="30,180 80,40 140,180 200,40 250,180"
          fill="none" stroke="#f43f5e" stroke-width="1" stroke-dasharray="4 3"/>
      </svg>
      <div class="label">stroke-linejoin: round</div>
    </div>
    <div class="demo">
      <svg width="280" height="220">
        <polyline points="30,180 80,40 140,180 200,40 250,180"
          fill="none" stroke="#06b6d4" stroke-width="20" stroke-linejoin="bevel" stroke-linecap="butt"/>
        <polyline points="30,180 80,40 140,180 200,40 250,180"
          fill="none" stroke="#f43f5e" stroke-width="1" stroke-dasharray="4 3"/>
      </svg>
      <div class="label">stroke-linejoin: bevel</div>
    </div>
  </div>
</body>
</html>
