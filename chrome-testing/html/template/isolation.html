<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>isolation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 32px; }
    .demo-card { background: #16213e; border-radius: 12px; padding: 20px; width: 380px; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 12px; text-align: center; }
    .scene { position: relative; width: 100%; height: 200px; background: #0f3460; border-radius: 8px; overflow: hidden; }
    .shape1 { position: absolute; width: 140px; height: 140px; border-radius: 16px; background: #e94560; top: 20px; left: 40px; }
    .shape2 { position: absolute; width: 140px; height: 140px; border-radius: 16px; background: #0ea5e9; mix-blend-mode: screen; top: 50px; left: 100px; }
    .group { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    .card-title { font-size: 14px; color: #e0e0e0; margin-bottom: 10px; text-align: center; font-weight: 600; }
    .note { font-size: 10px; color: #6b7280; text-align: center; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>Isolation</h1>
  <p class="prop-name">isolation</p>
  <div class="demos">
    <div class="demo-card">
      <div class="card-title">isolation: auto</div>
      <div class="scene">
        <div class="group" style="isolation: auto;">
          <div class="shape1"></div>
          <div class="shape2"></div>
        </div>
      </div>
      <div class="label">isolation: auto</div>
      <div class="note">Blends with background (screen blend visible)</div>
    </div>
    <div class="demo-card">
      <div class="card-title">isolation: isolate</div>
      <div class="scene">
        <div class="group" style="isolation: isolate;">
          <div class="shape1"></div>
          <div class="shape2"></div>
        </div>
      </div>
      <div class="label">isolation: isolate</div>
      <div class="note">Creates new stacking context, blend confined to group</div>
    </div>
  </div>
</body>
</html>
