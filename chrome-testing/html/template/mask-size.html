<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>mask-size</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: grid; grid-template-columns: repeat(5, 1fr); gap: 18px; }
    .demo-card { background: #16213e; border-radius: 10px; padding: 16px; }
    .demo-card h3 { font-size: 12px; color: #e2e8f0; margin-bottom: 10px; }
    .label { font-size: 10px; font-family: monospace; color: #9ca3af; margin-top: 8px; }
    .desc { font-size: 9px; color: #6b7280; margin-top: 4px; }
    .box {
      width: 180px;
      height: 120px;
      background: linear-gradient(135deg, #e94560, #a855f7, #00d2ff, #4ade80);
      border-radius: 8px;
    }
    .size-auto {
      -webkit-mask-image: radial-gradient(circle, black 50%, transparent 51%);
      -webkit-mask-size: auto;
      -webkit-mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-image: radial-gradient(circle, black 50%, transparent 51%);
      mask-size: auto;
      mask-repeat: no-repeat;
      mask-position: center;
    }
    .size-cover {
      -webkit-mask-image: radial-gradient(circle, black 50%, transparent 51%);
      -webkit-mask-size: cover;
      -webkit-mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-image: radial-gradient(circle, black 50%, transparent 51%);
      mask-size: cover;
      mask-repeat: no-repeat;
      mask-position: center;
    }
    .size-contain {
      -webkit-mask-image: radial-gradient(circle, black 50%, transparent 51%);
      -webkit-mask-size: contain;
      -webkit-mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-image: radial-gradient(circle, black 50%, transparent 51%);
      mask-size: contain;
      mask-repeat: no-repeat;
      mask-position: center;
    }
    .size-100 {
      -webkit-mask-image: radial-gradient(circle, black 50%, transparent 51%);
      -webkit-mask-size: 100%;
      -webkit-mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-image: radial-gradient(circle, black 50%, transparent 51%);
      mask-size: 100%;
      mask-repeat: no-repeat;
      mask-position: center;
    }
    .size-50-50 {
      -webkit-mask-image: radial-gradient(circle, black 50%, transparent 51%);
      -webkit-mask-size: 50% 50%;
      -webkit-mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-image: radial-gradient(circle, black 50%, transparent 51%);
      mask-size: 50% 50%;
      mask-repeat: no-repeat;
      mask-position: center;
    }
  </style>
</head>
<body>
  <h1>Mask Size</h1>
  <p class="prop-name">mask-size</p>
  <div class="demos">

    <div class="demo-card">
      <h3>auto</h3>
      <div class="box size-auto"></div>
      <p class="label">mask-size: auto</p>
      <p class="desc">Intrinsic mask dimensions</p>
    </div>

    <div class="demo-card">
      <h3>cover</h3>
      <div class="box size-cover"></div>
      <p class="label">mask-size: cover</p>
      <p class="desc">Scales to cover entire element</p>
    </div>

    <div class="demo-card">
      <h3>contain</h3>
      <div class="box size-contain"></div>
      <p class="label">mask-size: contain</p>
      <p class="desc">Scales to fit within element</p>
    </div>

    <div class="demo-card">
      <h3>100%</h3>
      <div class="box size-100"></div>
      <p class="label">mask-size: 100%</p>
      <p class="desc">Full element width</p>
    </div>

    <div class="demo-card">
      <h3>50% 50%</h3>
      <div class="box size-50-50"></div>
      <p class="label">mask-size: 50% 50%</p>
      <p class="desc">Half width and half height</p>
    </div>

  </div>
</body>
</html>
