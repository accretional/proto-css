<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>block-size</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .demo-item { display: flex; flex-direction: column; align-items: flex-start; }
    .container {
      height: 220px;
      width: 100%;
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
      padding: 8px;
      display: flex;
      align-items: flex-start;
    }
    .box {
      width: 100%;
      background: rgba(102, 126, 234, 0.35);
      border: 2px solid #667eea;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: rgba(255,255,255,0.8);
      padding: 6px;
      overflow: hidden;
    }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>Block Size</h1>
  <p class="prop-name">block-size</p>
  <div class="demos">
    <div class="demo-item">
      <div class="container">
        <div class="box" style="block-size: 50px;">50px</div>
      </div>
      <div class="label">block-size: 50px</div>
    </div>
    <div class="demo-item">
      <div class="container">
        <div class="box" style="block-size: 100px;">100px</div>
      </div>
      <div class="label">block-size: 100px</div>
    </div>
    <div class="demo-item">
      <div class="container">
        <div class="box" style="block-size: 200px;">200px</div>
      </div>
      <div class="label">block-size: 200px</div>
    </div>
    <div class="demo-item">
      <div class="container">
        <div class="box" style="block-size: auto;">auto</div>
      </div>
      <div class="label">block-size: auto</div>
    </div>
    <div class="demo-item">
      <div class="container">
        <div class="box" style="block-size: min-content;">min-content</div>
      </div>
      <div class="label">block-size: min-content</div>
    </div>
    <div class="demo-item">
      <div class="container">
        <div class="box" style="block-size: max-content;">max-content</div>
      </div>
      <div class="label">block-size: max-content</div>
    </div>
  </div>
</body>
</html>
