<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>mask-position</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .demo-card { background: #16213e; border-radius: 10px; padding: 16px; }
    .demo-card h3 { font-size: 12px; color: #e2e8f0; margin-bottom: 10px; }
    .label { font-size: 10px; font-family: monospace; color: #9ca3af; margin-top: 8px; }
    .box {
      width: 100%;
      height: 100px;
      background: linear-gradient(135deg, #e94560, #a855f7, #00d2ff, #4ade80);
      border-radius: 6px;
      position: relative;
    }
    .dot {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #f9a825;
      z-index: 2;
      box-shadow: 0 0 4px rgba(249,168,37,0.6);
    }
    .pos-center {
      -webkit-mask-image: radial-gradient(circle 50px, black 60%, transparent 61%);
      -webkit-mask-position: center;
      -webkit-mask-repeat: no-repeat;
      mask-image: radial-gradient(circle 50px, black 60%, transparent 61%);
      mask-position: center;
      mask-repeat: no-repeat;
    }
    .pos-top {
      -webkit-mask-image: radial-gradient(circle 50px, black 60%, transparent 61%);
      -webkit-mask-position: top;
      -webkit-mask-repeat: no-repeat;
      mask-image: radial-gradient(circle 50px, black 60%, transparent 61%);
      mask-position: top;
      mask-repeat: no-repeat;
    }
    .pos-bottom {
      -webkit-mask-image: radial-gradient(circle 50px, black 60%, transparent 61%);
      -webkit-mask-position: bottom;
      -webkit-mask-repeat: no-repeat;
      mask-image: radial-gradient(circle 50px, black 60%, transparent 61%);
      mask-position: bottom;
      mask-repeat: no-repeat;
    }
    .pos-left {
      -webkit-mask-image: radial-gradient(circle 50px, black 60%, transparent 61%);
      -webkit-mask-position: left;
      -webkit-mask-repeat: no-repeat;
      mask-image: radial-gradient(circle 50px, black 60%, transparent 61%);
      mask-position: left;
      mask-repeat: no-repeat;
    }
    .pos-right {
      -webkit-mask-image: radial-gradient(circle 50px, black 60%, transparent 61%);
      -webkit-mask-position: right;
      -webkit-mask-repeat: no-repeat;
      mask-image: radial-gradient(circle 50px, black 60%, transparent 61%);
      mask-position: right;
      mask-repeat: no-repeat;
    }
    .pos-50-50 {
      -webkit-mask-image: radial-gradient(circle 50px, black 60%, transparent 61%);
      -webkit-mask-position: 50% 50%;
      -webkit-mask-repeat: no-repeat;
      mask-image: radial-gradient(circle 50px, black 60%, transparent 61%);
      mask-position: 50% 50%;
      mask-repeat: no-repeat;
    }
    .pos-0-0 {
      -webkit-mask-image: radial-gradient(circle 50px, black 60%, transparent 61%);
      -webkit-mask-position: 0 0;
      -webkit-mask-repeat: no-repeat;
      mask-image: radial-gradient(circle 50px, black 60%, transparent 61%);
      mask-position: 0 0;
      mask-repeat: no-repeat;
    }
  </style>
</head>
<body>
  <h1>Mask Position</h1>
  <p class="prop-name">mask-position</p>
  <div class="demos">

    <div class="demo-card">
      <h3>center</h3>
      <div class="box pos-center">
        <div class="dot" style="top:50%;left:50%;transform:translate(-50%,-50%)"></div>
      </div>
      <p class="label">mask-position: center</p>
    </div>

    <div class="demo-card">
      <h3>top</h3>
      <div class="box pos-top">
        <div class="dot" style="top:0;left:50%;transform:translateX(-50%)"></div>
      </div>
      <p class="label">mask-position: top</p>
    </div>

    <div class="demo-card">
      <h3>bottom</h3>
      <div class="box pos-bottom">
        <div class="dot" style="bottom:0;left:50%;transform:translateX(-50%)"></div>
      </div>
      <p class="label">mask-position: bottom</p>
    </div>

    <div class="demo-card">
      <h3>left</h3>
      <div class="box pos-left">
        <div class="dot" style="top:50%;left:0;transform:translateY(-50%)"></div>
      </div>
      <p class="label">mask-position: left</p>
    </div>

    <div class="demo-card">
      <h3>right</h3>
      <div class="box pos-right">
        <div class="dot" style="top:50%;right:0;transform:translateY(-50%)"></div>
      </div>
      <p class="label">mask-position: right</p>
    </div>

    <div class="demo-card">
      <h3>50% 50%</h3>
      <div class="box pos-50-50">
        <div class="dot" style="top:50%;left:50%;transform:translate(-50%,-50%)"></div>
      </div>
      <p class="label">mask-position: 50% 50%</p>
    </div>

    <div class="demo-card">
      <h3>0 0</h3>
      <div class="box pos-0-0">
        <div class="dot" style="top:0;left:0"></div>
      </div>
      <p class="label">mask-position: 0 0</p>
    </div>

  </div>
</body>
</html>
