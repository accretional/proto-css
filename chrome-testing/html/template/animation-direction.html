<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>animation-direction</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 24px; }
    .demo-box {
      background: #16213e;
      border-radius: 12px;
      padding: 24px;
      width: 280px;
      height: 280px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .demo-title { font-size: 13px; color: #ccc; margin-bottom: 12px; }
    .track {
      width: 200px;
      height: 160px;
      background: #0f3460;
      border-radius: 8px;
      position: relative;
    }
    .start-marker, .end-marker {
      position: absolute;
      font-size: 9px;
      font-family: monospace;
      color: #4a5568;
    }
    .start-marker { top: 4px; left: 8px; }
    .end-marker { bottom: 4px; right: 8px; }
    @keyframes moveCorner {
      0% { top: 10px; left: 10px; background: #e94560; }
      100% { top: 90px; left: 130px; background: #3498db; }
    }
    .dir-box {
      width: 50px;
      height: 50px;
      border-radius: 8px;
      position: absolute;
      animation: moveCorner 2s linear infinite;
      
      animation-delay: -0.5s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .dir-box::after {
      content: '';
      width: 0;
      height: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-bottom: 12px solid rgba(255,255,255,0.8);
    }
    .normal { animation-direction: normal; }
    .reverse { animation-direction: reverse; }
    .alternate { animation-direction: alternate; animation-delay: -0.5s; }
    .alternate-reverse { animation-direction: alternate-reverse; animation-delay: -0.5s; }
    .path {
      position: absolute;
      top: 35px;
      left: 35px;
      width: 130px;
      height: 80px;
      border: 2px dashed #4a5568;
      border-radius: 4px;
      opacity: 0.4;
    }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 12px; text-align: center; }
  </style>
</head>
<body>
  <h1>Animation Direction</h1>
  <p class="prop-name">animation-direction</p>
  <div class="demos">
    <div class="demo-box">
      <div class="demo-title">Normal</div>
      <div class="track">
        <div class="start-marker">start (0%)</div>
        <div class="end-marker">end (100%)</div>
        <div class="path"></div>
        <div class="dir-box normal"></div>
      </div>
      <div class="label">animation-direction: normal</div>
    </div>
    <div class="demo-box">
      <div class="demo-title">Reverse</div>
      <div class="track">
        <div class="start-marker">start (0%)</div>
        <div class="end-marker">end (100%)</div>
        <div class="path"></div>
        <div class="dir-box reverse"></div>
      </div>
      <div class="label">animation-direction: reverse</div>
    </div>
    <div class="demo-box">
      <div class="demo-title">Alternate</div>
      <div class="track">
        <div class="start-marker">start (0%)</div>
        <div class="end-marker">end (100%)</div>
        <div class="path"></div>
        <div class="dir-box alternate"></div>
      </div>
      <div class="label">animation-direction: alternate</div>
    </div>
    <div class="demo-box">
      <div class="demo-title">Alternate Reverse</div>
      <div class="track">
        <div class="start-marker">start (0%)</div>
        <div class="end-marker">end (100%)</div>
        <div class="path"></div>
        <div class="dir-box alternate-reverse"></div>
      </div>
      <div class="label">animation-direction: alternate-reverse</div>
    </div>
  </div>
</body>
</html>
