<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>font-synthesis-weight</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .demo-block {
      background: #16213e;
      border-radius: 8px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; }
    .sample {
      font-size: 24px;
      color: #fff;
      line-height: 1.5;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Font Synthesis Weight</h1>
  <p class="prop-name">font-synthesis-weight</p>
  <div class="demos">
    <div class="demo-block">
      <div class="label">font-synthesis-weight: auto</div>
      <div class="sample" style="font-synthesis-weight: auto;">The quick brown fox jumps over the lazy dog</div>
    </div>
    <div class="demo-block">
      <div class="label">font-synthesis-weight: none</div>
      <div class="sample" style="font-synthesis-weight: none;">The quick brown fox jumps over the lazy dog</div>
    </div>
  </div>
</body>
</html>
