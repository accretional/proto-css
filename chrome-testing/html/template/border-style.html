<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>border-style</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 20px; }
    .demo-box { display: flex; flex-direction: column; align-items: center; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; }
    .box {
      width: 140px;
      height: 80px;
      background: #0f3460;
      border-width: 4px;
      border-color: #e94560;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: #e0e0e0;
    }
    .s-none { border-style: none; }
    .s-hidden { border-style: hidden; }
    .s-solid { border-style: solid; }
    .s-dashed { border-style: dashed; }
    .s-dotted { border-style: dotted; }
    .s-double { border-style: double; }
    .s-groove { border-style: groove; }
    .s-ridge { border-style: ridge; }
    .s-inset { border-style: inset; }
    .s-outset { border-style: outset; }
  </style>
</head>
<body>
  <h1>Border Style</h1>
  <p class="prop-name">border-style</p>
  <div class="demos">
    <div class="demo-box">
      <div class="box s-none">none</div>
      <span class="label">border-style: none</span>
    </div>
    <div class="demo-box">
      <div class="box s-hidden">hidden</div>
      <span class="label">border-style: hidden</span>
    </div>
    <div class="demo-box">
      <div class="box s-solid">solid</div>
      <span class="label">border-style: solid</span>
    </div>
    <div class="demo-box">
      <div class="box s-dashed">dashed</div>
      <span class="label">border-style: dashed</span>
    </div>
    <div class="demo-box">
      <div class="box s-dotted">dotted</div>
      <span class="label">border-style: dotted</span>
    </div>
    <div class="demo-box">
      <div class="box s-double">double</div>
      <span class="label">border-style: double</span>
    </div>
    <div class="demo-box">
      <div class="box s-groove">groove</div>
      <span class="label">border-style: groove</span>
    </div>
    <div class="demo-box">
      <div class="box s-ridge">ridge</div>
      <span class="label">border-style: ridge</span>
    </div>
    <div class="demo-box">
      <div class="box s-inset">inset</div>
      <span class="label">border-style: inset</span>
    </div>
    <div class="demo-box">
      <div class="box s-outset">outset</div>
      <span class="label">border-style: outset</span>
    </div>
  </div>
</body>
</html>
