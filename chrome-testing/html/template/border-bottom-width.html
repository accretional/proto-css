<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>border-bottom-width</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
    .demo-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .box {
      width: 140px;
      height: 80px;
      background: #16213e;
      border-bottom-style: solid;
      border-bottom-color: #e94560;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: #ccc;
      font-family: monospace;
    }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; text-align: center; }
  </style>
</head>
<body>
  <h1>Border Bottom Width</h1>
  <p class="prop-name">border-bottom-width</p>
  <div class="demos">
    <div class="demo-item">
      <div class="box" style="border-bottom-width: 0;">0</div>
      <div class="label">border-bottom-width: 0</div>
    </div>
    <div class="demo-item">
      <div class="box" style="border-bottom-width: 2px;">2px</div>
      <div class="label">border-bottom-width: 2px</div>
    </div>
    <div class="demo-item">
      <div class="box" style="border-bottom-width: 5px;">5px</div>
      <div class="label">border-bottom-width: 5px</div>
    </div>
    <div class="demo-item">
      <div class="box" style="border-bottom-width: 8px;">8px</div>
      <div class="label">border-bottom-width: 8px</div>
    </div>
    <div class="demo-item">
      <div class="box" style="border-bottom-width: thin;">thin</div>
      <div class="label">border-bottom-width: thin</div>
    </div>
    <div class="demo-item">
      <div class="box" style="border-bottom-width: medium;">medium</div>
      <div class="label">border-bottom-width: medium</div>
    </div>
    <div class="demo-item">
      <div class="box" style="border-bottom-width: thick;">thick</div>
      <div class="label">border-bottom-width: thick</div>
    </div>
    <div class="demo-item">
      <div class="box" style="border-bottom-width: 12px; border-bottom-color: #53d8fb;">12px</div>
      <div class="label">border-bottom-width: 12px</div>
    </div>
  </div>
</body>
</html>
