<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>border-top-width</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
    .demo-box { display: flex; flex-direction: column; align-items: center; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; text-align: center; }
    .box {
      width: 170px;
      height: 90px;
      background: #0f3460;
      border-top-style: solid;
      border-top-color: #e94560;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <h1>Border Top Width</h1>
  <p class="prop-name">border-top-width</p>
  <div class="demos">
    <div class="demo-box">
      <div class="box" style="border-top-width: 0;">0</div>
      <span class="label">border-top-width: 0</span>
    </div>
    <div class="demo-box">
      <div class="box" style="border-top-width: 1px;">1px</div>
      <span class="label">border-top-width: 1px</span>
    </div>
    <div class="demo-box">
      <div class="box" style="border-top-width: 2px;">2px</div>
      <span class="label">border-top-width: 2px</span>
    </div>
    <div class="demo-box">
      <div class="box" style="border-top-width: 4px;">4px</div>
      <span class="label">border-top-width: 4px</span>
    </div>
    <div class="demo-box">
      <div class="box" style="border-top-width: thin;">thin</div>
      <span class="label">border-top-width: thin</span>
    </div>
    <div class="demo-box">
      <div class="box" style="border-top-width: medium;">medium</div>
      <span class="label">border-top-width: medium</span>
    </div>
    <div class="demo-box">
      <div class="box" style="border-top-width: thick;">thick</div>
      <span class="label">border-top-width: thick</span>
    </div>
  </div>
</body>
</html>
