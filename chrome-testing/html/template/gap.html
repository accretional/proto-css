<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>gap</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
    .demo-box { background: #16213e; border-radius: 8px; padding: 16px; }
    .demo-box h3 { font-size: 13px; color: #e0e0e0; margin-bottom: 10px; }
    .grid-container { display: grid; grid-template-columns: repeat(3, 1fr); width: 100%; }
    .grid-container .cell { background: #0f3460; border-radius: 4px; height: 36px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #e94560; font-weight: 600; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>Gap</h1>
  <p class="prop-name">gap</p>
  <div class="demos">
    <div class="demo-box">
      <h3>No gap</h3>
      <div class="grid-container" style="gap: 0;">
        <div class="cell">1</div><div class="cell">2</div><div class="cell">3</div>
        <div class="cell">4</div><div class="cell">5</div><div class="cell">6</div>
      </div>
      <p class="label">gap: 0</p>
    </div>
    <div class="demo-box">
      <h3>10px gap</h3>
      <div class="grid-container" style="gap: 10px;">
        <div class="cell">1</div><div class="cell">2</div><div class="cell">3</div>
        <div class="cell">4</div><div class="cell">5</div><div class="cell">6</div>
      </div>
      <p class="label">gap: 10px</p>
    </div>
    <div class="demo-box">
      <h3>20px gap</h3>
      <div class="grid-container" style="gap: 20px;">
        <div class="cell">1</div><div class="cell">2</div><div class="cell">3</div>
        <div class="cell">4</div><div class="cell">5</div><div class="cell">6</div>
      </div>
      <p class="label">gap: 20px</p>
    </div>
    <div class="demo-box">
      <h3>Mixed row/column gap</h3>
      <div class="grid-container" style="gap: 10px 20px;">
        <div class="cell">1</div><div class="cell">2</div><div class="cell">3</div>
        <div class="cell">4</div><div class="cell">5</div><div class="cell">6</div>
      </div>
      <p class="label">gap: 10px 20px</p>
    </div>
    <div class="demo-box">
      <h3>normal (browser default)</h3>
      <div class="grid-container" style="gap: normal;">
        <div class="cell">1</div><div class="cell">2</div><div class="cell">3</div>
        <div class="cell">4</div><div class="cell">5</div><div class="cell">6</div>
      </div>
      <p class="label">gap: normal</p>
    </div>
  </div>
</body>
</html>
