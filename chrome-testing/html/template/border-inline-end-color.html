<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>border-inline-end-color</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
    .demo-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .box {
      width: 180px;
      height: 100px;
      background: #16213e;
      border-inline-end: 8px solid;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #ccc;
      font-family: monospace;
    }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; text-align: center; }
  </style>
</head>
<body>
  <h1>Border Inline End Color</h1>
  <p class="prop-name">border-inline-end-color</p>
  <div class="demos">
    <div class="demo-item">
      <div class="box" style="border-inline-end-color: #e94560;">#e94560</div>
      <div class="label">border-inline-end-color: #e94560</div>
    </div>
    <div class="demo-item">
      <div class="box" style="border-inline-end-color: #53d8fb;">#53d8fb</div>
      <div class="label">border-inline-end-color: #53d8fb</div>
    </div>
    <div class="demo-item">
      <div class="box" style="border-inline-end-color: #4ade80;">#4ade80</div>
      <div class="label">border-inline-end-color: #4ade80</div>
    </div>
    <div class="demo-item">
      <div class="box" style="border-inline-end-color: #a855f7;">#a855f7</div>
      <div class="label">border-inline-end-color: #a855f7</div>
    </div>
    <div class="demo-item">
      <div class="box" style="border-inline-end-color: #fbbf24;">#fbbf24</div>
      <div class="label">border-inline-end-color: #fbbf24</div>
    </div>
  </div>
</body>
</html>
