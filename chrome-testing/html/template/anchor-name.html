<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>anchor-name</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 32px; }
    .demo-box {
      background: #16213e;
      border-radius: 12px;
      padding: 24px;
      width: 360px;
      height: 280px;
      position: relative;
    }
    .anchor-btn {
      anchor-name: --my-button;
      background: #e94560;
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      position: absolute;
      top: 80px;
      left: 60px;
    }
    .tooltip-top {
      position: absolute;
      background: #2ecc71;
      color: #000;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      position-anchor: --my-button;
      bottom: anchor(top);
      left: anchor(center);
      translate: -50% -8px;
    }
    .anchor-btn2 {
      anchor-name: --btn-two;
      background: #3498db;
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      position: absolute;
      top: 100px;
      left: 80px;
    }
    .tooltip-right {
      position: absolute;
      background: #f39c12;
      color: #000;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      position-anchor: --btn-two;
      left: anchor(right);
      top: anchor(center);
      translate: 8px -50%;
    }
    .anchor-btn3 {
      anchor-name: --btn-three;
      background: #9b59b6;
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      position: absolute;
      top: 100px;
      left: 70px;
    }
    .tooltip-bottom {
      position: absolute;
      background: #1abc9c;
      color: #000;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      position-anchor: --btn-three;
      top: anchor(bottom);
      left: anchor(center);
      translate: -50% 8px;
    }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; position: absolute; bottom: 16px; left: 24px; }
    .demo-title { font-size: 13px; color: #ccc; margin-bottom: 8px; }
  </style>
</head>
<body>
  <h1>Anchor Name</h1>
  <p class="prop-name">anchor-name</p>
  <div class="demos">
    <div class="demo-box">
      <div class="demo-title">Tooltip positioned above anchor</div>
      <button class="anchor-btn">Anchor Element</button>
      <div class="tooltip-top">Tooltip above</div>
      <div class="label">anchor-name: --my-button</div>
    </div>
    <div class="demo-box">
      <div class="demo-title">Tooltip positioned to the right</div>
      <button class="anchor-btn2">Click Me</button>
      <div class="tooltip-right">Tooltip right</div>
      <div class="label">anchor-name: --btn-two</div>
    </div>
    <div class="demo-box">
      <div class="demo-title">Tooltip positioned below anchor</div>
      <button class="anchor-btn3">Submit</button>
      <div class="tooltip-bottom">Tooltip below</div>
      <div class="label">anchor-name: --btn-three</div>
    </div>
  </div>
</body>
</html>
