<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>min-block-size</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-end; }
    .demo-card {
      background: #16213e;
      border-radius: 12px;
      padding: 20px;
      width: 260px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 10px; text-align: center; }
    .box-area {
      width: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      min-height: 240px;
    }
    .box {
      background: linear-gradient(180deg, #4fc3f7 0%, #7c4dff 100%);
      border-radius: 8px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: #fff;
      font-family: monospace;
      padding: 8px;
      position: relative;
    }
    .box-0 { min-block-size: 0; }
    .box-50 { min-block-size: 50px; }
    .box-100 { min-block-size: 100px; }
    .box-200 { min-block-size: 200px; }
    .height-marker {
      position: absolute;
      right: -8px;
      top: 0;
      bottom: 0;
      width: 2px;
      background: #ff6b6b;
    }
    .height-label {
      font-size: 10px;
      color: #4fc3f7;
      font-family: monospace;
      margin-top: 4px;
    }
    .tiny-content { font-size: 10px; }
  </style>
</head>
<body>
  <h1>Min Block Size</h1>
  <p class="prop-name">min-block-size</p>
  <div class="demos">
    <div class="demo-card">
      <div class="box-area">
        <div class="box box-0">
          <span class="tiny-content">Hi</span>
        </div>
      </div>
      <p class="height-label">Collapses to content</p>
      <p class="label">min-block-size: 0</p>
    </div>

    <div class="demo-card">
      <div class="box-area">
        <div class="box box-50">
          <span class="tiny-content">Hi</span>
        </div>
      </div>
      <p class="height-label">At least 50px tall</p>
      <p class="label">min-block-size: 50px</p>
    </div>

    <div class="demo-card">
      <div class="box-area">
        <div class="box box-100">
          <span class="tiny-content">Hi</span>
        </div>
      </div>
      <p class="height-label">At least 100px tall</p>
      <p class="label">min-block-size: 100px</p>
    </div>

    <div class="demo-card">
      <div class="box-area">
        <div class="box box-200">
          <span class="tiny-content">Hi</span>
        </div>
      </div>
      <p class="height-label">At least 200px tall</p>
      <p class="label">min-block-size: 200px</p>
    </div>
  </div>
</body>
</html>
