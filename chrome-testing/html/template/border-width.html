<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>border-width</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
    .demo-box { display: flex; flex-direction: column; align-items: center; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; max-width: 200px; text-align: center; }
    .box {
      width: 160px;
      height: 120px;
      background: #0f3460;
      border-style: solid;
      border-color: #e94560;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <h1>Border Width</h1>
  <p class="prop-name">border-width</p>
  <div class="demos">
    <div class="demo-box">
      <div class="box" style="border-width: 0;">0</div>
      <span class="label">border-width: 0</span>
    </div>
    <div class="demo-box">
      <div class="box" style="border-width: 2px;">2px</div>
      <span class="label">border-width: 2px</span>
    </div>
    <div class="demo-box">
      <div class="box" style="border-width: 8px;">8px</div>
      <span class="label">border-width: 8px</span>
    </div>
    <div class="demo-box">
      <div class="box" style="border-width: 20px;">20px</div>
      <span class="label">border-width: 20px</span>
    </div>
    <div class="demo-box">
      <div class="box" style="border-width: thin;">thin</div>
      <span class="label">border-width: thin</span>
    </div>
    <div class="demo-box">
      <div class="box" style="border-width: medium;">medium</div>
      <span class="label">border-width: medium</span>
    </div>
    <div class="demo-box">
      <div class="box" style="border-width: thick;">thick</div>
      <span class="label">border-width: thick</span>
    </div>
    <div class="demo-box">
      <div class="box" style="border-width: 2px 8px 16px 4px;">T:2 R:8 B:16 L:4</div>
      <span class="label">border-width: 2px 8px 16px 4px</span>
    </div>
  </div>
</body>
</html>
