<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>border-inline-start</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 28px; }
    .demo-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .box {
      width: 220px;
      height: 100px;
      background: #16213e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #ccc;
      font-family: monospace;
      text-align: center;
      line-height: 1.5;
    }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; text-align: center; max-width: 280px; }
  </style>
</head>
<body>
  <h1>Border Inline Start</h1>
  <p class="prop-name">border-inline-start</p>
  <div class="demos">
    <div class="demo-item">
      <div class="box" style="border-inline-start: 5px solid #e94560;">5px solid #e94560</div>
      <div class="label">border-inline-start: 5px solid #e94560</div>
    </div>
    <div class="demo-item">
      <div class="box" style="border-inline-start: 6px dashed #53d8fb;">6px dashed #53d8fb</div>
      <div class="label">border-inline-start: 6px dashed #53d8fb</div>
    </div>
    <div class="demo-item">
      <div class="box" style="border-inline-start: 4px dotted #4ade80;">4px dotted #4ade80</div>
      <div class="label">border-inline-start: 4px dotted #4ade80</div>
    </div>
    <div class="demo-item">
      <div class="box" style="border-inline-start: 8px double #a855f7;">8px double #a855f7</div>
      <div class="label">border-inline-start: 8px double #a855f7</div>
    </div>
  </div>
</body>
</html>
