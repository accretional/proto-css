<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>aspect-ratio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .demo-box { background: #16213e; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; align-items: center; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 10px; text-align: center; }

    .ratio-box {
      width: 140px;
      background: linear-gradient(135deg, #e94560, #533bdb);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 4px;
    }
    .ratio-label { font-size: 16px; font-weight: 700; color: #fff; }
    .ratio-dims { font-size: 10px; color: rgba(255,255,255,0.7); font-family: monospace; }
  </style>
</head>
<body>
  <h1>Aspect Ratio</h1>
  <p class="prop-name">aspect-ratio</p>
  <div class="demos">
    <div class="demo-box">
      <div class="ratio-box" style="aspect-ratio: auto; height: 100px; background: linear-gradient(135deg, #6b7280, #374151);">
        <span class="ratio-label">auto</span>
        <span class="ratio-dims">Intrinsic</span>
      </div>
      <p class="label">aspect-ratio: auto</p>
    </div>

    <div class="demo-box">
      <div class="ratio-box" style="aspect-ratio: 1/1;">
        <span class="ratio-label">1 / 1</span>
        <span class="ratio-dims">Square</span>
      </div>
      <p class="label">aspect-ratio: 1/1</p>
    </div>

    <div class="demo-box">
      <div class="ratio-box" style="aspect-ratio: 16/9; background: linear-gradient(135deg, #533bdb, #0ea5e9);">
        <span class="ratio-label">16 / 9</span>
        <span class="ratio-dims">Widescreen</span>
      </div>
      <p class="label">aspect-ratio: 16/9</p>
    </div>

    <div class="demo-box">
      <div class="ratio-box" style="aspect-ratio: 4/3; background: linear-gradient(135deg, #0ea5e9, #10b981);">
        <span class="ratio-label">4 / 3</span>
        <span class="ratio-dims">Classic TV</span>
      </div>
      <p class="label">aspect-ratio: 4/3</p>
    </div>

    <div class="demo-box">
      <div class="ratio-box" style="aspect-ratio: 3/2; background: linear-gradient(135deg, #10b981, #f59205);">
        <span class="ratio-label">3 / 2</span>
        <span class="ratio-dims">Photo</span>
      </div>
      <p class="label">aspect-ratio: 3/2</p>
    </div>

    <div class="demo-box">
      <div class="ratio-box" style="aspect-ratio: 2/1; background: linear-gradient(135deg, #f59205, #e94560);">
        <span class="ratio-label">2 / 1</span>
        <span class="ratio-dims">Panoramic</span>
      </div>
      <p class="label">aspect-ratio: 2/1</p>
    </div>

    <div class="demo-box">
      <div class="ratio-box" style="aspect-ratio: auto 16/9; background: linear-gradient(135deg, #ec4899, #8b5cf6);">
        <span class="ratio-label">auto 16/9</span>
        <span class="ratio-dims">Preferred</span>
      </div>
      <p class="label">aspect-ratio: auto 16/9</p>
    </div>
  </div>
</body>
</html>
