<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>rotate</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 24px; }
    .demo-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 160px;
    }
    .rotate-wrapper {
      width: 130px;
      height: 130px;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 400px;
    }
    .rotate-box {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #e94560, #e2b714);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      box-shadow: 0 4px 15px rgba(233, 69, 96, 0.3);
    }
    .ghost {
      position: absolute;
      width: 80px;
      height: 80px;
      border: 2px dashed #3a4a5e;
      border-radius: 10px;
    }
    .rotate-wrapper { position: relative; }
    .r0 { rotate: 0deg; }
    .r45 { rotate: 45deg; }
    .r90 { rotate: 90deg; }
    .r180 { rotate: 180deg; }
    .rn45 { rotate: -45deg; }
    .r3d { rotate: 1 1 0 45deg; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; text-align: center; }
  </style>
</head>
<body>
  <h1>Rotate</h1>
  <p class="prop-name">rotate</p>
  <div class="demos">
    <div class="demo-card">
      <div class="rotate-wrapper">
        <div class="rotate-box r0">R</div>
      </div>
      <div class="label">rotate: 0deg</div>
    </div>
    <div class="demo-card">
      <div class="rotate-wrapper">
        <div class="ghost"></div>
        <div class="rotate-box r45">R</div>
      </div>
      <div class="label">rotate: 45deg</div>
    </div>
    <div class="demo-card">
      <div class="rotate-wrapper">
        <div class="ghost"></div>
        <div class="rotate-box r90">R</div>
      </div>
      <div class="label">rotate: 90deg</div>
    </div>
    <div class="demo-card">
      <div class="rotate-wrapper">
        <div class="ghost"></div>
        <div class="rotate-box r180">R</div>
      </div>
      <div class="label">rotate: 180deg</div>
    </div>
    <div class="demo-card">
      <div class="rotate-wrapper">
        <div class="ghost"></div>
        <div class="rotate-box rn45">R</div>
      </div>
      <div class="label">rotate: -45deg</div>
    </div>
    <div class="demo-card">
      <div class="rotate-wrapper">
        <div class="ghost"></div>
        <div class="rotate-box r3d">R</div>
      </div>
      <div class="label">rotate: 1 1 0 45deg</div>
    </div>
  </div>
</body>
</html>
