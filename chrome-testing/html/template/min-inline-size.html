<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>min-inline-size</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-direction: column; gap: 14px; }
    .demo-row {
      background: #16213e;
      border-radius: 10px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .label {
      font-size: 11px;
      font-family: monospace;
      color: #9ca3af;
      min-width: 220px;
      flex-shrink: 0;
    }
    .track {
      flex: 1;
      background: #0f3460;
      border-radius: 6px;
      padding: 4px;
      display: flex;
      align-items: center;
    }
    .box {
      background: linear-gradient(90deg, #4fc3f7, #7c4dff);
      border-radius: 6px;
      padding: 12px 14px;
      font-size: 12px;
      color: #fff;
      font-family: monospace;
      display: inline-flex;
      align-items: center;
      height: 44px;
    }
    .box-0 { min-inline-size: 0; }
    .box-50 { min-inline-size: 50px; }
    .box-100 { min-inline-size: 100px; }
    .box-maxc { min-inline-size: max-content; }
    .size-note {
      font-size: 10px;
      color: #7b8794;
      margin-left: 8px;
      font-family: monospace;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <h1>Min Inline Size</h1>
  <p class="prop-name">min-inline-size</p>
  <div class="demos">
    <div class="demo-row">
      <p class="label">min-inline-size: 0</p>
      <div class="track">
        <div class="box box-0">.</div>
      </div>
      <span class="size-note">Shrinks to content</span>
    </div>

    <div class="demo-row">
      <p class="label">min-inline-size: 50px</p>
      <div class="track">
        <div class="box box-50">.</div>
      </div>
      <span class="size-note">At least 50px</span>
    </div>

    <div class="demo-row">
      <p class="label">min-inline-size: 100px</p>
      <div class="track">
        <div class="box box-100">.</div>
      </div>
      <span class="size-note">At least 100px</span>
    </div>

    <div class="demo-row">
      <p class="label">min-inline-size: max-content</p>
      <div class="track">
        <div class="box box-maxc">This text determines the minimum width</div>
      </div>
      <span class="size-note">Sized to content</span>
    </div>
  </div>
</body>
</html>
