<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>mask-repeat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    .demo-card { background: #16213e; border-radius: 10px; padding: 16px; }
    .demo-card h3 { font-size: 12px; color: #e2e8f0; margin-bottom: 10px; }
    .label { font-size: 10px; font-family: monospace; color: #9ca3af; margin-top: 8px; }
    .box {
      width: 100%;
      height: 110px;
      background: linear-gradient(135deg, #e94560, #a855f7, #00d2ff, #4ade80);
      border-radius: 6px;
    }
    .rep-repeat-x {
      -webkit-mask-image: radial-gradient(circle 15px, black 60%, transparent 61%);
      -webkit-mask-size: 40px 40px;
      -webkit-mask-repeat: repeat-x;
      -webkit-mask-position: center;
      mask-image: radial-gradient(circle 15px, black 60%, transparent 61%);
      mask-size: 40px 40px;
      mask-repeat: repeat-x;
      mask-position: center;
    }
    .rep-repeat-y {
      -webkit-mask-image: radial-gradient(circle 15px, black 60%, transparent 61%);
      -webkit-mask-size: 40px 40px;
      -webkit-mask-repeat: repeat-y;
      -webkit-mask-position: center;
      mask-image: radial-gradient(circle 15px, black 60%, transparent 61%);
      mask-size: 40px 40px;
      mask-repeat: repeat-y;
      mask-position: center;
    }
    .rep-repeat {
      -webkit-mask-image: radial-gradient(circle 15px, black 60%, transparent 61%);
      -webkit-mask-size: 40px 40px;
      -webkit-mask-repeat: repeat;
      mask-image: radial-gradient(circle 15px, black 60%, transparent 61%);
      mask-size: 40px 40px;
      mask-repeat: repeat;
    }
    .rep-space {
      -webkit-mask-image: radial-gradient(circle 15px, black 60%, transparent 61%);
      -webkit-mask-size: 50px 50px;
      -webkit-mask-repeat: space;
      mask-image: radial-gradient(circle 15px, black 60%, transparent 61%);
      mask-size: 50px 50px;
      mask-repeat: space;
    }
    .rep-round {
      -webkit-mask-image: radial-gradient(circle 15px, black 60%, transparent 61%);
      -webkit-mask-size: 50px 50px;
      -webkit-mask-repeat: round;
      mask-image: radial-gradient(circle 15px, black 60%, transparent 61%);
      mask-size: 50px 50px;
      mask-repeat: round;
    }
    .rep-no-repeat {
      -webkit-mask-image: radial-gradient(circle 30px, black 60%, transparent 61%);
      -webkit-mask-size: 80px 80px;
      -webkit-mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-image: radial-gradient(circle 30px, black 60%, transparent 61%);
      mask-size: 80px 80px;
      mask-repeat: no-repeat;
      mask-position: center;
    }
  </style>
</head>
<body>
  <h1>Mask Repeat</h1>
  <p class="prop-name">mask-repeat</p>
  <div class="demos">

    <div class="demo-card">
      <h3>repeat-x</h3>
      <div class="box rep-repeat-x"></div>
      <p class="label">mask-repeat: repeat-x</p>
    </div>

    <div class="demo-card">
      <h3>repeat-y</h3>
      <div class="box rep-repeat-y"></div>
      <p class="label">mask-repeat: repeat-y</p>
    </div>

    <div class="demo-card">
      <h3>repeat</h3>
      <div class="box rep-repeat"></div>
      <p class="label">mask-repeat: repeat</p>
    </div>

    <div class="demo-card">
      <h3>space</h3>
      <div class="box rep-space"></div>
      <p class="label">mask-repeat: space</p>
    </div>

    <div class="demo-card">
      <h3>round</h3>
      <div class="box rep-round"></div>
      <p class="label">mask-repeat: round</p>
    </div>

    <div class="demo-card">
      <h3>no-repeat</h3>
      <div class="box rep-no-repeat"></div>
      <p class="label">mask-repeat: no-repeat</p>
    </div>

  </div>
</body>
</html>
