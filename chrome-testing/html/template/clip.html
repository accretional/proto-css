<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>clip</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 4px; }
    .deprecated { font-size: 11px; color: #e94560; font-style: italic; margin-bottom: 24px; }
    .demos { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .demo-card {
      background: #16213e;
      border-radius: 10px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-bottom: 14px; align-self: flex-start; }
    .clip-container {
      position: relative;
      width: 180px;
      height: 180px;
      background: #0f3460;
      border-radius: 8px;
      overflow: visible;
    }
    .clip-ghost {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      border: 2px dashed #2a2a5a;
      border-radius: 8px;
    }
    .clip-target {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #e94560, #7b61ff, #0f3460);
      border-radius: 8px;
    }
    .note { font-size: 10px; color: #6b7280; margin-top: 10px; text-align: center; }
  </style>
</head>
<body>
  <h1>Clip (deprecated)</h1>
  <p class="prop-name">clip</p>
  <p class="deprecated">Deprecated: use clip-path instead. Requires position: absolute.</p>
  <div class="demos">
    <div class="demo-card">
      <div class="label">clip: auto</div>
      <div class="clip-container">
        <div class="clip-ghost"></div>
        <div class="clip-target" style="clip: auto;"></div>
      </div>
      <p class="note">No clipping, full element visible</p>
    </div>
    <div class="demo-card">
      <div class="label">clip: rect(10px, 100px, 100px, 10px)</div>
      <div class="clip-container">
        <div class="clip-ghost"></div>
        <div class="clip-target" style="clip: rect(10px, 100px, 100px, 10px);"></div>
      </div>
      <p class="note">Rectangular clip region with offsets</p>
    </div>
  </div>
</body>
</html>
