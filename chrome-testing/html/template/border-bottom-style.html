<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>border-bottom-style</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
    .demo-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .box {
      width: 160px;
      height: 80px;
      background: #16213e;
      border-bottom: 8px solid #e94560;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: #ccc;
      font-family: monospace;
    }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; text-align: center; }
  </style>
</head>
<body>
  <h1>Border Bottom Style</h1>
  <p class="prop-name">border-bottom-style</p>
  <div class="demos">
    <div class="demo-item">
      <div class="box" style="border-bottom-style: dotted;">dotted</div>
      <div class="label">border-bottom-style: dotted</div>
    </div>
    <div class="demo-item">
      <div class="box" style="border-bottom-style: dashed;">dashed</div>
      <div class="label">border-bottom-style: dashed</div>
    </div>
    <div class="demo-item">
      <div class="box" style="border-bottom-style: solid;">solid</div>
      <div class="label">border-bottom-style: solid</div>
    </div>
    <div class="demo-item">
      <div class="box" style="border-bottom-style: double; border-bottom-width: 8px;">double</div>
      <div class="label">border-bottom-style: double</div>
    </div>
    <div class="demo-item">
      <div class="box" style="border-bottom-style: groove; border-bottom-width: 8px; border-bottom-color: #53d8fb;">groove</div>
      <div class="label">border-bottom-style: groove</div>
    </div>
    <div class="demo-item">
      <div class="box" style="border-bottom-style: ridge; border-bottom-width: 8px; border-bottom-color: #a855f7;">ridge</div>
      <div class="label">border-bottom-style: ridge</div>
    </div>
  </div>
</body>
</html>
