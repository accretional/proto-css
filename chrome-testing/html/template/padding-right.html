<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>padding-right</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-direction: column; gap: 16px; }
    .demo-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .label-fixed {
      font-size: 11px;
      font-family: monospace;
      color: #9ca3af;
      width: 180px;
      text-align: right;
      flex-shrink: 0;
    }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; }
    .pad-outer {
      background: rgba(52, 152, 219, 0.25);
      border: 1px dashed rgba(52, 152, 219, 0.5);
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
    }
    .pad-inner {
      background: #0f3460;
      border-radius: 4px;
      height: 44px;
      min-width: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-family: monospace;
      color: #64b5f6;
    }
    .legend {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
      font-size: 12px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .legend-swatch {
      width: 14px;
      height: 14px;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <h1>Padding Right</h1>
  <p class="prop-name">padding-right</p>
  <div class="legend">
    <div class="legend-item">
      <div class="legend-swatch" style="background:rgba(52,152,219,0.25); border:1px dashed rgba(52,152,219,0.5);"></div>
      <span>Right padding area</span>
    </div>
    <div class="legend-item">
      <div class="legend-swatch" style="background:#0f3460;"></div>
      <span>Content</span>
    </div>
  </div>
  <div class="demos">

    <div class="demo-row">
      <div class="label-fixed">padding-right: 0</div>
      <div class="pad-outer" style="padding-right: 0;">
        <div class="pad-inner">Content</div>
      </div>
    </div>

    <div class="demo-row">
      <div class="label-fixed">padding-right: 10px</div>
      <div class="pad-outer" style="padding-right: 10px;">
        <div class="pad-inner">Content</div>
      </div>
    </div>

    <div class="demo-row">
      <div class="label-fixed">padding-right: 30px</div>
      <div class="pad-outer" style="padding-right: 30px;">
        <div class="pad-inner">Content</div>
      </div>
    </div>

    <div class="demo-row">
      <div class="label-fixed">padding-right: 50px</div>
      <div class="pad-outer" style="padding-right: 50px;">
        <div class="pad-inner">Content</div>
      </div>
    </div>

  </div>

  <div style="margin-top:32px; background:#16213e; border-radius:10px; padding:20px; max-width:900px;">
    <h2 style="font-size:14px; color:#fff; margin-bottom:16px;">Visual Comparison</h2>
    <div style="display:flex; flex-direction:column; gap:12px;">
      <div style="display:flex; align-items:center; gap:12px;">
        <span style="font-size:10px; font-family:monospace; color:#9ca3af; width:100px; text-align:right;">0</span>
        <div style="background:rgba(52,152,219,0.25); border:1px dashed rgba(52,152,219,0.5); border-radius:4px; padding-right:0; height:36px; display:inline-flex; align-items:center;">
          <div style="background:#0f3460; border-radius:3px; padding:6px 16px; font-size:10px; font-family:monospace; color:#64b5f6;">Content</div>
        </div>
      </div>
      <div style="display:flex; align-items:center; gap:12px;">
        <span style="font-size:10px; font-family:monospace; color:#9ca3af; width:100px; text-align:right;">10px</span>
        <div style="background:rgba(52,152,219,0.25); border:1px dashed rgba(52,152,219,0.5); border-radius:4px; padding-right:10px; height:36px; display:inline-flex; align-items:center;">
          <div style="background:#0f3460; border-radius:3px; padding:6px 16px; font-size:10px; font-family:monospace; color:#64b5f6;">Content</div>
        </div>
      </div>
      <div style="display:flex; align-items:center; gap:12px;">
        <span style="font-size:10px; font-family:monospace; color:#9ca3af; width:100px; text-align:right;">30px</span>
        <div style="background:rgba(52,152,219,0.25); border:1px dashed rgba(52,152,219,0.5); border-radius:4px; padding-right:30px; height:36px; display:inline-flex; align-items:center;">
          <div style="background:#0f3460; border-radius:3px; padding:6px 16px; font-size:10px; font-family:monospace; color:#64b5f6;">Content</div>
        </div>
      </div>
      <div style="display:flex; align-items:center; gap:12px;">
        <span style="font-size:10px; font-family:monospace; color:#9ca3af; width:100px; text-align:right;">50px</span>
        <div style="background:rgba(52,152,219,0.25); border:1px dashed rgba(52,152,219,0.5); border-radius:4px; padding-right:50px; height:36px; display:inline-flex; align-items:center;">
          <div style="background:#0f3460; border-radius:3px; padding:6px 16px; font-size:10px; font-family:monospace; color:#64b5f6;">Content</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
