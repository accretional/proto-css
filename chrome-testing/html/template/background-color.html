<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>background-color</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .demo-box { background: #16213e; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; align-items: center; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 10px; text-align: center; }
    .container { border-radius: 8px; min-height: 80px; width: 100%; border: 2px solid rgba(255,255,255,0.1); }
  </style>
</head>
<body>
  <h1>Background Color</h1>
  <p class="prop-name">background-color</p>
  <div class="demos">
    <div class="demo-box">
      <div class="container" style="background-color: #e94560;"></div>
      <p class="label">background-color: #e94560</p>
    </div>

    <div class="demo-box">
      <div class="container" style="background-color: #10b981;"></div>
      <p class="label">background-color: #10b981</p>
    </div>

    <div class="demo-box">
      <div class="container" style="background-color: #3b82f6;"></div>
      <p class="label">background-color: #3b82f6</p>
    </div>

    <div class="demo-box">
      <div class="container" style="background-color: rgb(168, 85, 247);"></div>
      <p class="label">background-color: rgb(168, 85, 247)</p>
    </div>

    <div class="demo-box">
      <div class="container" style="background-color: transparent; border-style: dashed;"></div>
      <p class="label">background-color: transparent</p>
    </div>

    <div class="demo-box">
      <div class="container" style="background-color: currentcolor; color: #fbbf24;"></div>
      <p class="label">background-color: currentcolor</p>
    </div>
  </div>
</body>
</html>
