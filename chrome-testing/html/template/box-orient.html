<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>box-orient</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 32px; }
    .demo-box { display: flex; flex-direction: column; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; }
    .container {
      display: -webkit-box;
      background: #16213e;
      border: 2px solid #333;
      padding: 8px;
    }
    .horizontal {
      -webkit-box-orient: horizontal;
      width: 400px;
      height: 100px;
    }
    .vertical {
      -webkit-box-orient: vertical;
      width: 140px;
      height: 320px;
    }
    .child {
      -webkit-box-flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      margin: 4px;
      border-radius: 6px;
    }
    .child:nth-child(1) { background: #e94560; }
    .child:nth-child(2) { background: #0f3460; }
    .child:nth-child(3) { background: #53d769; color: #1a1a2e; }
    .child:nth-child(4) { background: #fbbf24; color: #1a1a2e; }
  </style>
</head>
<body>
  <h1>Box Orient (deprecated)</h1>
  <p class="prop-name">box-orient / -webkit-box-orient</p>
  <div class="demos">
    <div class="demo-box">
      <div class="container horizontal">
        <div class="child">1</div>
        <div class="child">2</div>
        <div class="child">3</div>
        <div class="child">4</div>
      </div>
      <span class="label">-webkit-box-orient: horizontal</span>
    </div>
    <div class="demo-box">
      <div class="container vertical">
        <div class="child">1</div>
        <div class="child">2</div>
        <div class="child">3</div>
        <div class="child">4</div>
      </div>
      <span class="label">-webkit-box-orient: vertical</span>
    </div>
  </div>
</body>
</html>
