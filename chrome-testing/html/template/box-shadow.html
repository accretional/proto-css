<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>box-shadow</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: grid; grid-template-columns: repeat(5, 1fr); gap: 32px; }
    .demo-box { display: flex; flex-direction: column; align-items: center; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 12px; max-width: 200px; text-align: center; }
    .box {
      width: 140px;
      height: 100px;
      background: #0f3460;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h1>Box Shadow</h1>
  <p class="prop-name">box-shadow</p>
  <div class="demos">
    <div class="demo-box">
      <div class="box" style="box-shadow: none;">none</div>
      <span class="label">box-shadow: none</span>
    </div>
    <div class="demo-box">
      <div class="box" style="box-shadow: 2px 2px 4px rgba(0,0,0,0.5);">offset+blur</div>
      <span class="label">box-shadow: 2px 2px 4px rgba(0,0,0,0.5)</span>
    </div>
    <div class="demo-box">
      <div class="box" style="box-shadow: 0 4px 6px red;">color</div>
      <span class="label">box-shadow: 0 4px 6px red</span>
    </div>
    <div class="demo-box">
      <div class="box" style="box-shadow: inset 0 2px 4px blue;">inset</div>
      <span class="label">box-shadow: inset 0 2px 4px blue</span>
    </div>
    <div class="demo-box">
      <div class="box" style="box-shadow: 2px 2px 0 0 red, 4px 4px 0 0 blue;">multiple</div>
      <span class="label">box-shadow: 2px 2px 0 0 red, 4px 4px 0 0 blue</span>
    </div>
  </div>
</body>
</html>
