<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>math-style</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  math { font-size: 32px; color: #e0e0e0; }
.formula-label { font-size: 11px; color: #7b8794; font-family: monospace; margin-top: 4px; }
</style>
</head>
<body>
<h1>Math Style</h1>
<p class="prop-name">math-style</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area">
      <div style="background: #0f3460; border-radius: 8px; padding: 24px 32px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; math-style: normal;"><div><math display="block"><mfrac><mrow><mi>a</mi><mo>+</mo><mi>b</mi></mrow><mrow><mi>c</mi><mo>+</mo><mi>d</mi></mrow></mfrac></math><p class="formula-label">fraction</p></div><div><math display="block"><munderover><mo>&sum;</mo><mrow><mi>i</mi><mo>=</mo><mn>0</mn></mrow><mi>n</mi></munderover><msub><mi>a</mi><mi>i</mi></msub></math><p class="formula-label">summation</p></div></div>
    </div>
    <div class="label">math-style: normal</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="background: #0f3460; border-radius: 8px; padding: 24px 32px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; math-style: compact;"><div><math display="block"><mfrac><mrow><mi>a</mi><mo>+</mo><mi>b</mi></mrow><mrow><mi>c</mi><mo>+</mo><mi>d</mi></mrow></mfrac></math><p class="formula-label">fraction</p></div><div><math display="block"><munderover><mo>&sum;</mo><mrow><mi>i</mi><mo>=</mo><mn>0</mn></mrow><mi>n</mi></munderover><msub><mi>a</mi><mi>i</mi></msub></math><p class="formula-label">summation</p></div></div>
    </div>
    <div class="label">math-style: compact</div>
  </div>
</div>
</body>
</html>
