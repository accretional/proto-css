<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>math-style</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
</style>
</head>
<body>
<h1>Math Style</h1>
<p class="prop-name">math-style</p>
<div class="demos">
  <div class="demo-box" data-css-prop="math-style" data-value="normal">
    <div class="demo-area">
      <math style="display: block; font-size: 24px; background: #0f3460; border-radius: 8px; padding: 24px 32px; color: #e0e0e0; math-style: normal;"><mfrac><mi>a</mi><mi>b</mi></mfrac><mo>+</mo><munderover><mo>&#x2211;</mo><mrow><mi>i</mi><mo>=</mo><mn>0</mn></mrow><mi>n</mi></munderover></math>
    </div>
    <div class="label">math-style: normal</div>
  </div>
  <div class="demo-box" data-css-prop="math-style" data-value="compact">
    <div class="demo-area">
      <math style="display: block; font-size: 24px; background: #0f3460; border-radius: 8px; padding: 24px 32px; color: #e0e0e0; math-style: compact;"><mfrac><mi>a</mi><mi>b</mi></mfrac><mo>+</mo><munderover><mo>&#x2211;</mo><mrow><mi>i</mi><mo>=</mo><mn>0</mn></mrow><mi>n</mi></munderover></math>
    </div>
    <div class="label">math-style: compact</div>
  </div>
</div>
<div id="control-bar"></div>
<script src="../interactive.js"></script>
</body>
</html>
