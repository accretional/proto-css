<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>clip-rule</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
</style>
</head>
<body>
<h1>Clip Rule</h1>
<p class="prop-name">clip-rule</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area">
      <style>#t0  path { clip-rule: nonzero; }</style>
      <svg id="t0" style="width: 300px; height: 300px;"><defs><clipPath id="demo-clip"><path d="M150,20 L180,110 L275,110 L200,165 L225,260 L150,205 L75,260 L100,165 L25,110 L120,110 Z M150,80 L165,130 L220,130 L175,160 L190,215 L150,185 L110,215 L125,160 L80,130 L135,130 Z" /></clipPath><linearGradient id="demo-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#e94560"/><stop offset="50%" stop-color="#ff9f43"/><stop offset="100%" stop-color="#7b61ff"/></linearGradient></defs><rect x="10" y="10" width="280" height="280" rx="8" fill="#0f3460" stroke="#2a2a5a" stroke-width="1" stroke-dasharray="4"/><rect x="10" y="10" width="280" height="280" rx="8" fill="url(#demo-grad)" clip-path="url(#demo-clip)"/></svg>
    </div>
    <div class="label">clip-rule: nonzero</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <style>#t1  path { clip-rule: evenodd; }</style>
      <svg id="t1" style="width: 300px; height: 300px;"><defs><clipPath id="demo-clip"><path d="M150,20 L180,110 L275,110 L200,165 L225,260 L150,205 L75,260 L100,165 L25,110 L120,110 Z M150,80 L165,130 L220,130 L175,160 L190,215 L150,185 L110,215 L125,160 L80,130 L135,130 Z" /></clipPath><linearGradient id="demo-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#e94560"/><stop offset="50%" stop-color="#ff9f43"/><stop offset="100%" stop-color="#7b61ff"/></linearGradient></defs><rect x="10" y="10" width="280" height="280" rx="8" fill="#0f3460" stroke="#2a2a5a" stroke-width="1" stroke-dasharray="4"/><rect x="10" y="10" width="280" height="280" rx="8" fill="url(#demo-grad)" clip-path="url(#demo-clip)"/></svg>
    </div>
    <div class="label">clip-rule: evenodd</div>
  </div>
</div>
</body>
</html>
