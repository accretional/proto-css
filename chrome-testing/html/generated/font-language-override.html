<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>font-language-override</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700');
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
</style>
</head>
<body>
<div id="control-bar"></div>
<h1>Font Language Override</h1>
<p class="prop-name">font-language-override</p>
<div class="demos">
  <div class="demo-box" data-css-prop="font-language-override" data-value="normal">
    <div class="demo-area">
      <div style="font-size: 28px; line-height: 1.5; font-family: &#39;Noto Serif&#39;, Georgia, serif; font-language-override: normal;">Straße Äpfel Übung çağ fiş</div>
    </div>
    <div class="label">font-language-override: normal</div>
  </div>
  <div class="demo-box" data-css-prop="font-language-override" data-value="&#34;example&#34;">
    <div class="demo-area">
      <div style="font-size: 28px; line-height: 1.5; font-family: &#39;Noto Serif&#39;, Georgia, serif; font-language-override: &#34;example&#34;;">Straße Äpfel Übung çağ fiş</div>
    </div>
    <div class="label">font-language-override: &#34;example&#34;</div>
  </div>
</div>
<script src="../interactive.js"></script>
</body>
</html>
