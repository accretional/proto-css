<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>font-language-override</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
</style>
</head>
<body>
<h1>Font Language Override</h1>
<p class="prop-name">font-language-override</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area">
      <div style="font-size: 28px; line-height: 1.5; font-family: &#39;Noto Serif&#39;, Georgia, serif; font-language-override: normal;">Straße Äpfel Übung çağ fiş</div>
    </div>
    <div class="label">font-language-override: normal</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="font-size: 28px; line-height: 1.5; font-family: &#39;Noto Serif&#39;, Georgia, serif; font-language-override: &#34;example&#34;;">Straße Äpfel Übung çağ fiş</div>
    </div>
    <div class="label">font-language-override: &#34;example&#34;</div>
  </div>
</div>
</body>
</html>
