<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>font-palette</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nabla&display=swap');
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
</style>
</head>
<body>
<h1>Font Palette</h1>
<p class="prop-name">font-palette</p>
<div class="demos">
  <div class="demo-box" data-css-prop="font-palette" data-value="normal">
    <div class="demo-area">
      <div style="font-family: &#39;Nabla&#39;, system-ui; font-size: 48px; line-height: 1.4; font-palette: normal;">AaBbCc 123</div>
    </div>
    <div class="label">font-palette: normal</div>
  </div>
  <div class="demo-box" data-css-prop="font-palette" data-value="light">
    <div class="demo-area">
      <div style="font-family: &#39;Nabla&#39;, system-ui; font-size: 48px; line-height: 1.4; font-palette: light;">AaBbCc 123</div>
    </div>
    <div class="label">font-palette: light</div>
  </div>
  <div class="demo-box" data-css-prop="font-palette" data-value="dark">
    <div class="demo-area">
      <div style="font-family: &#39;Nabla&#39;, system-ui; font-size: 48px; line-height: 1.4; font-palette: dark;">AaBbCc 123</div>
    </div>
    <div class="label">font-palette: dark</div>
  </div>
  <div class="demo-box" data-css-prop="font-palette" data-value="--my-var">
    <div class="demo-area">
      <div style="font-family: &#39;Nabla&#39;, system-ui; font-size: 48px; line-height: 1.4; font-palette: --my-var;">AaBbCc 123</div>
    </div>
    <div class="label">font-palette: --my-var</div>
  </div>
</div>
<div id="control-bar"></div>
<script src="../interactive.js"></script>
</body>
</html>
