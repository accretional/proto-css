<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>perspective-origin</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
  .box { width: 160px; height: 160px; background: linear-gradient(135deg, #e94560, #0f3460); border: 2px solid rgba(255,255,255,0.3); border-radius: 8px; transform: rotateY(45deg) rotateX(30deg); position: absolute; }
</style>
</head>
<body>
<h1>Perspective Origin</h1>
<p class="prop-name">perspective-origin</p>
<div class="demos">
  <div class="demo-box" data-css-prop="perspective-origin" data-value="center">
    <div class="demo-area">
      <div style="width: 240px; height: 200px; perspective: 400px; display: flex; align-items: center; justify-content: center; position: relative; border: 1px dashed rgba(255,255,255,0.15); border-radius: 6px; perspective-origin: center;"><div class="box"></div></div>
    </div>
    <div class="label">perspective-origin: center</div>
  </div>
  <div class="demo-box" data-css-prop="perspective-origin" data-value="top">
    <div class="demo-area">
      <div style="width: 240px; height: 200px; perspective: 400px; display: flex; align-items: center; justify-content: center; position: relative; border: 1px dashed rgba(255,255,255,0.15); border-radius: 6px; perspective-origin: top;"><div class="box"></div></div>
    </div>
    <div class="label">perspective-origin: top</div>
  </div>
  <div class="demo-box" data-css-prop="perspective-origin" data-value="bottom">
    <div class="demo-area">
      <div style="width: 240px; height: 200px; perspective: 400px; display: flex; align-items: center; justify-content: center; position: relative; border: 1px dashed rgba(255,255,255,0.15); border-radius: 6px; perspective-origin: bottom;"><div class="box"></div></div>
    </div>
    <div class="label">perspective-origin: bottom</div>
  </div>
  <div class="demo-box" data-css-prop="perspective-origin" data-value="left">
    <div class="demo-area">
      <div style="width: 240px; height: 200px; perspective: 400px; display: flex; align-items: center; justify-content: center; position: relative; border: 1px dashed rgba(255,255,255,0.15); border-radius: 6px; perspective-origin: left;"><div class="box"></div></div>
    </div>
    <div class="label">perspective-origin: left</div>
  </div>
  <div class="demo-box" data-css-prop="perspective-origin" data-value="right">
    <div class="demo-area">
      <div style="width: 240px; height: 200px; perspective: 400px; display: flex; align-items: center; justify-content: center; position: relative; border: 1px dashed rgba(255,255,255,0.15); border-radius: 6px; perspective-origin: right;"><div class="box"></div></div>
    </div>
    <div class="label">perspective-origin: right</div>
  </div>
  <div class="demo-box" data-css-prop="perspective-origin" data-value="50% 50%">
    <div class="demo-area">
      <div style="width: 240px; height: 200px; perspective: 400px; display: flex; align-items: center; justify-content: center; position: relative; border: 1px dashed rgba(255,255,255,0.15); border-radius: 6px; perspective-origin: 50% 50%;"><div class="box"></div></div>
    </div>
    <div class="label">perspective-origin: 50% 50%</div>
  </div>
</div>
<div id="control-bar"></div>
<script src="../interactive.js"></script>
</body>
</html>
