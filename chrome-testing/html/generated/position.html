<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>position</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .flow-box { width: 80px; height: 30px; background: rgba(255,255,255,0.1); border-radius: 4px; margin: 6px; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #777; }
</style>
</head>
<body>
<h1>Position</h1>
<p class="prop-name">position</p>
<div class="demos">
  <div class="demo-box">

      <div class="flow-box">sibling</div>
      <div style="width: 80px; height: 36px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff; background: linear-gradient(135deg, #e94560, #c23066); border: 2px solid rgba(255,255,255,0.3); margin: 6px; position: static;">target</div>

    </div>

  </div>

</html>
