<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>text-emphasis</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
</style>
</head>
<body>
<h1>Text Emphasis</h1>
<p class="prop-name">text-emphasis</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area">
      <div style="font-size: 32px; padding: 24px 16px; background: #0f1a30; border-radius: 8px; border: 1px solid #2a2a4a; line-height: 2.2; color: #e0e0e0; text-emphasis: none;">Emphasis</div>
    </div>
    <div class="label">text-emphasis: none</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="font-size: 32px; padding: 24px 16px; background: #0f1a30; border-radius: 8px; border: 1px solid #2a2a4a; line-height: 2.2; color: #e0e0e0; text-emphasis: red;">Emphasis</div>
    </div>
    <div class="label">text-emphasis: red</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="font-size: 32px; padding: 24px 16px; background: #0f1a30; border-radius: 8px; border: 1px solid #2a2a4a; line-height: 2.2; color: #e0e0e0; text-emphasis: #3498db;">Emphasis</div>
    </div>
    <div class="label">text-emphasis: #3498db</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="font-size: 32px; padding: 24px 16px; background: #0f1a30; border-radius: 8px; border: 1px solid #2a2a4a; line-height: 2.2; color: #e0e0e0; text-emphasis: &#34;example&#34;;">Emphasis</div>
    </div>
    <div class="label">text-emphasis: &#34;example&#34;</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="font-size: 32px; padding: 24px 16px; background: #0f1a30; border-radius: 8px; border: 1px solid #2a2a4a; line-height: 2.2; color: #e0e0e0; text-emphasis: rgb(0, 128, 0);">Emphasis</div>
    </div>
    <div class="label">text-emphasis: rgb(0, 128, 0)</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="font-size: 32px; padding: 24px 16px; background: #0f1a30; border-radius: 8px; border: 1px solid #2a2a4a; line-height: 2.2; color: #e0e0e0; text-emphasis: filled;">Emphasis</div>
    </div>
    <div class="label">text-emphasis: filled</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="font-size: 32px; padding: 24px 16px; background: #0f1a30; border-radius: 8px; border: 1px solid #2a2a4a; line-height: 2.2; color: #e0e0e0; text-emphasis: transparent;">Emphasis</div>
    </div>
    <div class="label">text-emphasis: transparent</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="font-size: 32px; padding: 24px 16px; background: #0f1a30; border-radius: 8px; border: 1px solid #2a2a4a; line-height: 2.2; color: #e0e0e0; text-emphasis: open;">Emphasis</div>
    </div>
    <div class="label">text-emphasis: open</div>
  </div>
</div>
</body>
</html>
