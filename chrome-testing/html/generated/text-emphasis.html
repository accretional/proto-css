<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>text-emphasis</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 20px; }
    .demo-card { background: #16213e; border-radius: 12px; padding: 24px; min-width: 260px; flex: 1; }
    .sample { font-size: 28px; padding: 24px 16px; background: #0f1a30; border-radius: 8px; border: 1px solid #2a2a4a; line-height: 2; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>Text Emphasis</h1>
  <p class="prop-name">text-emphasis</p>
  <div class="demos">
    <div class="demo-card">
      <div class="sample" style="text-emphasis: light-dark(none,) ! important;">Emphasis marks</div>
      <p class="label">text-emphasis: light-dark(none,) ! important</p>
    </div>
    <div class="demo-card">
      <div class="sample" style="text-emphasis: "7";">Emphasis marks</div>
      <p class="label">text-emphasis: "7"</p>
    </div>
    <div class="demo-card">
      <div class="sample" style="text-emphasis: currentcolor '' ! important;">Emphasis marks</div>
      <p class="label">text-emphasis: currentcolor '' ! important</p>
    </div>
    <div class="demo-card">
      <div class="sample" style="text-emphasis: none light-dark(none,) ! important;">Emphasis marks</div>
      <p class="label">text-emphasis: none light-dark(none,) ! important</p>
    </div>
  </div>
</body>
</html>
