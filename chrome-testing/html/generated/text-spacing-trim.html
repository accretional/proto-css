<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>text-spacing-trim</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
</style>
</head>
<body>
<h1>Text Spacing Trim</h1>
<p class="prop-name">text-spacing-trim</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area">
      <div style="font-size: 40px; line-height: 1.4; color: #fff; min-height: 90px; display: flex; align-items: center; border-left: 3px solid #e94560; padding-left: 12px; text-spacing-trim: space-all;">「東京」「大阪」の（天気）。</div>
    </div>
    <div class="label">text-spacing-trim: space-all</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="font-size: 40px; line-height: 1.4; color: #fff; min-height: 90px; display: flex; align-items: center; border-left: 3px solid #e94560; padding-left: 12px; text-spacing-trim: auto;">「東京」「大阪」の（天気）。</div>
    </div>
    <div class="label">text-spacing-trim: auto</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="font-size: 40px; line-height: 1.4; color: #fff; min-height: 90px; display: flex; align-items: center; border-left: 3px solid #e94560; padding-left: 12px; text-spacing-trim: normal;">「東京」「大阪」の（天気）。</div>
    </div>
    <div class="label">text-spacing-trim: normal</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="font-size: 40px; line-height: 1.4; color: #fff; min-height: 90px; display: flex; align-items: center; border-left: 3px solid #e94560; padding-left: 12px; text-spacing-trim: space-first;">「東京」「大阪」の（天気）。</div>
    </div>
    <div class="label">text-spacing-trim: space-first</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="font-size: 40px; line-height: 1.4; color: #fff; min-height: 90px; display: flex; align-items: center; border-left: 3px solid #e94560; padding-left: 12px; text-spacing-trim: trim-start;">「東京」「大阪」の（天気）。</div>
    </div>
    <div class="label">text-spacing-trim: trim-start</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="font-size: 40px; line-height: 1.4; color: #fff; min-height: 90px; display: flex; align-items: center; border-left: 3px solid #e94560; padding-left: 12px; text-spacing-trim: trim-both;">「東京」「大阪」の（天気）。</div>
    </div>
    <div class="label">text-spacing-trim: trim-both</div>
  </div>
</div>
</body>
</html>
