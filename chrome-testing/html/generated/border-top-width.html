<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>border-top-width</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
</style>
</head>
<body>
<h1>Border Top Width</h1>
<p class="prop-name">border-top-width</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area">
      <div style="width: 170px; height: 90px; background: #0f3460; border-top-style: solid; border-top-color: #e94560; display: flex; align-items: center; justify-content: center; font-size: 13px; border-top-width: 0;"></div>
    </div>
    <div class="label">border-top-width: 0</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="width: 170px; height: 90px; background: #0f3460; border-top-style: solid; border-top-color: #e94560; display: flex; align-items: center; justify-content: center; font-size: 13px; border-top-width: 4px;"></div>
    </div>
    <div class="label">border-top-width: 4px</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="width: 170px; height: 90px; background: #0f3460; border-top-style: solid; border-top-color: #e94560; display: flex; align-items: center; justify-content: center; font-size: 13px; border-top-width: 10px;"></div>
    </div>
    <div class="label">border-top-width: 10px</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="width: 170px; height: 90px; background: #0f3460; border-top-style: solid; border-top-color: #e94560; display: flex; align-items: center; justify-content: center; font-size: 13px; border-top-width: 20px;"></div>
    </div>
    <div class="label">border-top-width: 20px</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="width: 170px; height: 90px; background: #0f3460; border-top-style: solid; border-top-color: #e94560; display: flex; align-items: center; justify-content: center; font-size: 13px; border-top-width: 50px;"></div>
    </div>
    <div class="label">border-top-width: 50px</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="width: 170px; height: 90px; background: #0f3460; border-top-style: solid; border-top-color: #e94560; display: flex; align-items: center; justify-content: center; font-size: 13px; border-top-width: hairline;"></div>
    </div>
    <div class="label">border-top-width: hairline</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="width: 170px; height: 90px; background: #0f3460; border-top-style: solid; border-top-color: #e94560; display: flex; align-items: center; justify-content: center; font-size: 13px; border-top-width: thin;"></div>
    </div>
    <div class="label">border-top-width: thin</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="width: 170px; height: 90px; background: #0f3460; border-top-style: solid; border-top-color: #e94560; display: flex; align-items: center; justify-content: center; font-size: 13px; border-top-width: medium;"></div>
    </div>
    <div class="label">border-top-width: medium</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="width: 170px; height: 90px; background: #0f3460; border-top-style: solid; border-top-color: #e94560; display: flex; align-items: center; justify-content: center; font-size: 13px; border-top-width: thick;"></div>
    </div>
    <div class="label">border-top-width: thick</div>
  </div>
</div>
</body>
</html>
