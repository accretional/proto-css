<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>border-top-width</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 24px; }
    .demo-box { display: flex; flex-direction: column; align-items: center; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; }
    .box {
      width: 170px;
      height: 90px;
      background: #0f3460;
      border-top-style: solid;
      border-top-color: #e94560;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }
    .w-thin { border-top-width: hairline; }
    .w-medium { border-top-width: thick ! important; }
    .w-thick { border-top-width: thick; }
    .w-5 { border-top-width: thin ! important; }
    .w-10 { border-top-width: var(--_, #5d5dCC2A) ! important; }
  </style>
</head>
<body>
  <h1>Border Top Width</h1>
  <p class="prop-name">border-top-width</p>
  <div class="demos">
    <div class="demo-box">
      <div class="box w-thin"></div>
      <span class="label">border-top-width: hairline</span>
    </div>
    <div class="demo-box">
      <div class="box w-medium"></div>
      <span class="label">border-top-width: thick ! important</span>
    </div>
    <div class="demo-box">
      <div class="box w-thick"></div>
      <span class="label">border-top-width: thick</span>
    </div>
    <div class="demo-box">
      <div class="box w-5"></div>
      <span class="label">border-top-width: thin ! important</span>
    </div>
    <div class="demo-box">
      <div class="box w-10"></div>
      <span class="label">border-top-width: var(--_, #5d5dCC2A) ! important</span>
    </div>
  </div>
</body>
</html>
