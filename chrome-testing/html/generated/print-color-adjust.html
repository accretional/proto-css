<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>print-color-adjust</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
</style>
</head>
<body>
<h1>Print Color Adjust</h1>
<p class="prop-name">print-color-adjust</p>
<div class="demos">
  <div class="demo-box" data-css-prop="print-color-adjust" data-value="economy">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 28px; display: flex; flex-direction: column; align-items: center; width: 540px;">
      <div style="width: 460px; background: #fff; border-radius: 8px; padding: 24px; color: #222; position: relative; print-color-adjust: economy;"><div style="font-size: 16px; font-weight: 700; margin-bottom: 12px; color: #222;">Sales Report</div><div style="display: flex; gap: 12px; margin-bottom: 12px;"><div style="width: 50px; height: 50px; border-radius: 8px; border: 1px solid #ddd; background: #e94560;"></div><div style="width: 50px; height: 50px; border-radius: 8px; border: 1px solid #ddd; background: #0f3460;"></div><div style="width: 50px; height: 50px; border-radius: 8px; border: 1px solid #ddd; background: #22c55e;"></div></div><div style="height: 24px; border-radius: 4px; margin-bottom: 6px; width: 80%; background: #e94560;"></div><div style="height: 24px; border-radius: 4px; margin-bottom: 6px; width: 55%; background: #0f3460;"></div><div style="height: 24px; border-radius: 4px; margin-bottom: 6px; width: 90%; background: #22c55e;"></div></div>
    </div>
    <div class="label">print-color-adjust: economy</div>
  </div>
  <div class="demo-box" data-css-prop="print-color-adjust" data-value="exact">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 28px; display: flex; flex-direction: column; align-items: center; width: 540px;">
      <div style="width: 460px; background: #fff; border-radius: 8px; padding: 24px; color: #222; position: relative; print-color-adjust: exact;"><div style="font-size: 16px; font-weight: 700; margin-bottom: 12px; color: #222;">Sales Report</div><div style="display: flex; gap: 12px; margin-bottom: 12px;"><div style="width: 50px; height: 50px; border-radius: 8px; border: 1px solid #ddd; background: #e94560;"></div><div style="width: 50px; height: 50px; border-radius: 8px; border: 1px solid #ddd; background: #0f3460;"></div><div style="width: 50px; height: 50px; border-radius: 8px; border: 1px solid #ddd; background: #22c55e;"></div></div><div style="height: 24px; border-radius: 4px; margin-bottom: 6px; width: 80%; background: #e94560;"></div><div style="height: 24px; border-radius: 4px; margin-bottom: 6px; width: 55%; background: #0f3460;"></div><div style="height: 24px; border-radius: 4px; margin-bottom: 6px; width: 90%; background: #22c55e;"></div></div>
    </div>
    <div class="label">print-color-adjust: exact</div>
  </div>
</div>
<div id="control-bar"></div>
<script src="../interactive.js"></script>
</body>
</html>
