<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>fill</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
</style>
</head>
<body>
<h1>SVG Fill Color</h1>
<p class="prop-name">fill</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; align-items: center; min-width: 200px; flex: 1;">
      <svg width="140" height="140" viewBox="0 0 140 140">
      <circle style="cx: 70; cy: 70; r: 55; fill: none;"></circle>
      </svg>
    </div>
    <div class="label">fill: none</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; align-items: center; min-width: 200px; flex: 1;">
      <svg width="140" height="140" viewBox="0 0 140 140">
      <circle style="cx: 70; cy: 70; r: 55; fill: linear-gradient(red, blue);"></circle>
      </svg>
    </div>
    <div class="label">fill: linear-gradient(red, blue)</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; align-items: center; min-width: 200px; flex: 1;">
      <svg width="140" height="140" viewBox="0 0 140 140">
      <circle style="cx: 70; cy: 70; r: 55; fill: child;"></circle>
      </svg>
    </div>
    <div class="label">fill: child</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; align-items: center; min-width: 200px; flex: 1;">
      <svg width="140" height="140" viewBox="0 0 140 140">
      <circle style="cx: 70; cy: 70; r: 55; fill: child(0);"></circle>
      </svg>
    </div>
    <div class="label">fill: child(0)</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; align-items: center; min-width: 200px; flex: 1;">
      <svg width="140" height="140" viewBox="0 0 140 140">
      <circle style="cx: 70; cy: 70; r: 55; fill: child(1);"></circle>
      </svg>
    </div>
    <div class="label">fill: child(1)</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; align-items: center; min-width: 200px; flex: 1;">
      <svg width="140" height="140" viewBox="0 0 140 140">
      <circle style="cx: 70; cy: 70; r: 55; fill: child(2);"></circle>
      </svg>
    </div>
    <div class="label">fill: child(2)</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; align-items: center; min-width: 200px; flex: 1;">
      <svg width="140" height="140" viewBox="0 0 140 140">
      <circle style="cx: 70; cy: 70; r: 55; fill: child(5);"></circle>
      </svg>
    </div>
    <div class="label">fill: child(5)</div>
  </div>
</div>
</body>
</html>
