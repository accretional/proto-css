<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>fill</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
  svg { width: 140px; height: 150px; }
</style>
</head>
<body>
<div id="control-bar"></div>
<h1>SVG Fill Color</h1>
<p class="prop-name">fill</p>
<div class="demos">
  <div class="demo-box" data-css-prop="fill" data-value="none">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; align-items: center; min-width: 200px;">
      <svg style="display: block; fill: none;"><circle cx="70" cy="70" r="55" stroke="#555" stroke-width="2" /><rect x="20" y="130" width="100" height="10" rx="5" stroke="#555" stroke-width="1" /></svg>
    </div>
    <div class="label">fill: none</div>
  </div>
  <div class="demo-box" data-css-prop="fill" data-value="linear-gradient(red, blue)">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; align-items: center; min-width: 200px;">
      <svg style="display: block; fill: linear-gradient(red, blue);"><circle cx="70" cy="70" r="55" stroke="#555" stroke-width="2" /><rect x="20" y="130" width="100" height="10" rx="5" stroke="#555" stroke-width="1" /></svg>
    </div>
    <div class="label">fill: linear-gradient(red, blue)</div>
  </div>
  <div class="demo-box" data-css-prop="fill" data-value="red">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; align-items: center; min-width: 200px;">
      <svg style="display: block; fill: red;"><circle cx="70" cy="70" r="55" stroke="#555" stroke-width="2" /><rect x="20" y="130" width="100" height="10" rx="5" stroke="#555" stroke-width="1" /></svg>
    </div>
    <div class="label">fill: red</div>
  </div>
  <div class="demo-box" data-css-prop="fill" data-value="url(statue.svg)">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; align-items: center; min-width: 200px;">
      <svg style="display: block; fill: url(statue.svg);"><circle cx="70" cy="70" r="55" stroke="#555" stroke-width="2" /><rect x="20" y="130" width="100" height="10" rx="5" stroke="#555" stroke-width="1" /></svg>
    </div>
    <div class="label">fill: url(statue.svg)</div>
  </div>
  <div class="demo-box" data-css-prop="fill" data-value="#3498db">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; align-items: center; min-width: 200px;">
      <svg style="display: block; fill: #3498db;"><circle cx="70" cy="70" r="55" stroke="#555" stroke-width="2" /><rect x="20" y="130" width="100" height="10" rx="5" stroke="#555" stroke-width="1" /></svg>
    </div>
    <div class="label">fill: #3498db</div>
  </div>
</div>
<script src="../interactive.js"></script>
</body>
</html>
