<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>outline-style</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
</style>
</head>
<body>
<h1>Outline Style</h1>
<p class="prop-name">outline-style</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area">
      <div style="width: 120px; height: 80px; background: #0f3460; border-radius: 6px; outline-width: 4px; outline-color: #e94560; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #c0c0d0; outline-style: auto;"></div>
    </div>
    <div class="label">outline-style: auto</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="width: 120px; height: 80px; background: #0f3460; border-radius: 6px; outline-width: 4px; outline-color: #e94560; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #c0c0d0; outline-style: none;"></div>
    </div>
    <div class="label">outline-style: none</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="width: 120px; height: 80px; background: #0f3460; border-radius: 6px; outline-width: 4px; outline-color: #e94560; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #c0c0d0; outline-style: dotted;"></div>
    </div>
    <div class="label">outline-style: dotted</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="width: 120px; height: 80px; background: #0f3460; border-radius: 6px; outline-width: 4px; outline-color: #e94560; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #c0c0d0; outline-style: dashed;"></div>
    </div>
    <div class="label">outline-style: dashed</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="width: 120px; height: 80px; background: #0f3460; border-radius: 6px; outline-width: 4px; outline-color: #e94560; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #c0c0d0; outline-style: solid;"></div>
    </div>
    <div class="label">outline-style: solid</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="width: 120px; height: 80px; background: #0f3460; border-radius: 6px; outline-width: 4px; outline-color: #e94560; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #c0c0d0; outline-style: double;"></div>
    </div>
    <div class="label">outline-style: double</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="width: 120px; height: 80px; background: #0f3460; border-radius: 6px; outline-width: 4px; outline-color: #e94560; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #c0c0d0; outline-style: groove;"></div>
    </div>
    <div class="label">outline-style: groove</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="width: 120px; height: 80px; background: #0f3460; border-radius: 6px; outline-width: 4px; outline-color: #e94560; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #c0c0d0; outline-style: ridge;"></div>
    </div>
    <div class="label">outline-style: ridge</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="width: 120px; height: 80px; background: #0f3460; border-radius: 6px; outline-width: 4px; outline-color: #e94560; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #c0c0d0; outline-style: inset;"></div>
    </div>
    <div class="label">outline-style: inset</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="width: 120px; height: 80px; background: #0f3460; border-radius: 6px; outline-width: 4px; outline-color: #e94560; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #c0c0d0; outline-style: outset;"></div>
    </div>
    <div class="label">outline-style: outset</div>
  </div>
</div>
</body>
</html>
