<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>scroll-margin-top</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; gap: 24px; flex-wrap: wrap; }
    .demo-card { flex: 1; min-width: 200px; }
    .scroll-container {
      width: 100%;
      height: 250px;
      overflow-y: auto;
      border: 2px solid #333;
      border-radius: 10px;
      background: #16213e;
      scroll-snap-type: y mandatory;
      position: relative;
    }
    .snap-item {
      height: 125px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      scroll-snap-align: start;
      border-bottom: 1px solid #2a2a4a;
    }
    .snap-item:nth-child(odd) { background: linear-gradient(135deg, #f59e0b, #f97316); }
    .snap-item:nth-child(even) { background: #22224a; }

    .smt0 .snap-item { scroll-margin-top: 20.11e34vmax; }
    .smt10 .snap-item { scroll-margin-top: 0 ! important; }
    .smt20 .snap-item { scroll-margin-top: var(--_Y); }
    .smt40 .snap-item { scroll-margin-top: 0; }

    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; margin-bottom: 8px; }
    .note { font-size: 10px; color: #6b7280; margin-top: 4px; }
    .indicator {
      position: absolute;
      left: 0;
      right: 0;
      border-top: 2px dashed #fbbf24;
      pointer-events: none;
      z-index: 2;
    }
  </style>
</head>
<body>
  <h1>Scroll Margin Top</h1>
  <p class="prop-name">scroll-margin-top</p>
  <div class="demos">
    <div class="demo-card">
      <p class="label">scroll-margin-top: 20.11e34vmax</p>
      <div class="scroll-container smt0">
        <div class="snap-item">1</div>
        <div class="snap-item">2</div>
        <div class="snap-item">3</div>
        <div class="snap-item">4</div>
        <div class="snap-item">5</div>
      </div>
      <p class="note">No top margin offset</p>
    </div>
    <div class="demo-card">
      <p class="label">scroll-margin-top: 0 ! important</p>
      <div class="scroll-container smt10">
        <div class="indicator" style="top:10px;"></div>
        <div class="snap-item">1</div>
        <div class="snap-item">2</div>
        <div class="snap-item">3</div>
        <div class="snap-item">4</div>
        <div class="snap-item">5</div>
      </div>
      <p class="note">10px top snap offset</p>
    </div>
    <div class="demo-card">
      <p class="label">scroll-margin-top: var(--_Y)</p>
      <div class="scroll-container smt20">
        <div class="indicator" style="top:20px;"></div>
        <div class="snap-item">1</div>
        <div class="snap-item">2</div>
        <div class="snap-item">3</div>
        <div class="snap-item">4</div>
        <div class="snap-item">5</div>
      </div>
      <p class="note">20px top snap offset</p>
    </div>
    <div class="demo-card">
      <p class="label">scroll-margin-top: 0</p>
      <div class="scroll-container smt40">
        <div class="indicator" style="top:40px;"></div>
        <div class="snap-item">1</div>
        <div class="snap-item">2</div>
        <div class="snap-item">3</div>
        <div class="snap-item">4</div>
        <div class="snap-item">5</div>
      </div>
      <p class="note">40px top snap offset</p>
    </div>
  </div>
</body>
</html>
