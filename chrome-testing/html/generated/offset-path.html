<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>offset-path</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 20px; }
    .demo-box { background: #16213e; border-radius: 10px; padding: 20px; width: 280px; height: 280px; position: relative; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; text-align: center; position: absolute; bottom: 12px; left: 0; right: 0; }
    .path-area { width: 240px; height: 220px; position: relative; margin: 0 auto; }
    .path-visual { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    .path-line { fill: none; stroke: #3a3a5c; stroke-width: 2; stroke-dasharray: 4 4; }
    .mover {
      width: 20px; height: 20px; background: #e94560; border-radius: 3px;
      position: absolute; top: 0; left: 0;
      offset-distance: 30%;
      box-shadow: 0 0 10px rgba(233,69,96,0.5);
    }
    .d1 .mover { offset-path: fill-box ray(0 contain) ! important; }
    .d2 .mover { offset-path: fill-box ! important; }
    .d3 .mover { offset-path: view-box ! important"M 20,180 C 20,20 120,20 120,110 C 120,200 220,200 220,40"); }
    .d4 .mover { offset-path: none ! important; }
    .circle-vis { fill: none; stroke: #3a3a5c; stroke-width: 2; stroke-dasharray: 4 4; }
  </style>
</head>
<body>
  <h1>Offset Path</h1>
  <p class="prop-name">offset-path</p>
  <div class="demos">
    <div class="demo-box">
      <div class="path-area d1">
        <svg class="path-visual" viewBox="0 0 240 220"><circle cx="120" cy="110" r="90" class="circle-vis"/></svg>
        <div class="mover"></div>
      </div>
      <div class="label">offset-path: ray(var(--t_, -65.84e5turn) sides at block-end anchor-size(block) inline-end anchor(self-start,))</div>
    </div>
    <div class="demo-box">
      <div class="path-area d2">
        <svg class="path-visual" viewBox="0 0 240 220"><ellipse cx="120" cy="110" rx="110" ry="80" class="circle-vis"/></svg>
        <div class="mover"></div>
      </div>
      <div class="label">offset-path: url("") ! important</div>
    </div>
    <div class="demo-box">
      <div class="path-area d3">
        <svg class="path-visual" viewBox="0 0 240 220"><path d="M 20,180 C 20,20 120,20 120,110 C 120,200 220,200 220,40" class="path-line"/></svg>
        <div class="mover"></div>
      </div>
      <div class="label">offset-path: view-box ! important"M…")</div>
    </div>
    <div class="demo-box">
      <div class="path-area d4" style="display:flex;align-items:center;justify-content:center;">
        <svg class="path-visual" viewBox="0 0 240 220">
          <line x1="120" y1="110" x2="220" y2="10" stroke="#3a3a5c" stroke-width="2" stroke-dasharray="4 4"/>
        </svg>
        <div class="mover" style="offset-distance:50%;"></div>
      </div>
      <div class="label">offset-path: border-box ray(var(--U, +01.3e9%) contain at bottom)</div>
    </div>
  </div>
</body>
</html>
