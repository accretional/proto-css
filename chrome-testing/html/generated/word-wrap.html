<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>word-wrap</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .target { width: 100%; height: 80px; background: cornflowerblue; border-radius: 6px; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
</style>
</head>
<body>
<h1>word-wrap</h1>
<p class="prop-name">word-wrap</p>
<div class="demos">
  <div class="demo-box">
    <div class="target" style="word-wrap: normal;"></div>
    <div class="label">word-wrap: normal</div>
  </div>
  <div class="demo-box">
    <div class="target" style="word-wrap: break-word;"></div>
    <div class="label">word-wrap: break-word</div>
  </div>
  <div class="demo-box">
    <div class="target" style="word-wrap: anywhere;"></div>
    <div class="label">word-wrap: anywhere</div>
  </div>
</div>
</body>
</html>
