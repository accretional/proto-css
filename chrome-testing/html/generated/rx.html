<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>rx</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
</style>
</head>
<body>
<h1>SVG Horizontal Radius</h1>
<p class="prop-name">rx</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area">
      <style>#t0  ellipse.target { rx: 10px; }</style>
      <svg id="t0" style="width: 240px; height: 120px;"><line x1="120" y1="0" x2="120" y2="120" stroke="#3a4a5e" stroke-width="1" stroke-dasharray="4 3"/><line x1="0" y1="60" x2="240" y2="60" stroke="#3a4a5e" stroke-width="1" stroke-dasharray="4 3"/><ellipse class="target" cx="120" cy="60" rx="50" ry="50" fill="#e94560" opacity="0.85"/></svg>
    </div>
    <div class="label">rx: 10px</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <style>#t1  ellipse.target { rx: auto; }</style>
      <svg id="t1" style="width: 240px; height: 120px;"><line x1="120" y1="0" x2="120" y2="120" stroke="#3a4a5e" stroke-width="1" stroke-dasharray="4 3"/><line x1="0" y1="60" x2="240" y2="60" stroke="#3a4a5e" stroke-width="1" stroke-dasharray="4 3"/><ellipse class="target" cx="120" cy="60" rx="50" ry="50" fill="#e94560" opacity="0.85"/></svg>
    </div>
    <div class="label">rx: auto</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <style>#t2  ellipse.target { rx: 25%; }</style>
      <svg id="t2" style="width: 240px; height: 120px;"><line x1="120" y1="0" x2="120" y2="120" stroke="#3a4a5e" stroke-width="1" stroke-dasharray="4 3"/><line x1="0" y1="60" x2="240" y2="60" stroke="#3a4a5e" stroke-width="1" stroke-dasharray="4 3"/><ellipse class="target" cx="120" cy="60" rx="50" ry="50" fill="#e94560" opacity="0.85"/></svg>
    </div>
    <div class="label">rx: 25%</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <style>#t3  ellipse.target { rx: 50%; }</style>
      <svg id="t3" style="width: 240px; height: 120px;"><line x1="120" y1="0" x2="120" y2="120" stroke="#3a4a5e" stroke-width="1" stroke-dasharray="4 3"/><line x1="0" y1="60" x2="240" y2="60" stroke="#3a4a5e" stroke-width="1" stroke-dasharray="4 3"/><ellipse class="target" cx="120" cy="60" rx="50" ry="50" fill="#e94560" opacity="0.85"/></svg>
    </div>
    <div class="label">rx: 50%</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <style>#t4  ellipse.target { rx: 100%; }</style>
      <svg id="t4" style="width: 240px; height: 120px;"><line x1="120" y1="0" x2="120" y2="120" stroke="#3a4a5e" stroke-width="1" stroke-dasharray="4 3"/><line x1="0" y1="60" x2="240" y2="60" stroke="#3a4a5e" stroke-width="1" stroke-dasharray="4 3"/><ellipse class="target" cx="120" cy="60" rx="50" ry="50" fill="#e94560" opacity="0.85"/></svg>
    </div>
    <div class="label">rx: 100%</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <style>#t5  ellipse.target { rx: 0; }</style>
      <svg id="t5" style="width: 240px; height: 120px;"><line x1="120" y1="0" x2="120" y2="120" stroke="#3a4a5e" stroke-width="1" stroke-dasharray="4 3"/><line x1="0" y1="60" x2="240" y2="60" stroke="#3a4a5e" stroke-width="1" stroke-dasharray="4 3"/><ellipse class="target" cx="120" cy="60" rx="50" ry="50" fill="#e94560" opacity="0.85"/></svg>
    </div>
    <div class="label">rx: 0</div>
  </div>
</div>
</body>
</html>
