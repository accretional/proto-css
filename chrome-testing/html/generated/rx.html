<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>rx</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
</style>
</head>
<body>
<h1>SVG Horizontal Radius</h1>
<p class="prop-name">rx</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area">
      <svg style="width: 120px; height: 100px; rx: 0;"><line x1="60" y1="0" x2="60" y2="100" stroke="#3a4a5e" stroke-width="1" stroke-dasharray="4 3"/><line x1="0" y1="50" x2="120" y2="50" stroke="#3a4a5e" stroke-width="1" stroke-dasharray="4 3"/><ellipse cx="60" cy="50" rx="50" ry="40" fill="#e94560" opacity="0.85"/></svg>
    </div>
    <div class="label">rx: 0</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <svg style="width: 120px; height: 100px; rx: 10px;"><line x1="60" y1="0" x2="60" y2="100" stroke="#3a4a5e" stroke-width="1" stroke-dasharray="4 3"/><line x1="0" y1="50" x2="120" y2="50" stroke="#3a4a5e" stroke-width="1" stroke-dasharray="4 3"/><ellipse cx="60" cy="50" rx="50" ry="40" fill="#e94560" opacity="0.85"/></svg>
    </div>
    <div class="label">rx: 10px</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <svg style="width: 120px; height: 100px; rx: 25%;"><line x1="60" y1="0" x2="60" y2="100" stroke="#3a4a5e" stroke-width="1" stroke-dasharray="4 3"/><line x1="0" y1="50" x2="120" y2="50" stroke="#3a4a5e" stroke-width="1" stroke-dasharray="4 3"/><ellipse cx="60" cy="50" rx="50" ry="40" fill="#e94560" opacity="0.85"/></svg>
    </div>
    <div class="label">rx: 25%</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <svg style="width: 120px; height: 100px; rx: 50%;"><line x1="60" y1="0" x2="60" y2="100" stroke="#3a4a5e" stroke-width="1" stroke-dasharray="4 3"/><line x1="0" y1="50" x2="120" y2="50" stroke="#3a4a5e" stroke-width="1" stroke-dasharray="4 3"/><ellipse cx="60" cy="50" rx="50" ry="40" fill="#e94560" opacity="0.85"/></svg>
    </div>
    <div class="label">rx: 50%</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <svg style="width: 120px; height: 100px; rx: 100%;"><line x1="60" y1="0" x2="60" y2="100" stroke="#3a4a5e" stroke-width="1" stroke-dasharray="4 3"/><line x1="0" y1="50" x2="120" y2="50" stroke="#3a4a5e" stroke-width="1" stroke-dasharray="4 3"/><ellipse cx="60" cy="50" rx="50" ry="40" fill="#e94560" opacity="0.85"/></svg>
    </div>
    <div class="label">rx: 100%</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <svg style="width: 120px; height: 100px; rx: auto;"><line x1="60" y1="0" x2="60" y2="100" stroke="#3a4a5e" stroke-width="1" stroke-dasharray="4 3"/><line x1="0" y1="50" x2="120" y2="50" stroke="#3a4a5e" stroke-width="1" stroke-dasharray="4 3"/><ellipse cx="60" cy="50" rx="50" ry="40" fill="#e94560" opacity="0.85"/></svg>
    </div>
    <div class="label">rx: auto</div>
  </div>
</div>
</body>
</html>
