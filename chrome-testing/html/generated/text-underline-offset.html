<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>text-underline-offset</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
</style>
</head>
<body>
<h1>Text Underline Offset</h1>
<p class="prop-name">text-underline-offset</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area">
      <span style="font-size: 28px; font-weight: 600; color: #fff; text-decoration: underline; text-decoration-color: #e94560; text-decoration-thickness: 3px; text-underline-offset: auto;">Offset</span>
    </div>
    <div class="label">text-underline-offset: auto</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <span style="font-size: 28px; font-weight: 600; color: #fff; text-decoration: underline; text-decoration-color: #e94560; text-decoration-thickness: 3px; text-underline-offset: 10px;">Offset</span>
    </div>
    <div class="label">text-underline-offset: 10px</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <span style="font-size: 28px; font-weight: 600; color: #fff; text-decoration: underline; text-decoration-color: #e94560; text-decoration-thickness: 3px; text-underline-offset: 25%;">Offset</span>
    </div>
    <div class="label">text-underline-offset: 25%</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <span style="font-size: 28px; font-weight: 600; color: #fff; text-decoration: underline; text-decoration-color: #e94560; text-decoration-thickness: 3px; text-underline-offset: 50%;">Offset</span>
    </div>
    <div class="label">text-underline-offset: 50%</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <span style="font-size: 28px; font-weight: 600; color: #fff; text-decoration: underline; text-decoration-color: #e94560; text-decoration-thickness: 3px; text-underline-offset: 100%;">Offset</span>
    </div>
    <div class="label">text-underline-offset: 100%</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <span style="font-size: 28px; font-weight: 600; color: #fff; text-decoration: underline; text-decoration-color: #e94560; text-decoration-thickness: 3px; text-underline-offset: 0;">Offset</span>
    </div>
    <div class="label">text-underline-offset: 0</div>
  </div>
</div>
</body>
</html>
