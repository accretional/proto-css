<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>offset-anchor</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
  .anchor-dot { width: 6px; height: 6px; background: #00ff88; border-radius: 50%; position: absolute; }
</style>
</head>
<body>
<h1>Offset Anchor</h1>
<p class="prop-name">offset-anchor</p>
<div class="demos">
  <div class="demo-box" data-css-prop="offset-anchor" data-value="auto">
    <div class="demo-area" style="width: 240px; height: 200px; position: relative;">
      <svg class="path-visual" viewBox="0 0 240 200" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"><path d="M 20,100 C 60,20 180,20 220,100" fill="none" stroke="#3a3a5c" stroke-width="2" stroke-dasharray="4 4"/></svg>
      <div style="width: 40px; height: 40px; background: #e94560; border-radius: 4px; position: absolute; top: 0; left: 0; offset-path: path(&#34;M 20,100 C 60,20 180,20 220,100&#34;); offset-distance: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; color: #fff; offset-anchor: auto;"><div class="anchor-dot"></div></div>
    </div>
    <div class="label">offset-anchor: auto</div>
  </div>
  <div class="demo-box" data-css-prop="offset-anchor" data-value="center">
    <div class="demo-area" style="width: 240px; height: 200px; position: relative;">
      <svg class="path-visual" viewBox="0 0 240 200" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"><path d="M 20,100 C 60,20 180,20 220,100" fill="none" stroke="#3a3a5c" stroke-width="2" stroke-dasharray="4 4"/></svg>
      <div style="width: 40px; height: 40px; background: #e94560; border-radius: 4px; position: absolute; top: 0; left: 0; offset-path: path(&#34;M 20,100 C 60,20 180,20 220,100&#34;); offset-distance: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; color: #fff; offset-anchor: center;"><div class="anchor-dot"></div></div>
    </div>
    <div class="label">offset-anchor: center</div>
  </div>
  <div class="demo-box" data-css-prop="offset-anchor" data-value="top">
    <div class="demo-area" style="width: 240px; height: 200px; position: relative;">
      <svg class="path-visual" viewBox="0 0 240 200" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"><path d="M 20,100 C 60,20 180,20 220,100" fill="none" stroke="#3a3a5c" stroke-width="2" stroke-dasharray="4 4"/></svg>
      <div style="width: 40px; height: 40px; background: #e94560; border-radius: 4px; position: absolute; top: 0; left: 0; offset-path: path(&#34;M 20,100 C 60,20 180,20 220,100&#34;); offset-distance: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; color: #fff; offset-anchor: top;"><div class="anchor-dot"></div></div>
    </div>
    <div class="label">offset-anchor: top</div>
  </div>
  <div class="demo-box" data-css-prop="offset-anchor" data-value="bottom">
    <div class="demo-area" style="width: 240px; height: 200px; position: relative;">
      <svg class="path-visual" viewBox="0 0 240 200" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"><path d="M 20,100 C 60,20 180,20 220,100" fill="none" stroke="#3a3a5c" stroke-width="2" stroke-dasharray="4 4"/></svg>
      <div style="width: 40px; height: 40px; background: #e94560; border-radius: 4px; position: absolute; top: 0; left: 0; offset-path: path(&#34;M 20,100 C 60,20 180,20 220,100&#34;); offset-distance: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; color: #fff; offset-anchor: bottom;"><div class="anchor-dot"></div></div>
    </div>
    <div class="label">offset-anchor: bottom</div>
  </div>
  <div class="demo-box" data-css-prop="offset-anchor" data-value="left">
    <div class="demo-area" style="width: 240px; height: 200px; position: relative;">
      <svg class="path-visual" viewBox="0 0 240 200" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"><path d="M 20,100 C 60,20 180,20 220,100" fill="none" stroke="#3a3a5c" stroke-width="2" stroke-dasharray="4 4"/></svg>
      <div style="width: 40px; height: 40px; background: #e94560; border-radius: 4px; position: absolute; top: 0; left: 0; offset-path: path(&#34;M 20,100 C 60,20 180,20 220,100&#34;); offset-distance: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; color: #fff; offset-anchor: left;"><div class="anchor-dot"></div></div>
    </div>
    <div class="label">offset-anchor: left</div>
  </div>
  <div class="demo-box" data-css-prop="offset-anchor" data-value="right">
    <div class="demo-area" style="width: 240px; height: 200px; position: relative;">
      <svg class="path-visual" viewBox="0 0 240 200" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"><path d="M 20,100 C 60,20 180,20 220,100" fill="none" stroke="#3a3a5c" stroke-width="2" stroke-dasharray="4 4"/></svg>
      <div style="width: 40px; height: 40px; background: #e94560; border-radius: 4px; position: absolute; top: 0; left: 0; offset-path: path(&#34;M 20,100 C 60,20 180,20 220,100&#34;); offset-distance: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; color: #fff; offset-anchor: right;"><div class="anchor-dot"></div></div>
    </div>
    <div class="label">offset-anchor: right</div>
  </div>
  <div class="demo-box" data-css-prop="offset-anchor" data-value="50% 50%">
    <div class="demo-area" style="width: 240px; height: 200px; position: relative;">
      <svg class="path-visual" viewBox="0 0 240 200" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"><path d="M 20,100 C 60,20 180,20 220,100" fill="none" stroke="#3a3a5c" stroke-width="2" stroke-dasharray="4 4"/></svg>
      <div style="width: 40px; height: 40px; background: #e94560; border-radius: 4px; position: absolute; top: 0; left: 0; offset-path: path(&#34;M 20,100 C 60,20 180,20 220,100&#34;); offset-distance: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; color: #fff; offset-anchor: 50% 50%;"><div class="anchor-dot"></div></div>
    </div>
    <div class="label">offset-anchor: 50% 50%</div>
  </div>
</div>
<div id="control-bar"></div>
<script src="../interactive.js"></script>
</body>
</html>
