<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>isolation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .shape1 { position: absolute; width: 120px; height: 120px; border-radius: 16px; background: #e94560; top: 20px; left: 30px; }
.shape2 { position: absolute; width: 120px; height: 120px; border-radius: 16px; background: #0ea5e9; mix-blend-mode: multiply; top: 50px; left: 80px; }
</style>
</head>
<body>
<h1>Isolation</h1>
<p class="prop-name">isolation</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area" style="position: relative; width: 100%; height: 200px; background: #e2b714; border-radius: 8px; overflow: hidden;">
      <div style="position: relative; width: 100%; height: 180px; border-radius: 8px; overflow: hidden; isolation: auto;"><div class="shape1"></div><div class="shape2"></div></div>
    </div>
    <div class="label">isolation: auto</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="position: relative; width: 100%; height: 200px; background: #e2b714; border-radius: 8px; overflow: hidden;">
      <div style="position: relative; width: 100%; height: 180px; border-radius: 8px; overflow: hidden; isolation: isolate;"><div class="shape1"></div><div class="shape2"></div></div>
    </div>
    <div class="label">isolation: isolate</div>
  </div>
</div>
</body>
</html>
