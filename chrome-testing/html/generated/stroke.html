<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>stroke</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .svg-container { background: #0a0a1a; border-radius: 8px; padding: 10px; display: flex; align-items: center; justify-content: center; }
.stroke-preview { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.sp-line { width: 40px; height: 4px; border-radius: 2px; }
.sp-text { font-size: 11px; color: #7b8794; }
</style>
</head>
<body>
<h1>Stroke</h1>
<p class="prop-name">stroke</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 18px; width: 228px;">
      <svg style="display: block; stroke: none;"><circle cx="55" cy="45" r="30" fill="none" stroke-width="3" /><rect x="105" y="15" width="60" height="60" rx="6" fill="none" stroke-width="3" /><polygon points="95,115 55,85 135,85" fill="none" stroke-width="3" /></svg>
    </div>
    <div class="label">stroke: none</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 18px; width: 228px;">
      <svg style="display: block; stroke: linear-gradient(red, blue);"><circle cx="55" cy="45" r="30" fill="none" stroke-width="3" /><rect x="105" y="15" width="60" height="60" rx="6" fill="none" stroke-width="3" /><polygon points="95,115 55,85 135,85" fill="none" stroke-width="3" /></svg>
    </div>
    <div class="label">stroke: linear-gradient(red, blue)</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 18px; width: 228px;">
      <svg style="display: block; stroke: child;"><circle cx="55" cy="45" r="30" fill="none" stroke-width="3" /><rect x="105" y="15" width="60" height="60" rx="6" fill="none" stroke-width="3" /><polygon points="95,115 55,85 135,85" fill="none" stroke-width="3" /></svg>
    </div>
    <div class="label">stroke: child</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 18px; width: 228px;">
      <svg style="display: block; stroke: child(0);"><circle cx="55" cy="45" r="30" fill="none" stroke-width="3" /><rect x="105" y="15" width="60" height="60" rx="6" fill="none" stroke-width="3" /><polygon points="95,115 55,85 135,85" fill="none" stroke-width="3" /></svg>
    </div>
    <div class="label">stroke: child(0)</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 18px; width: 228px;">
      <svg style="display: block; stroke: child(1);"><circle cx="55" cy="45" r="30" fill="none" stroke-width="3" /><rect x="105" y="15" width="60" height="60" rx="6" fill="none" stroke-width="3" /><polygon points="95,115 55,85 135,85" fill="none" stroke-width="3" /></svg>
    </div>
    <div class="label">stroke: child(1)</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 18px; width: 228px;">
      <svg style="display: block; stroke: child(2);"><circle cx="55" cy="45" r="30" fill="none" stroke-width="3" /><rect x="105" y="15" width="60" height="60" rx="6" fill="none" stroke-width="3" /><polygon points="95,115 55,85 135,85" fill="none" stroke-width="3" /></svg>
    </div>
    <div class="label">stroke: child(2)</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 18px; width: 228px;">
      <svg style="display: block; stroke: child(5);"><circle cx="55" cy="45" r="30" fill="none" stroke-width="3" /><rect x="105" y="15" width="60" height="60" rx="6" fill="none" stroke-width="3" /><polygon points="95,115 55,85 135,85" fill="none" stroke-width="3" /></svg>
    </div>
    <div class="label">stroke: child(5)</div>
  </div>
</div>
</body>
</html>
