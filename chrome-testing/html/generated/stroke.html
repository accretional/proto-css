<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>stroke</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
  svg { width: 190px; height: 110px; }
</style>
</head>
<body>
<h1>Stroke</h1>
<p class="prop-name">stroke</p>
<div class="demos">
  <div class="demo-box" data-css-prop="stroke" data-value="none">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 18px; display: flex; justify-content: center;">
      <svg style="display: block; stroke: none;"><circle cx="55" cy="50" r="30" fill="#0f3460" stroke-width="4" /><rect x="100" y="20" width="60" height="60" rx="6" fill="#0f3460" stroke-width="4" /><line x1="20" y1="95" x2="170" y2="95" stroke-width="4" /></svg>
    </div>
    <div class="label">stroke: none</div>
  </div>
  <div class="demo-box" data-css-prop="stroke" data-value="linear-gradient(red, blue)">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 18px; display: flex; justify-content: center;">
      <svg style="display: block; stroke: linear-gradient(red, blue);"><circle cx="55" cy="50" r="30" fill="#0f3460" stroke-width="4" /><rect x="100" y="20" width="60" height="60" rx="6" fill="#0f3460" stroke-width="4" /><line x1="20" y1="95" x2="170" y2="95" stroke-width="4" /></svg>
    </div>
    <div class="label">stroke: linear-gradient(red, blue)</div>
  </div>
  <div class="demo-box" data-css-prop="stroke" data-value="red">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 18px; display: flex; justify-content: center;">
      <svg style="display: block; stroke: red;"><circle cx="55" cy="50" r="30" fill="#0f3460" stroke-width="4" /><rect x="100" y="20" width="60" height="60" rx="6" fill="#0f3460" stroke-width="4" /><line x1="20" y1="95" x2="170" y2="95" stroke-width="4" /></svg>
    </div>
    <div class="label">stroke: red</div>
  </div>
  <div class="demo-box" data-css-prop="stroke" data-value="url(statue.svg)">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 18px; display: flex; justify-content: center;">
      <svg style="display: block; stroke: url(statue.svg);"><circle cx="55" cy="50" r="30" fill="#0f3460" stroke-width="4" /><rect x="100" y="20" width="60" height="60" rx="6" fill="#0f3460" stroke-width="4" /><line x1="20" y1="95" x2="170" y2="95" stroke-width="4" /></svg>
    </div>
    <div class="label">stroke: url(statue.svg)</div>
  </div>
  <div class="demo-box" data-css-prop="stroke" data-value="#3498db">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 18px; display: flex; justify-content: center;">
      <svg style="display: block; stroke: #3498db;"><circle cx="55" cy="50" r="30" fill="#0f3460" stroke-width="4" /><rect x="100" y="20" width="60" height="60" rx="6" fill="#0f3460" stroke-width="4" /><line x1="20" y1="95" x2="170" y2="95" stroke-width="4" /></svg>
    </div>
    <div class="label">stroke: #3498db</div>
  </div>
</div>
<div id="control-bar"></div>
<script src="../interactive.js"></script>
</body>
</html>
