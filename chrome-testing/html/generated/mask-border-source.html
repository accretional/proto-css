<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>mask-border-source</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
</style>
</head>
<body>
<h1>Mask Border Source</h1>
<p class="prop-name">mask-border-source</p>
<div class="demos">
  <div class="demo-box" data-css-prop="mask-border-source" data-value="none">
    <div class="demo-area">
      <div style="width: 100%; height: 120px; background: linear-gradient(135deg, #e94560, #a855f7, #00d2ff); border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 13px; font-family: monospace; mask-border-slice: 30; mask-border-width: 20px; mask-border-source: none;">content</div>
    </div>
    <div class="label">mask-border-source: none</div>
  </div>
  <div class="demo-box" data-css-prop="mask-border-source" data-value="linear-gradient(red, blue)">
    <div class="demo-area">
      <div style="width: 100%; height: 120px; background: linear-gradient(135deg, #e94560, #a855f7, #00d2ff); border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 13px; font-family: monospace; mask-border-slice: 30; mask-border-width: 20px; mask-border-source: linear-gradient(red, blue);">content</div>
    </div>
    <div class="label">mask-border-source: linear-gradient(red, blue)</div>
  </div>
  <div class="demo-box" data-css-prop="mask-border-source" data-value="url(statue.svg)">
    <div class="demo-area">
      <div style="width: 100%; height: 120px; background: linear-gradient(135deg, #e94560, #a855f7, #00d2ff); border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 13px; font-family: monospace; mask-border-slice: 30; mask-border-width: 20px; mask-border-source: url(statue.svg);">content</div>
    </div>
    <div class="label">mask-border-source: url(statue.svg)</div>
  </div>
</div>
<div id="control-bar"></div>
<script src="../interactive.js"></script>
</body>
</html>
