<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>mask-border-source</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
</style>
</head>
<body>
<h1>Mask Border Source</h1>
<p class="prop-name">mask-border-source</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area">
      <div style="width: 100%; height: 120px; background: linear-gradient(135deg, #e94560, #a855f7, #00d2ff); border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 13px; font-family: monospace; border: 20px solid #4a5568; mask-border-source: none;">content</div>
    </div>
    <div class="label">mask-border-source: none</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="width: 100%; height: 120px; background: linear-gradient(135deg, #e94560, #a855f7, #00d2ff); border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 13px; font-family: monospace; border: 20px solid #4a5568; mask-border-source: linear-gradient(red, blue);">content</div>
    </div>
    <div class="label">mask-border-source: linear-gradient(red, blue)</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="width: 100%; height: 120px; background: linear-gradient(135deg, #e94560, #a855f7, #00d2ff); border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 13px; font-family: monospace; border: 20px solid #4a5568; mask-border-source: url(statue.svg);">content</div>
    </div>
    <div class="label">mask-border-source: url(statue.svg)</div>
  </div>
</div>
</body>
</html>
