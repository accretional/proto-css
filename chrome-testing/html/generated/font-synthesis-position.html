<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>font-synthesis-position</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
</style>
</head>
<body>
<h1>Font Synthesis Position</h1>
<p class="prop-name">font-synthesis-position</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area">
      <div style="font-size: 32px; line-height: 1.6; font-synthesis-position: auto;">H<sub>2</sub>O CO<sub>2</sub> E=mc<sup>2</sup></div>
    </div>
    <div class="label">font-synthesis-position: auto</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="font-size: 32px; line-height: 1.6; font-synthesis-position: none;">H<sub>2</sub>O CO<sub>2</sub> E=mc<sup>2</sup></div>
    </div>
    <div class="label">font-synthesis-position: none</div>
  </div>
</div>
</body>
</html>
