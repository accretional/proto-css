<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>color-interpolation</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
</style>
</head>
<body>
<h1>Color Interpolation</h1>
<p class="prop-name">color-interpolation</p>
<div class="demos">
  <div class="demo-box" data-css-prop="color-interpolation" data-value="auto">
    <div class="demo-area">
      <svg style="width: 500px; height: 80px; color-interpolation: auto;"><defs><linearGradient id="demo-grad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#ff0000"/><stop offset="50%" stop-color="#00ff00"/><stop offset="100%" stop-color="#0000ff"/></linearGradient></defs><rect x="0" y="0" width="500" height="80" rx="10" fill="url(#demo-grad)"/></svg>
    </div>
    <div class="label">color-interpolation: auto</div>
  </div>
  <div class="demo-box" data-css-prop="color-interpolation" data-value="srgb">
    <div class="demo-area">
      <svg style="width: 500px; height: 80px; color-interpolation: srgb;"><defs><linearGradient id="demo-grad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#ff0000"/><stop offset="50%" stop-color="#00ff00"/><stop offset="100%" stop-color="#0000ff"/></linearGradient></defs><rect x="0" y="0" width="500" height="80" rx="10" fill="url(#demo-grad)"/></svg>
    </div>
    <div class="label">color-interpolation: srgb</div>
  </div>
  <div class="demo-box" data-css-prop="color-interpolation" data-value="linearRGB">
    <div class="demo-area">
      <svg style="width: 500px; height: 80px; color-interpolation: linearRGB;"><defs><linearGradient id="demo-grad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#ff0000"/><stop offset="50%" stop-color="#00ff00"/><stop offset="100%" stop-color="#0000ff"/></linearGradient></defs><rect x="0" y="0" width="500" height="80" rx="10" fill="url(#demo-grad)"/></svg>
    </div>
    <div class="label">color-interpolation: linearRGB</div>
  </div>
</div>
<div id="control-bar"></div>
<script src="../interactive.js"></script>
</body>
</html>
