<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>animation-name</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  @keyframes slide {
  0% { transform: translateX(0); }
  50% { transform: translateX(40px); }
  100% { transform: translateX(0); }
}
@keyframes fade {
  0% { opacity: 1; }
  50% { opacity: 0.2; }
  100% { opacity: 1; }
}
@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-30px); }
}
</style>
</head>
<body>
<h1>Animation Name</h1>
<p class="prop-name">animation-name</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area">
      <div style="width: 80px; height: 80px; background: #e94560; border-radius: 8px; animation-delay: -0.5s; animation-name: none;"></div>
    </div>
    <div class="label">animation-name: none</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="width: 80px; height: 80px; background: #e94560; border-radius: 8px; animation-delay: -0.5s; animation-name: my-animation;"></div>
    </div>
    <div class="label">animation-name: my-animation</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="width: 80px; height: 80px; background: #e94560; border-radius: 8px; animation-delay: -0.5s; animation-name: none, none;"></div>
    </div>
    <div class="label">animation-name: none, none</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="width: 80px; height: 80px; background: #e94560; border-radius: 8px; animation-delay: -0.5s; animation-name: my-animation, none;"></div>
    </div>
    <div class="label">animation-name: my-animation, none</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="width: 80px; height: 80px; background: #e94560; border-radius: 8px; animation-delay: -0.5s; animation-name: none, my-animation;"></div>
    </div>
    <div class="label">animation-name: none, my-animation</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="width: 80px; height: 80px; background: #e94560; border-radius: 8px; animation-delay: -0.5s; animation-name: my-animation, my-animation;"></div>
    </div>
    <div class="label">animation-name: my-animation, my-animation</div>
  </div>
</div>
</body>
</html>
