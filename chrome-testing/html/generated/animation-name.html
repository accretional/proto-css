<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>animation-name</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  @keyframes slide {
  0% { transform: translateX(-100px); background: #e94560; }
  50% { transform: translateX(100px); background: #3498db; }
  100% { transform: translateX(-100px); background: #e94560; }
}
@keyframes fade {
  0% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.1; transform: scale(0.3); }
  100% { opacity: 1; transform: scale(1); }
}
@keyframes spin {
  0% { transform: rotate(0deg) scale(1); border-radius: 8px; }
  50% { transform: rotate(180deg) scale(1.8); border-radius: 50%; }
  100% { transform: rotate(360deg) scale(1); border-radius: 8px; }
}
@keyframes bounce {
  0%, 100% { transform: translateY(0); background: #e94560; border-radius: 8px; }
  25% { transform: translateY(-80px); background: #f39c12; border-radius: 50%; }
  50% { transform: translateY(0); background: #2ecc71; border-radius: 0; }
  75% { transform: translateY(-40px); background: #a855f7; border-radius: 50%; }
}
</style>
</head>
<body>
<h1>Animation Name</h1>
<p class="prop-name">animation-name</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area" style="display: flex; align-items: center; justify-content: center; min-height: 140px; position: relative;">
      <div style="width: 80px; height: 80px; background: #e94560; border-radius: 8px; animation-duration: 2s; animation-timing-function: linear; animation-iteration-count: infinite; animation-delay: -0.7s; animation-name: none;"></div>
    </div>
    <div class="label">animation-name: none</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="display: flex; align-items: center; justify-content: center; min-height: 140px; position: relative;">
      <div style="width: 80px; height: 80px; background: #e94560; border-radius: 8px; animation-duration: 2s; animation-timing-function: linear; animation-iteration-count: infinite; animation-delay: -0.7s; animation-name: slide;"></div>
    </div>
    <div class="label">animation-name: slide</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="display: flex; align-items: center; justify-content: center; min-height: 140px; position: relative;">
      <div style="width: 80px; height: 80px; background: #e94560; border-radius: 8px; animation-duration: 2s; animation-timing-function: linear; animation-iteration-count: infinite; animation-delay: -0.7s; animation-name: bounce;"></div>
    </div>
    <div class="label">animation-name: bounce</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="display: flex; align-items: center; justify-content: center; min-height: 140px; position: relative;">
      <div style="width: 80px; height: 80px; background: #e94560; border-radius: 8px; animation-duration: 2s; animation-timing-function: linear; animation-iteration-count: infinite; animation-delay: -0.7s; animation-name: none, none;"></div>
    </div>
    <div class="label">animation-name: none, none</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="display: flex; align-items: center; justify-content: center; min-height: 140px; position: relative;">
      <div style="width: 80px; height: 80px; background: #e94560; border-radius: 8px; animation-duration: 2s; animation-timing-function: linear; animation-iteration-count: infinite; animation-delay: -0.7s; animation-name: slide, none;"></div>
    </div>
    <div class="label">animation-name: slide, none</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="display: flex; align-items: center; justify-content: center; min-height: 140px; position: relative;">
      <div style="width: 80px; height: 80px; background: #e94560; border-radius: 8px; animation-duration: 2s; animation-timing-function: linear; animation-iteration-count: infinite; animation-delay: -0.7s; animation-name: bounce, none;"></div>
    </div>
    <div class="label">animation-name: bounce, none</div>
  </div>
</div>
</body>
</html>
