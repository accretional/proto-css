<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>inset-inline-end</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
  .end-edge { position: absolute; top: 0; bottom: 0; right: 0; width: 2px; background: #f5c542; }
</style>
</head>
<body>
<div id="control-bar"></div>
<h1>Inset Inline End</h1>
<p class="prop-name">inset-inline-end</p>
<div class="demos">
  <div class="demo-box" data-css-prop="inset-inline-end" data-value="auto">
    <div class="demo-area" style="width: 650px; height: 56px; background: #16213e; border-radius: 8px; position: relative; border: 1px dashed #3a3a5e;">
      <div class="end-edge"></div>
      <div style="position: absolute; top: 8px; bottom: 8px; width: 120px; background: linear-gradient(90deg, rgba(233,69,96,0.8), rgba(15,52,96,0.8)); border: 2px solid #e94560; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-family: monospace; color: #fff; inset-inline-end: auto;"></div>
    </div>
    <div class="label">inset-inline-end: auto</div>
  </div>
  <div class="demo-box" data-css-prop="inset-inline-end" data-value="10px">
    <div class="demo-area" style="width: 650px; height: 56px; background: #16213e; border-radius: 8px; position: relative; border: 1px dashed #3a3a5e;">
      <div class="end-edge"></div>
      <div style="position: absolute; top: 8px; bottom: 8px; width: 120px; background: linear-gradient(90deg, rgba(233,69,96,0.8), rgba(15,52,96,0.8)); border: 2px solid #e94560; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-family: monospace; color: #fff; inset-inline-end: 10px;"></div>
    </div>
    <div class="label">inset-inline-end: 10px</div>
  </div>
  <div class="demo-box" data-css-prop="inset-inline-end" data-value="25%">
    <div class="demo-area" style="width: 650px; height: 56px; background: #16213e; border-radius: 8px; position: relative; border: 1px dashed #3a3a5e;">
      <div class="end-edge"></div>
      <div style="position: absolute; top: 8px; bottom: 8px; width: 120px; background: linear-gradient(90deg, rgba(233,69,96,0.8), rgba(15,52,96,0.8)); border: 2px solid #e94560; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-family: monospace; color: #fff; inset-inline-end: 25%;"></div>
    </div>
    <div class="label">inset-inline-end: 25%</div>
  </div>
  <div class="demo-box" data-css-prop="inset-inline-end" data-value="50%">
    <div class="demo-area" style="width: 650px; height: 56px; background: #16213e; border-radius: 8px; position: relative; border: 1px dashed #3a3a5e;">
      <div class="end-edge"></div>
      <div style="position: absolute; top: 8px; bottom: 8px; width: 120px; background: linear-gradient(90deg, rgba(233,69,96,0.8), rgba(15,52,96,0.8)); border: 2px solid #e94560; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-family: monospace; color: #fff; inset-inline-end: 50%;"></div>
    </div>
    <div class="label">inset-inline-end: 50%</div>
  </div>
  <div class="demo-box" data-css-prop="inset-inline-end" data-value="100%">
    <div class="demo-area" style="width: 650px; height: 56px; background: #16213e; border-radius: 8px; position: relative; border: 1px dashed #3a3a5e;">
      <div class="end-edge"></div>
      <div style="position: absolute; top: 8px; bottom: 8px; width: 120px; background: linear-gradient(90deg, rgba(233,69,96,0.8), rgba(15,52,96,0.8)); border: 2px solid #e94560; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-family: monospace; color: #fff; inset-inline-end: 100%;"></div>
    </div>
    <div class="label">inset-inline-end: 100%</div>
  </div>
  <div class="demo-box" data-css-prop="inset-inline-end" data-value="0">
    <div class="demo-area" style="width: 650px; height: 56px; background: #16213e; border-radius: 8px; position: relative; border: 1px dashed #3a3a5e;">
      <div class="end-edge"></div>
      <div style="position: absolute; top: 8px; bottom: 8px; width: 120px; background: linear-gradient(90deg, rgba(233,69,96,0.8), rgba(15,52,96,0.8)); border: 2px solid #e94560; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-family: monospace; color: #fff; inset-inline-end: 0;"></div>
    </div>
    <div class="label">inset-inline-end: 0</div>
  </div>
</div>
<script src="../interactive.js"></script>
</body>
</html>
