<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>r</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
</style>
</head>
<body>
<h1>SVG Circle Radius</h1>
<p class="prop-name">r</p>
<div class="demos">
  <div class="demo-box" data-css-prop="r" data-value="10px" data-target-selector=" circle" data-target-id="t0">
    <div class="demo-area">
      <style>#t0  circle { r: 10px; }</style>
      <svg id="t0" style="width: 120px; height: 120px;"><circle cx="60" cy="60" r="50" fill="#e2b714" opacity="0.85"/></svg>
    </div>
    <div class="label">r: 10px</div>
  </div>
  <div class="demo-box" data-css-prop="r" data-value="25%" data-target-selector=" circle" data-target-id="t1">
    <div class="demo-area">
      <style>#t1  circle { r: 25%; }</style>
      <svg id="t1" style="width: 120px; height: 120px;"><circle cx="60" cy="60" r="50" fill="#e2b714" opacity="0.85"/></svg>
    </div>
    <div class="label">r: 25%</div>
  </div>
  <div class="demo-box" data-css-prop="r" data-value="50%" data-target-selector=" circle" data-target-id="t2">
    <div class="demo-area">
      <style>#t2  circle { r: 50%; }</style>
      <svg id="t2" style="width: 120px; height: 120px;"><circle cx="60" cy="60" r="50" fill="#e2b714" opacity="0.85"/></svg>
    </div>
    <div class="label">r: 50%</div>
  </div>
  <div class="demo-box" data-css-prop="r" data-value="100%" data-target-selector=" circle" data-target-id="t3">
    <div class="demo-area">
      <style>#t3  circle { r: 100%; }</style>
      <svg id="t3" style="width: 120px; height: 120px;"><circle cx="60" cy="60" r="50" fill="#e2b714" opacity="0.85"/></svg>
    </div>
    <div class="label">r: 100%</div>
  </div>
  <div class="demo-box" data-css-prop="r" data-value="0" data-target-selector=" circle" data-target-id="t4">
    <div class="demo-area">
      <style>#t4  circle { r: 0; }</style>
      <svg id="t4" style="width: 120px; height: 120px;"><circle cx="60" cy="60" r="50" fill="#e2b714" opacity="0.85"/></svg>
    </div>
    <div class="label">r: 0</div>
  </div>
</div>
<div id="control-bar"></div>
<script src="../interactive.js"></script>
</body>
</html>
