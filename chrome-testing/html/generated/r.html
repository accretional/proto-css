<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>r</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
</style>
</head>
<body>
<h1>SVG Circle Radius</h1>
<p class="prop-name">r</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area">
      <style>#t0  circle { r: 10px; }</style>
      <svg id="t0" style="width: 120px; height: 120px;"><circle cx="60" cy="60" r="50" fill="#e2b714" opacity="0.85"/></svg>
    </div>
    <div class="label">r: 10px</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <style>#t1  circle { r: 25%; }</style>
      <svg id="t1" style="width: 120px; height: 120px;"><circle cx="60" cy="60" r="50" fill="#e2b714" opacity="0.85"/></svg>
    </div>
    <div class="label">r: 25%</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <style>#t2  circle { r: 50%; }</style>
      <svg id="t2" style="width: 120px; height: 120px;"><circle cx="60" cy="60" r="50" fill="#e2b714" opacity="0.85"/></svg>
    </div>
    <div class="label">r: 50%</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <style>#t3  circle { r: 100%; }</style>
      <svg id="t3" style="width: 120px; height: 120px;"><circle cx="60" cy="60" r="50" fill="#e2b714" opacity="0.85"/></svg>
    </div>
    <div class="label">r: 100%</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <style>#t4  circle { r: 0; }</style>
      <svg id="t4" style="width: 120px; height: 120px;"><circle cx="60" cy="60" r="50" fill="#e2b714" opacity="0.85"/></svg>
    </div>
    <div class="label">r: 0</div>
  </div>
</div>
</body>
</html>
