<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>quotes</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
</style>
</head>
<body>
<h1>Quotes</h1>
<p class="prop-name">quotes</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 10px; padding: 24px; width: 280px; display: flex; flex-direction: column; align-items: center;">
      <style>#t0 q { quotes: auto; }</style>
      <div id="t0" style="font-size: 20px; color: #e2b714; line-height: 1.8;"><q>Hello World</q> and <q>Nested <q>quote</q></q></div>
    </div>
    <div class="label">quotes: auto</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 10px; padding: 24px; width: 280px; display: flex; flex-direction: column; align-items: center;">
      <style>#t1 q { quotes: none; }</style>
      <div id="t1" style="font-size: 20px; color: #e2b714; line-height: 1.8;"><q>Hello World</q> and <q>Nested <q>quote</q></q></div>
    </div>
    <div class="label">quotes: none</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 10px; padding: 24px; width: 280px; display: flex; flex-direction: column; align-items: center;">
      <style>#t2 q { quotes: match-parent; }</style>
      <div id="t2" style="font-size: 20px; color: #e2b714; line-height: 1.8;"><q>Hello World</q> and <q>Nested <q>quote</q></q></div>
    </div>
    <div class="label">quotes: match-parent</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 10px; padding: 24px; width: 280px; display: flex; flex-direction: column; align-items: center;">
      <style>#t3 q { quotes: "example" "example"; }</style>
      <div id="t3" style="font-size: 20px; color: #e2b714; line-height: 1.8;"><q>Hello World</q> and <q>Nested <q>quote</q></q></div>
    </div>
    <div class="label">quotes: &#34;example&#34; &#34;example&#34;</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 10px; padding: 24px; width: 280px; display: flex; flex-direction: column; align-items: center;">
      <style>#t4 q { quotes: "example" "example" "example" "example"; }</style>
      <div id="t4" style="font-size: 20px; color: #e2b714; line-height: 1.8;"><q>Hello World</q> and <q>Nested <q>quote</q></q></div>
    </div>
    <div class="label">quotes: &#34;example&#34; &#34;example&#34; &#34;example&#34; &#34;example&#34;</div>
  </div>
</div>
</body>
</html>
