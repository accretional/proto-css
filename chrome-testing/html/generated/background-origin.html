<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>background-origin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 32px; }
    .demo-item { display: flex; flex-direction: column; align-items: center; }
    .box {
      width: 260px;
      height: 200px;
      border: 16px dashed rgba(255, 107, 107, 0.6);
      padding: 24px;
      background-image: linear-gradient(135deg, #667eea, #764ba2);
      background-repeat: no-repeat;
      background-size: 100% 100%;
    }
    .inner {
      width: 100%;
      height: 100%;
      border: 1px dashed rgba(255,255,255,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: rgba(255,255,255,0.7);
    }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; text-align: center; }
    .b1 { background-origin: border-box, border-box ! important; }
    .b2 { background-origin: border-box, border-box; }
    .b3 { background-origin: content-box ! important; }
  </style>
</head>
<body>
  <h1>Background Origin</h1>
  <p class="prop-name">background-origin</p>
  <div class="demos">
    <div class="demo-item">
      <div class="box b1">
        <div class="inner">content area</div>
      </div>
      <div class="label">background-origin: border-box, border-box ! important</div>
    </div>
    <div class="demo-item">
      <div class="box b2">
        <div class="inner">content area</div>
      </div>
      <div class="label">background-origin: border-box, border-box</div>
    </div>
    <div class="demo-item">
      <div class="box b3">
        <div class="inner">content area</div>
      </div>
      <div class="label">background-origin: content-box ! important</div>
    </div>
  </div>
</body>
</html>
