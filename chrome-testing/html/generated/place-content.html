<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>place-content</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 28px; }
    .demo-card {
      background: #16213e;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 360px;
    }
    .grid-container {
      width: 300px;
      height: 200px;
      display: grid;
      grid-template-columns: 60px 60px 60px;
      grid-template-rows: 50px 50px;
      border: 2px dashed rgba(255,255,255,0.2);
      border-radius: 6px;
      position: relative;
    }
    .grid-item {
      background: linear-gradient(135deg, #e94560, #c23066);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
    }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 10px; text-align: center; }
  </style>
</head>
<body>
  <h1>Place Content</h1>
  <p class="prop-name">place-content</p>
  <div class="demos">

    <div class="demo-card">
      <div class="grid-container" style="place-content: normal ! important;">
        <div class="grid-item">1</div>
        <div class="grid-item">2</div>
        <div class="grid-item">3</div>
        <div class="grid-item">4</div>
        <div class="grid-item">5</div>
        <div class="grid-item">6</div>
      </div>
      <div class="label">place-content: normal ! important</div>
    </div>

    <div class="demo-card">
      <div class="grid-container" style="place-content: space-evenly ! important;">
        <div class="grid-item">1</div>
        <div class="grid-item">2</div>
        <div class="grid-item">3</div>
        <div class="grid-item">4</div>
        <div class="grid-item">5</div>
        <div class="grid-item">6</div>
      </div>
      <div class="label">place-content: space-evenly ! important</div>
    </div>

    <div class="demo-card">
      <div class="grid-container" style="place-content: unsafe start;">
        <div class="grid-item">1</div>
        <div class="grid-item">2</div>
        <div class="grid-item">3</div>
        <div class="grid-item">4</div>
        <div class="grid-item">5</div>
        <div class="grid-item">6</div>
      </div>
      <div class="label">place-content: unsafe start</div>
    </div>

  </div>
</body>
</html>
