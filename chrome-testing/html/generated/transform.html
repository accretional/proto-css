<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>transform</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
  .ghost { width: 70px; height: 70px; border: 2px dashed #394867; border-radius: 8px; position: absolute; }
</style>
</head>
<body>
<h1>Transform</h1>
<p class="prop-name">transform</p>
<div class="demos">
  <div class="demo-box" data-css-prop="transform" data-value="none">
    <div class="demo-area" style="width: 130px; height: 130px; display: flex; align-items: center; justify-content: center; position: relative;">
      <div class="ghost"></div>
      <div style="width: 70px; height: 70px; background: linear-gradient(135deg, #e94560, #0f3460); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; color: #fff; transform: none;">T</div>
    </div>
    <div class="label">transform: none</div>
  </div>
  <div class="demo-box" data-css-prop="transform" data-value="rotate(45deg)">
    <div class="demo-area" style="width: 130px; height: 130px; display: flex; align-items: center; justify-content: center; position: relative;">
      <div class="ghost"></div>
      <div style="width: 70px; height: 70px; background: linear-gradient(135deg, #e94560, #0f3460); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; color: #fff; transform: rotate(45deg);">T</div>
    </div>
    <div class="label">transform: rotate(45deg)</div>
  </div>
  <div class="demo-box" data-css-prop="transform" data-value="scale(2) translateX(10px)">
    <div class="demo-area" style="width: 130px; height: 130px; display: flex; align-items: center; justify-content: center; position: relative;">
      <div class="ghost"></div>
      <div style="width: 70px; height: 70px; background: linear-gradient(135deg, #e94560, #0f3460); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; color: #fff; transform: scale(2) translateX(10px);">T</div>
    </div>
    <div class="label">transform: scale(2) translateX(10px)</div>
  </div>
  <div class="demo-box" data-css-prop="transform" data-value="skewX(15deg) translateY(20px)">
    <div class="demo-area" style="width: 130px; height: 130px; display: flex; align-items: center; justify-content: center; position: relative;">
      <div class="ghost"></div>
      <div style="width: 70px; height: 70px; background: linear-gradient(135deg, #e94560, #0f3460); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; color: #fff; transform: skewX(15deg) translateY(20px);">T</div>
    </div>
    <div class="label">transform: skewX(15deg) translateY(20px)</div>
  </div>
  <div class="demo-box" data-css-prop="transform" data-value="rotate(30deg) scale(0.5) translateX(30px)">
    <div class="demo-area" style="width: 130px; height: 130px; display: flex; align-items: center; justify-content: center; position: relative;">
      <div class="ghost"></div>
      <div style="width: 70px; height: 70px; background: linear-gradient(135deg, #e94560, #0f3460); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; color: #fff; transform: rotate(30deg) scale(0.5) translateX(30px);">T</div>
    </div>
    <div class="label">transform: rotate(30deg) scale(0.5) translateX(30px)</div>
  </div>
</div>
<div id="control-bar"></div>
<script src="../interactive.js"></script>
</body>
</html>
