<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>transform</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .ghost { width: 70px; height: 70px; border: 2px dashed #394867; border-radius: 8px; position: absolute; }
</style>
</head>
<body>
<h1>Transform</h1>
<p class="prop-name">transform</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area" style="width: 130px; height: 130px; display: flex; align-items: center; justify-content: center; position: relative;">
      <div class="ghost"></div>
      <div style="width: 70px; height: 70px; background: linear-gradient(135deg, #e94560, #0f3460); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; color: #fff; transform: none;">T</div>
    </div>
    <div class="label">transform: none</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="width: 130px; height: 130px; display: flex; align-items: center; justify-content: center; position: relative;">
      <div class="ghost"></div>
      <div style="width: 70px; height: 70px; background: linear-gradient(135deg, #e94560, #0f3460); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; color: #fff; transform: rotate(45deg);">T</div>
    </div>
    <div class="label">transform: rotate(45deg)</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="width: 130px; height: 130px; display: flex; align-items: center; justify-content: center; position: relative;">
      <div class="ghost"></div>
      <div style="width: 70px; height: 70px; background: linear-gradient(135deg, #e94560, #0f3460); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; color: #fff; transform: scale(2) translateX(10px);">T</div>
    </div>
    <div class="label">transform: scale(2) translateX(10px)</div>
  </div>
</div>
</body>
</html>
