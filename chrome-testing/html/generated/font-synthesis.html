<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>font-synthesis</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .synth-label { font-size: 10px; color: #6b7280; font-family: monospace; }
</style>
</head>
<body>
<h1>Font Synthesis</h1>
<p class="prop-name">font-synthesis</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area">
      <div style="font-size: 20px; line-height: 1.5; font-weight: bold; font-synthesis: none;"><b>Bold</b> <i>Italic</i> <span style="font-variant:small-caps">Small</span></div>
    </div>
    <div class="label">font-synthesis: none</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="font-size: 20px; line-height: 1.5; font-weight: bold; font-synthesis: weight;"><b>Bold</b> <i>Italic</i> <span style="font-variant:small-caps">Small</span></div>
    </div>
    <div class="label">font-synthesis: weight</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="font-size: 20px; line-height: 1.5; font-weight: bold; font-synthesis: style;"><b>Bold</b> <i>Italic</i> <span style="font-variant:small-caps">Small</span></div>
    </div>
    <div class="label">font-synthesis: style</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="font-size: 20px; line-height: 1.5; font-weight: bold; font-synthesis: small-caps;"><b>Bold</b> <i>Italic</i> <span style="font-variant:small-caps">Small</span></div>
    </div>
    <div class="label">font-synthesis: small-caps</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="font-size: 20px; line-height: 1.5; font-weight: bold; font-synthesis: position;"><b>Bold</b> <i>Italic</i> <span style="font-variant:small-caps">Small</span></div>
    </div>
    <div class="label">font-synthesis: position</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="font-size: 20px; line-height: 1.5; font-weight: bold; font-synthesis: weight style;"><b>Bold</b> <i>Italic</i> <span style="font-variant:small-caps">Small</span></div>
    </div>
    <div class="label">font-synthesis: weight style</div>
  </div>
</div>
</body>
</html>
