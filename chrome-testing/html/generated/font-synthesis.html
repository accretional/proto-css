<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>font-synthesis</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fira+Code');
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
  .synth-label { font-size: 10px; color: #6b7280; font-family: monospace; }
</style>
</head>
<body>
<div id="control-bar"></div>
<h1>Font Synthesis</h1>
<p class="prop-name">font-synthesis</p>
<div class="demos">
  <div class="demo-box" data-css-prop="font-synthesis" data-value="none">
    <div class="demo-area">
      <div style="font-family: &#39;Fira Code&#39;, monospace; font-size: 20px; line-height: 1.5; font-weight: bold; font-synthesis: none;"><b>Bold</b> <i>Italic</i> <span style="font-variant:small-caps">Small</span></div>
    </div>
    <div class="label">font-synthesis: none</div>
  </div>
  <div class="demo-box" data-css-prop="font-synthesis" data-value="weight">
    <div class="demo-area">
      <div style="font-family: &#39;Fira Code&#39;, monospace; font-size: 20px; line-height: 1.5; font-weight: bold; font-synthesis: weight;"><b>Bold</b> <i>Italic</i> <span style="font-variant:small-caps">Small</span></div>
    </div>
    <div class="label">font-synthesis: weight</div>
  </div>
  <div class="demo-box" data-css-prop="font-synthesis" data-value="style">
    <div class="demo-area">
      <div style="font-family: &#39;Fira Code&#39;, monospace; font-size: 20px; line-height: 1.5; font-weight: bold; font-synthesis: style;"><b>Bold</b> <i>Italic</i> <span style="font-variant:small-caps">Small</span></div>
    </div>
    <div class="label">font-synthesis: style</div>
  </div>
  <div class="demo-box" data-css-prop="font-synthesis" data-value="small-caps">
    <div class="demo-area">
      <div style="font-family: &#39;Fira Code&#39;, monospace; font-size: 20px; line-height: 1.5; font-weight: bold; font-synthesis: small-caps;"><b>Bold</b> <i>Italic</i> <span style="font-variant:small-caps">Small</span></div>
    </div>
    <div class="label">font-synthesis: small-caps</div>
  </div>
  <div class="demo-box" data-css-prop="font-synthesis" data-value="position">
    <div class="demo-area">
      <div style="font-family: &#39;Fira Code&#39;, monospace; font-size: 20px; line-height: 1.5; font-weight: bold; font-synthesis: position;"><b>Bold</b> <i>Italic</i> <span style="font-variant:small-caps">Small</span></div>
    </div>
    <div class="label">font-synthesis: position</div>
  </div>
  <div class="demo-box" data-css-prop="font-synthesis" data-value="weight style">
    <div class="demo-area">
      <div style="font-family: &#39;Fira Code&#39;, monospace; font-size: 20px; line-height: 1.5; font-weight: bold; font-synthesis: weight style;"><b>Bold</b> <i>Italic</i> <span style="font-variant:small-caps">Small</span></div>
    </div>
    <div class="label">font-synthesis: weight style</div>
  </div>
</div>
<script src="../interactive.js"></script>
</body>
</html>
