<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>cy</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
</style>
</head>
<body>
<h1>SVG Circle cy</h1>
<p class="prop-name">cy</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 8px; padding: 14px 18px;">
      <svg style="width: 200px; height: 200px; cy: 10px;"><rect x="0" y="0" width="200" height="200" fill="none" stroke="#0f3460" stroke-width="1" rx="4"/><line x1="0" y1="100" x2="200" y2="100" stroke="#0f3460" stroke-width="1" stroke-dasharray="4"/><line x1="100" y1="0" x2="100" y2="200" stroke="#0f3460" stroke-width="1" stroke-dasharray="4"/><circle cx="100" cy="100" r="20" fill="#e9456044" stroke="#e94560" stroke-width="2"/><text x="100" y="105" text-anchor="middle" font-size="9" fill="#fff" font-family="monospace">100</text></svg>
    </div>
    <div class="label">cy: 10px</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 8px; padding: 14px 18px;">
      <svg style="width: 200px; height: 200px; cy: 25%;"><rect x="0" y="0" width="200" height="200" fill="none" stroke="#0f3460" stroke-width="1" rx="4"/><line x1="0" y1="100" x2="200" y2="100" stroke="#0f3460" stroke-width="1" stroke-dasharray="4"/><line x1="100" y1="0" x2="100" y2="200" stroke="#0f3460" stroke-width="1" stroke-dasharray="4"/><circle cx="100" cy="100" r="20" fill="#e9456044" stroke="#e94560" stroke-width="2"/><text x="100" y="105" text-anchor="middle" font-size="9" fill="#fff" font-family="monospace">100</text></svg>
    </div>
    <div class="label">cy: 25%</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 8px; padding: 14px 18px;">
      <svg style="width: 200px; height: 200px; cy: 50%;"><rect x="0" y="0" width="200" height="200" fill="none" stroke="#0f3460" stroke-width="1" rx="4"/><line x1="0" y1="100" x2="200" y2="100" stroke="#0f3460" stroke-width="1" stroke-dasharray="4"/><line x1="100" y1="0" x2="100" y2="200" stroke="#0f3460" stroke-width="1" stroke-dasharray="4"/><circle cx="100" cy="100" r="20" fill="#e9456044" stroke="#e94560" stroke-width="2"/><text x="100" y="105" text-anchor="middle" font-size="9" fill="#fff" font-family="monospace">100</text></svg>
    </div>
    <div class="label">cy: 50%</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 8px; padding: 14px 18px;">
      <svg style="width: 200px; height: 200px; cy: 100%;"><rect x="0" y="0" width="200" height="200" fill="none" stroke="#0f3460" stroke-width="1" rx="4"/><line x1="0" y1="100" x2="200" y2="100" stroke="#0f3460" stroke-width="1" stroke-dasharray="4"/><line x1="100" y1="0" x2="100" y2="200" stroke="#0f3460" stroke-width="1" stroke-dasharray="4"/><circle cx="100" cy="100" r="20" fill="#e9456044" stroke="#e94560" stroke-width="2"/><text x="100" y="105" text-anchor="middle" font-size="9" fill="#fff" font-family="monospace">100</text></svg>
    </div>
    <div class="label">cy: 100%</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 8px; padding: 14px 18px;">
      <svg style="width: 200px; height: 200px; cy: 0;"><rect x="0" y="0" width="200" height="200" fill="none" stroke="#0f3460" stroke-width="1" rx="4"/><line x1="0" y1="100" x2="200" y2="100" stroke="#0f3460" stroke-width="1" stroke-dasharray="4"/><line x1="100" y1="0" x2="100" y2="200" stroke="#0f3460" stroke-width="1" stroke-dasharray="4"/><circle cx="100" cy="100" r="20" fill="#e9456044" stroke="#e94560" stroke-width="2"/><text x="100" y="105" text-anchor="middle" font-size="9" fill="#fff" font-family="monospace">100</text></svg>
    </div>
    <div class="label">cy: 0</div>
  </div>
</div>
</body>
</html>
