<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>marker-start</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 24px; }
    .demo-card { background: #16213e; border-radius: 10px; padding: 20px; width: 380px; }
    .demo-card h3 { font-size: 13px; color: #e2e8f0; margin-bottom: 12px; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>Marker Start</h1>
  <p class="prop-name">marker-start</p>
  <div class="demos">

    <div class="demo-card">
      <h3>Arrow Start</h3>
      <svg width="340" height="80" viewBox="0 0 340 80">
        <defs>
          <marker id="startArrow" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#e94560"/>
          </marker>
        </defs>
        <path d="M 30,40 C 100,10 240,70 320,40" fill="none" stroke="#e94560" stroke-width="2.5" marker-start="url(#startArrow)"/>
      </svg>
      <p class="label">marker-start: url('俢') ! important</p>
    </div>

    <div class="demo-card">
      <h3>Circle Start</h3>
      <svg width="340" height="80" viewBox="0 0 340 80">
        <defs>
          <marker id="startCircle" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="10" markerHeight="10">
            <circle cx="5" cy="5" r="4" fill="#00d2ff" stroke="#0a1628" stroke-width="1"/>
          </marker>
        </defs>
        <path d="M 30,50 Q 170,5 320,50" fill="none" stroke="#00d2ff" stroke-width="2.5" marker-start="url(#startCircle)"/>
      </svg>
      <p class="label">marker-start: revert-rule ! important</p>
    </div>

    <div class="demo-card">
      <h3>Square Start</h3>
      <svg width="340" height="80" viewBox="0 0 340 80">
        <defs>
          <marker id="startSquare" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8">
            <rect x="1" y="1" width="8" height="8" fill="#a855f7" rx="1"/>
          </marker>
        </defs>
        <path d="M 30,40 L 120,20 L 220,60 L 320,35" fill="none" stroke="#a855f7" stroke-width="2.5" marker-start="url(#startSquare)"/>
      </svg>
      <p class="label">marker-start: url('󇍼')</p>
    </div>

    <div class="demo-card">
      <h3>Diamond Start</h3>
      <svg width="340" height="80" viewBox="0 0 340 80">
        <defs>
          <marker id="startDiamond" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="10" markerHeight="10">
            <polygon points="5,0 10,5 5,10 0,5" fill="#f9a825"/>
          </marker>
        </defs>
        <path d="M 30,60 C 130,10 230,70 320,30" fill="none" stroke="#f9a825" stroke-width="2.5" marker-start="url(#startDiamond)"/>
      </svg>
      <p class="label">marker-start: revert-rule</p>
    </div>

    <div class="demo-card">
      <h3>Star Start</h3>
      <svg width="340" height="80" viewBox="0 0 340 80">
        <defs>
          <marker id="startStar" viewBox="0 0 12 12" refX="6" refY="6" markerWidth="10" markerHeight="10">
            <polygon points="6,0 7.5,4.5 12,4.5 8.5,7.5 9.5,12 6,9 2.5,12 3.5,7.5 0,4.5 4.5,4.5" fill="#4ade80"/>
          </marker>
        </defs>
        <path d="M 30,40 Q 170,5 320,40" fill="none" stroke="#4ade80" stroke-width="2.5" marker-start="url(#startStar)"/>
      </svg>
      <p class="label">marker-start: url("") ! important</p>
    </div>

    <div class="demo-card">
      <h3>None</h3>
      <svg width="340" height="80" viewBox="0 0 340 80">
        <path d="M 20,40 C 100,10 240,70 320,40" fill="none" stroke="#6b7280" stroke-width="2.5"/>
      </svg>
      <p class="label">marker-start: revert-rule</p>
    </div>

  </div>
</body>
</html>
