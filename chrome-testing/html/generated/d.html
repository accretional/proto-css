<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>d</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
</style>
</head>
<body>
<h1>SVG Path Data</h1>
<p class="prop-name">d</p>
<div class="demos">
  <div class="demo-box" data-css-prop="d" data-value="path(&#39;M 20 140 C 50 20, 90 20, 120 140 S 160 60, 160 140&#39;)">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; align-items: center; min-width: 200px;">
      <svg width="180" height="180" viewBox="0 0 180 180">
      <path style="fill: #e94560; stroke: #fff; stroke-width: 2; d: path(&#39;M 20 140 C 50 20, 90 20, 120 140 S 160 60, 160 140&#39;);"></path>
      </svg>
    </div>
    <div class="label">d: path(&#39;M 20 140 C 50 20, 90 20, 120 140 S 160 60, 160 140&#39;)</div>
  </div>
  <div class="demo-box" data-css-prop="d" data-value="path(&#39;M 90 10 L 160 160 L 20 160 Z&#39;)">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; align-items: center; min-width: 200px;">
      <svg width="180" height="180" viewBox="0 0 180 180">
      <path style="fill: #e94560; stroke: #fff; stroke-width: 2; d: path(&#39;M 90 10 L 160 160 L 20 160 Z&#39;);"></path>
      </svg>
    </div>
    <div class="label">d: path(&#39;M 90 10 L 160 160 L 20 160 Z&#39;)</div>
  </div>
  <div class="demo-box" data-css-prop="d" data-value="path(&#39;M 90 20 A 70 70 0 1 1 90 160 A 70 70 0 1 1 90 20&#39;)">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; align-items: center; min-width: 200px;">
      <svg width="180" height="180" viewBox="0 0 180 180">
      <path style="fill: #e94560; stroke: #fff; stroke-width: 2; d: path(&#39;M 90 20 A 70 70 0 1 1 90 160 A 70 70 0 1 1 90 20&#39;);"></path>
      </svg>
    </div>
    <div class="label">d: path(&#39;M 90 20 A 70 70 0 1 1 90 160 A 70 70 0 1 1 90 20&#39;)</div>
  </div>
  <div class="demo-box" data-css-prop="d" data-value="none">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; align-items: center; min-width: 200px;">
      <svg width="180" height="180" viewBox="0 0 180 180">
      <path style="fill: #e94560; stroke: #fff; stroke-width: 2; d: none;"></path>
      </svg>
    </div>
    <div class="label">d: none</div>
  </div>
</div>
<div id="control-bar"></div>
<script src="../interactive.js"></script>
</body>
</html>
