<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>d</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
</style>
</head>
<body>
<h1>SVG Path Data</h1>
<p class="prop-name">d</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; align-items: center; min-width: 200px;">
      <svg style="width: 120px; height: 120px; d: none;"><path d="M60,10 A50,50 0 1,1 59.99,10 Z" fill="#e94560"/></svg>
    </div>
    <div class="label">d: none</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; align-items: center; min-width: 200px;">
      <svg style="width: 120px; height: 120px; d: &#34;example&#34;;"><path d="M60,10 A50,50 0 1,1 59.99,10 Z" fill="#e94560"/></svg>
    </div>
    <div class="label">d: &#34;example&#34;</div>
  </div>
</div>
</body>
</html>
