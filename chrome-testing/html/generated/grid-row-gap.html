<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>grid-row-gap</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
  .cell { background: #0f3460; border-radius: 4px; height: 36px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #e94560; font-weight: 600; }
</style>
</head>
<body>
<h1>Grid Row Gap</h1>
<p class="prop-name">grid-row-gap</p>
<div class="demos">
  <div class="demo-box" data-css-prop="grid-row-gap" data-value="10px">
    <div class="demo-area">
      <div style="display: grid; grid-template-columns: repeat(3, 1fr); width: 100%; grid-row-gap: 10px;"><div class="cell">1</div><div class="cell">2</div><div class="cell">3</div><div class="cell">4</div><div class="cell">5</div><div class="cell">6</div></div>
    </div>
    <div class="label">grid-row-gap: 10px</div>
  </div>
  <div class="demo-box" data-css-prop="grid-row-gap" data-value="20px">
    <div class="demo-area">
      <div style="display: grid; grid-template-columns: repeat(3, 1fr); width: 100%; grid-row-gap: 20px;"><div class="cell">1</div><div class="cell">2</div><div class="cell">3</div><div class="cell">4</div><div class="cell">5</div><div class="cell">6</div></div>
    </div>
    <div class="label">grid-row-gap: 20px</div>
  </div>
  <div class="demo-box" data-css-prop="grid-row-gap" data-value="normal">
    <div class="demo-area">
      <div style="display: grid; grid-template-columns: repeat(3, 1fr); width: 100%; grid-row-gap: normal;"><div class="cell">1</div><div class="cell">2</div><div class="cell">3</div><div class="cell">4</div><div class="cell">5</div><div class="cell">6</div></div>
    </div>
    <div class="label">grid-row-gap: normal</div>
  </div>
  <div class="demo-box" data-css-prop="grid-row-gap" data-value="10px 20px">
    <div class="demo-area">
      <div style="display: grid; grid-template-columns: repeat(3, 1fr); width: 100%; grid-row-gap: 10px 20px;"><div class="cell">1</div><div class="cell">2</div><div class="cell">3</div><div class="cell">4</div><div class="cell">5</div><div class="cell">6</div></div>
    </div>
    <div class="label">grid-row-gap: 10px 20px</div>
  </div>
</div>
<div id="control-bar"></div>
<script src="../interactive.js"></script>
</body>
</html>
