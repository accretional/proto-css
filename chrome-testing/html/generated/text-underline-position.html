<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>text-underline-position</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
</style>
</head>
<body>
<div id="control-bar"></div>
<h1>Text Underline Position</h1>
<p class="prop-name">text-underline-position</p>
<div class="demos">
  <div class="demo-box" data-css-prop="text-underline-position" data-value="auto">
    <div class="demo-area">
      <span style="font-size: 28px; font-weight: 600; color: #fff; text-decoration: underline; text-decoration-color: #e94560; text-decoration-thickness: 3px; text-underline-position: auto;">Typography</span>
    </div>
    <div class="label">text-underline-position: auto</div>
  </div>
  <div class="demo-box" data-css-prop="text-underline-position" data-value="from-font">
    <div class="demo-area">
      <span style="font-size: 28px; font-weight: 600; color: #fff; text-decoration: underline; text-decoration-color: #e94560; text-decoration-thickness: 3px; text-underline-position: from-font;">Typography</span>
    </div>
    <div class="label">text-underline-position: from-font</div>
  </div>
  <div class="demo-box" data-css-prop="text-underline-position" data-value="under">
    <div class="demo-area">
      <span style="font-size: 28px; font-weight: 600; color: #fff; text-decoration: underline; text-decoration-color: #e94560; text-decoration-thickness: 3px; text-underline-position: under;">Typography</span>
    </div>
    <div class="label">text-underline-position: under</div>
  </div>
  <div class="demo-box" data-css-prop="text-underline-position" data-value="left">
    <div class="demo-area">
      <span style="font-size: 28px; font-weight: 600; color: #fff; text-decoration: underline; text-decoration-color: #e94560; text-decoration-thickness: 3px; text-underline-position: left;">Typography</span>
    </div>
    <div class="label">text-underline-position: left</div>
  </div>
  <div class="demo-box" data-css-prop="text-underline-position" data-value="from-font left">
    <div class="demo-area">
      <span style="font-size: 28px; font-weight: 600; color: #fff; text-decoration: underline; text-decoration-color: #e94560; text-decoration-thickness: 3px; text-underline-position: from-font left;">Typography</span>
    </div>
    <div class="label">text-underline-position: from-font left</div>
  </div>
</div>
<script src="../interactive.js"></script>
</body>
</html>
