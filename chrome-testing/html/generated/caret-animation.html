<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>caret-animation</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
  input:focus { border-color: #e94560; }
</style>
</head>
<body>
<div id="control-bar"></div>
<h1>Caret Animation</h1>
<p class="prop-name">caret-animation</p>
<div class="demos">
  <div class="demo-box" data-css-prop="caret-animation" data-value="auto">
    <div class="demo-area">
      <input style="width: 100%; padding: 14px 16px; background: #0f3460; border: 2px solid #1a4a8a; border-radius: 8px; color: #e0e0e0; font-size: 15px; outline: none; font-family: system-ui, sans-serif; caret-color: #e94560; caret-animation: auto;"></input>
    </div>
    <div class="label">caret-animation: auto</div>
  </div>
  <div class="demo-box" data-css-prop="caret-animation" data-value="manual">
    <div class="demo-area">
      <input style="width: 100%; padding: 14px 16px; background: #0f3460; border: 2px solid #1a4a8a; border-radius: 8px; color: #e0e0e0; font-size: 15px; outline: none; font-family: system-ui, sans-serif; caret-color: #e94560; caret-animation: manual;"></input>
    </div>
    <div class="label">caret-animation: manual</div>
  </div>
</div>
<script src="../interactive.js"></script>
</body>
</html>
