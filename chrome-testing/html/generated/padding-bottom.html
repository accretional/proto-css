<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>padding-bottom</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
  .pad-inner { background: #0f3460; border-radius: 4px; min-height: 50px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-family: monospace; color: #64b5f6; }
</style>
</head>
<body>
<h1>Padding Bottom</h1>
<p class="prop-name">padding-bottom</p>
<div class="demos">
  <div class="demo-box" data-css-prop="padding-bottom" data-value="10px">
    <div class="demo-area">
      <div style="background: rgba(240, 165, 0, 0.25); border: 1px dashed rgba(240, 165, 0, 0.5); border-radius: 6px; width: 160px; padding-bottom: 10px;"><div class="pad-inner">Content</div></div>
    </div>
    <div class="label">padding-bottom: 10px</div>
  </div>
  <div class="demo-box" data-css-prop="padding-bottom" data-value="25%">
    <div class="demo-area">
      <div style="background: rgba(240, 165, 0, 0.25); border: 1px dashed rgba(240, 165, 0, 0.5); border-radius: 6px; width: 160px; padding-bottom: 25%;"><div class="pad-inner">Content</div></div>
    </div>
    <div class="label">padding-bottom: 25%</div>
  </div>
  <div class="demo-box" data-css-prop="padding-bottom" data-value="50%">
    <div class="demo-area">
      <div style="background: rgba(240, 165, 0, 0.25); border: 1px dashed rgba(240, 165, 0, 0.5); border-radius: 6px; width: 160px; padding-bottom: 50%;"><div class="pad-inner">Content</div></div>
    </div>
    <div class="label">padding-bottom: 50%</div>
  </div>
  <div class="demo-box" data-css-prop="padding-bottom" data-value="0">
    <div class="demo-area">
      <div style="background: rgba(240, 165, 0, 0.25); border: 1px dashed rgba(240, 165, 0, 0.5); border-radius: 6px; width: 160px; padding-bottom: 0;"><div class="pad-inner">Content</div></div>
    </div>
    <div class="label">padding-bottom: 0</div>
  </div>
</div>
<div id="control-bar"></div>
<script src="../interactive.js"></script>
</body>
</html>
