<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>scroll-timeline-axis</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
  .experimental { display: inline-block; background: #e9456033; color: #e94560; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 4px; margin-left: 8px; vertical-align: middle; }
.demos { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.axis-box { width: 120px; height: 100px; border: 2px solid #333; border-radius: 8px; position: relative; background: #16213e; }
.arrow-h { position: absolute; top: 50%; left: -40px; right: -40px; height: 2px; background: #e94560; transform: translateY(-50%); }
.arrow-h::before, .arrow-h::after { content: ''; position: absolute; top: -4px; width: 0; height: 0; border-style: solid; }
.arrow-h::before { left: 0; border-width: 5px 8px 5px 0; border-color: transparent #e94560 transparent transparent; }
.arrow-h::after { right: 0; border-width: 5px 0 5px 8px; border-color: transparent transparent transparent #e94560; }
.arrow-v { position: absolute; left: 50%; top: -30px; bottom: -30px; width: 2px; background: #2ecc71; transform: translateX(-50%); }
.arrow-v::before, .arrow-v::after { content: ''; position: absolute; left: -4px; width: 0; height: 0; border-style: solid; }
.arrow-v::before { top: 0; border-width: 0 5px 8px 5px; border-color: transparent transparent #2ecc71 transparent; }
.arrow-v::after { bottom: 0; border-width: 8px 5px 0 5px; border-color: #2ecc71 transparent transparent transparent; }
.box-label { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 10px; color: #7b8794; font-family: monospace; text-align: center; }
.axis-label-v { position: absolute; top: 12px; left: 12px; font-size: 11px; font-family: monospace; color: #2ecc71; background: #2ecc7122; padding: 2px 8px; border-radius: 4px; }
.axis-label-h { position: absolute; bottom: 12px; right: 12px; font-size: 11px; font-family: monospace; color: #e94560; background: #e9456022; padding: 2px 8px; border-radius: 4px; }
</style>
</head>
<body>
<div id="control-bar"></div>
<h1>Scroll Timeline Axis</h1>
<p class="prop-name">scroll-timeline-axis</p>
<div class="demos">
  <div class="demo-box" data-css-prop="scroll-timeline-axis" data-value="block">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 20px;">
      <div style="width: 100%; height: 180px; background: #0a0a1a; border-radius: 8px; position: relative; display: flex; align-items: center; justify-content: center; scroll-timeline-axis: block;"><div class="axis-box"><div class="arrow-v"></div><div class="box-label">scroll<br>container</div></div></div>
    </div>
    <div class="label">scroll-timeline-axis: block</div>
  </div>
  <div class="demo-box" data-css-prop="scroll-timeline-axis" data-value="inline">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 20px;">
      <div style="width: 100%; height: 180px; background: #0a0a1a; border-radius: 8px; position: relative; display: flex; align-items: center; justify-content: center; scroll-timeline-axis: inline;"><div class="axis-box"><div class="arrow-v"></div><div class="box-label">scroll<br>container</div></div></div>
    </div>
    <div class="label">scroll-timeline-axis: inline</div>
  </div>
  <div class="demo-box" data-css-prop="scroll-timeline-axis" data-value="x">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 20px;">
      <div style="width: 100%; height: 180px; background: #0a0a1a; border-radius: 8px; position: relative; display: flex; align-items: center; justify-content: center; scroll-timeline-axis: x;"><div class="axis-box"><div class="arrow-v"></div><div class="box-label">scroll<br>container</div></div></div>
    </div>
    <div class="label">scroll-timeline-axis: x</div>
  </div>
  <div class="demo-box" data-css-prop="scroll-timeline-axis" data-value="y">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 20px;">
      <div style="width: 100%; height: 180px; background: #0a0a1a; border-radius: 8px; position: relative; display: flex; align-items: center; justify-content: center; scroll-timeline-axis: y;"><div class="axis-box"><div class="arrow-v"></div><div class="box-label">scroll<br>container</div></div></div>
    </div>
    <div class="label">scroll-timeline-axis: y</div>
  </div>
</div>
<script src="../interactive.js"></script>
</body>
</html>
