<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>caret-shape</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  input:focus { border-color: #e94560; }
</style>
</head>
<body>
<h1>Caret Shape</h1>
<p class="prop-name">caret-shape</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area">
      <input style="width: 100%; padding: 12px 14px; background: #0f3460; border: 2px solid #1a4a8a; border-radius: 8px; color: #e0e0e0; font-size: 15px; outline: none; font-family: system-ui, sans-serif; caret-color: #e94560; caret-shape: auto;"></input>
    </div>
    <div class="label">caret-shape: auto</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <input style="width: 100%; padding: 12px 14px; background: #0f3460; border: 2px solid #1a4a8a; border-radius: 8px; color: #e0e0e0; font-size: 15px; outline: none; font-family: system-ui, sans-serif; caret-color: #e94560; caret-shape: bar;"></input>
    </div>
    <div class="label">caret-shape: bar</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <input style="width: 100%; padding: 12px 14px; background: #0f3460; border: 2px solid #1a4a8a; border-radius: 8px; color: #e0e0e0; font-size: 15px; outline: none; font-family: system-ui, sans-serif; caret-color: #e94560; caret-shape: block;"></input>
    </div>
    <div class="label">caret-shape: block</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <input style="width: 100%; padding: 12px 14px; background: #0f3460; border: 2px solid #1a4a8a; border-radius: 8px; color: #e0e0e0; font-size: 15px; outline: none; font-family: system-ui, sans-serif; caret-color: #e94560; caret-shape: underscore;"></input>
    </div>
    <div class="label">caret-shape: underscore</div>
  </div>
</div>
</body>
</html>
