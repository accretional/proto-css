<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>animation-composition</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  @keyframes composeDemo {
  from { transform: rotate(0deg) scale(1); }
  to { transform: rotate(180deg) scale(2); }
}
</style>
</head>
<body>
<h1>Animation Composition</h1>
<p class="prop-name">animation-composition</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area" style="position: relative; height: 80px; background: #0f3460; border-radius: 8px; overflow: hidden;">
      <div style="width: 60px; height: 60px; border-radius: 8px; position: absolute; left: 10px; top: 50%; margin-top: -30px; transform: rotate(45deg) scale(1.5); background: #e94560; animation: composeDemo 3s linear infinite; animation-delay: -1.5s; animation-composition: replace;"></div>
    </div>
    <div class="label">animation-composition: replace</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="position: relative; height: 80px; background: #0f3460; border-radius: 8px; overflow: hidden;">
      <div style="width: 60px; height: 60px; border-radius: 8px; position: absolute; left: 10px; top: 50%; margin-top: -30px; transform: rotate(45deg) scale(1.5); background: #e94560; animation: composeDemo 3s linear infinite; animation-delay: -1.5s; animation-composition: add;"></div>
    </div>
    <div class="label">animation-composition: add</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="position: relative; height: 80px; background: #0f3460; border-radius: 8px; overflow: hidden;">
      <div style="width: 60px; height: 60px; border-radius: 8px; position: absolute; left: 10px; top: 50%; margin-top: -30px; transform: rotate(45deg) scale(1.5); background: #e94560; animation: composeDemo 3s linear infinite; animation-delay: -1.5s; animation-composition: accumulate;"></div>
    </div>
    <div class="label">animation-composition: accumulate</div>
  </div>
</div>
</body>
</html>
