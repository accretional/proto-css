<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>stroke-miterlimit</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
</style>
</head>
<body>
<h1>Stroke Miter Limit</h1>
<p class="prop-name">stroke-miterlimit</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area" style="display: flex; flex-direction: column; align-items: center; background: #16213e; border-radius: 12px; padding: 24px 28px;">
      <svg width="220" height="200">
      <polyline style="fill: none; stroke: #06b6d4; stroke-width: 14; stroke-linejoin: miter; stroke-miterlimit: 0;"></polyline>
      <polyline points="30,170 110,20 190,170 110,90 30,170" fill="none" stroke="#f43f5e" stroke-width="1" stroke-dasharray="3 3"/></svg>
    </div>
    <div class="label">stroke-miterlimit: 0</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="display: flex; flex-direction: column; align-items: center; background: #16213e; border-radius: 12px; padding: 24px 28px;">
      <svg width="220" height="200">
      <polyline style="fill: none; stroke: #06b6d4; stroke-width: 14; stroke-linejoin: miter; stroke-miterlimit: 0.5;"></polyline>
      <polyline points="30,170 110,20 190,170 110,90 30,170" fill="none" stroke="#f43f5e" stroke-width="1" stroke-dasharray="3 3"/></svg>
    </div>
    <div class="label">stroke-miterlimit: 0.5</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="display: flex; flex-direction: column; align-items: center; background: #16213e; border-radius: 12px; padding: 24px 28px;">
      <svg width="220" height="200">
      <polyline style="fill: none; stroke: #06b6d4; stroke-width: 14; stroke-linejoin: miter; stroke-miterlimit: 1;"></polyline>
      <polyline points="30,170 110,20 190,170 110,90 30,170" fill="none" stroke="#f43f5e" stroke-width="1" stroke-dasharray="3 3"/></svg>
    </div>
    <div class="label">stroke-miterlimit: 1</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="display: flex; flex-direction: column; align-items: center; background: #16213e; border-radius: 12px; padding: 24px 28px;">
      <svg width="220" height="200">
      <polyline style="fill: none; stroke: #06b6d4; stroke-width: 14; stroke-linejoin: miter; stroke-miterlimit: 2;"></polyline>
      <polyline points="30,170 110,20 190,170 110,90 30,170" fill="none" stroke="#f43f5e" stroke-width="1" stroke-dasharray="3 3"/></svg>
    </div>
    <div class="label">stroke-miterlimit: 2</div>
  </div>
</div>
</body>
</html>
