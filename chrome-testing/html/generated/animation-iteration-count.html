<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>animation-iteration-count</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
  @keyframes slideCount {
  from { left: 0; background: #e94560; }
  to { left: calc(100% - 40px); background: #3498db; }
}
</style>
</head>
<body>
<h1>Animation Iteration Count</h1>
<p class="prop-name">animation-iteration-count</p>
<div class="demos">
  <div class="demo-box" data-css-prop="animation-iteration-count" data-value="infinite">
    <div class="demo-area" style="position: relative; height: 56px; background: #0f3460; border-radius: 8px; overflow: hidden;">
      <div style="width: 40px; height: 40px; border-radius: 6px; position: absolute; left: 0; top: 50%; margin-top: -20px; background: #e94560; animation: slideCount 0.5s linear; animation-delay: -0.2s; animation-iteration-count: infinite;"></div>
    </div>
    <div class="label">animation-iteration-count: infinite</div>
  </div>
  <div class="demo-box" data-css-prop="animation-iteration-count" data-value="1">
    <div class="demo-area" style="position: relative; height: 56px; background: #0f3460; border-radius: 8px; overflow: hidden;">
      <div style="width: 40px; height: 40px; border-radius: 6px; position: absolute; left: 0; top: 50%; margin-top: -20px; background: #e94560; animation: slideCount 0.5s linear; animation-delay: -0.2s; animation-iteration-count: 1;"></div>
    </div>
    <div class="label">animation-iteration-count: 1</div>
  </div>
  <div class="demo-box" data-css-prop="animation-iteration-count" data-value="0.5">
    <div class="demo-area" style="position: relative; height: 56px; background: #0f3460; border-radius: 8px; overflow: hidden;">
      <div style="width: 40px; height: 40px; border-radius: 6px; position: absolute; left: 0; top: 50%; margin-top: -20px; background: #e94560; animation: slideCount 0.5s linear; animation-delay: -0.2s; animation-iteration-count: 0.5;"></div>
    </div>
    <div class="label">animation-iteration-count: 0.5</div>
  </div>
  <div class="demo-box" data-css-prop="animation-iteration-count" data-value="2">
    <div class="demo-area" style="position: relative; height: 56px; background: #0f3460; border-radius: 8px; overflow: hidden;">
      <div style="width: 40px; height: 40px; border-radius: 6px; position: absolute; left: 0; top: 50%; margin-top: -20px; background: #e94560; animation: slideCount 0.5s linear; animation-delay: -0.2s; animation-iteration-count: 2;"></div>
    </div>
    <div class="label">animation-iteration-count: 2</div>
  </div>
  <div class="demo-box" data-css-prop="animation-iteration-count" data-value="0">
    <div class="demo-area" style="position: relative; height: 56px; background: #0f3460; border-radius: 8px; overflow: hidden;">
      <div style="width: 40px; height: 40px; border-radius: 6px; position: absolute; left: 0; top: 50%; margin-top: -20px; background: #e94560; animation: slideCount 0.5s linear; animation-delay: -0.2s; animation-iteration-count: 0;"></div>
    </div>
    <div class="label">animation-iteration-count: 0</div>
  </div>
  <div class="demo-box" data-css-prop="animation-iteration-count" data-value="infinite, infinite">
    <div class="demo-area" style="position: relative; height: 56px; background: #0f3460; border-radius: 8px; overflow: hidden;">
      <div style="width: 40px; height: 40px; border-radius: 6px; position: absolute; left: 0; top: 50%; margin-top: -20px; background: #e94560; animation: slideCount 0.5s linear; animation-delay: -0.2s; animation-iteration-count: infinite, infinite;"></div>
    </div>
    <div class="label">animation-iteration-count: infinite, infinite</div>
  </div>
</div>
<div id="control-bar"></div>
<script src="../interactive.js"></script>
</body>
</html>
