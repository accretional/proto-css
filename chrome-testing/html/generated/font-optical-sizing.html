<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>font-optical-sizing</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 24px; }
    .demo-card {
      background: #16213e; border-radius: 12px; padding: 24px; flex: 1; min-width: 560px;
      border: 1px solid #2a2a4a;
    }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; }
    .tag {
      display: inline-block; background: #7c3aed33; color: #a78bfa; font-size: 11px;
      font-family: monospace; padding: 2px 8px; border-radius: 4px; margin-bottom: 12px;
    }
    .size-row {
      display: flex; align-items: baseline; gap: 20px; margin-bottom: 8px; flex-wrap: wrap;
    }
    .size-row span { color: #fff; }
    .s12 { font-size: 12px; }
    .s24 { font-size: 24px; }
    .s48 { font-size: 48px; }
    .s72 { font-size: 72px; }
    .optical-auto { font-optical-sizing: auto ! important; }
    .optical-none { font-optical-sizing: auto ! important; }
    .size-label { font-size: 10px; color: #6b7280; font-family: monospace; }
  </style>
</head>
<body>
  <h1>Font Optical Sizing</h1>
  <p class="prop-name">font-optical-sizing</p>
  <div class="demos">
    <div class="demo-card">
      <div class="tag">auto</div>
      <div class="size-row optical-auto">
        <div><span class="s12">Hamburgefons</span><br><span class="size-label">12px</span></div>
        <div><span class="s24">Hamburgefons</span><br><span class="size-label">24px</span></div>
        <div><span class="s48">Hamburgefons</span><br><span class="size-label">48px</span></div>
        <div><span class="s72">Hburg</span><br><span class="size-label">72px</span></div>
      </div>
      <p class="label">font-optical-sizing: auto ! important</p>
    </div>
    <div class="demo-card">
      <div class="tag">none</div>
      <div class="size-row optical-none">
        <div><span class="s12">Hamburgefons</span><br><span class="size-label">12px</span></div>
        <div><span class="s24">Hamburgefons</span><br><span class="size-label">24px</span></div>
        <div><span class="s48">Hamburgefons</span><br><span class="size-label">48px</span></div>
        <div><span class="s72">Hburg</span><br><span class="size-label">72px</span></div>
      </div>
      <p class="label">font-optical-sizing: auto ! important</p>
    </div>
  </div>
</body>
</html>
