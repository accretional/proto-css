<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>font-variant-alternates</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
  .sample-small { font-size: 16px; color: #a0a0b0; line-height: 1.5; }
</style>
</head>
<body>
<h1>Font Variant Alternates</h1>
<p class="prop-name">font-variant-alternates</p>
<div class="demos">
  <div class="demo-box" data-css-prop="font-variant-alternates" data-value="normal">
    <div class="demo-area">
      <div style="font-size: 28px; line-height: 1.4; font-family: Georgia, &#34;Times New Roman&#34;, serif; font-variant-alternates: normal;">Historical Forms fi fl</div>
    </div>
    <div class="label">font-variant-alternates: normal</div>
  </div>
  <div class="demo-box" data-css-prop="font-variant-alternates" data-value="historical-forms">
    <div class="demo-area">
      <div style="font-size: 28px; line-height: 1.4; font-family: Georgia, &#34;Times New Roman&#34;, serif; font-variant-alternates: historical-forms;">Historical Forms fi fl</div>
    </div>
    <div class="label">font-variant-alternates: historical-forms</div>
  </div>
</div>
<div id="control-bar"></div>
<script src="../interactive.js"></script>
</body>
</html>
