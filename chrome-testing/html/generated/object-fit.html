<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>object-fit</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
</style>
</head>
<body>
<h1>Object Fit</h1>
<p class="prop-name">object-fit</p>
<div class="demos">
  <div class="demo-box" data-css-prop="object-fit" data-value="fill">
    <div class="demo-area" style="width: 174px; height: 174px; border: 2px dashed #4fc3f744; border-radius: 8px; position: relative; overflow: hidden; background: #0a0a1e;">
      <img style="width: 170px; height: 170px; display: block; border-radius: 4px; background: #0f3460; object-fit: fill;"></img>
      <script>var img=document.currentScript.closest('.demo-area').querySelector('img');img.src='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="150" viewBox="0 0 300 150"><rect width="300" height="150" fill="#e94560"/><circle cx="80" cy="75" r="40" fill="white" opacity="0.9"/><rect x="160" y="30" width="100" height="90" rx="8" fill="#0ea5e9"/><text x="150" y="85" text-anchor="middle" fill="white" font-size="16" font-weight="bold">300x150</text></svg>');</script>
    </div>
    <div class="label">object-fit: fill</div>
  </div>
  <div class="demo-box" data-css-prop="object-fit" data-value="none">
    <div class="demo-area" style="width: 174px; height: 174px; border: 2px dashed #4fc3f744; border-radius: 8px; position: relative; overflow: hidden; background: #0a0a1e;">
      <img style="width: 170px; height: 170px; display: block; border-radius: 4px; background: #0f3460; object-fit: none;"></img>
      <script>var img=document.currentScript.closest('.demo-area').querySelector('img');img.src='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="150" viewBox="0 0 300 150"><rect width="300" height="150" fill="#e94560"/><circle cx="80" cy="75" r="40" fill="white" opacity="0.9"/><rect x="160" y="30" width="100" height="90" rx="8" fill="#0ea5e9"/><text x="150" y="85" text-anchor="middle" fill="white" font-size="16" font-weight="bold">300x150</text></svg>');</script>
    </div>
    <div class="label">object-fit: none</div>
  </div>
  <div class="demo-box" data-css-prop="object-fit" data-value="contain">
    <div class="demo-area" style="width: 174px; height: 174px; border: 2px dashed #4fc3f744; border-radius: 8px; position: relative; overflow: hidden; background: #0a0a1e;">
      <img style="width: 170px; height: 170px; display: block; border-radius: 4px; background: #0f3460; object-fit: contain;"></img>
      <script>var img=document.currentScript.closest('.demo-area').querySelector('img');img.src='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="150" viewBox="0 0 300 150"><rect width="300" height="150" fill="#e94560"/><circle cx="80" cy="75" r="40" fill="white" opacity="0.9"/><rect x="160" y="30" width="100" height="90" rx="8" fill="#0ea5e9"/><text x="150" y="85" text-anchor="middle" fill="white" font-size="16" font-weight="bold">300x150</text></svg>');</script>
    </div>
    <div class="label">object-fit: contain</div>
  </div>
  <div class="demo-box" data-css-prop="object-fit" data-value="cover">
    <div class="demo-area" style="width: 174px; height: 174px; border: 2px dashed #4fc3f744; border-radius: 8px; position: relative; overflow: hidden; background: #0a0a1e;">

    </div>
    <div class="label">object-fit: cover</div>
  </div>

    <div class="demo-area" style="width: 174px; height: 174px; border: 2px dashed #4fc3f744; border-radius: 8px; position: relative; overflow: hidden; background: #0a0a1e;">
      <img style="width: 170px; height: 170px; display: block; border-radius: 4px; background: #0f3460; object-fit: scale-down;"></img>
      <script>var img=document.currentScript.closest('.demo-area').querySelector('img');img.src='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="150" viewBox="0 0 300 150"><rect width="300" height="150" fill="#e94560"/><circle cx="80" cy="75" r="40" fill="white" opacity="0.9"/><rect x="160" y="30" width="100" height="90" rx="8" fill="#0ea5e9"/><text x="150" y="85" text-anchor="middle" fill="white" font-size="16" font-weight="bold">300x150</text></svg>');</script>
    </div>
    <div class="label">object-fit: scale-down</div>
  </div>
  <div class="demo-box" data-css-prop="object-fit" data-value="contain scale-down">
    <div class="demo-area" style="width: 174px; height: 174px; border: 2px dashed #4fc3f744; border-radius: 8px; position: relative; overflow: hidden; background: #0a0a1e;">
      <img style="width: 170px; height: 170px; display: block; border-radius: 4px; background: #0f3460; object-fit: contain scale-down;"></img>
      <script>var img=document.currentScript.closest('.demo-area').querySelector('img');img.src='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="150" viewBox="0 0 300 150"><rect width="300" height="150" fill="#e94560"/><circle cx="80" cy="75" r="40" fill="white" opacity="0.9"/><rect x="160" y="30" width="100" height="90" rx="8" fill="#0ea5e9"/><text x="150" y="85" text-anchor="middle" fill="white" font-size="16" font-weight="bold">300x150</text></svg>');</script>
    </div>
    <div class="label">object-fit: contain scale-down</div>
  </div>
  <div class="demo-box" data-css-prop="object-fit" data-value="cover scale-down">
    <div class="demo-area" style="width: 174px; height: 174px; border: 2px dashed #4fc3f744; border-radius: 8px; position: relative; overflow: hidden; background: #0a0a1e;">
      <img style="width: 170px; height: 170px; display: block; border-radius: 4px; background: #0f3460; object-fit: cover scale-down;"></img>
      <script>var img=document.currentScript.closest('.demo-area').querySelector('img');img.src='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="150" viewBox="0 0 300 150"><rect width="300" height="150" fill="#e94560"/><circle cx="80" cy="75" r="40" fill="white" opacity="0.9"/><rect x="160" y="30" width="100" height="90" rx="8" fill="#0ea5e9"/><text x="150" y="85" text-anchor="middle" fill="white" font-size="16" font-weight="bold">300x150</text></svg>');</script>
    </div>
    <div class="label">object-fit: cover scale-down</div>
  </div>
</div>
<div id="control-bar"></div>
<script src="../interactive.js"></script>
</body>
</html>
