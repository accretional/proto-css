<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>object-fit</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .size-badge { position: absolute; top: 4px; right: 4px; background: #000a; color: #4fc3f7; font-size: 9px; font-family: monospace; padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>
<h1>Object Fit</h1>
<p class="prop-name">object-fit</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area" style="width: 170px; height: 170px; border: 2px dashed #4fc3f744; border-radius: 8px; position: relative; overflow: hidden; background: #0f3460;">
      <img style="width: 100%; height: 100%; display: block; object-fit: fill;"></img>
    </div>
    <div class="label">object-fit: fill</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="width: 170px; height: 170px; border: 2px dashed #4fc3f744; border-radius: 8px; position: relative; overflow: hidden; background: #0f3460;">
      <img style="width: 100%; height: 100%; display: block; object-fit: none;"></img>
    </div>
    <div class="label">object-fit: none</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="width: 170px; height: 170px; border: 2px dashed #4fc3f744; border-radius: 8px; position: relative; overflow: hidden; background: #0f3460;">
      <img style="width: 100%; height: 100%; display: block; object-fit: scale-down;"></img>
    </div>
    <div class="label">object-fit: scale-down</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="width: 170px; height: 170px; border: 2px dashed #4fc3f744; border-radius: 8px; position: relative; overflow: hidden; background: #0f3460;">
      <img style="width: 100%; height: 100%; display: block; object-fit: contain;"></img>
    </div>
    <div class="label">object-fit: contain</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="width: 170px; height: 170px; border: 2px dashed #4fc3f744; border-radius: 8px; position: relative; overflow: hidden; background: #0f3460;">
      <img style="width: 100%; height: 100%; display: block; object-fit: contain scale-down;"></img>
    </div>
    <div class="label">object-fit: contain scale-down</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="width: 170px; height: 170px; border: 2px dashed #4fc3f744; border-radius: 8px; position: relative; overflow: hidden; background: #0f3460;">
      <img style="width: 100%; height: 100%; display: block; object-fit: cover;"></img>
    </div>
    <div class="label">object-fit: cover</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="width: 170px; height: 170px; border: 2px dashed #4fc3f744; border-radius: 8px; position: relative; overflow: hidden; background: #0f3460;">
      <img style="width: 100%; height: 100%; display: block; object-fit: cover scale-down;"></img>
    </div>
    <div class="label">object-fit: cover scale-down</div>
  </div>
</div>
</body>
</html>
