<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>animation-duration</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
  @keyframes slideBar {
  from { left: 0; }
  to { left: calc(100% - 48px); }
}
</style>
</head>
<body>
<div id="control-bar"></div>
<h1>Animation Duration</h1>
<p class="prop-name">animation-duration</p>
<div class="demos">
  <div class="demo-box" data-css-prop="animation-duration" data-value="auto">
    <div class="demo-area" style="position: relative; height: 50px; background: #0f3460; border-radius: 8px; overflow: hidden;">
      <div style="position: absolute; left: 0; top: 0; width: 48px; height: 100%; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; color: #fff; background: #e94560; animation: slideBar 2s linear infinite; animation-delay: -0.25s; animation-duration: auto;"></div>
    </div>
    <div class="label">animation-duration: auto</div>
  </div>
  <div class="demo-box" data-css-prop="animation-duration" data-value="0.3s">
    <div class="demo-area" style="position: relative; height: 50px; background: #0f3460; border-radius: 8px; overflow: hidden;">
      <div style="position: absolute; left: 0; top: 0; width: 48px; height: 100%; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; color: #fff; background: #e94560; animation: slideBar 2s linear infinite; animation-delay: -0.25s; animation-duration: 0.3s;"></div>
    </div>
    <div class="label">animation-duration: 0.3s</div>
  </div>
  <div class="demo-box" data-css-prop="animation-duration" data-value="calc(50% + 20px)">
    <div class="demo-area" style="position: relative; height: 50px; background: #0f3460; border-radius: 8px; overflow: hidden;">
      <div style="position: absolute; left: 0; top: 0; width: 48px; height: 100%; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; color: #fff; background: #e94560; animation: slideBar 2s linear infinite; animation-delay: -0.25s; animation-duration: calc(50% + 20px);"></div>
    </div>
    <div class="label">animation-duration: calc(50% + 20px)</div>
  </div>
  <div class="demo-box" data-css-prop="animation-duration" data-value="1s">
    <div class="demo-area" style="position: relative; height: 50px; background: #0f3460; border-radius: 8px; overflow: hidden;">
      <div style="position: absolute; left: 0; top: 0; width: 48px; height: 100%; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; color: #fff; background: #e94560; animation: slideBar 2s linear infinite; animation-delay: -0.25s; animation-duration: 1s;"></div>
    </div>
    <div class="label">animation-duration: 1s</div>
  </div>
  <div class="demo-box" data-css-prop="animation-duration" data-value="2s">
    <div class="demo-area" style="position: relative; height: 50px; background: #0f3460; border-radius: 8px; overflow: hidden;">
      <div style="position: absolute; left: 0; top: 0; width: 48px; height: 100%; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; color: #fff; background: #e94560; animation: slideBar 2s linear infinite; animation-delay: -0.25s; animation-duration: 2s;"></div>
    </div>
    <div class="label">animation-duration: 2s</div>
  </div>
  <div class="demo-box" data-css-prop="animation-duration" data-value="0s">
    <div class="demo-area" style="position: relative; height: 50px; background: #0f3460; border-radius: 8px; overflow: hidden;">
      <div style="position: absolute; left: 0; top: 0; width: 48px; height: 100%; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; color: #fff; background: #e94560; animation: slideBar 2s linear infinite; animation-delay: -0.25s; animation-duration: 0s;"></div>
    </div>
    <div class="label">animation-duration: 0s</div>
  </div>
  <div class="demo-box" data-css-prop="animation-duration" data-value="auto, auto">
    <div class="demo-area" style="position: relative; height: 50px; background: #0f3460; border-radius: 8px; overflow: hidden;">
      <div style="position: absolute; left: 0; top: 0; width: 48px; height: 100%; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; color: #fff; background: #e94560; animation: slideBar 2s linear infinite; animation-delay: -0.25s; animation-duration: auto, auto;"></div>
    </div>
    <div class="label">animation-duration: auto, auto</div>
  </div>
  <div class="demo-box" data-css-prop="animation-duration" data-value="0.3s, auto">
    <div class="demo-area" style="position: relative; height: 50px; background: #0f3460; border-radius: 8px; overflow: hidden;">
      <div style="position: absolute; left: 0; top: 0; width: 48px; height: 100%; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; color: #fff; background: #e94560; animation: slideBar 2s linear infinite; animation-delay: -0.25s; animation-duration: 0.3s, auto;"></div>
    </div>
    <div class="label">animation-duration: 0.3s, auto</div>
  </div>
</div>
<script src="../interactive.js"></script>
</body>
</html>
