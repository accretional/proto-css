<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>baseline-source</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
  .flex-item { border-radius: 6px; padding: 10px 14px; display: flex; align-items: center; justify-content: center; }
.item-a { background: rgba(102, 126, 234, 0.4); border: 2px solid #667eea; height: 70px; width: 80px; }
.item-c { background: rgba(254, 202, 87, 0.4); border: 2px solid #feca57; height: 100px; width: 80px; }
</style>
</head>
<body>
<div id="control-bar"></div>
<h1>Baseline Source</h1>
<p class="prop-name">baseline-source</p>
<div class="demos">
  <div class="demo-box" data-css-prop="baseline-source" data-value="auto">
    <div class="demo-area" style="display: flex; align-items: baseline; gap: 12px; background: #16213e; border-radius: 8px; border: 2px solid rgba(255,255,255,0.1); padding: 20px; height: 280px;">
      <div class="flex-item item-a"><span style="font-size: 14px;">A ref</span></div>
      <div style="border-radius: 6px; padding: 10px 14px; display: flex; flex-direction: column; justify-content: space-between; background: rgba(240, 147, 251, 0.4); border: 2px solid #f093fb; font-size: 24px; height: 160px; width: 100px; baseline-source: auto;"><span style="font-size: 24px;">Top</span><span style="font-size: 10px; color: rgba(255,255,255,0.5);">target</span><span style="font-size: 24px;">Bot</span></div>
      <div class="flex-item item-c"><span style="font-size: 14px;">C ref</span></div>
    </div>
    <div class="label">baseline-source: auto</div>
  </div>
  <div class="demo-box" data-css-prop="baseline-source" data-value="first">
    <div class="demo-area" style="display: flex; align-items: baseline; gap: 12px; background: #16213e; border-radius: 8px; border: 2px solid rgba(255,255,255,0.1); padding: 20px; height: 280px;">
      <div class="flex-item item-a"><span style="font-size: 14px;">A ref</span></div>
      <div style="border-radius: 6px; padding: 10px 14px; display: flex; flex-direction: column; justify-content: space-between; background: rgba(240, 147, 251, 0.4); border: 2px solid #f093fb; font-size: 24px; height: 160px; width: 100px; baseline-source: first;"><span style="font-size: 24px;">Top</span><span style="font-size: 10px; color: rgba(255,255,255,0.5);">target</span><span style="font-size: 24px;">Bot</span></div>
      <div class="flex-item item-c"><span style="font-size: 14px;">C ref</span></div>
    </div>
    <div class="label">baseline-source: first</div>
  </div>
  <div class="demo-box" data-css-prop="baseline-source" data-value="last">
    <div class="demo-area" style="display: flex; align-items: baseline; gap: 12px; background: #16213e; border-radius: 8px; border: 2px solid rgba(255,255,255,0.1); padding: 20px; height: 280px;">
      <div class="flex-item item-a"><span style="font-size: 14px;">A ref</span></div>
      <div style="border-radius: 6px; padding: 10px 14px; display: flex; flex-direction: column; justify-content: space-between; background: rgba(240, 147, 251, 0.4); border: 2px solid #f093fb; font-size: 24px; height: 160px; width: 100px; baseline-source: last;"><span style="font-size: 24px;">Top</span><span style="font-size: 10px; color: rgba(255,255,255,0.5);">target</span><span style="font-size: 24px;">Bot</span></div>
      <div class="flex-item item-c"><span style="font-size: 14px;">C ref</span></div>
    </div>
    <div class="label">baseline-source: last</div>
  </div>
</div>
<script src="../interactive.js"></script>
</body>
</html>
