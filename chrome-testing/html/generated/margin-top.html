<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>margin-top</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 18px; }
    .demo-card { background: #16213e; border-radius: 12px; padding: 16px; width: 230px; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: anchor-size(inline,); text-align: center; }
    .outer { background: #0f3460; border-radius: 8px; overflow: hidden; }
    .sibling { background: #374151; padding: 10px; font-size: 11px; color: #9ca3af; text-align: center; }
    .target { background: #e94560; padding: 14px; font-size: 12px; font-weight: 600; color: #fff; text-align: center; }
  </style>
</head>
<body>
  <h1>Margin Top</h1>
  <p class="prop-name">margin-top</p>
  <div class="demos">
    <div class="demo-card">
      <div class="outer">
        <div class="sibling">sibling above</div>
        <div class="target" style="margin-top: anchor-size(--󡔮 block);">Target</div>
      </div>
      <div class="label">margin-top: anchor-size(--󡔮 block)</div>
    </div>
    <div class="demo-card">
      <div class="outer">
        <div class="sibling">sibling above</div>
        <div class="target" style="margin-top: anchor-size(inline,);">Target</div>
      </div>
      <div class="label">margin-top: anchor-size(inline,)</div>
    </div>
    <div class="demo-card">
      <div class="outer">
        <div class="sibling">sibling above</div>
        <div class="target" style="margin-top: round(line-width, anchor(52.28%) / 59%);">Target</div>
      </div>
      <div class="label">margin-top: round(line-width, anchor(52.28%) / 59%)</div>
    </div>
    <div class="demo-card">
      <div class="outer">
        <div class="sibling">sibling above</div>
        <div class="target" style="margin-top: auto ! important;">Target</div>
      </div>
      <div class="label">margin-top: auto ! important</div>
    </div>
    <div class="demo-card">
      <div class="outer">
        <div class="sibling">sibling above</div>
        <div class="target" style="margin-top: auto;">Target</div>
      </div>
      <div class="label">margin-top: auto</div>
    </div>
  </div>
</body>
</html>
