<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>scroll-snap-stop</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
  .snap-item { min-width: 180px; height: 140px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 28px; font-weight: 700; color: #fff; flex-shrink: 0; scroll-snap-align: start; position: relative; }
.snap-item .num-label { font-size: 11px; font-weight: 400; opacity: 0.7; margin-top: 4px; }
</style>
</head>
<body>
<div id="control-bar"></div>
<h1>Scroll Snap Stop</h1>
<p class="prop-name">scroll-snap-stop</p>
<div class="demos">
  <div class="demo-box" data-css-prop="scroll-snap-stop" data-value="normal">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 24px; flex: 1; min-width: 360px; max-width: 560px;">
      <div style="width: 100%; height: 140px; overflow-x: scroll; display: flex; scroll-snap-type: x mandatory; border-radius: 8px; background: #0a0a1a; scroll-snap-stop: normal;"><div class="snap-item" style="background: #e94560;">1<span class="num-label">stop</span></div><div class="snap-item" style="background: #0f3460;">2<span class="num-label">stop</span></div><div class="snap-item" style="background: #533483;">3<span class="num-label">stop</span></div><div class="snap-item" style="background: #2b6e4e;">4<span class="num-label">stop</span></div><div class="snap-item" style="background: #8b5e3c;">5<span class="num-label">stop</span></div><div class="snap-item" style="background: #6b2d5b;">6<span class="num-label">stop</span></div></div>
    </div>
    <div class="label">scroll-snap-stop: normal</div>
  </div>
  <div class="demo-box" data-css-prop="scroll-snap-stop" data-value="always">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 24px; flex: 1; min-width: 360px; max-width: 560px;">
      <div style="width: 100%; height: 140px; overflow-x: scroll; display: flex; scroll-snap-type: x mandatory; border-radius: 8px; background: #0a0a1a; scroll-snap-stop: always;"><div class="snap-item" style="background: #e94560;">1<span class="num-label">stop</span></div><div class="snap-item" style="background: #0f3460;">2<span class="num-label">stop</span></div><div class="snap-item" style="background: #533483;">3<span class="num-label">stop</span></div><div class="snap-item" style="background: #2b6e4e;">4<span class="num-label">stop</span></div><div class="snap-item" style="background: #8b5e3c;">5<span class="num-label">stop</span></div><div class="snap-item" style="background: #6b2d5b;">6<span class="num-label">stop</span></div></div>
    </div>
    <div class="label">scroll-snap-stop: always</div>
  </div>
</div>
<script src="../interactive.js"></script>
</body>
</html>
