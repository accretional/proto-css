<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>mask-type</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
  .svg-demo { border: 1px solid #2d3748; border-radius: 6px; overflow: hidden; background: #0f172a; }
.section-label { font-size: 10px; color: #6b7280; text-align: center; margin-top: 4px; }
.arrow-col { display: flex; align-items: center; font-size: 18px; color: #4a5568; padding-top: 50px; }
</style>
</head>
<body>
<div id="control-bar"></div>
<h1>Mask Type</h1>
<p class="prop-name">mask-type</p>
<div class="demos">
  <div class="demo-box" data-css-prop="mask-type" data-value="luminance">
    <div class="demo-area" style="display: flex; gap: 24px; align-items: flex-start;">
      <div><div class="svg-demo"><svg width="160" height="120" viewBox="0 0 160 120"><rect width="160" height="120" fill="#334155"/><text x="30" y="30" font-size="10" fill="#94a3b8" font-family="monospace">mask source</text><circle cx="80" cy="60" r="40" fill="black" opacity="0.5"/></svg></div><p class="section-label">SVG mask</p></div><div class="arrow-col">&rarr;</div>
      <svg style="width: 200px; height: 120px; mask-type: luminance;"><defs><mask id="typeMask" maskContentUnits="objectBoundingBox"><rect width="1" height="1" fill="white"/><circle cx="0.5" cy="0.5" r="0.3" fill="black"/></mask><linearGradient id="grad1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#e94560"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#00d2ff"/></linearGradient></defs><rect width="200" height="120" fill="url(#grad1)" mask="url(#typeMask)"/></svg>
    </div>
    <div class="label">mask-type: luminance</div>
  </div>
  <div class="demo-box" data-css-prop="mask-type" data-value="alpha">
    <div class="demo-area" style="display: flex; gap: 24px; align-items: flex-start;">
      <div><div class="svg-demo"><svg width="160" height="120" viewBox="0 0 160 120"><rect width="160" height="120" fill="#334155"/><text x="30" y="30" font-size="10" fill="#94a3b8" font-family="monospace">mask source</text><circle cx="80" cy="60" r="40" fill="black" opacity="0.5"/></svg></div><p class="section-label">SVG mask</p></div><div class="arrow-col">&rarr;</div>
      <svg style="width: 200px; height: 120px; mask-type: alpha;"><defs><mask id="typeMask" maskContentUnits="objectBoundingBox"><rect width="1" height="1" fill="white"/><circle cx="0.5" cy="0.5" r="0.3" fill="black"/></mask><linearGradient id="grad1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#e94560"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#00d2ff"/></linearGradient></defs><rect width="200" height="120" fill="url(#grad1)" mask="url(#typeMask)"/></svg>
    </div>
    <div class="label">mask-type: alpha</div>
  </div>
</div>
<script src="../interactive.js"></script>
</body>
</html>
