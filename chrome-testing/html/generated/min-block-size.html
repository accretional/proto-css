<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>min-block-size</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .tiny-content { font-size: 10px; }
</style>
</head>
<body>
<h1>Min Block Size</h1>
<p class="prop-name">min-block-size</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area" style="width: 100%; display: flex; align-items: flex-end; justify-content: center; min-height: 240px;">
      <div style="background: linear-gradient(180deg, #4fc3f7 0%, #7c4dff 100%); border-radius: 8px; width: 100%; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #fff; font-family: monospace; padding: 8px; min-block-size: auto;"><span class="tiny-content">Hi</span></div>
    </div>
    <div class="label">min-block-size: auto</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="width: 100%; display: flex; align-items: flex-end; justify-content: center; min-height: 240px;">
      <div style="background: linear-gradient(180deg, #4fc3f7 0%, #7c4dff 100%); border-radius: 8px; width: 100%; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #fff; font-family: monospace; padding: 8px; min-block-size: 10px;"><span class="tiny-content">Hi</span></div>
    </div>
    <div class="label">min-block-size: 10px</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="width: 100%; display: flex; align-items: flex-end; justify-content: center; min-height: 240px;">
      <div style="background: linear-gradient(180deg, #4fc3f7 0%, #7c4dff 100%); border-radius: 8px; width: 100%; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #fff; font-family: monospace; padding: 8px; min-block-size: min-content;"><span class="tiny-content">Hi</span></div>
    </div>
    <div class="label">min-block-size: min-content</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="width: 100%; display: flex; align-items: flex-end; justify-content: center; min-height: 240px;">
      <div style="background: linear-gradient(180deg, #4fc3f7 0%, #7c4dff 100%); border-radius: 8px; width: 100%; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #fff; font-family: monospace; padding: 8px; min-block-size: max-content;"><span class="tiny-content">Hi</span></div>
    </div>
    <div class="label">min-block-size: max-content</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="width: 100%; display: flex; align-items: flex-end; justify-content: center; min-height: 240px;">
      <div style="background: linear-gradient(180deg, #4fc3f7 0%, #7c4dff 100%); border-radius: 8px; width: 100%; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #fff; font-family: monospace; padding: 8px; min-block-size: fit-content(10px);"><span class="tiny-content">Hi</span></div>
    </div>
    <div class="label">min-block-size: fit-content(10px)</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="width: 100%; display: flex; align-items: flex-end; justify-content: center; min-height: 240px;">
      <div style="background: linear-gradient(180deg, #4fc3f7 0%, #7c4dff 100%); border-radius: 8px; width: 100%; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #fff; font-family: monospace; padding: 8px; min-block-size: calc-size(auto, 0);"><span class="tiny-content">Hi</span></div>
    </div>
    <div class="label">min-block-size: calc-size(auto, 0)</div>
  </div>
</div>
</body>
</html>
