<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>position-try-order</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .anchor-el { padding: 8px 18px; background: linear-gradient(135deg, #0f3460, #1a5276); border: 2px solid #3498db; border-radius: 8px; font-size: 12px; font-weight: 600; color: #7ec8e3; }
</style>
</head>
<body>
<h1>Position Try Order</h1>
<p class="prop-name">position-try-order</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area" style="width: 310px; height: 210px; position: relative; border: 2px solid rgba(255,255,255,0.1); border-radius: 8px; background: rgba(0,0,0,0.2);">
      <div class="anchor-el" style="position: absolute; top: 80px; left: 110px;">Anchor</div>
      <div style="position: absolute; padding: 6px 14px; background: linear-gradient(135deg, #e94560, #c23066); border: 2px solid rgba(255,255,255,0.3); border-radius: 8px; font-size: 11px; font-weight: 600; color: #fff; white-space: nowrap; top: 48px; left: 105px; position-try-order: normal;">chosen</div>
    </div>
    <div class="label">position-try-order: normal</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="width: 310px; height: 210px; position: relative; border: 2px solid rgba(255,255,255,0.1); border-radius: 8px; background: rgba(0,0,0,0.2);">
      <div class="anchor-el" style="position: absolute; top: 80px; left: 110px;">Anchor</div>
      <div style="position: absolute; padding: 6px 14px; background: linear-gradient(135deg, #e94560, #c23066); border: 2px solid rgba(255,255,255,0.3); border-radius: 8px; font-size: 11px; font-weight: 600; color: #fff; white-space: nowrap; top: 48px; left: 105px; position-try-order: most-width;">chosen</div>
    </div>
    <div class="label">position-try-order: most-width</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="width: 310px; height: 210px; position: relative; border: 2px solid rgba(255,255,255,0.1); border-radius: 8px; background: rgba(0,0,0,0.2);">
      <div class="anchor-el" style="position: absolute; top: 80px; left: 110px;">Anchor</div>
      <div style="position: absolute; padding: 6px 14px; background: linear-gradient(135deg, #e94560, #c23066); border: 2px solid rgba(255,255,255,0.3); border-radius: 8px; font-size: 11px; font-weight: 600; color: #fff; white-space: nowrap; top: 48px; left: 105px; position-try-order: most-height;">chosen</div>
    </div>
    <div class="label">position-try-order: most-height</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="width: 310px; height: 210px; position: relative; border: 2px solid rgba(255,255,255,0.1); border-radius: 8px; background: rgba(0,0,0,0.2);">
      <div class="anchor-el" style="position: absolute; top: 80px; left: 110px;">Anchor</div>
      <div style="position: absolute; padding: 6px 14px; background: linear-gradient(135deg, #e94560, #c23066); border: 2px solid rgba(255,255,255,0.3); border-radius: 8px; font-size: 11px; font-weight: 600; color: #fff; white-space: nowrap; top: 48px; left: 105px; position-try-order: most-block-size;">chosen</div>
    </div>
    <div class="label">position-try-order: most-block-size</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="width: 310px; height: 210px; position: relative; border: 2px solid rgba(255,255,255,0.1); border-radius: 8px; background: rgba(0,0,0,0.2);">
      <div class="anchor-el" style="position: absolute; top: 80px; left: 110px;">Anchor</div>
      <div style="position: absolute; padding: 6px 14px; background: linear-gradient(135deg, #e94560, #c23066); border: 2px solid rgba(255,255,255,0.3); border-radius: 8px; font-size: 11px; font-weight: 600; color: #fff; white-space: nowrap; top: 48px; left: 105px; position-try-order: most-inline-size;">chosen</div>
    </div>
    <div class="label">position-try-order: most-inline-size</div>
  </div>
</div>
</body>
</html>
