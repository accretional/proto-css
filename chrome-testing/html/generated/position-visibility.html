<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>position-visibility</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
  .anchor-el { position: absolute; top: 70px; left: 100px; padding: 6px 14px; background: linear-gradient(135deg, #0f3460, #1a5276); border: 2px solid #3498db; border-radius: 8px; font-size: 11px; font-weight: 600; color: #7ec8e3; }
</style>
</head>
<body>
<div id="control-bar"></div>
<h1>Position Visibility</h1>
<p class="prop-name">position-visibility</p>
<div class="demos">
  <div class="demo-box" data-css-prop="position-visibility" data-value="always">
    <div class="demo-area" style="width: 310px; height: 200px; position: relative; border: 2px solid rgba(255,255,255,0.1); border-radius: 8px; background: rgba(0,0,0,0.2); overflow: hidden;">
      <div class="anchor-el">Anchor</div>
      <div style="position: absolute; padding: 6px 14px; background: linear-gradient(135deg, #e94560, #c23066); border: 2px solid rgba(255,255,255,0.3); border-radius: 8px; font-size: 11px; font-weight: 600; color: #fff; white-space: nowrap; top: 38px; left: 95px; position-visibility: always;">Tooltip</div>
    </div>
    <div class="label">position-visibility: always</div>
  </div>
  <div class="demo-box" data-css-prop="position-visibility" data-value="anchors-valid">
    <div class="demo-area" style="width: 310px; height: 200px; position: relative; border: 2px solid rgba(255,255,255,0.1); border-radius: 8px; background: rgba(0,0,0,0.2); overflow: hidden;">
      <div class="anchor-el">Anchor</div>
      <div style="position: absolute; padding: 6px 14px; background: linear-gradient(135deg, #e94560, #c23066); border: 2px solid rgba(255,255,255,0.3); border-radius: 8px; font-size: 11px; font-weight: 600; color: #fff; white-space: nowrap; top: 38px; left: 95px; position-visibility: anchors-valid;">Tooltip</div>
    </div>
    <div class="label">position-visibility: anchors-valid</div>
  </div>
  <div class="demo-box" data-css-prop="position-visibility" data-value="anchors-visible">
    <div class="demo-area" style="width: 310px; height: 200px; position: relative; border: 2px solid rgba(255,255,255,0.1); border-radius: 8px; background: rgba(0,0,0,0.2); overflow: hidden;">
      <div class="anchor-el">Anchor</div>
      <div style="position: absolute; padding: 6px 14px; background: linear-gradient(135deg, #e94560, #c23066); border: 2px solid rgba(255,255,255,0.3); border-radius: 8px; font-size: 11px; font-weight: 600; color: #fff; white-space: nowrap; top: 38px; left: 95px; position-visibility: anchors-visible;">Tooltip</div>
    </div>
    <div class="label">position-visibility: anchors-visible</div>
  </div>
</div>
<script src="../interactive.js"></script>
</body>
</html>
