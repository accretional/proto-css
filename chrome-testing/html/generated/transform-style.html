<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>transform-style</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
  .child-front { position: absolute; width: 100%; height: 100%; background: rgba(52, 211, 153, 0.4); border: 2px solid #34d399; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: #34d399; transform: translateZ(40px); }
.child-back { position: absolute; width: 100%; height: 100%; background: rgba(59, 130, 246, 0.4); border: 2px solid #3b82f6; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: #3b82f6; transform: translateZ(-40px); }
</style>
</head>
<body>
<div id="control-bar"></div>
<h1>Transform Style</h1>
<p class="prop-name">transform-style</p>
<div class="demos">
  <div class="demo-box" data-css-prop="transform-style" data-value="flat">
    <div class="demo-area" style="width: 200px; height: 200px; perspective: 600px; display: flex; align-items: center; justify-content: center;">
      <div style="width: 150px; height: 150px; position: relative; transform: rotateY(35deg) rotateX(15deg); border: 2px solid rgba(233, 69, 96, 0.5); background: rgba(233, 69, 96, 0.1); transform-style: flat;"><div class="child-front">Front Z+40</div><div class="child-back">Back Z-40</div></div>
    </div>
    <div class="label">transform-style: flat</div>
  </div>
  <div class="demo-box" data-css-prop="transform-style" data-value="preserve-3d">
    <div class="demo-area" style="width: 200px; height: 200px; perspective: 600px; display: flex; align-items: center; justify-content: center;">
      <div style="width: 150px; height: 150px; position: relative; transform: rotateY(35deg) rotateX(15deg); border: 2px solid rgba(233, 69, 96, 0.5); background: rgba(233, 69, 96, 0.1); transform-style: preserve-3d;"><div class="child-front">Front Z+40</div><div class="child-back">Back Z-40</div></div>
    </div>
    <div class="label">transform-style: preserve-3d</div>
  </div>
</div>
<script src="../interactive.js"></script>
</body>
</html>
