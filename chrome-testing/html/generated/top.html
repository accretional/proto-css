<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>top</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
</style>
</head>
<body>
<h1>Top</h1>
<p class="prop-name">top</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area" style="width: 160px; height: 160px; background: #16213e; border-radius: 10px; position: relative; border: 1px dashed #394867;">
      <div style="position: absolute; top: 0; left: 0; right: 0; border-top: 1px dashed #3a7bd5; pointer-events: none;"></div>
      <div style="width: 50px; height: 50px; background: #e94560; border-radius: 6px; position: relative; top: auto;"></div>
    </div>
    <div class="label">top: auto</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="width: 160px; height: 160px; background: #16213e; border-radius: 10px; position: relative; border: 1px dashed #394867;">
      <div style="position: absolute; top: 0; left: 0; right: 0; border-top: 1px dashed #3a7bd5; pointer-events: none;"></div>
      <div style="width: 50px; height: 50px; background: #e94560; border-radius: 6px; position: relative; top: 10px;"></div>
    </div>
    <div class="label">top: 10px</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="width: 160px; height: 160px; background: #16213e; border-radius: 10px; position: relative; border: 1px dashed #394867;">
      <div style="position: absolute; top: 0; left: 0; right: 0; border-top: 1px dashed #3a7bd5; pointer-events: none;"></div>
      <div style="width: 50px; height: 50px; background: #e94560; border-radius: 6px; position: relative; top: anchor(top);"></div>
    </div>
    <div class="label">top: anchor(top)</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="width: 160px; height: 160px; background: #16213e; border-radius: 10px; position: relative; border: 1px dashed #394867;">
      <div style="position: absolute; top: 0; left: 0; right: 0; border-top: 1px dashed #3a7bd5; pointer-events: none;"></div>
      <div style="width: 50px; height: 50px; background: #e94560; border-radius: 6px; position: relative; top: anchor-size(width);"></div>
    </div>
    <div class="label">top: anchor-size(width)</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="width: 160px; height: 160px; background: #16213e; border-radius: 10px; position: relative; border: 1px dashed #394867;">
      <div style="position: absolute; top: 0; left: 0; right: 0; border-top: 1px dashed #3a7bd5; pointer-events: none;"></div>
      <div style="width: 50px; height: 50px; background: #e94560; border-radius: 6px; position: relative; top: 25%;"></div>
    </div>
    <div class="label">top: 25%</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="width: 160px; height: 160px; background: #16213e; border-radius: 10px; position: relative; border: 1px dashed #394867;">
      <div style="position: absolute; top: 0; left: 0; right: 0; border-top: 1px dashed #3a7bd5; pointer-events: none;"></div>
      <div style="width: 50px; height: 50px; background: #e94560; border-radius: 6px; position: relative; top: anchor(bottom);"></div>
    </div>
    <div class="label">top: anchor(bottom)</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="width: 160px; height: 160px; background: #16213e; border-radius: 10px; position: relative; border: 1px dashed #394867;">
      <div style="position: absolute; top: 0; left: 0; right: 0; border-top: 1px dashed #3a7bd5; pointer-events: none;"></div>
      <div style="width: 50px; height: 50px; background: #e94560; border-radius: 6px; position: relative; top: anchor-size(height);"></div>
    </div>
    <div class="label">top: anchor-size(height)</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="width: 160px; height: 160px; background: #16213e; border-radius: 10px; position: relative; border: 1px dashed #394867;">
      <div style="position: absolute; top: 0; left: 0; right: 0; border-top: 1px dashed #3a7bd5; pointer-events: none;"></div>
      <div style="width: 50px; height: 50px; background: #e94560; border-radius: 6px; position: relative; top: 50%;"></div>
    </div>
    <div class="label">top: 50%</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="width: 160px; height: 160px; background: #16213e; border-radius: 10px; position: relative; border: 1px dashed #394867;">
      <div style="position: absolute; top: 0; left: 0; right: 0; border-top: 1px dashed #3a7bd5; pointer-events: none;"></div>
      <div style="width: 50px; height: 50px; background: #e94560; border-radius: 6px; position: relative; top: 100%;"></div>
    </div>
    <div class="label">top: 100%</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="width: 160px; height: 160px; background: #16213e; border-radius: 10px; position: relative; border: 1px dashed #394867;">
      <div style="position: absolute; top: 0; left: 0; right: 0; border-top: 1px dashed #3a7bd5; pointer-events: none;"></div>
      <div style="width: 50px; height: 50px; background: #e94560; border-radius: 6px; position: relative; top: 0;"></div>
    </div>
    <div class="label">top: 0</div>
  </div>
</div>
</body>
</html>
