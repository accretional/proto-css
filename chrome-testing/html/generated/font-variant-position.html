<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>font-variant-position</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
  .pos { color: #a78bfa; }
</style>
</head>
<body>
<h1>Font Variant Position</h1>
<p class="prop-name">font-variant-position</p>
<div class="demos">
  <div class="demo-box" data-css-prop="font-variant-position" data-value="normal">
    <div class="demo-area">
      <div style="font-size: 36px; color: #fff; line-height: 1.8; font-variant-position: normal;">H<span class="pos">2</span>O &nbsp;&nbsp; CO<span class="pos">2</span> &nbsp;&nbsp; x<span class="pos">n</span></div>
    </div>
    <div class="label">font-variant-position: normal</div>
  </div>
  <div class="demo-box" data-css-prop="font-variant-position" data-value="sub">
    <div class="demo-area">
      <div style="font-size: 36px; color: #fff; line-height: 1.8; font-variant-position: sub;">H<span class="pos">2</span>O &nbsp;&nbsp; CO<span class="pos">2</span> &nbsp;&nbsp; x<span class="pos">n</span></div>
    </div>
    <div class="label">font-variant-position: sub</div>
  </div>
  <div class="demo-box" data-css-prop="font-variant-position" data-value="super">
    <div class="demo-area">
      <div style="font-size: 36px; color: #fff; line-height: 1.8; font-variant-position: super;">H<span class="pos">2</span>O &nbsp;&nbsp; CO<span class="pos">2</span> &nbsp;&nbsp; x<span class="pos">n</span></div>
    </div>
    <div class="label">font-variant-position: super</div>
  </div>
</div>
<div id="control-bar"></div>
<script src="../interactive.js"></script>
</body>
</html>
