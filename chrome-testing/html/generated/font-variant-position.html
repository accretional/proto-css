<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>font-variant-position</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .pos { color: #a78bfa; }
</style>
</head>
<body>
<h1>Font Variant Position</h1>
<p class="prop-name">font-variant-position</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area">
      <div style="font-size: 36px; color: #fff; line-height: 1.8; font-variant-position: normal;">H<span class="pos">2</span>O &amp;nbsp; CO<span class="pos">2</span></div>
    </div>
    <div class="label">font-variant-position: normal</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="font-size: 36px; color: #fff; line-height: 1.8; font-variant-position: sub;">H<span class="pos">2</span>O &amp;nbsp; CO<span class="pos">2</span></div>
    </div>
    <div class="label">font-variant-position: sub</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="font-size: 36px; color: #fff; line-height: 1.8; font-variant-position: super;">H<span class="pos">2</span>O &amp;nbsp; CO<span class="pos">2</span></div>
    </div>
    <div class="label">font-variant-position: super</div>
  </div>
</div>
</body>
</html>
