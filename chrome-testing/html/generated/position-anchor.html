<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>position-anchor</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .anchor-el { position: absolute; width: 90px; height: 40px; background: linear-gradient(135deg, #0f3460, #1a5276); border: 2px solid #3498db; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: #7ec8e3; }
</style>
</head>
<body>
<h1>Position Anchor</h1>
<p class="prop-name">position-anchor</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area" style="width: 310px; height: 200px; position: relative; border: 2px dashed rgba(255,255,255,0.12); border-radius: 8px; background: #16213e; padding: 24px;">
      <div class="anchor-el" style="position: absolute; top: 70px; left: 30px;">--anchor</div>
      <div style="position: absolute; padding: 6px 14px; background: linear-gradient(135deg, #e94560, #c23066); border: 2px solid rgba(255,255,255,0.3); border-radius: 8px; font-size: 11px; font-weight: 600; color: #fff; white-space: nowrap; top: 30px; left: 40px; position-anchor: normal;">Tooltip</div>
    </div>
    <div class="label">position-anchor: normal</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="width: 310px; height: 200px; position: relative; border: 2px dashed rgba(255,255,255,0.12); border-radius: 8px; background: #16213e; padding: 24px;">
      <div class="anchor-el" style="position: absolute; top: 70px; left: 30px;">--anchor</div>
      <div style="position: absolute; padding: 6px 14px; background: linear-gradient(135deg, #e94560, #c23066); border: 2px solid rgba(255,255,255,0.3); border-radius: 8px; font-size: 11px; font-weight: 600; color: #fff; white-space: nowrap; top: 30px; left: 40px; position-anchor: none;">Tooltip</div>
    </div>
    <div class="label">position-anchor: none</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="width: 310px; height: 200px; position: relative; border: 2px dashed rgba(255,255,255,0.12); border-radius: 8px; background: #16213e; padding: 24px;">
      <div class="anchor-el" style="position: absolute; top: 70px; left: 30px;">--anchor</div>
      <div style="position: absolute; padding: 6px 14px; background: linear-gradient(135deg, #e94560, #c23066); border: 2px solid rgba(255,255,255,0.3); border-radius: 8px; font-size: 11px; font-weight: 600; color: #fff; white-space: nowrap; top: 30px; left: 40px; position-anchor: auto;">Tooltip</div>
    </div>
    <div class="label">position-anchor: auto</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="width: 310px; height: 200px; position: relative; border: 2px dashed rgba(255,255,255,0.12); border-radius: 8px; background: #16213e; padding: 24px;">
      <div class="anchor-el" style="position: absolute; top: 70px; left: 30px;">--anchor</div>
      <div style="position: absolute; padding: 6px 14px; background: linear-gradient(135deg, #e94560, #c23066); border: 2px solid rgba(255,255,255,0.3); border-radius: 8px; font-size: 11px; font-weight: 600; color: #fff; white-space: nowrap; top: 30px; left: 40px; position-anchor: --my-anchor;">Tooltip</div>
    </div>
    <div class="label">position-anchor: --my-anchor</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="width: 310px; height: 200px; position: relative; border: 2px dashed rgba(255,255,255,0.12); border-radius: 8px; background: #16213e; padding: 24px;">
      <div class="anchor-el" style="position: absolute; top: 70px; left: 30px;">--anchor</div>
      <div style="position: absolute; padding: 6px 14px; background: linear-gradient(135deg, #e94560, #c23066); border: 2px solid rgba(255,255,255,0.3); border-radius: 8px; font-size: 11px; font-weight: 600; color: #fff; white-space: nowrap; top: 30px; left: 40px; position-anchor: match-parent;">Tooltip</div>
    </div>
    <div class="label">position-anchor: match-parent</div>
  </div>
</div>
</body>
</html>
