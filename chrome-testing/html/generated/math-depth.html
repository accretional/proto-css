<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>math-depth</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
</style>
</head>
<body>
<div id="control-bar"></div>
<h1>Math Depth</h1>
<p class="prop-name">math-depth</p>
<div class="demos">
  <div class="demo-box" data-css-prop="math-depth" data-value="auto-add">
    <div class="demo-area">
      <math style="display: block; background: #0f3460; border-radius: 8px; padding: 20px 24px; min-height: 100px; font-size: 36px; color: #e0e0e0; math-depth: auto-add;"><mfrac><mrow><mi>x</mi><mo>+</mo><mfrac><mi>a</mi><mrow><mi>b</mi><mo>+</mo><mfrac><mi>c</mi><mi>d</mi></mfrac></mrow></mfrac></mrow><mrow><mi>y</mi><mo>+</mo><mfrac><mi>p</mi><mi>q</mi></mfrac></mrow></mfrac></math>
    </div>
    <div class="label">math-depth: auto-add</div>
  </div>
  <div class="demo-box" data-css-prop="math-depth" data-value="add(1)">
    <div class="demo-area">
      <math style="display: block; background: #0f3460; border-radius: 8px; padding: 20px 24px; min-height: 100px; font-size: 36px; color: #e0e0e0; math-depth: add(1);"><mfrac><mrow><mi>x</mi><mo>+</mo><mfrac><mi>a</mi><mrow><mi>b</mi><mo>+</mo><mfrac><mi>c</mi><mi>d</mi></mfrac></mrow></mfrac></mrow><mrow><mi>y</mi><mo>+</mo><mfrac><mi>p</mi><mi>q</mi></mfrac></mrow></mfrac></math>
    </div>
    <div class="label">math-depth: add(1)</div>
  </div>
  <div class="demo-box" data-css-prop="math-depth" data-value="1">
    <div class="demo-area">
      <math style="display: block; background: #0f3460; border-radius: 8px; padding: 20px 24px; min-height: 100px; font-size: 36px; color: #e0e0e0; math-depth: 1;"><mfrac><mrow><mi>x</mi><mo>+</mo><mfrac><mi>a</mi><mrow><mi>b</mi><mo>+</mo><mfrac><mi>c</mi><mi>d</mi></mfrac></mrow></mfrac></mrow><mrow><mi>y</mi><mo>+</mo><mfrac><mi>p</mi><mi>q</mi></mfrac></mrow></mfrac></math>
    </div>
    <div class="label">math-depth: 1</div>
  </div>
  <div class="demo-box" data-css-prop="math-depth" data-value="add(2)">
    <div class="demo-area">
      <math style="display: block; background: #0f3460; border-radius: 8px; padding: 20px 24px; min-height: 100px; font-size: 36px; color: #e0e0e0; math-depth: add(2);"><mfrac><mrow><mi>x</mi><mo>+</mo><mfrac><mi>a</mi><mrow><mi>b</mi><mo>+</mo><mfrac><mi>c</mi><mi>d</mi></mfrac></mrow></mfrac></mrow><mrow><mi>y</mi><mo>+</mo><mfrac><mi>p</mi><mi>q</mi></mfrac></mrow></mfrac></math>
    </div>
    <div class="label">math-depth: add(2)</div>
  </div>
  <div class="demo-box" data-css-prop="math-depth" data-value="2">
    <div class="demo-area">
      <math style="display: block; background: #0f3460; border-radius: 8px; padding: 20px 24px; min-height: 100px; font-size: 36px; color: #e0e0e0; math-depth: 2;"><mfrac><mrow><mi>x</mi><mo>+</mo><mfrac><mi>a</mi><mrow><mi>b</mi><mo>+</mo><mfrac><mi>c</mi><mi>d</mi></mfrac></mrow></mfrac></mrow><mrow><mi>y</mi><mo>+</mo><mfrac><mi>p</mi><mi>q</mi></mfrac></mrow></mfrac></math>
    </div>
    <div class="label">math-depth: 2</div>
  </div>
  <div class="demo-box" data-css-prop="math-depth" data-value="add(5)">
    <div class="demo-area">
      <math style="display: block; background: #0f3460; border-radius: 8px; padding: 20px 24px; min-height: 100px; font-size: 36px; color: #e0e0e0; math-depth: add(5);"><mfrac><mrow><mi>x</mi><mo>+</mo><mfrac><mi>a</mi><mrow><mi>b</mi><mo>+</mo><mfrac><mi>c</mi><mi>d</mi></mfrac></mrow></mfrac></mrow><mrow><mi>y</mi><mo>+</mo><mfrac><mi>p</mi><mi>q</mi></mfrac></mrow></mfrac></math>
    </div>
    <div class="label">math-depth: add(5)</div>
  </div>
</div>
<script src="../interactive.js"></script>
</body>
</html>
