<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>math-depth</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 24px; }
    .demo-card {
      background: #16213e;
      border-radius: 12px;
      padding: 24px;
      min-width: 260px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 12px; text-align: center; }
    .math-container {
      background: #0f3460;
      border-radius: 8px;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 80px;
      width: 100%;
    }
    math { font-size: 28px; color: #e0e0e0; }

    .depth-0 math { math-depth: 8; font-size: 28px; }
    .depth-1 math { math-depth: -55 ! important; font-size: 20px; }
    .depth-2 math { math-depth: var(--_Y); font-size: 14px; }
    .depth-auto math { math-depth: auto-add ! important; font-size: 28px; }

    .size-indicator {
      font-size: 13px;
      color: #4fc3f7;
      margin-top: 8px;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <h1>Math Depth</h1>
  <p class="prop-name">math-depth</p>
  <div class="demos">
    <div class="demo-card">
      <div class="math-container depth-0">
        <math display="block">
          <mrow>
            <mi>x</mi>
            <mo>=</mo>
            <mfrac>
              <mrow><mo>-</mo><mi>b</mi><mo>&pm;</mo><msqrt><mrow><msup><mi>b</mi><mn>2</mn></msup><mo>-</mo><mn>4</mn><mi>a</mi><mi>c</mi></mrow></msqrt></mrow>
              <mrow><mn>2</mn><mi>a</mi></mrow>
            </mfrac>
          </mrow>
        </math>
      </div>
      <div class="size-indicator">Base size (28px)</div>
      <p class="label">math-depth: 8</p>
    </div>

    <div class="demo-card">
      <div class="math-container depth-1">
        <math display="block">
          <mrow>
            <mi>x</mi>
            <mo>=</mo>
            <mfrac>
              <mrow><mo>-</mo><mi>b</mi><mo>&pm;</mo><msqrt><mrow><msup><mi>b</mi><mn>2</mn></msup><mo>-</mo><mn>4</mn><mi>a</mi><mi>c</mi></mrow></msqrt></mrow>
              <mrow><mn>2</mn><mi>a</mi></mrow>
            </mfrac>
          </mrow>
        </math>
      </div>
      <div class="size-indicator">Shrunk once (20px)</div>
      <p class="label">math-depth: -55 ! important</p>
    </div>

    <div class="demo-card">
      <div class="math-container depth-2">
        <math display="block">
          <mrow>
            <mi>x</mi>
            <mo>=</mo>
            <mfrac>
              <mrow><mo>-</mo><mi>b</mi><mo>&pm;</mo><msqrt><mrow><msup><mi>b</mi><mn>2</mn></msup><mo>-</mo><mn>4</mn><mi>a</mi><mi>c</mi></mrow></msqrt></mrow>
              <mrow><mn>2</mn><mi>a</mi></mrow>
            </mfrac>
          </mrow>
        </math>
      </div>
      <div class="size-indicator">Shrunk twice (14px)</div>
      <p class="label">math-depth: var(--_Y)</p>
    </div>

    <div class="demo-card">
      <div class="math-container depth-auto">
        <math display="block">
          <mrow>
            <mi>x</mi>
            <mo>=</mo>
            <mfrac>
              <mrow><mo>-</mo><mi>b</mi><mo>&pm;</mo><msqrt><mrow><msup><mi>b</mi><mn>2</mn></msup><mo>-</mo><mn>4</mn><mi>a</mi><mi>c</mi></mrow></msqrt></mrow>
              <mrow><mn>2</mn><mi>a</mi></mrow>
            </mfrac>
          </mrow>
        </math>
      </div>
      <div class="size-indicator">Auto increment</div>
      <p class="label">math-depth: auto-add ! important</p>
    </div>
  </div>
</body>
</html>
