<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>math-depth</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
</style>
</head>
<body>
<h1>Math Depth</h1>
<p class="prop-name">math-depth</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area">
      <math style="display: block; background: #0f3460; border-radius: 8px; padding: 20px 24px; min-height: 80px; font-size: 28px; color: #e0e0e0; math-depth: auto-add;"><mfrac><mi>x</mi><mrow><mi>y</mi><mfrac><mi>a</mi><mi>b</mi></mfrac></mrow></mfrac></math>
    </div>
    <div class="label">math-depth: auto-add</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <math style="display: block; background: #0f3460; border-radius: 8px; padding: 20px 24px; min-height: 80px; font-size: 28px; color: #e0e0e0; math-depth: add(1);"><mfrac><mi>x</mi><mrow><mi>y</mi><mfrac><mi>a</mi><mi>b</mi></mfrac></mrow></mfrac></math>
    </div>
    <div class="label">math-depth: add(1)</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <math style="display: block; background: #0f3460; border-radius: 8px; padding: 20px 24px; min-height: 80px; font-size: 28px; color: #e0e0e0; math-depth: 1;"><mfrac><mi>x</mi><mrow><mi>y</mi><mfrac><mi>a</mi><mi>b</mi></mfrac></mrow></mfrac></math>
    </div>
    <div class="label">math-depth: 1</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <math style="display: block; background: #0f3460; border-radius: 8px; padding: 20px 24px; min-height: 80px; font-size: 28px; color: #e0e0e0; math-depth: add(2);"><mfrac><mi>x</mi><mrow><mi>y</mi><mfrac><mi>a</mi><mi>b</mi></mfrac></mrow></mfrac></math>
    </div>
    <div class="label">math-depth: add(2)</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <math style="display: block; background: #0f3460; border-radius: 8px; padding: 20px 24px; min-height: 80px; font-size: 28px; color: #e0e0e0; math-depth: 2;"><mfrac><mi>x</mi><mrow><mi>y</mi><mfrac><mi>a</mi><mi>b</mi></mfrac></mrow></mfrac></math>
    </div>
    <div class="label">math-depth: 2</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <math style="display: block; background: #0f3460; border-radius: 8px; padding: 20px 24px; min-height: 80px; font-size: 28px; color: #e0e0e0; math-depth: add(5);"><mfrac><mi>x</mi><mrow><mi>y</mi><mfrac><mi>a</mi><mi>b</mi></mfrac></mrow></mfrac></math>
    </div>
    <div class="label">math-depth: add(5)</div>
  </div>
</div>
</body>
</html>
