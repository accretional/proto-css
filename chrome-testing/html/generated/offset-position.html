<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>offset-position</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .crosshair-h { position: absolute; left: 0; right: 0; top: 50%; border-top: 1px dashed #3a4a5e; }
.crosshair-v { position: absolute; top: 0; bottom: 0; left: 50%; border-left: 1px dashed #3a4a5e; }
</style>
</head>
<body>
<h1>Offset Position</h1>
<p class="prop-name">offset-position</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area" style="width: 240px; height: 240px; position: relative; background: repeating-linear-gradient(0deg, transparent, transparent 59px, #2a2a4a 59px, #2a2a4a 60px), repeating-linear-gradient(90deg, transparent, transparent 59px, #2a2a4a 59px, #2a2a4a 60px); border: 1px solid #2a2a4a;">
      <div class="crosshair-h"></div><div class="crosshair-v"></div>
      <div style="width: 24px; height: 24px; background: #e94560; border-radius: 4px; position: absolute; offset-path: ray(0deg closest-side); offset-distance: 50%; box-shadow: 0 0 10px rgba(233,69,96,0.5); offset-position: normal;"></div>
    </div>
    <div class="label">offset-position: normal</div>
  </div>
  <div class="demo-box">

</html>
