<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>box-ordinal-group</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
  .child { -webkit-box-flex: 1; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 16px; font-weight: bold; color: #fff; border-right: 2px solid #1a1a2e; }
.child small { font-size: 10px; font-weight: normal; opacity: 0.7; margin-top: 2px; }
.child:nth-child(1) { background: #e94560; }
.child:nth-child(2) { background: #0f3460; }
.child:nth-child(3) { background: #53d769; color: #1a1a2e; }
.child:nth-child(4) { background: #fbbf24; color: #1a1a2e; }
</style>
</head>
<body>
<div id="control-bar"></div>
<h1>Box Ordinal Group (deprecated)</h1>
<p class="prop-name">box-ordinal-group</p>
<div class="demos">
  <div class="demo-box" data-css-prop="-webkit-box-ordinal-group" data-value="1" data-target-selector="&gt; *:first-child" data-target-id="t0">
    <div class="demo-area">
      <style>#t0 > *:first-child { -webkit-box-ordinal-group: 1; }</style>
      <div id="t0" style="display: -webkit-box; -webkit-box-orient: horizontal; width: 100%; max-width: 800px; height: 80px; background: #16213e; border: 2px solid #333;"><div class="child">A <small>ordinal</small></div><div class="child">B <small>ordinal</small></div><div class="child">C <small>ordinal</small></div><div class="child">D <small>ordinal</small></div></div>
    </div>
    <div class="label">box-ordinal-group: 1</div>
  </div>
  <div class="demo-box" data-css-prop="-webkit-box-ordinal-group" data-value="2" data-target-selector="&gt; *:first-child" data-target-id="t1">
    <div class="demo-area">
      <style>#t1 > *:first-child { -webkit-box-ordinal-group: 2; }</style>
      <div id="t1" style="display: -webkit-box; -webkit-box-orient: horizontal; width: 100%; max-width: 800px; height: 80px; background: #16213e; border: 2px solid #333;"><div class="child">A <small>ordinal</small></div><div class="child">B <small>ordinal</small></div><div class="child">C <small>ordinal</small></div><div class="child">D <small>ordinal</small></div></div>
    </div>
    <div class="label">box-ordinal-group: 2</div>
  </div>
  <div class="demo-box" data-css-prop="-webkit-box-ordinal-group" data-value="5" data-target-selector="&gt; *:first-child" data-target-id="t2">
    <div class="demo-area">
      <style>#t2 > *:first-child { -webkit-box-ordinal-group: 5; }</style>
      <div id="t2" style="display: -webkit-box; -webkit-box-orient: horizontal; width: 100%; max-width: 800px; height: 80px; background: #16213e; border: 2px solid #333;"><div class="child">A <small>ordinal</small></div><div class="child">B <small>ordinal</small></div><div class="child">C <small>ordinal</small></div><div class="child">D <small>ordinal</small></div></div>
    </div>
    <div class="label">box-ordinal-group: 5</div>
  </div>
  <div class="demo-box" data-css-prop="-webkit-box-ordinal-group" data-value="0" data-target-selector="&gt; *:first-child" data-target-id="t3">
    <div class="demo-area">
      <style>#t3 > *:first-child { -webkit-box-ordinal-group: 0; }</style>
      <div id="t3" style="display: -webkit-box; -webkit-box-orient: horizontal; width: 100%; max-width: 800px; height: 80px; background: #16213e; border: 2px solid #333;"><div class="child">A <small>ordinal</small></div><div class="child">B <small>ordinal</small></div><div class="child">C <small>ordinal</small></div><div class="child">D <small>ordinal</small></div></div>
    </div>
    <div class="label">box-ordinal-group: 0</div>
  </div>
</div>
<script src="../interactive.js"></script>
</body>
</html>
