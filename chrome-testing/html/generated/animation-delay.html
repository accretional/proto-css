<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>animation-delay</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
  @keyframes slideAcross {
  from { left: 0; background: #e94560; }
  50% { background: #3498db; }
  to { left: calc(100% - 48px); background: #2ecc71; }
}
</style>
</head>
<body>
<h1>Animation Delay</h1>
<p class="prop-name">animation-delay</p>
<div class="demos">
  <div class="demo-box" data-css-prop="animation-delay" data-value="0s">
    <div class="demo-area" style="position: relative; height: 64px; background: #0f3460; border-radius: 8px; overflow: hidden;">
      <div style="width: 48px; height: 48px; border-radius: 8px; position: absolute; left: 0; top: 50%; transform: translateY(-50%); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; color: #fff; background: #e94560; animation: slideAcross 6s linear infinite; animation-delay: 0s;"></div>
    </div>
    <div class="label">animation-delay: 0s</div>
  </div>
  <div class="demo-box" data-css-prop="animation-delay" data-value="var(--my-var)">
    <div class="demo-area" style="position: relative; height: 64px; background: #0f3460; border-radius: 8px; overflow: hidden;">
      <div style="width: 48px; height: 48px; border-radius: 8px; position: absolute; left: 0; top: 50%; transform: translateY(-50%); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; color: #fff; background: #e94560; animation: slideAcross 6s linear infinite; animation-delay: var(--my-var);"></div>
    </div>
    <div class="label">animation-delay: var(--my-var)</div>
  </div>
  <div class="demo-box" data-css-prop="animation-delay" data-value="+0s">
    <div class="demo-area" style="position: relative; height: 64px; background: #0f3460; border-radius: 8px; overflow: hidden;">
      <div style="width: 48px; height: 48px; border-radius: 8px; position: absolute; left: 0; top: 50%; transform: translateY(-50%); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; color: #fff; background: #e94560; animation: slideAcross 6s linear infinite; animation-delay: +0s;"></div>
    </div>
    <div class="label">animation-delay: +0s</div>
  </div>
  <div class="demo-box" data-css-prop="animation-delay" data-value="-0s">
    <div class="demo-area" style="position: relative; height: 64px; background: #0f3460; border-radius: 8px; overflow: hidden;">
      <div style="width: 48px; height: 48px; border-radius: 8px; position: absolute; left: 0; top: 50%; transform: translateY(-50%); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; color: #fff; background: #e94560; animation: slideAcross 6s linear infinite; animation-delay: -0s;"></div>
    </div>
    <div class="label">animation-delay: -0s</div>
  </div>
  <div class="demo-box" data-css-prop="animation-delay" data-value="1s">
    <div class="demo-area" style="position: relative; height: 64px; background: #0f3460; border-radius: 8px; overflow: hidden;">
      <div style="width: 48px; height: 48px; border-radius: 8px; position: absolute; left: 0; top: 50%; transform: translateY(-50%); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; color: #fff; background: #e94560; animation: slideAcross 6s linear infinite; animation-delay: 1s;"></div>
    </div>
    <div class="label">animation-delay: 1s</div>
  </div>
  <div class="demo-box" data-css-prop="animation-delay" data-value="+1s">
    <div class="demo-area" style="position: relative; height: 64px; background: #0f3460; border-radius: 8px; overflow: hidden;">
      <div style="width: 48px; height: 48px; border-radius: 8px; position: absolute; left: 0; top: 50%; transform: translateY(-50%); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; color: #fff; background: #e94560; animation: slideAcross 6s linear infinite; animation-delay: +1s;"></div>
    </div>
    <div class="label">animation-delay: +1s</div>
  </div>
  <div class="demo-box" data-css-prop="animation-delay" data-value="-1s">
    <div class="demo-area" style="position: relative; height: 64px; background: #0f3460; border-radius: 8px; overflow: hidden;">
      <div style="width: 48px; height: 48px; border-radius: 8px; position: absolute; left: 0; top: 50%; transform: translateY(-50%); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; color: #fff; background: #e94560; animation: slideAcross 6s linear infinite; animation-delay: -1s;"></div>
    </div>
    <div class="label">animation-delay: -1s</div>
  </div>
  <div class="demo-box" data-css-prop="animation-delay" data-value="2s">
    <div class="demo-area" style="position: relative; height: 64px; background: #0f3460; border-radius: 8px; overflow: hidden;">
      <div style="width: 48px; height: 48px; border-radius: 8px; position: absolute; left: 0; top: 50%; transform: translateY(-50%); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; color: #fff; background: #e94560; animation: slideAcross 6s linear infinite; animation-delay: 2s;"></div>
    </div>
    <div class="label">animation-delay: 2s</div>
  </div>
</div>
<div id="control-bar"></div>
<script src="../interactive.js"></script>
</body>
</html>
