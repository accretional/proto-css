<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>animation-delay</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  @keyframes slideAcross {
  from { left: 0; }
  to { left: calc(100% - 48px); }
}
</style>
</head>
<body>
<h1>Animation Delay</h1>
<p class="prop-name">animation-delay</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area" style="position: relative; height: 64px; background: #0f3460; border-radius: 8px; overflow: hidden;">
      <div style="width: 48px; height: 48px; border-radius: 8px; position: absolute; left: 0; top: 50%; transform: translateY(-50%); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; color: #fff; background: #e94560; animation: slideAcross 4s linear infinite; animation-delay: 0s;"></div>
    </div>
    <div class="label">animation-delay: 0s</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="position: relative; height: 64px; background: #0f3460; border-radius: 8px; overflow: hidden;">
      <div style="width: 48px; height: 48px; border-radius: 8px; position: absolute; left: 0; top: 50%; transform: translateY(-50%); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; color: #fff; background: #e94560; animation: slideAcross 4s linear infinite; animation-delay: var(--my-var);"></div>
    </div>
    <div class="label">animation-delay: var(--my-var)</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="position: relative; height: 64px; background: #0f3460; border-radius: 8px; overflow: hidden;">
      <div style="width: 48px; height: 48px; border-radius: 8px; position: absolute; left: 0; top: 50%; transform: translateY(-50%); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; color: #fff; background: #e94560; animation: slideAcross 4s linear infinite; animation-delay: +0s;"></div>
    </div>
    <div class="label">animation-delay: +0s</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="position: relative; height: 64px; background: #0f3460; border-radius: 8px; overflow: hidden;">
      <div style="width: 48px; height: 48px; border-radius: 8px; position: absolute; left: 0; top: 50%; transform: translateY(-50%); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; color: #fff; background: #e94560; animation: slideAcross 4s linear infinite; animation-delay: var(--my-var, 0);"></div>
    </div>
    <div class="label">animation-delay: var(--my-var, 0)</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="position: relative; height: 64px; background: #0f3460; border-radius: 8px; overflow: hidden;">
      <div style="width: 48px; height: 48px; border-radius: 8px; position: absolute; left: 0; top: 50%; transform: translateY(-50%); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; color: #fff; background: #e94560; animation: slideAcross 4s linear infinite; animation-delay: -0s;"></div>
    </div>
    <div class="label">animation-delay: -0s</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="position: relative; height: 64px; background: #0f3460; border-radius: 8px; overflow: hidden;">
      <div style="width: 48px; height: 48px; border-radius: 8px; position: absolute; left: 0; top: 50%; transform: translateY(-50%); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; color: #fff; background: #e94560; animation: slideAcross 4s linear infinite; animation-delay: var(--my-var, 0%);"></div>
    </div>
    <div class="label">animation-delay: var(--my-var, 0%)</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="position: relative; height: 64px; background: #0f3460; border-radius: 8px; overflow: hidden;">
      <div style="width: 48px; height: 48px; border-radius: 8px; position: absolute; left: 0; top: 50%; transform: translateY(-50%); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; color: #fff; background: #e94560; animation: slideAcross 4s linear infinite; animation-delay: 1s;"></div>
    </div>
    <div class="label">animation-delay: 1s</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="position: relative; height: 64px; background: #0f3460; border-radius: 8px; overflow: hidden;">
      <div style="width: 48px; height: 48px; border-radius: 8px; position: absolute; left: 0; top: 50%; transform: translateY(-50%); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; color: #fff; background: #e94560; animation: slideAcross 4s linear infinite; animation-delay: +1s;"></div>
    </div>
    <div class="label">animation-delay: +1s</div>
  </div>
</div>
</body>
</html>
