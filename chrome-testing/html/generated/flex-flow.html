<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>flex-flow</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-direction: column; gap: 20px; }
    .demo-block { display: flex; flex-direction: column; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-bottom: 6px; }
    .container {
      display: flex;
      background: #16213e;
      border-radius: 8px;
      padding: 14px;
      gap: 8px;
      width: 100%;
      min-height: 190px;
      align-content: flex-start;
    }
    .item {
      background: #0f3460;
      border: 2px solid #f72585;
      border-radius: 6px;
      width: 110px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      color: #f72585;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <h1>Flex Flow</h1>
  <p class="prop-name">flex-flow</p>
  <div class="demos">
    <div class="demo-block">
      <div class="label">flex-flow: wrap ! important</div>
      <div class="container" style="flex-flow: wrap ! important;">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
        <div class="item">7</div>
        <div class="item">8</div>
        <div class="item">9</div>
        <div class="item">10</div>
      </div>
    </div>
    <div class="demo-block">
      <div class="label">flex-flow: column nowrap</div>
      <div class="container" style="flex-flow: column nowrap; height: 190px; overflow: hidden;">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
      </div>
    </div>
    <div class="demo-block">
      <div class="label">flex-flow: nowrap ! important</div>
      <div class="container" style="flex-flow: nowrap ! important; align-content: flex-end;">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
        <div class="item">7</div>
        <div class="item">8</div>
        <div class="item">9</div>
        <div class="item">10</div>
      </div>
    </div>
  </div>
</body>
</html>
