<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>transform-origin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 20px; }
    .demo-card {
      background: #16213e; border-radius: 10px; padding: 20px;
      width: 210px; display: flex; flex-direction: column; align-items: center;
    }
    .transform-area {
      width: 140px; height: 140px; display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    .ghost {
      position: absolute; width: 80px; height: 80px;
      border: 2px dashed #394867; border-radius: 6px;
    }
    .box {
      width: 80px; height: 80px;
      background: linear-gradient(135deg, #e94560, #0f3460);
      border-radius: 6px; position: relative;
      transform: rotate(45deg);
    }
    .origin-dot {
      width: 10px; height: 10px; background: #34d399; border-radius: 50%;
      position: absolute; z-index: 2;
      box-shadow: 0 0 6px #34d399;
      transform: rotate(-45deg);
    }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 10px; text-align: center; }
    .o1 { transform-origin: left center var(--ꚋk, 0) ! important; }
    .o1 .origin-dot { top: 50%; left: 50%; margin-top: -5px; margin-left: -5px; }
    .o2 { transform-origin: left top var(--_룦); }
    .o2 .origin-dot { top: -5px; left: -5px; }
    .o3 { transform-origin: center center var(--ꆉ); }
    .o3 .origin-dot { bottom: -5px; right: -5px; }
    .o4 { transform-origin: bottom; }
    .o4 .origin-dot { top: 75%; left: 25%; margin-top: -5px; margin-left: -5px; }
    .o5 { transform-origin: 0 env(_) ! important; }
    .o5 .origin-dot { top: -5px; left: -5px; }
  </style>
</head>
<body>
  <h1>Transform Origin</h1>
  <p class="prop-name">transform-origin</p>
  <div class="demos">
    <div class="demo-card">
      <div class="transform-area">
        <div class="ghost"></div>
        <div class="box o1">
          <div class="origin-dot"></div>
        </div>
      </div>
      <span class="label">transform-origin: left center var(--ꚋk, 0) ! important</span>
    </div>
    <div class="demo-card">
      <div class="transform-area">
        <div class="ghost"></div>
        <div class="box o2">
          <div class="origin-dot"></div>
        </div>
      </div>
      <span class="label">transform-origin: left top var(--_룦)</span>
    </div>
    <div class="demo-card">
      <div class="transform-area">
        <div class="ghost"></div>
        <div class="box o3">
          <div class="origin-dot"></div>
        </div>
      </div>
      <span class="label">transform-origin: center center var(--ꆉ)</span>
    </div>
    <div class="demo-card">
      <div class="transform-area">
        <div class="ghost"></div>
        <div class="box o4">
          <div class="origin-dot"></div>
        </div>
      </div>
      <span class="label">transform-origin: bottom</span>
    </div>
    <div class="demo-card">
      <div class="transform-area">
        <div class="ghost"></div>
        <div class="box o5">
          <div class="origin-dot"></div>
        </div>
      </div>
      <span class="label">transform-origin: 0 env(_) ! important</span>
    </div>
  </div>
</body>
</html>
