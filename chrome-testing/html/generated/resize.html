<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>resize</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
</style>
</head>
<body>
<h1>Resize</h1>
<p class="prop-name">resize</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area">
      <div style="width: 160px; height: 120px; background: #16213e; border: 2px solid #e94560; border-radius: 8px; overflow: auto; padding: 12px; font-size: 12px; color: #9ca3af; position: relative; resize: none;">Drag to resize this box</div>
    </div>
    <div class="label">resize: none</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="width: 160px; height: 120px; background: #16213e; border: 2px solid #e94560; border-radius: 8px; overflow: auto; padding: 12px; font-size: 12px; color: #9ca3af; position: relative; resize: both;">Drag to resize this box</div>
    </div>
    <div class="label">resize: both</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="width: 160px; height: 120px; background: #16213e; border: 2px solid #e94560; border-radius: 8px; overflow: auto; padding: 12px; font-size: 12px; color: #9ca3af; position: relative; resize: horizontal;">Drag to resize this box</div>
    </div>
    <div class="label">resize: horizontal</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="width: 160px; height: 120px; background: #16213e; border: 2px solid #e94560; border-radius: 8px; overflow: auto; padding: 12px; font-size: 12px; color: #9ca3af; position: relative; resize: vertical;">Drag to resize this box</div>
    </div>
    <div class="label">resize: vertical</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="width: 160px; height: 120px; background: #16213e; border: 2px solid #e94560; border-radius: 8px; overflow: auto; padding: 12px; font-size: 12px; color: #9ca3af; position: relative; resize: block;">Drag to resize this box</div>
    </div>
    <div class="label">resize: block</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="width: 160px; height: 120px; background: #16213e; border: 2px solid #e94560; border-radius: 8px; overflow: auto; padding: 12px; font-size: 12px; color: #9ca3af; position: relative; resize: inline;">Drag to resize this box</div>
    </div>
    <div class="label">resize: inline</div>
  </div>
</div>
</body>
</html>
