<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>paint-order</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
  svg { width: 240px; height: 100px; }
</style>
</head>
<body>
<div id="control-bar"></div>
<h1>Paint Order</h1>
<p class="prop-name">paint-order</p>
<div class="demos">
  <div class="demo-box" data-css-prop="paint-order" data-value="normal" data-target-selector=" text.target" data-target-id="t0">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; align-items: center;">
      <style>#t0  text.target { paint-order: normal; }</style>
      <svg id="t0" style="display: block;"><text class="target" x="120" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="72" fill="#e94560" stroke="#ffffff" stroke-width="12">Abc</text></svg>
    </div>
    <div class="label">paint-order: normal</div>
  </div>
  <div class="demo-box" data-css-prop="paint-order" data-value="fill" data-target-selector=" text.target" data-target-id="t1">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; align-items: center;">
      <style>#t1  text.target { paint-order: fill; }</style>
      <svg id="t1" style="display: block;"><text class="target" x="120" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="72" fill="#e94560" stroke="#ffffff" stroke-width="12">Abc</text></svg>
    </div>
    <div class="label">paint-order: fill</div>
  </div>
  <div class="demo-box" data-css-prop="paint-order" data-value="stroke" data-target-selector=" text.target" data-target-id="t2">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; align-items: center;">
      <style>#t2  text.target { paint-order: stroke; }</style>
      <svg id="t2" style="display: block;"><text class="target" x="120" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="72" fill="#e94560" stroke="#ffffff" stroke-width="12">Abc</text></svg>
    </div>
    <div class="label">paint-order: stroke</div>
  </div>
  <div class="demo-box" data-css-prop="paint-order" data-value="markers" data-target-selector=" text.target" data-target-id="t3">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; align-items: center;">
      <style>#t3  text.target { paint-order: markers; }</style>
      <svg id="t3" style="display: block;"><text class="target" x="120" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="72" fill="#e94560" stroke="#ffffff" stroke-width="12">Abc</text></svg>
    </div>
    <div class="label">paint-order: markers</div>
  </div>
  <div class="demo-box" data-css-prop="paint-order" data-value="fill stroke" data-target-selector=" text.target" data-target-id="t4">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; align-items: center;">
      <style>#t4  text.target { paint-order: fill stroke; }</style>
      <svg id="t4" style="display: block;"><text class="target" x="120" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="72" fill="#e94560" stroke="#ffffff" stroke-width="12">Abc</text></svg>
    </div>
    <div class="label">paint-order: fill stroke</div>
  </div>
  <div class="demo-box" data-css-prop="paint-order" data-value="stroke fill" data-target-selector=" text.target" data-target-id="t5">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; align-items: center;">
      <style>#t5  text.target { paint-order: stroke fill; }</style>
      <svg id="t5" style="display: block;"><text class="target" x="120" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="72" fill="#e94560" stroke="#ffffff" stroke-width="12">Abc</text></svg>
    </div>
    <div class="label">paint-order: stroke fill</div>
  </div>
</div>
<script src="../interactive.js"></script>
</body>
</html>
