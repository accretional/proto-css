<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>scroll-padding-top</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
  .snap-item { height: 125px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; scroll-snap-align: start; border-bottom: 1px solid #2a2a4a; }
.snap-item:nth-child(odd) { background: linear-gradient(135deg, #a855f7, #7c3aed); }
.snap-item:nth-child(even) { background: #22224a; color: #c4b5fd; }
</style>
</head>
<body>
<div id="control-bar"></div>
<h1>Scroll Padding Top</h1>
<p class="prop-name">scroll-padding-top</p>
<div class="demos">
  <div class="demo-box" data-css-prop="scroll-padding-top" data-value="auto">
    <div class="demo-area">
      <div style="width: 100%; height: 250px; overflow-y: auto; border: 2px solid #333; border-radius: 10px; background: #16213e; scroll-snap-type: y mandatory; scroll-padding-top: auto;"><div class="snap-item">1</div><div class="snap-item">2</div><div class="snap-item">3</div><div class="snap-item">4</div><div class="snap-item">5</div></div>
    </div>
    <div class="label">scroll-padding-top: auto</div>
  </div>
  <div class="demo-box" data-css-prop="scroll-padding-top" data-value="10px">
    <div class="demo-area">
      <div style="width: 100%; height: 250px; overflow-y: auto; border: 2px solid #333; border-radius: 10px; background: #16213e; scroll-snap-type: y mandatory; scroll-padding-top: 10px;"><div class="snap-item">1</div><div class="snap-item">2</div><div class="snap-item">3</div><div class="snap-item">4</div><div class="snap-item">5</div></div>
    </div>
    <div class="label">scroll-padding-top: 10px</div>
  </div>
  <div class="demo-box" data-css-prop="scroll-padding-top" data-value="25%">
    <div class="demo-area">
      <div style="width: 100%; height: 250px; overflow-y: auto; border: 2px solid #333; border-radius: 10px; background: #16213e; scroll-snap-type: y mandatory; scroll-padding-top: 25%;"><div class="snap-item">1</div><div class="snap-item">2</div><div class="snap-item">3</div><div class="snap-item">4</div><div class="snap-item">5</div></div>
    </div>
    <div class="label">scroll-padding-top: 25%</div>
  </div>
  <div class="demo-box" data-css-prop="scroll-padding-top" data-value="50%">
    <div class="demo-area">
      <div style="width: 100%; height: 250px; overflow-y: auto; border: 2px solid #333; border-radius: 10px; background: #16213e; scroll-snap-type: y mandatory; scroll-padding-top: 50%;"><div class="snap-item">1</div><div class="snap-item">2</div><div class="snap-item">3</div><div class="snap-item">4</div><div class="snap-item">5</div></div>
    </div>
    <div class="label">scroll-padding-top: 50%</div>
  </div>
  <div class="demo-box" data-css-prop="scroll-padding-top" data-value="100%">
    <div class="demo-area">
      <div style="width: 100%; height: 250px; overflow-y: auto; border: 2px solid #333; border-radius: 10px; background: #16213e; scroll-snap-type: y mandatory; scroll-padding-top: 100%;"><div class="snap-item">1</div><div class="snap-item">2</div><div class="snap-item">3</div><div class="snap-item">4</div><div class="snap-item">5</div></div>
    </div>
    <div class="label">scroll-padding-top: 100%</div>
  </div>
  <div class="demo-box" data-css-prop="scroll-padding-top" data-value="0">
    <div class="demo-area">
      <div style="width: 100%; height: 250px; overflow-y: auto; border: 2px solid #333; border-radius: 10px; background: #16213e; scroll-snap-type: y mandatory; scroll-padding-top: 0;"><div class="snap-item">1</div><div class="snap-item">2</div><div class="snap-item">3</div><div class="snap-item">4</div><div class="snap-item">5</div></div>
    </div>
    <div class="label">scroll-padding-top: 0</div>
  </div>
</div>
<script src="../interactive.js"></script>
</body>
</html>
