<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>overflow-y</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .tall-content { display: flex; flex-direction: column; gap: 8px; }
.block { width: 100%; height: 50px; border-radius: 6px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; color: #fff; }
.b1 { background: #e94560; }
.b2 { background: #0077ff; }
.b3 { background: #00cc66; }
.b4 { background: #f5a623; }
.b5 { background: #7b68ee; }
</style>
</head>
<body>
<h1>Overflow Y</h1>
<p class="prop-name">overflow-y</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area">
      <div style="width: 100%; height: 160px; background: #0f3460; border-radius: 6px; border: 2px solid #3a3a5c; padding: 12px; overflow-x: hidden; overflow-y: visible;"><div class="tall-content"><div class="block b1">Row 1</div><div class="block b2">Row 2</div><div class="block b3">Row 3</div><div class="block b4">Row 4</div><div class="block b5">Row 5</div></div></div>
    </div>
    <div class="label">overflow-y: visible</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="width: 100%; height: 160px; background: #0f3460; border-radius: 6px; border: 2px solid #3a3a5c; padding: 12px; overflow-x: hidden; overflow-y: hidden;"><div class="tall-content"><div class="block b1">Row 1</div><div class="block b2">Row 2</div><div class="block b3">Row 3</div><div class="block b4">Row 4</div><div class="block b5">Row 5</div></div></div>
    </div>
    <div class="label">overflow-y: hidden</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="width: 100%; height: 160px; background: #0f3460; border-radius: 6px; border: 2px solid #3a3a5c; padding: 12px; overflow-x: hidden; overflow-y: clip;"><div class="tall-content"><div class="block b1">Row 1</div><div class="block b2">Row 2</div><div class="block b3">Row 3</div><div class="block b4">Row 4</div><div class="block b5">Row 5</div></div></div>
    </div>
    <div class="label">overflow-y: clip</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="width: 100%; height: 160px; background: #0f3460; border-radius: 6px; border: 2px solid #3a3a5c; padding: 12px; overflow-x: hidden; overflow-y: scroll;"><div class="tall-content"><div class="block b1">Row 1</div><div class="block b2">Row 2</div><div class="block b3">Row 3</div><div class="block b4">Row 4</div><div class="block b5">Row 5</div></div></div>
    </div>
    <div class="label">overflow-y: scroll</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="width: 100%; height: 160px; background: #0f3460; border-radius: 6px; border: 2px solid #3a3a5c; padding: 12px; overflow-x: hidden; overflow-y: auto;"><div class="tall-content"><div class="block b1">Row 1</div><div class="block b2">Row 2</div><div class="block b3">Row 3</div><div class="block b4">Row 4</div><div class="block b5">Row 5</div></div></div>
    </div>
    <div class="label">overflow-y: auto</div>
  </div>
</div>
</body>
</html>
