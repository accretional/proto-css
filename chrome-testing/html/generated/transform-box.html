<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>transform-box</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
  .origin-marker { position: absolute; top: 50%; left: 50%; width: 8px; height: 8px; background: #ef4444; border-radius: 50%; transform: translate(-50%, -50%); z-index: 10; }
.box-inner { width: 100%; height: 100%; background: linear-gradient(135deg, #e94560, #c2185b); border-radius: 2px; }
</style>
</head>
<body>
<div id="control-bar"></div>
<h1>Transform Box</h1>
<p class="prop-name">transform-box</p>
<div class="demos">
  <div class="demo-box" data-css-prop="transform-box" data-value="content-box">
    <div class="demo-area" style="width: 240px; height: 240px; display: flex; align-items: center; justify-content: center; position: relative;">
      <div class="origin-marker"></div>
      <div style="width: 40px; height: 40px; border: 25px solid rgba(79, 195, 247, 0.4); padding: 15px; background: transparent; transform: rotate(45deg); transform-origin: top left; position: relative; transform-box: content-box;"><div class="box-inner"></div></div>
    </div>
    <div class="label">transform-box: content-box</div>
  </div>
  <div class="demo-box" data-css-prop="transform-box" data-value="border-box">
    <div class="demo-area" style="width: 240px; height: 240px; display: flex; align-items: center; justify-content: center; position: relative;">
      <div class="origin-marker"></div>
      <div style="width: 40px; height: 40px; border: 25px solid rgba(79, 195, 247, 0.4); padding: 15px; background: transparent; transform: rotate(45deg); transform-origin: top left; position: relative; transform-box: border-box;"><div class="box-inner"></div></div>
    </div>
    <div class="label">transform-box: border-box</div>
  </div>
  <div class="demo-box" data-css-prop="transform-box" data-value="fill-box">
    <div class="demo-area" style="width: 240px; height: 240px; display: flex; align-items: center; justify-content: center; position: relative;">
      <div class="origin-marker"></div>
      <div style="width: 40px; height: 40px; border: 25px solid rgba(79, 195, 247, 0.4); padding: 15px; background: transparent; transform: rotate(45deg); transform-origin: top left; position: relative; transform-box: fill-box;"><div class="box-inner"></div></div>
    </div>
    <div class="label">transform-box: fill-box</div>
  </div>
  <div class="demo-box" data-css-prop="transform-box" data-value="stroke-box">
    <div class="demo-area" style="width: 240px; height: 240px; display: flex; align-items: center; justify-content: center; position: relative;">
      <div class="origin-marker"></div>
      <div style="width: 40px; height: 40px; border: 25px solid rgba(79, 195, 247, 0.4); padding: 15px; background: transparent; transform: rotate(45deg); transform-origin: top left; position: relative; transform-box: stroke-box;"><div class="box-inner"></div></div>
    </div>
    <div class="label">transform-box: stroke-box</div>
  </div>
  <div class="demo-box" data-css-prop="transform-box" data-value="view-box">
    <div class="demo-area" style="width: 240px; height: 240px; display: flex; align-items: center; justify-content: center; position: relative;">
      <div class="origin-marker"></div>
      <div style="width: 40px; height: 40px; border: 25px solid rgba(79, 195, 247, 0.4); padding: 15px; background: transparent; transform: rotate(45deg); transform-origin: top left; position: relative; transform-box: view-box;"><div class="box-inner"></div></div>
    </div>
    <div class="label">transform-box: view-box</div>
  </div>
</div>
<script src="../interactive.js"></script>
</body>
</html>
