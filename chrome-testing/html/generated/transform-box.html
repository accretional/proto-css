<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>transform-box</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .ghost { position: absolute; top: 50%; left: 50%; width: 80px; height: 80px; border: 2px dashed #394867; transform: translate(-50%, -50%); }
.box-inner { width: 100%; height: 100%; background: linear-gradient(135deg, #e94560, #c2185b); border-radius: 4px; }
</style>
</head>
<body>
<h1>Transform Box</h1>
<p class="prop-name">transform-box</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area" style="width: 160px; height: 160px; display: flex; align-items: center; justify-content: center; position: relative;">
      <div class="ghost"></div>
      <div style="width: 80px; height: 80px; border: 4px solid #394867; padding: 12px; position: relative; transform: rotate(30deg); transform-box: content-box;"><div class="box-inner"></div></div>
    </div>
    <div class="label">transform-box: content-box</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="width: 160px; height: 160px; display: flex; align-items: center; justify-content: center; position: relative;">
      <div class="ghost"></div>
      <div style="width: 80px; height: 80px; border: 4px solid #394867; padding: 12px; position: relative; transform: rotate(30deg); transform-box: border-box;"><div class="box-inner"></div></div>
    </div>
    <div class="label">transform-box: border-box</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="width: 160px; height: 160px; display: flex; align-items: center; justify-content: center; position: relative;">
      <div class="ghost"></div>
      <div style="width: 80px; height: 80px; border: 4px solid #394867; padding: 12px; position: relative; transform: rotate(30deg); transform-box: fill-box;"><div class="box-inner"></div></div>
    </div>
    <div class="label">transform-box: fill-box</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="width: 160px; height: 160px; display: flex; align-items: center; justify-content: center; position: relative;">
      <div class="ghost"></div>
      <div style="width: 80px; height: 80px; border: 4px solid #394867; padding: 12px; position: relative; transform: rotate(30deg); transform-box: stroke-box;"><div class="box-inner"></div></div>
    </div>
    <div class="label">transform-box: stroke-box</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="width: 160px; height: 160px; display: flex; align-items: center; justify-content: center; position: relative;">
      <div class="ghost"></div>
      <div style="width: 80px; height: 80px; border: 4px solid #394867; padding: 12px; position: relative; transform: rotate(30deg); transform-box: view-box;"><div class="box-inner"></div></div>
    </div>
    <div class="label">transform-box: view-box</div>
  </div>
</div>
</body>
</html>
