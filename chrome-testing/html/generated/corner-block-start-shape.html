<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>corner-block-start-shape</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 4px; }
    .experimental { font-size: 12px; color: #e94560; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 32px; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; text-align: center; }

    .shape-box {
      width: 160px;
      height: 160px;
      background: linear-gradient(135deg, #0f3460, #16213e);
      border: 3px solid #00d2ff;
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #c0c0c0;
      position: relative;
    }

    .corner-dot {
      position: absolute;
      width: 16px;
      height: 16px;
      border-radius: 50%;
    }
    .active { background: #00d2ff; }
    .inactive { background: #7b8794; opacity: 0.3; }

    .demo-card { text-align: center; }

    .round-start {
      corner-block-start-shape: squircle superellipse(var(--kޭ, --_)) ! important;
    }
    .scoop-start {
      corner-block-start-shape: bevel ! important;
    }

    .legend {
      display: flex;
      gap: 16px;
      margin-top: 28px;
      font-size: 12px;
      color: #7b8794;
    }
    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 4px;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <h1>Corner Block Start Shape</h1>
  <p class="prop-name">corner-block-start-shape</p>
  <p class="experimental">Experimental property</p>
  <div class="demos">
    <div class="demo-card">
      <div class="shape-box round-start">
        <span>round</span>
        <div class="corner-dot active" style="top:-8px;left:-8px;"></div>
        <div class="corner-dot active" style="top:-8px;right:-8px;"></div>
        <div class="corner-dot inactive" style="bottom:-8px;left:-8px;"></div>
        <div class="corner-dot inactive" style="bottom:-8px;right:-8px;"></div>
      </div>
      <p class="label">corner-block-start-shape: squircle superellipse(var(--kޭ, --_)) ! important</p>
    </div>

    <div class="demo-card">
      <svg width="160" height="160" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0 30 Q0 0 30 30 H130 Q160 0 160 30 V130 Q160 160 130 160 H30 Q0 160 0 130 Z" fill="#16213e" stroke="#00d2ff" stroke-width="3"/>
        <text x="80" y="95" fill="#c0c0c0" text-anchor="middle" font-size="14" font-family="system-ui">scoop</text>
        <circle cx="0" cy="0" r="7" fill="#00d2ff"/>
        <circle cx="160" cy="0" r="7" fill="#00d2ff"/>
        <circle cx="0" cy="160" r="7" fill="#7b8794" opacity="0.3"/>
        <circle cx="160" cy="160" r="7" fill="#7b8794" opacity="0.3"/>
      </svg>
      <p class="label">corner-block-start-shape: bevel ! important</p>
    </div>

    <div class="demo-card">
      <div style="display:flex; flex-direction: column; gap: 12px;">
        <svg width="240" height="80" viewBox="0 0 240 80" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="2" width="236" height="76" rx="20" fill="#16213e" stroke="#7b8794" stroke-width="2" stroke-dasharray="6 4"/>
          <text x="120" y="30" fill="#7b8794" text-anchor="middle" font-size="11" font-family="monospace">block-start = top edge</text>
          <text x="120" y="50" fill="#7b8794" text-anchor="middle" font-size="11" font-family="monospace">(in default writing-mode)</text>
          <line x1="40" y1="2" x2="200" y2="2" stroke="#00d2ff" stroke-width="4"/>
          <text x="120" y="72" fill="#00d2ff" text-anchor="middle" font-size="10" font-family="monospace">affected edge</text>
        </svg>
      </div>
    </div>
  </div>

  <div class="legend">
    <span><span class="legend-dot" style="background:#00d2ff;"></span> Affected corners (block-start)</span>
    <span><span class="legend-dot" style="background:#7b8794; opacity:0.3;"></span> Unaffected corners</span>
  </div>
</body>
</html>
