<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>mask</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
</style>
</head>
<body>
<h1>Mask</h1>
<p class="prop-name">mask</p>
<div class="demos">
  <div class="demo-box" data-css-prop="mask" data-value="none">
    <div class="demo-area">
      <div style="width: 100%; height: 120px; border-radius: 8px; background: linear-gradient(135deg, #e94560, #0f3460, #00d2ff, #f9a825); background-size: 100% 100%; -webkit-mask-image: linear-gradient(to right, black, transparent); mask-image: linear-gradient(to right, black, transparent); mask: none;"></div>
    </div>
    <div class="label">mask: none</div>
  </div>
  <div class="demo-box" data-css-prop="mask" data-value="url(mask.png)">
    <div class="demo-area">
      <div style="width: 100%; height: 120px; border-radius: 8px; background: linear-gradient(135deg, #e94560, #0f3460, #00d2ff, #f9a825); background-size: 100% 100%; -webkit-mask-image: linear-gradient(to right, black, transparent); mask-image: linear-gradient(to right, black, transparent); mask: url(mask.png);"></div>
    </div>
    <div class="label">mask: url(mask.png)</div>
  </div>
  <div class="demo-box" data-css-prop="mask" data-value="center">
    <div class="demo-area">
      <div style="width: 100%; height: 120px; border-radius: 8px; background: linear-gradient(135deg, #e94560, #0f3460, #00d2ff, #f9a825); background-size: 100% 100%; -webkit-mask-image: linear-gradient(to right, black, transparent); mask-image: linear-gradient(to right, black, transparent); mask: center;"></div>
    </div>
    <div class="label">mask: center</div>
  </div>
  <div class="demo-box" data-css-prop="mask" data-value="none center">
    <div class="demo-area">
      <div style="width: 100%; height: 120px; border-radius: 8px; background: linear-gradient(135deg, #e94560, #0f3460, #00d2ff, #f9a825); background-size: 100% 100%; -webkit-mask-image: linear-gradient(to right, black, transparent); mask-image: linear-gradient(to right, black, transparent); mask: none center;"></div>
    </div>
    <div class="label">mask: none center</div>
  </div>
  <div class="demo-box" data-css-prop="mask" data-value="url(mask.png) center">
    <div class="demo-area">
      <div style="width: 100%; height: 120px; border-radius: 8px; background: linear-gradient(135deg, #e94560, #0f3460, #00d2ff, #f9a825); background-size: 100% 100%; -webkit-mask-image: linear-gradient(to right, black, transparent); mask-image: linear-gradient(to right, black, transparent); mask: url(mask.png) center;"></div>
    </div>
    <div class="label">mask: url(mask.png) center</div>
  </div>
  <div class="demo-box" data-css-prop="mask" data-value="top">
    <div class="demo-area">
      <div style="width: 100%; height: 120px; border-radius: 8px; background: linear-gradient(135deg, #e94560, #0f3460, #00d2ff, #f9a825); background-size: 100% 100%; -webkit-mask-image: linear-gradient(to right, black, transparent); mask-image: linear-gradient(to right, black, transparent); mask: top;"></div>
    </div>
    <div class="label">mask: top</div>
  </div>
</div>
<div id="control-bar"></div>
<script src="../interactive.js"></script>
</body>
</html>
