<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>will-change</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
  .hint-badge { position: absolute; top: -8px; right: -8px; background: #e94560; color: #fff; font-size: 9px; padding: 2px 7px; border-radius: 10px; font-family: monospace; }
.layer-indicator { position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); font-size: 8px; color: #64748b; font-family: monospace; background: #0f1a30; padding: 2px 8px; border-radius: 4px; border: 1px solid #2a2a4a; white-space: nowrap; }
</style>
</head>
<body>
<h1>Will Change</h1>
<p class="prop-name">will-change</p>
<div class="demos">
  <div class="demo-box" data-css-prop="will-change" data-value="auto">
    <div class="demo-area" style="background: #16213e; border-radius: 10px; padding: 20px; text-align: center;">
      <div style="width: 120px; height: 120px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #fff; background: linear-gradient(135deg, #533483, #0f3460); position: relative; will-change: auto;">Target</div>
    </div>
    <div class="label">will-change: auto</div>
  </div>
  <div class="demo-box" data-css-prop="will-change" data-value="scroll-position">
    <div class="demo-area" style="background: #16213e; border-radius: 10px; padding: 20px; text-align: center;">
      <div style="width: 120px; height: 120px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #fff; background: linear-gradient(135deg, #533483, #0f3460); position: relative; will-change: scroll-position;">Target</div>
    </div>
    <div class="label">will-change: scroll-position</div>
  </div>
  <div class="demo-box" data-css-prop="will-change" data-value="contents">
    <div class="demo-area" style="background: #16213e; border-radius: 10px; padding: 20px; text-align: center;">
      <div style="width: 120px; height: 120px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #fff; background: linear-gradient(135deg, #533483, #0f3460); position: relative; will-change: contents;">Target</div>
    </div>
    <div class="label">will-change: contents</div>
  </div>
  <div class="demo-box" data-css-prop="will-change" data-value="my-custom">
    <div class="demo-area" style="background: #16213e; border-radius: 10px; padding: 20px; text-align: center;">
      <div style="width: 120px; height: 120px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #fff; background: linear-gradient(135deg, #533483, #0f3460); position: relative; will-change: my-custom;">Target</div>
    </div>
    <div class="label">will-change: my-custom</div>
  </div>
</div>
<div id="control-bar"></div>
<script src="../interactive.js"></script>
</body>
</html>
