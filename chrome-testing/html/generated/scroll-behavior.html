<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>scroll-behavior</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .scroll-item { height: 140px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 600; border-bottom: 1px solid #2a2a4a; }
.scroll-item:nth-child(odd) { background: #1a1a3e; }
.scroll-item:nth-child(even) { background: #22224a; }
.scroll-item:nth-child(1) { background: linear-gradient(135deg, #6366f1, #8b5cf6); }
.scroll-item:nth-child(4) { background: linear-gradient(135deg, #ec4899, #f43f5e); }
.scroll-item:nth-child(6) { background: linear-gradient(135deg, #14b8a6, #06b6d4); }
</style>
</head>
<body>
<h1>Scroll Behavior</h1>
<p class="prop-name">scroll-behavior</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area">
      <div style="width: 100%; height: 280px; overflow-y: auto; border: 2px solid #333; border-radius: 10px; background: #16213e; position: relative; scroll-behavior: auto;"><div class="scroll-item">Section 1</div><div class="scroll-item">Section 2</div><div class="scroll-item">Section 3</div><div class="scroll-item">Section 4</div><div class="scroll-item">Section 5</div><div class="scroll-item">Section 6</div></div>
    </div>
    <div class="label">scroll-behavior: auto</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="width: 100%; height: 280px; overflow-y: auto; border: 2px solid #333; border-radius: 10px; background: #16213e; position: relative; scroll-behavior: smooth;"><div class="scroll-item">Section 1</div><div class="scroll-item">Section 2</div><div class="scroll-item">Section 3</div><div class="scroll-item">Section 4</div><div class="scroll-item">Section 5</div><div class="scroll-item">Section 6</div></div>
    </div>
    <div class="label">scroll-behavior: smooth</div>
  </div>
</div>
</body>
</html>
