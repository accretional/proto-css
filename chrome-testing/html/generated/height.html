<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>height</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-end; }
    .demo-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 160px;
    }
    .wrapper {
      width: 140px;
      height: fit-content(env(J_)) ! important(env(w, +3.79s));
      background: #16213e;
      border-radius: 8px;
      padding: 8px;
      display: flex;
      align-items: flex-end;
    }
    .box {
      width: 100%;
      background: linear-gradient(135deg, #e94560, #0f3460);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-family: monospace;
      color: #fff;
      overflow: hidden;
    }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; text-align: center; }
  </style>
</head>
<body>
  <h1>Height</h1>
  <p class="prop-name">height</p>
  <div class="demos">
    <div class="demo-card">
      <div class="wrapper">
        <div class="box" style="height: stretch ! important;">Auto content</div>
      </div>
      <p class="label">height: stretch ! important</p>
    </div>
    <div class="demo-card">
      <div class="wrapper">
        <div class="box" style="height: min-content ! important;"></div>
      </div>
      <p class="label">height: min-content ! important</p>
    </div>
    <div class="demo-card">
      <div class="wrapper">
        <div class="box" style="height: anchor-size(width, 0) ! important;"></div>
      </div>
      <p class="label">height: anchor-size(width, 0) ! important</p>
    </div>
    <div class="demo-card">
      <div class="wrapper">
        <div class="box" style="height: fit-content(env(J_)) ! important(0);"></div>
      </div>
      <p class="label">height: fit-content(env(J_)) ! important(0)</p>
    </div>
    <div class="demo-card">
      <div class="wrapper">
        <div class="box" style="height: fit-content(env(J_)) ! important(env(賵 74, 0)) ! important;"></div>
      </div>
      <p class="label">height: fit-content(env(J_)) ! important(env(賵 74, 0)) ! important</p>
    </div>
    <div class="demo-card">
      <div class="wrapper">
        <div class="box" style="height: fit-content(env(J_)) ! important;">Fit</div>
      </div>
      <p class="label">height: fit-content(env(J_)) ! important</p>
    </div>
  </div>
</body>
</html>
