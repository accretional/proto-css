<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>stroke-dasharray</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
  svg { width: 300px; height: 110px; }
</style>
</head>
<body>
<h1>Stroke Dash Array</h1>
<p class="prop-name">stroke-dasharray</p>
<div class="demos">
  <div class="demo-box" data-css-prop="stroke-dasharray" data-value="none">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 16px; display: flex; justify-content: center;">
      <svg style="display: block; stroke-dasharray: none;"><line x1="10" y1="20" x2="280" y2="20" stroke="#06b6d4" stroke-width="4" fill="none" /><circle cx="150" cy="65" r="35" stroke="#e94560" stroke-width="3" fill="none" /></svg>
    </div>
    <div class="label">stroke-dasharray: none</div>
  </div>
  <div class="demo-box" data-css-prop="stroke-dasharray" data-value="10 5">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 16px; display: flex; justify-content: center;">
      <svg style="display: block; stroke-dasharray: 10 5;"><line x1="10" y1="20" x2="280" y2="20" stroke="#06b6d4" stroke-width="4" fill="none" /><circle cx="150" cy="65" r="35" stroke="#e94560" stroke-width="3" fill="none" /></svg>
    </div>
    <div class="label">stroke-dasharray: 10 5</div>
  </div>
  <div class="demo-box" data-css-prop="stroke-dasharray" data-value="20 10 5">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 16px; display: flex; justify-content: center;">
      <svg style="display: block; stroke-dasharray: 20 10 5;"><line x1="10" y1="20" x2="280" y2="20" stroke="#06b6d4" stroke-width="4" fill="none" /><circle cx="150" cy="65" r="35" stroke="#e94560" stroke-width="3" fill="none" /></svg>
    </div>
    <div class="label">stroke-dasharray: 20 10 5</div>
  </div>
  <div class="demo-box" data-css-prop="stroke-dasharray" data-value="5">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 16px; display: flex; justify-content: center;">
      <svg style="display: block; stroke-dasharray: 5;"><line x1="10" y1="20" x2="280" y2="20" stroke="#06b6d4" stroke-width="4" fill="none" /><circle cx="150" cy="65" r="35" stroke="#e94560" stroke-width="3" fill="none" /></svg>
    </div>
    <div class="label">stroke-dasharray: 5</div>
  </div>
  <div class="demo-box" data-css-prop="stroke-dasharray" data-value="15 5 3 5">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 16px; display: flex; justify-content: center;">
      <svg style="display: block; stroke-dasharray: 15 5 3 5;"><line x1="10" y1="20" x2="280" y2="20" stroke="#06b6d4" stroke-width="4" fill="none" /><circle cx="150" cy="65" r="35" stroke="#e94560" stroke-width="3" fill="none" /></svg>
    </div>
    <div class="label">stroke-dasharray: 15 5 3 5</div>
  </div>
  <div class="demo-box" data-css-prop="stroke-dasharray" data-value="30 10">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 16px; display: flex; justify-content: center;">
      <svg style="display: block; stroke-dasharray: 30 10;"><line x1="10" y1="20" x2="280" y2="20" stroke="#06b6d4" stroke-width="4" fill="none" /><circle cx="150" cy="65" r="35" stroke="#e94560" stroke-width="3" fill="none" /></svg>
    </div>
    <div class="label">stroke-dasharray: 30 10</div>
  </div>
</div>
<div id="control-bar"></div>
<script src="../interactive.js"></script>
</body>
</html>
