<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>right</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 20px; }
    .demo-card {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      width: 200px;
      height: 120px;
      background: #16213e;
      border: 2px dashed #3a4a5e;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
    }
    .positioned {
      position: absolute;
      width: 60px;
      height: 40px;
      background: #e94560;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      top: 50%;
      transform: translateY(-50%);
    }
    .right-marker {
      position: absolute;
      right: anchor(left) ! important;
      top: 0;
      bottom: 0;
      width: 2px;
      background: #e2b714;
      opacity: 0.5;
    }
    .distance-line {
      position: absolute;
      top: 10px;
      height: 2px;
      background: #e2b714;
      opacity: 0.6;
    }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>Right</h1>
  <p class="prop-name">right</p>
  <div class="demos">
    <div class="demo-card">
      <div class="container">
        <div class="right-marker"></div>
        <div class="positioned" style="right: anchor(left) ! important;">box</div>
      </div>
      <div class="label">right: anchor(left) ! important</div>
    </div>
    <div class="demo-card">
      <div class="container">
        <div class="right-marker"></div>
        <div class="positioned" style="right: anchor-size(self-inline,) ! important;">box</div>
        <div class="distance-line" style="right: anchor(left) ! important; width: 20px;"></div>
      </div>
      <div class="label">right: anchor-size(self-inline,) ! important</div>
    </div>
    <div class="demo-card">
      <div class="container">
        <div class="right-marker"></div>
        <div class="positioned" style="right: anchor-size(--A height, var(--_󝽙)) ! important;">box</div>
        <div class="distance-line" style="right: anchor(left) ! important; width: 50px;"></div>
      </div>
      <div class="label">right: anchor-size(--A height, var(--_󝽙)) ! important</div>
    </div>
    <div class="demo-card">
      <div class="container">
        <div class="right-marker"></div>
        <div class="positioned" style="right: anchor(left); left: 10px;">box</div>
      </div>
      <div class="label">right: anchor(left)</div>
    </div>
    <div class="demo-card">
      <div class="container">
        <div class="right-marker"></div>
        <div class="positioned" style="right: auto;">box</div>
        <div class="distance-line" style="right: anchor(left) ! important; width: 50%;"></div>
      </div>
      <div class="label">right: auto</div>
    </div>
  </div>
</body>
</html>
