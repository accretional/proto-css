<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>right</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
  .right-marker { position: absolute; right: 0; top: 0; bottom: 0; width: 2px; background: #e2b714; opacity: 0.5; }
</style>
</head>
<body>
<div id="control-bar"></div>
<h1>Right</h1>
<p class="prop-name">right</p>
<div class="demos">
  <div class="demo-box" data-css-prop="right" data-value="auto">
    <div class="demo-area" style="width: 200px; height: 120px; background: #16213e; border: 2px dashed #3a4a5e; border-radius: 8px; position: relative; overflow: hidden;">
      <div class="right-marker"></div>
      <div style="position: absolute; top: 50%; transform: translateY(-50%); width: 60px; height: 40px; background: #e94560; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff; right: auto;">box</div>
    </div>
    <div class="label">right: auto</div>
  </div>
  <div class="demo-box" data-css-prop="right" data-value="10px">
    <div class="demo-area" style="width: 200px; height: 120px; background: #16213e; border: 2px dashed #3a4a5e; border-radius: 8px; position: relative; overflow: hidden;">
      <div class="right-marker"></div>
      <div style="position: absolute; top: 50%; transform: translateY(-50%); width: 60px; height: 40px; background: #e94560; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff; right: 10px;">box</div>
    </div>
    <div class="label">right: 10px</div>
  </div>
  <div class="demo-box" data-css-prop="right" data-value="anchor(top)">
    <div class="demo-area" style="width: 200px; height: 120px; background: #16213e; border: 2px dashed #3a4a5e; border-radius: 8px; position: relative; overflow: hidden;">
      <div class="right-marker"></div>
      <div style="position: absolute; top: 50%; transform: translateY(-50%); width: 60px; height: 40px; background: #e94560; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff; right: anchor(top);">box</div>
    </div>
    <div class="label">right: anchor(top)</div>
  </div>
  <div class="demo-box" data-css-prop="right" data-value="anchor-size(width)">
    <div class="demo-area" style="width: 200px; height: 120px; background: #16213e; border: 2px dashed #3a4a5e; border-radius: 8px; position: relative; overflow: hidden;">
      <div class="right-marker"></div>
      <div style="position: absolute; top: 50%; transform: translateY(-50%); width: 60px; height: 40px; background: #e94560; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff; right: anchor-size(width);">box</div>
    </div>
    <div class="label">right: anchor-size(width)</div>
  </div>
  <div class="demo-box" data-css-prop="right" data-value="25%">
    <div class="demo-area" style="width: 200px; height: 120px; background: #16213e; border: 2px dashed #3a4a5e; border-radius: 8px; position: relative; overflow: hidden;">
      <div class="right-marker"></div>
      <div style="position: absolute; top: 50%; transform: translateY(-50%); width: 60px; height: 40px; background: #e94560; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff; right: 25%;">box</div>
    </div>
    <div class="label">right: 25%</div>
  </div>
  <div class="demo-box" data-css-prop="right" data-value="anchor(bottom)">
    <div class="demo-area" style="width: 200px; height: 120px; background: #16213e; border: 2px dashed #3a4a5e; border-radius: 8px; position: relative; overflow: hidden;">
      <div class="right-marker"></div>
      <div style="position: absolute; top: 50%; transform: translateY(-50%); width: 60px; height: 40px; background: #e94560; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff; right: anchor(bottom);">box</div>
    </div>
    <div class="label">right: anchor(bottom)</div>
  </div>
  <div class="demo-box" data-css-prop="right" data-value="anchor-size(height)">
    <div class="demo-area" style="width: 200px; height: 120px; background: #16213e; border: 2px dashed #3a4a5e; border-radius: 8px; position: relative; overflow: hidden;">
      <div class="right-marker"></div>
      <div style="position: absolute; top: 50%; transform: translateY(-50%); width: 60px; height: 40px; background: #e94560; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff; right: anchor-size(height);">box</div>
    </div>
    <div class="label">right: anchor-size(height)</div>
  </div>
  <div class="demo-box" data-css-prop="right" data-value="50%">
    <div class="demo-area" style="width: 200px; height: 120px; background: #16213e; border: 2px dashed #3a4a5e; border-radius: 8px; position: relative; overflow: hidden;">
      <div class="right-marker"></div>
      <div style="position: absolute; top: 50%; transform: translateY(-50%); width: 60px; height: 40px; background: #e94560; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff; right: 50%;">box</div>
    </div>
    <div class="label">right: 50%</div>
  </div>
  <div class="demo-box" data-css-prop="right" data-value="100%">
    <div class="demo-area" style="width: 200px; height: 120px; background: #16213e; border: 2px dashed #3a4a5e; border-radius: 8px; position: relative; overflow: hidden;">
      <div class="right-marker"></div>
      <div style="position: absolute; top: 50%; transform: translateY(-50%); width: 60px; height: 40px; background: #e94560; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff; right: 100%;">box</div>
    </div>
    <div class="label">right: 100%</div>
  </div>
  <div class="demo-box" data-css-prop="right" data-value="0">
    <div class="demo-area" style="width: 200px; height: 120px; background: #16213e; border: 2px dashed #3a4a5e; border-radius: 8px; position: relative; overflow: hidden;">
      <div class="right-marker"></div>
      <div style="position: absolute; top: 50%; transform: translateY(-50%); width: 60px; height: 40px; background: #e94560; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff; right: 0;">box</div>
    </div>
    <div class="label">right: 0</div>
  </div>
</div>
<script src="../interactive.js"></script>
</body>
</html>
