<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>fill-rule</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
  path { d: path("M100,10 L130,80 L195,80 L140,125 L160,190 L100,150 L40,190 L60,125 L5,80 L70,80 Z"); }
</style>
</head>
<body>
<div id="control-bar"></div>
<h1>SVG Fill Rule</h1>
<p class="prop-name">fill-rule</p>
<div class="demos">
  <div class="demo-box" data-css-prop="fill-rule" data-value="nonzero">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 24px; flex: 1; display: flex; flex-direction: column; align-items: center;">
      <svg width="200" height="200" viewBox="0 0 200 200">
      <path style="fill: #e94560; stroke: #fff; stroke-width: 1; fill-rule: nonzero;"></path>
      </svg>
    </div>
    <div class="label">fill-rule: nonzero</div>
  </div>
  <div class="demo-box" data-css-prop="fill-rule" data-value="evenodd">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 24px; flex: 1; display: flex; flex-direction: column; align-items: center;">
      <svg width="200" height="200" viewBox="0 0 200 200">
      <path style="fill: #e94560; stroke: #fff; stroke-width: 1; fill-rule: evenodd;"></path>
      </svg>
    </div>
    <div class="label">fill-rule: evenodd</div>
  </div>
</div>
<script src="../interactive.js"></script>
</body>
</html>
