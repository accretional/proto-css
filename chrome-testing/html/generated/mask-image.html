<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>mask-image</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
</style>
</head>
<body>
<div id="control-bar"></div>
<h1>Mask Image</h1>
<p class="prop-name">mask-image</p>
<div class="demos">
  <div class="demo-box" data-css-prop="mask-image" data-value="none">
    <div class="demo-area">
      <div style="width: 100%; height: 120px; background: linear-gradient(135deg, #e94560, #a855f7, #00d2ff, #4ade80); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px; font-weight: 600; mask-image: none;">MASKED</div>
    </div>
    <div class="label">mask-image: none</div>
  </div>
  <div class="demo-box" data-css-prop="mask-image" data-value="url(mask.png)">
    <div class="demo-area">
      <div style="width: 100%; height: 120px; background: linear-gradient(135deg, #e94560, #a855f7, #00d2ff, #4ade80); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px; font-weight: 600; mask-image: url(mask.png);">MASKED</div>
    </div>
    <div class="label">mask-image: url(mask.png)</div>
  </div>
  <div class="demo-box" data-css-prop="mask-image" data-value="none, none">
    <div class="demo-area">
      <div style="width: 100%; height: 120px; background: linear-gradient(135deg, #e94560, #a855f7, #00d2ff, #4ade80); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px; font-weight: 600; mask-image: none, none;">MASKED</div>
    </div>
    <div class="label">mask-image: none, none</div>
  </div>
  <div class="demo-box" data-css-prop="mask-image" data-value="url(mask.png), none">
    <div class="demo-area">
      <div style="width: 100%; height: 120px; background: linear-gradient(135deg, #e94560, #a855f7, #00d2ff, #4ade80); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px; font-weight: 600; mask-image: url(mask.png), none;">MASKED</div>
    </div>
    <div class="label">mask-image: url(mask.png), none</div>
  </div>
  <div class="demo-box" data-css-prop="mask-image" data-value="none, url(mask.png)">
    <div class="demo-area">
      <div style="width: 100%; height: 120px; background: linear-gradient(135deg, #e94560, #a855f7, #00d2ff, #4ade80); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px; font-weight: 600; mask-image: none, url(mask.png);">MASKED</div>
    </div>
    <div class="label">mask-image: none, url(mask.png)</div>
  </div>
  <div class="demo-box" data-css-prop="mask-image" data-value="url(mask.png), url(mask.png)">
    <div class="demo-area">
      <div style="width: 100%; height: 120px; background: linear-gradient(135deg, #e94560, #a855f7, #00d2ff, #4ade80); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px; font-weight: 600; mask-image: url(mask.png), url(mask.png);">MASKED</div>
    </div>
    <div class="label">mask-image: url(mask.png), url(mask.png)</div>
  </div>
</div>
<script src="../interactive.js"></script>
</body>
</html>
