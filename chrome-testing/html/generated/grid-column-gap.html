<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>grid-column-gap</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .cell { background: #0f3460; border-radius: 4px; height: 36px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #e94560; font-weight: 600; }
</style>
</head>
<body>
<h1>Grid Column Gap</h1>
<p class="prop-name">grid-column-gap</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area">
      <div style="display: grid; grid-template-columns: repeat(3, 1fr); width: 100%; grid-column-gap: 10px;"><div class="cell">1</div><div class="cell">2</div><div class="cell">3</div><div class="cell">4</div><div class="cell">5</div><div class="cell">6</div></div>
    </div>
    <div class="label">grid-column-gap: 10px</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="display: grid; grid-template-columns: repeat(3, 1fr); width: 100%; grid-column-gap: 20px;"><div class="cell">1</div><div class="cell">2</div><div class="cell">3</div><div class="cell">4</div><div class="cell">5</div><div class="cell">6</div></div>
    </div>
    <div class="label">grid-column-gap: 20px</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="display: grid; grid-template-columns: repeat(3, 1fr); width: 100%; grid-column-gap: normal;"><div class="cell">1</div><div class="cell">2</div><div class="cell">3</div><div class="cell">4</div><div class="cell">5</div><div class="cell">6</div></div>
    </div>
    <div class="label">grid-column-gap: normal</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="display: grid; grid-template-columns: repeat(3, 1fr); width: 100%; grid-column-gap: 10px 20px;"><div class="cell">1</div><div class="cell">2</div><div class="cell">3</div><div class="cell">4</div><div class="cell">5</div><div class="cell">6</div></div>
    </div>
    <div class="label">grid-column-gap: 10px 20px</div>
  </div>
</div>
</body>
</html>
