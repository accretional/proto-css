<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>content</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .demo-area div::before { display: block; padding: 4px; color: #e94560; font-weight: bold; max-height: 60px; max-width: 100%; overflow: hidden; }
</style>
</head>
<body>
<h1>Content</h1>
<p class="prop-name">content</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area">
      <style>#t0::before { content: normal; }</style>
      <div id="t0" style="display: block; padding: 16px; background: #16213e; border: 2px solid #e94560; border-radius: 8px; min-height: 60px; font-size: 18px; color: #e0e0e0; overflow: hidden; position: relative;"></div>
    </div>
    <div class="label">content: normal</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <style>#t1::before { content: none; }</style>
      <div id="t1" style="display: block; padding: 16px; background: #16213e; border: 2px solid #e94560; border-radius: 8px; min-height: 60px; font-size: 18px; color: #e0e0e0; overflow: hidden; position: relative;"></div>
    </div>
    <div class="label">content: none</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <style>#t2::before { content: linear-gradient(red, blue); }</style>
      <div id="t2" style="display: block; padding: 16px; background: #16213e; border: 2px solid #e94560; border-radius: 8px; min-height: 60px; font-size: 18px; color: #e0e0e0; overflow: hidden; position: relative;"></div>
    </div>
    <div class="label">content: linear-gradient(red, blue)</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <style>#t3::before { content: element(#my-ident); }</style>
      <div id="t3" style="display: block; padding: 16px; background: #16213e; border: 2px solid #e94560; border-radius: 8px; min-height: 60px; font-size: 18px; color: #e0e0e0; overflow: hidden; position: relative;"></div>
    </div>
    <div class="label">content: element(#my-ident)</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <style>#t4::before { content: "example"; }</style>
      <div id="t4" style="display: block; padding: 16px; background: #16213e; border: 2px solid #e94560; border-radius: 8px; min-height: 60px; font-size: 18px; color: #e0e0e0; overflow: hidden; position: relative;"></div>
    </div>
    <div class="label">content: &#34;example&#34;</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <style>#t5::before { content: url(statue.svg); }</style>
      <div id="t5" style="display: block; padding: 16px; background: #16213e; border: 2px solid #e94560; border-radius: 8px; min-height: 60px; font-size: 18px; color: #e0e0e0; overflow: hidden; position: relative;"></div>
    </div>
    <div class="label">content: url(statue.svg)</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <style>#t6::before { content: attr(my-ident); }</style>
      <div id="t6" style="display: block; padding: 16px; background: #16213e; border: 2px solid #e94560; border-radius: 8px; min-height: 60px; font-size: 18px; color: #e0e0e0; overflow: hidden; position: relative;"></div>
    </div>
    <div class="label">content: attr(my-ident)</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <style>#t7::before { content: contents; }</style>
      <div id="t7" style="display: block; padding: 16px; background: #16213e; border: 2px solid #e94560; border-radius: 8px; min-height: 60px; font-size: 18px; color: #e0e0e0; overflow: hidden; position: relative;"></div>
    </div>
    <div class="label">content: contents</div>
  </div>
</div>
</body>
</html>
