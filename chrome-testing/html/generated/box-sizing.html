<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>box-sizing</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
</style>
</head>
<body>
<div id="control-bar"></div>
<h1>Box Sizing</h1>
<p class="prop-name">box-sizing</p>
<div class="demos">
  <div class="demo-box" data-css-prop="box-sizing" data-value="content-box">
    <div class="demo-area">
      <div style="width: 300px; height: 80px; padding: 20px; border: 10px solid #e94560; background: #0f3460; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-family: monospace; color: #e0e0e0; box-sizing: content-box;"></div>
    </div>
    <div class="label">box-sizing: content-box</div>
  </div>
  <div class="demo-box" data-css-prop="box-sizing" data-value="border-box">
    <div class="demo-area">
      <div style="width: 300px; height: 80px; padding: 20px; border: 10px solid #e94560; background: #0f3460; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-family: monospace; color: #e0e0e0; box-sizing: border-box;"></div>
    </div>
    <div class="label">box-sizing: border-box</div>
  </div>
</div>
<script src="../interactive.js"></script>
</body>
</html>
