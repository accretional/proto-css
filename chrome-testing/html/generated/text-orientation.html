<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>text-orientation</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
</style>
</head>
<body>
<h1>Text Orientation</h1>
<p class="prop-name">text-orientation</p>
<div class="demos">
  <div class="demo-box" data-css-prop="text-orientation" data-value="mixed">
    <div class="demo-area">
      <div style="writing-mode: vertical-rl; font-size: 20px; line-height: 2; height: 300px; padding: 16px 20px; background: #0f1a30; border-radius: 8px; border: 1px solid #2a2a4a; text-orientation: mixed;">ABCabc123漢字かな</div>
    </div>
    <div class="label">text-orientation: mixed</div>
  </div>
  <div class="demo-box" data-css-prop="text-orientation" data-value="upright">
    <div class="demo-area">
      <div style="writing-mode: vertical-rl; font-size: 20px; line-height: 2; height: 300px; padding: 16px 20px; background: #0f1a30; border-radius: 8px; border: 1px solid #2a2a4a; text-orientation: upright;">ABCabc123漢字かな</div>
    </div>
    <div class="label">text-orientation: upright</div>
  </div>
  <div class="demo-box" data-css-prop="text-orientation" data-value="sideways">
    <div class="demo-area">
      <div style="writing-mode: vertical-rl; font-size: 20px; line-height: 2; height: 300px; padding: 16px 20px; background: #0f1a30; border-radius: 8px; border: 1px solid #2a2a4a; text-orientation: sideways;">ABCabc123漢字かな</div>
    </div>
    <div class="label">text-orientation: sideways</div>
  </div>
</div>
<div id="control-bar"></div>
<script src="../interactive.js"></script>
</body>
</html>
