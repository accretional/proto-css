<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>corner-top-shape</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
</style>
</head>
<body>
<h1>Corner Top Shape</h1>
<p class="prop-name">corner-top-shape</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area">
      <svg style="width: 140px; height: 140px; corner-top-shape: round;"><path d="M28 3 H112 Q137 3 137 28 V137 H3 V28 Q3 3 28 3 Z" fill="#16213e" stroke="#e94560" stroke-width="3"/><circle cx="3" cy="3" r="5" fill="#e94560"/><circle cx="137" cy="3" r="5" fill="#e94560"/><text x="70" y="80" fill="#e0e0e0" text-anchor="middle" font-size="13" font-family="system-ui">round</text></svg>
    </div>
    <div class="label">corner-top-shape: round</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <svg style="width: 140px; height: 140px; corner-top-shape: scoop;"><path d="M28 3 H112 Q137 3 137 28 V137 H3 V28 Q3 3 28 3 Z" fill="#16213e" stroke="#e94560" stroke-width="3"/><circle cx="3" cy="3" r="5" fill="#e94560"/><circle cx="137" cy="3" r="5" fill="#e94560"/><text x="70" y="80" fill="#e0e0e0" text-anchor="middle" font-size="13" font-family="system-ui">round</text></svg>
    </div>
    <div class="label">corner-top-shape: scoop</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <svg style="width: 140px; height: 140px; corner-top-shape: bevel;"><path d="M28 3 H112 Q137 3 137 28 V137 H3 V28 Q3 3 28 3 Z" fill="#16213e" stroke="#e94560" stroke-width="3"/><circle cx="3" cy="3" r="5" fill="#e94560"/><circle cx="137" cy="3" r="5" fill="#e94560"/><text x="70" y="80" fill="#e0e0e0" text-anchor="middle" font-size="13" font-family="system-ui">round</text></svg>
    </div>
    <div class="label">corner-top-shape: bevel</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <svg style="width: 140px; height: 140px; corner-top-shape: notch;"><path d="M28 3 H112 Q137 3 137 28 V137 H3 V28 Q3 3 28 3 Z" fill="#16213e" stroke="#e94560" stroke-width="3"/><circle cx="3" cy="3" r="5" fill="#e94560"/><circle cx="137" cy="3" r="5" fill="#e94560"/><text x="70" y="80" fill="#e0e0e0" text-anchor="middle" font-size="13" font-family="system-ui">round</text></svg>
    </div>
    <div class="label">corner-top-shape: notch</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <svg style="width: 140px; height: 140px; corner-top-shape: square;"><path d="M28 3 H112 Q137 3 137 28 V137 H3 V28 Q3 3 28 3 Z" fill="#16213e" stroke="#e94560" stroke-width="3"/><circle cx="3" cy="3" r="5" fill="#e94560"/><circle cx="137" cy="3" r="5" fill="#e94560"/><text x="70" y="80" fill="#e0e0e0" text-anchor="middle" font-size="13" font-family="system-ui">round</text></svg>
    </div>
    <div class="label">corner-top-shape: square</div>
  </div>
</div>
</body>
</html>
