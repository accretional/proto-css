<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>letter-spacing</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
</style>
</head>
<body>
<h1>Letter Spacing</h1>
<p class="prop-name">letter-spacing</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area">
      <div style="font-size: 22px; color: #fff; font-weight: 500; letter-spacing: normal;">The quick brown fox</div>
    </div>
    <div class="label">letter-spacing: normal</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="font-size: 22px; color: #fff; font-weight: 500; letter-spacing: 10px;">The quick brown fox</div>
    </div>
    <div class="label">letter-spacing: 10px</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="font-size: 22px; color: #fff; font-weight: 500; letter-spacing: 25%;">The quick brown fox</div>
    </div>
    <div class="label">letter-spacing: 25%</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="font-size: 22px; color: #fff; font-weight: 500; letter-spacing: 50%;">The quick brown fox</div>
    </div>
    <div class="label">letter-spacing: 50%</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="font-size: 22px; color: #fff; font-weight: 500; letter-spacing: 100%;">The quick brown fox</div>
    </div>
    <div class="label">letter-spacing: 100%</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="font-size: 22px; color: #fff; font-weight: 500; letter-spacing: 0;">The quick brown fox</div>
    </div>
    <div class="label">letter-spacing: 0</div>
  </div>
</div>
</body>
</html>
