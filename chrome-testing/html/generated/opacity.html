<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>opacity</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
  .layer { position: absolute; width: 100px; height: 100px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; color: #fff; }
.layer-blue { background: #0077ff; top: 30px; left: 30px; }
.layer-green { background: #00cc66; top: 60px; left: 60px; }
</style>
</head>
<body>
<div id="control-bar"></div>
<h1>Opacity</h1>
<p class="prop-name">opacity</p>
<div class="demos">
  <div class="demo-box" data-css-prop="opacity" data-value="1">
    <div class="demo-area" style="position: relative; width: 160px; height: 160px;">
      <div style="position: absolute; width: 100px; height: 100px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; color: #fff; background: #e94560; top: 0; left: 0; opacity: 1;"></div>
      <div class="layer layer-blue">B</div>
      <div class="layer layer-green">G</div>
    </div>
    <div class="label">opacity: 1</div>
  </div>
  <div class="demo-box" data-css-prop="opacity" data-value="25%">
    <div class="demo-area" style="position: relative; width: 160px; height: 160px;">
      <div style="position: absolute; width: 100px; height: 100px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; color: #fff; background: #e94560; top: 0; left: 0; opacity: 25%;"></div>
      <div class="layer layer-blue">B</div>
      <div class="layer layer-green">G</div>
    </div>
    <div class="label">opacity: 25%</div>
  </div>
  <div class="demo-box" data-css-prop="opacity" data-value="0.5">
    <div class="demo-area" style="position: relative; width: 160px; height: 160px;">
      <div style="position: absolute; width: 100px; height: 100px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; color: #fff; background: #e94560; top: 0; left: 0; opacity: 0.5;"></div>
      <div class="layer layer-blue">B</div>
      <div class="layer layer-green">G</div>
    </div>
    <div class="label">opacity: 0.5</div>
  </div>
  <div class="demo-box" data-css-prop="opacity" data-value="50%">
    <div class="demo-area" style="position: relative; width: 160px; height: 160px;">
      <div style="position: absolute; width: 100px; height: 100px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; color: #fff; background: #e94560; top: 0; left: 0; opacity: 50%;"></div>
      <div class="layer layer-blue">B</div>
      <div class="layer layer-green">G</div>
    </div>
    <div class="label">opacity: 50%</div>
  </div>
  <div class="demo-box" data-css-prop="opacity" data-value="2">
    <div class="demo-area" style="position: relative; width: 160px; height: 160px;">
      <div style="position: absolute; width: 100px; height: 100px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; color: #fff; background: #e94560; top: 0; left: 0; opacity: 2;"></div>
      <div class="layer layer-blue">B</div>
      <div class="layer layer-green">G</div>
    </div>
    <div class="label">opacity: 2</div>
  </div>
  <div class="demo-box" data-css-prop="opacity" data-value="75%">
    <div class="demo-area" style="position: relative; width: 160px; height: 160px;">
      <div style="position: absolute; width: 100px; height: 100px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; color: #fff; background: #e94560; top: 0; left: 0; opacity: 75%;"></div>
      <div class="layer layer-blue">B</div>

    </div>
    <div class="label">opacity: 75%</div>
  </div>
  <div class="demo-box" data-css-prop="opacity" data-value="0">
    <div class="demo-area" style="position: relative; width: 160px; height: 160px;">
      <div style="position: absolute; width: 100px; height: 100px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; color: #fff; background: #e94560; top: 0; left: 0; opacity: 0;"></div>
      <div class="layer layer-blue">B</div>
      <div class="layer layer-green">G</div>
    </div>
    <div class="label">opacity: 0</div>
  </div>
  <div class="demo-box" data-css-prop="opacity" data-value="100%">
    <div class="demo-area" style="position: relative; width: 160px; height: 160px;">
      <div style="position: absolute; width: 100px; height: 100px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; color: #fff; background: #e94560; top: 0; left: 0; opacity: 100%;"></div>
      <div class="layer layer-blue">B</div>
      <div class="layer layer-green">G</div>
    </div>
    <div class="label">opacity: 100%</div>
  </div>
  <div class="demo-box" data-css-prop="opacity" data-value="0%">
    <div class="demo-area" style="position: relative; width: 160px; height: 160px;">
      <div style="position: absolute; width: 100px; height: 100px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; color: #fff; background: #e94560; top: 0; left: 0; opacity: 0%;"></div>

  </div>
</div>
<script src="../interactive.js"></script>
</body>
</html>
