<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>flood-color</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
</style>
</head>
<body>
<h1>Flood Color (SVG Filter)</h1>
<p class="prop-name">flood-color</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area" style="display: flex; flex-direction: column; align-items: center;">
      <svg width="220" height="160" viewBox="0 0 220 160"><defs><filter id="fc-0" x="0" y="0" width="100%" height="100%" filterUnits="objectBoundingBox" primitiveUnits="userSpaceOnUse">
      <feFlood style="flood-opacity: 1; flood-color: red;"></feFlood>
      <feComposite operator="over" in2="SourceGraphic"/></filter></defs><rect x="10" y="10" width="200" height="140" rx="10" fill="#16213e" stroke="#333" stroke-width="1"/><rect x="20" y="20" width="180" height="120" rx="8" fill="#0a0a1a" filter="url(#fc-0)"/></svg>
    </div>
    <div class="label">flood-color: red</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="display: flex; flex-direction: column; align-items: center;">
      <svg width="220" height="160" viewBox="0 0 220 160"><defs><filter id="fc-1" x="0" y="0" width="100%" height="100%" filterUnits="objectBoundingBox" primitiveUnits="userSpaceOnUse">
      <feFlood style="flood-opacity: 1; flood-color: currentcolor;"></feFlood>
      <feComposite operator="over" in2="SourceGraphic"/></filter></defs><rect x="10" y="10" width="200" height="140" rx="10" fill="#16213e" stroke="#333" stroke-width="1"/><rect x="20" y="20" width="180" height="120" rx="8" fill="#0a0a1a" filter="url(#fc-1)"/></svg>
    </div>
    <div class="label">flood-color: currentcolor</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="display: flex; flex-direction: column; align-items: center;">
      <svg width="220" height="160" viewBox="0 0 220 160"><defs><filter id="fc-2" x="0" y="0" width="100%" height="100%" filterUnits="objectBoundingBox" primitiveUnits="userSpaceOnUse">
      <feFlood style="flood-opacity: 1; flood-color: Canvas;"></feFlood>
      <feComposite operator="over" in2="SourceGraphic"/></filter></defs><rect x="10" y="10" width="200" height="140" rx="10" fill="#16213e" stroke="#333" stroke-width="1"/><rect x="20" y="20" width="180" height="120" rx="8" fill="#0a0a1a" filter="url(#fc-2)"/></svg>
    </div>
    <div class="label">flood-color: Canvas</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="display: flex; flex-direction: column; align-items: center;">
      <svg width="220" height="160" viewBox="0 0 220 160"><defs><filter id="fc-3" x="0" y="0" width="100%" height="100%" filterUnits="objectBoundingBox" primitiveUnits="userSpaceOnUse">
      <feFlood style="flood-opacity: 1; flood-color: contrast-color(red);"></feFlood>
      <feComposite operator="over" in2="SourceGraphic"/></filter></defs><rect x="10" y="10" width="200" height="140" rx="10" fill="#16213e" stroke="#333" stroke-width="1"/><rect x="20" y="20" width="180" height="120" rx="8" fill="#0a0a1a" filter="url(#fc-3)"/></svg>
    </div>
    <div class="label">flood-color: contrast-color(red)</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="display: flex; flex-direction: column; align-items: center;">
      <svg width="220" height="160" viewBox="0 0 220 160"><defs><filter id="fc-4" x="0" y="0" width="100%" height="100%" filterUnits="objectBoundingBox" primitiveUnits="userSpaceOnUse">
      <feFlood style="flood-opacity: 1; flood-color: device-cmyk(0, 0.7, 1, 0);"></feFlood>
      <feComposite operator="over" in2="SourceGraphic"/></filter></defs><rect x="10" y="10" width="200" height="140" rx="10" fill="#16213e" stroke="#333" stroke-width="1"/><rect x="20" y="20" width="180" height="120" rx="8" fill="#0a0a1a" filter="url(#fc-4)"/></svg>
    </div>
    <div class="label">flood-color: device-cmyk(0, 0.7, 1, 0)</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="display: flex; flex-direction: column; align-items: center;">
      <svg width="220" height="160" viewBox="0 0 220 160"><defs><filter id="fc-5" x="0" y="0" width="100%" height="100%" filterUnits="objectBoundingBox" primitiveUnits="userSpaceOnUse">
      <feFlood style="flood-opacity: 1; flood-color: light-dark(red, blue);"></feFlood>
      <feComposite operator="over" in2="SourceGraphic"/></filter></defs><rect x="10" y="10" width="200" height="140" rx="10" fill="#16213e" stroke="#333" stroke-width="1"/><rect x="20" y="20" width="180" height="120" rx="8" fill="#0a0a1a" filter="url(#fc-5)"/></svg>
    </div>
    <div class="label">flood-color: light-dark(red, blue)</div>
  </div>
</div>
</body>
</html>
