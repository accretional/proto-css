<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>scroll-initial-target</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
  .scroll-item { height: 120px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; border-bottom: 1px solid #2a2a4a; background: #1a1a3e; }
.scroll-item:nth-child(even) { background: #22224a; }
.scroll-item.target { background: linear-gradient(135deg, #6366f1, #8b5cf6); position: relative; }
.scroll-item.target::after { content: 'TARGET'; position: absolute; top: 8px; right: 10px; font-size: 9px; background: rgba(0,0,0,0.3); padding: 2px 8px; border-radius: 4px; letter-spacing: 1px; }
</style>
</head>
<body>
<h1>Scroll Initial Target</h1>
<p class="prop-name">scroll-initial-target</p>
<div class="demos">
  <div class="demo-box" data-css-prop="scroll-initial-target" data-value="none">
    <div class="demo-area">
      <div style="width: 100%; height: 260px; overflow-y: auto; border: 2px solid #333; border-radius: 10px; background: #16213e; scroll-initial-target: none;"><div class="scroll-item">Item 1</div><div class="scroll-item">Item 2</div><div class="scroll-item target">Item 3</div><div class="scroll-item">Item 4</div><div class="scroll-item">Item 5</div><div class="scroll-item">Item 6</div></div>
    </div>
    <div class="label">scroll-initial-target: none</div>
  </div>
  <div class="demo-box" data-css-prop="scroll-initial-target" data-value="nearest">
    <div class="demo-area">
      <div style="width: 100%; height: 260px; overflow-y: auto; border: 2px solid #333; border-radius: 10px; background: #16213e; scroll-initial-target: nearest;"><div class="scroll-item">Item 1</div><div class="scroll-item">Item 2</div><div class="scroll-item target">Item 3</div><div class="scroll-item">Item 4</div><div class="scroll-item">Item 5</div><div class="scroll-item">Item 6</div></div>
    </div>
    <div class="label">scroll-initial-target: nearest</div>
  </div>
</div>
<div id="control-bar"></div>
<script src="../interactive.js"></script>
</body>
</html>
