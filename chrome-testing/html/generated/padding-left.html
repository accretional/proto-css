<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>padding-left</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .pad-inner { background: #0f3460; border-radius: 4px; height: 44px; min-width: 100px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-family: monospace; color: #64b5f6; }
</style>
</head>
<body>
<h1>Padding Left</h1>
<p class="prop-name">padding-left</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area">
      <div style="background: rgba(155, 89, 182, 0.25); border: 1px dashed rgba(155, 89, 182, 0.5); border-radius: 6px; display: inline-flex; align-items: center; padding-left: 0;"><div class="pad-inner">Content</div></div>
    </div>
    <div class="label">padding-left: 0</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="background: rgba(155, 89, 182, 0.25); border: 1px dashed rgba(155, 89, 182, 0.5); border-radius: 6px; display: inline-flex; align-items: center; padding-left: 10px;"><div class="pad-inner">Content</div></div>
    </div>
    <div class="label">padding-left: 10px</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="background: rgba(155, 89, 182, 0.25); border: 1px dashed rgba(155, 89, 182, 0.5); border-radius: 6px; display: inline-flex; align-items: center; padding-left: 25%;"><div class="pad-inner">Content</div></div>
    </div>
    <div class="label">padding-left: 25%</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="background: rgba(155, 89, 182, 0.25); border: 1px dashed rgba(155, 89, 182, 0.5); border-radius: 6px; display: inline-flex; align-items: center; padding-left: 50%;"><div class="pad-inner">Content</div></div>
    </div>
    <div class="label">padding-left: 50%</div>
  </div>
</div>
</body>
</html>
