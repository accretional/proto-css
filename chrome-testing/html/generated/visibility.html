<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>visibility</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .row { display: flex; gap: 10px; align-items: center; }
.box { width: 60px; height: 60px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; }
.box-a { background: #e94560; }
.box-c { background: #533483; }
.ghost-outline { border: 2px dashed #4a4a6a; width: 60px; height: 60px; border-radius: 6px; position: relative; }
.note { font-size: 10px; color: #6b7280; margin-top: 6px; line-height: 1.4; }
</style>
</head>
<body>
<h1>Visibility</h1>
<p class="prop-name">visibility</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 10px; padding: 20px; width: 280px;">
      <div class="box box-a">A</div>
      <div style="width: 60px; height: 60px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; background: #533483; visibility: visible;">B</div>
      <div class="box box-a">C</div>
    </div>
    <div class="label">visibility: visible</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 10px; padding: 20px; width: 280px;">
      <div class="box box-a">A</div>
      <div style="width: 60px; height: 60px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; background: #533483; visibility: hidden;">B</div>
      <div class="box box-a">C</div>
    </div>
    <div class="label">visibility: hidden</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 10px; padding: 20px; width: 280px;">
      <div class="box box-a">A</div>
      <div style="width: 60px; height: 60px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; background: #533483; visibility: force-hidden;">B</div>
      <div class="box box-a">C</div>
    </div>
    <div class="label">visibility: force-hidden</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 10px; padding: 20px; width: 280px;">
      <div class="box box-a">A</div>
      <div style="width: 60px; height: 60px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; background: #533483; visibility: collapse;">B</div>
      <div class="box box-a">C</div>
    </div>
    <div class="label">visibility: collapse</div>
  </div>
</div>
</body>
</html>
