<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>perspective</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .cube-face { width: 80px; height: 80px; background: linear-gradient(135deg, #e94560, #0f3460); border: 2px solid rgba(255,255,255,0.3); border-radius: 8px; transform: rotateY(40deg) rotateX(20deg); display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; color: #fff; }
</style>
</head>
<body>
<h1>Perspective</h1>
<p class="prop-name">perspective</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area" style="overflow: hidden; background: #16213e; border-radius: 12px; padding: 16px; display: flex; align-items: center; justify-content: center;">
      <div style="width: 140px; height: 140px; display: flex; align-items: center; justify-content: center; overflow: hidden; perspective: none;"><div class="cube-face">A</div></div>
    </div>
    <div class="label">perspective: none</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="overflow: hidden; background: #16213e; border-radius: 12px; padding: 16px; display: flex; align-items: center; justify-content: center;">
      <div style="width: 140px; height: 140px; display: flex; align-items: center; justify-content: center; overflow: hidden; perspective: 10px;"><div class="cube-face">A</div></div>
    </div>
    <div class="label">perspective: 10px</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="overflow: hidden; background: #16213e; border-radius: 12px; padding: 16px; display: flex; align-items: center; justify-content: center;">
      <div style="width: 140px; height: 140px; display: flex; align-items: center; justify-content: center; overflow: hidden; perspective: 20px;"><div class="cube-face">A</div></div>
    </div>
    <div class="label">perspective: 20px</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="overflow: hidden; background: #16213e; border-radius: 12px; padding: 16px; display: flex; align-items: center; justify-content: center;">
      <div style="width: 140px; height: 140px; display: flex; align-items: center; justify-content: center; overflow: hidden; perspective: 50px;"><div class="cube-face">A</div></div>
    </div>
    <div class="label">perspective: 50px</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="overflow: hidden; background: #16213e; border-radius: 12px; padding: 16px; display: flex; align-items: center; justify-content: center;">
      <div style="width: 140px; height: 140px; display: flex; align-items: center; justify-content: center; overflow: hidden; perspective: 4px;"><div class="cube-face">A</div></div>
    </div>
    <div class="label">perspective: 4px</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="overflow: hidden; background: #16213e; border-radius: 12px; padding: 16px; display: flex; align-items: center; justify-content: center;">
      <div style="width: 140px; height: 140px; display: flex; align-items: center; justify-content: center; overflow: hidden; perspective: 0;"><div class="cube-face">A</div></div>
    </div>
    <div class="label">perspective: 0</div>
  </div>
</div>
</body>
</html>
