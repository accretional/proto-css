<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>color-interpolation-filters</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
</style>
</head>
<body>
<h1>Color Interpolation Filters</h1>
<p class="prop-name">color-interpolation-filters</p>
<div class="demos">
  <div class="demo-box" data-css-prop="color-interpolation-filters" data-value="auto" data-target-selector=" feGaussianBlur" data-target-id="t0">
    <div class="demo-area">
      <style>#t0  feGaussianBlur { color-interpolation-filters: auto; }</style>
      <svg id="t0" style="width: 500px; height: 100px;"><defs><filter id="demo-blur"><feGaussianBlur stdDeviation="6"/></filter></defs><rect x="20" y="10" width="120" height="80" rx="8" fill="#e94560" filter="url(#demo-blur)"/><rect x="190" y="10" width="120" height="80" rx="8" fill="#22c55e" filter="url(#demo-blur)"/><rect x="360" y="10" width="120" height="80" rx="8" fill="#3b82f6" filter="url(#demo-blur)"/></svg>
    </div>
    <div class="label">color-interpolation-filters: auto</div>
  </div>
  <div class="demo-box" data-css-prop="color-interpolation-filters" data-value="srgb" data-target-selector=" feGaussianBlur" data-target-id="t1">
    <div class="demo-area">
      <style>#t1  feGaussianBlur { color-interpolation-filters: srgb; }</style>
      <svg id="t1" style="width: 500px; height: 100px;"><defs><filter id="demo-blur"><feGaussianBlur stdDeviation="6"/></filter></defs><rect x="20" y="10" width="120" height="80" rx="8" fill="#e94560" filter="url(#demo-blur)"/><rect x="190" y="10" width="120" height="80" rx="8" fill="#22c55e" filter="url(#demo-blur)"/><rect x="360" y="10" width="120" height="80" rx="8" fill="#3b82f6" filter="url(#demo-blur)"/></svg>
    </div>
    <div class="label">color-interpolation-filters: srgb</div>
  </div>
</div>
<div id="control-bar"></div>
<script src="../interactive.js"></script>
</body>
</html>
