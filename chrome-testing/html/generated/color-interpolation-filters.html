<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>color-interpolation-filters</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
</style>
</head>
<body>
<h1>Color Interpolation Filters</h1>
<p class="prop-name">color-interpolation-filters</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area">
      <svg style="width: 500px; height: 100px; color-interpolation-filters: auto;"><defs><filter id="demo-blur"><feGaussianBlur stdDeviation="6"/></filter></defs><rect x="20" y="10" width="120" height="80" rx="8" fill="#e94560" filter="url(#demo-blur)"/><rect x="190" y="10" width="120" height="80" rx="8" fill="#22c55e" filter="url(#demo-blur)"/><rect x="360" y="10" width="120" height="80" rx="8" fill="#3b82f6" filter="url(#demo-blur)"/></svg>
    </div>
    <div class="label">color-interpolation-filters: auto</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <svg style="width: 500px; height: 100px; color-interpolation-filters: srgb;"><defs><filter id="demo-blur"><feGaussianBlur stdDeviation="6"/></filter></defs><rect x="20" y="10" width="120" height="80" rx="8" fill="#e94560" filter="url(#demo-blur)"/><rect x="190" y="10" width="120" height="80" rx="8" fill="#22c55e" filter="url(#demo-blur)"/><rect x="360" y="10" width="120" height="80" rx="8" fill="#3b82f6" filter="url(#demo-blur)"/></svg>
    </div>
    <div class="label">color-interpolation-filters: srgb</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <svg style="width: 500px; height: 100px; color-interpolation-filters: linearRGB;"><defs><filter id="demo-blur"><feGaussianBlur stdDeviation="6"/></filter></defs><rect x="20" y="10" width="120" height="80" rx="8" fill="#e94560" filter="url(#demo-blur)"/><rect x="190" y="10" width="120" height="80" rx="8" fill="#22c55e" filter="url(#demo-blur)"/><rect x="360" y="10" width="120" height="80" rx="8" fill="#3b82f6" filter="url(#demo-blur)"/></svg>
    </div>
    <div class="label">color-interpolation-filters: linearRGB</div>
  </div>
</div>
</body>
</html>
