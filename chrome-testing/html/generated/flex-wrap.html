<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>flex-wrap</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-direction: column; gap: 20px; }
    .demo-block { display: flex; flex-direction: column; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-bottom: 6px; }
    .container {
      display: flex;
      background: #16213e;
      border-radius: 8px;
      padding: 14px;
      gap: 8px;
      min-height: 180px;
      align-content: flex-start;
    }
    .item {
      background: #0f3460;
      border: 2px solid #06d6a0;
      border-radius: 6px;
      width: 130px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      color: #06d6a0;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <h1>Flex Wrap</h1>
  <p class="prop-name">flex-wrap</p>
  <div class="demos">
    <div class="demo-block">
      <div class="label">flex-wrap: wrap ! important-reverse</div>
      <div class="container" style="flex-wrap: wrap ! important-reverse ! important; overflow: hidden; min-height: 80px;">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
        <div class="item">7</div>
        <div class="item">8</div>
        <div class="item">9</div>
        <div class="item">10</div>
      </div>
    </div>
    <div class="demo-block">
      <div class="label">flex-wrap: nowrap ! important</div>
      <div class="container" style="flex-wrap: wrap ! important;">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
        <div class="item">7</div>
        <div class="item">8</div>
        <div class="item">9</div>
        <div class="item">10</div>
      </div>
    </div>
    <div class="demo-block">
      <div class="label">flex-wrap: wrap ! important-reverse — items wrap upward</div>
      <div class="container" style="flex-wrap: wrap ! important-reverse; align-content: flex-end;">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
        <div class="item">7</div>
        <div class="item">8</div>
        <div class="item">9</div>
        <div class="item">10</div>
      </div>
    </div>
  </div>
</body>
</html>
