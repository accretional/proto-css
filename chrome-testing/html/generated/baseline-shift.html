<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>baseline-shift</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
  .baseline-line { stroke: #e94560; stroke-width: 2; stroke-dasharray: 6 3; }
</style>
</head>
<body>
<h1>Baseline Shift</h1>
<p class="prop-name">baseline-shift</p>
<div class="demos">
  <div class="demo-box" data-css-prop="baseline-shift" data-value="10px">
    <div class="demo-area" style="background: #16213e; border-radius: 8px; border: 2px solid rgba(255,255,255,0.1);">
      <svg width="320" height="160" viewBox="0 0 320 160"><rect width="320" height="160" fill="#0f3460" rx="8"/><line class="baseline-line" x1="0" y1="100" x2="320" y2="100"/><text x="10" y="16" fill="#9ca3af" font-size="11" font-family="monospace">baseline ref (y=100)</text><text x="10" y="100" fill="#e0e0e0" font-size="32" font-family="system-ui">Text 
      <tspan style="fill: #ff6b6b; font-size: 28px; baseline-shift: 10px;">shifted</tspan>
      </text></svg>
    </div>
    <div class="label">baseline-shift: 10px</div>
  </div>
  <div class="demo-box" data-css-prop="baseline-shift" data-value="sub">
    <div class="demo-area" style="background: #16213e; border-radius: 8px; border: 2px solid rgba(255,255,255,0.1);">

      </text></svg>
    </div>
    <div class="label">baseline-shift: sub</div>
  </div>

</div>
<div id="control-bar"></div>
<script src="../interactive.js"></script>
</body>
</html>
