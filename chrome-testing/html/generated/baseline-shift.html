<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>baseline-shift</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .baseline-line { stroke: rgba(255,255,255,0.15); stroke-width: 1; stroke-dasharray: 4 3; }
</style>
</head>
<body>
<h1>Baseline Shift</h1>
<p class="prop-name">baseline-shift</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 8px; border: 2px solid rgba(255,255,255,0.1);">
      <svg width="280" height="70" viewBox="0 0 280 70"><line class="baseline-line" x1="0" y1="45" x2="280" y2="45"/><text x="10" y="45" fill="#e0e0e0" font-size="20" font-family="system-ui">Text 
      <tspan style="fill: #ff6b6b; font-size: 16px; baseline-shift: 0;">shifted</tspan>
      </text></svg>
    </div>
    <div class="label">baseline-shift: 0</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 8px; border: 2px solid rgba(255,255,255,0.1);">
      <svg width="280" height="70" viewBox="0 0 280 70"><line class="baseline-line" x1="0" y1="45" x2="280" y2="45"/><text x="10" y="45" fill="#e0e0e0" font-size="20" font-family="system-ui">Text 
      <tspan style="fill: #ff6b6b; font-size: 16px; baseline-shift: 10px;">shifted</tspan>
      </text></svg>
    </div>
    <div class="label">baseline-shift: 10px</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 8px; border: 2px solid rgba(255,255,255,0.1);">
      <svg width="280" height="70" viewBox="0 0 280 70"><line class="baseline-line" x1="0" y1="45" x2="280" y2="45"/><text x="10" y="45" fill="#e0e0e0" font-size="20" font-family="system-ui">Text 
      <tspan style="fill: #ff6b6b; font-size: 16px; baseline-shift: 25%;">shifted</tspan>
      </text></svg>
    </div>
    <div class="label">baseline-shift: 25%</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 8px; border: 2px solid rgba(255,255,255,0.1);">
      <svg width="280" height="70" viewBox="0 0 280 70"><line class="baseline-line" x1="0" y1="45" x2="280" y2="45"/><text x="10" y="45" fill="#e0e0e0" font-size="20" font-family="system-ui">Text 
      <tspan style="fill: #ff6b6b; font-size: 16px; baseline-shift: 50%;">shifted</tspan>
      </text></svg>
    </div>
    <div class="label">baseline-shift: 50%</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 8px; border: 2px solid rgba(255,255,255,0.1);">
      <svg width="280" height="70" viewBox="0 0 280 70"><line class="baseline-line" x1="0" y1="45" x2="280" y2="45"/><text x="10" y="45" fill="#e0e0e0" font-size="20" font-family="system-ui">Text 
      <tspan style="fill: #ff6b6b; font-size: 16px; baseline-shift: 100%;">shifted</tspan>
      </text></svg>
    </div>
    <div class="label">baseline-shift: 100%</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 8px; border: 2px solid rgba(255,255,255,0.1);">
      <svg width="280" height="70" viewBox="0 0 280 70"><line class="baseline-line" x1="0" y1="45" x2="280" y2="45"/><text x="10" y="45" fill="#e0e0e0" font-size="20" font-family="system-ui">Text 
      <tspan style="fill: #ff6b6b; font-size: 16px; baseline-shift: sub;">shifted</tspan>
      </text></svg>
    </div>
    <div class="label">baseline-shift: sub</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 8px; border: 2px solid rgba(255,255,255,0.1);">
      <svg width="280" height="70" viewBox="0 0 280 70"><line class="baseline-line" x1="0" y1="45" x2="280" y2="45"/><text x="10" y="45" fill="#e0e0e0" font-size="20" font-family="system-ui">Text 
      <tspan style="fill: #ff6b6b; font-size: 16px; baseline-shift: super;">shifted</tspan>
      </text></svg>
    </div>
    <div class="label">baseline-shift: super</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 8px; border: 2px solid rgba(255,255,255,0.1);">
      <svg width="280" height="70" viewBox="0 0 280 70"><line class="baseline-line" x1="0" y1="45" x2="280" y2="45"/><text x="10" y="45" fill="#e0e0e0" font-size="20" font-family="system-ui">Text 
      <tspan style="fill: #ff6b6b; font-size: 16px; baseline-shift: top;">shifted</tspan>
      </text></svg>
    </div>
    <div class="label">baseline-shift: top</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 8px; border: 2px solid rgba(255,255,255,0.1);">
      <svg width="280" height="70" viewBox="0 0 280 70"><line class="baseline-line" x1="0" y1="45" x2="280" y2="45"/><text x="10" y="45" fill="#e0e0e0" font-size="20" font-family="system-ui">Text 
      <tspan style="fill: #ff6b6b; font-size: 16px; baseline-shift: center;">shifted</tspan>
      </text></svg>
    </div>
    <div class="label">baseline-shift: center</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 8px; border: 2px solid rgba(255,255,255,0.1);">
      <svg width="280" height="70" viewBox="0 0 280 70"><line class="baseline-line" x1="0" y1="45" x2="280" y2="45"/><text x="10" y="45" fill="#e0e0e0" font-size="20" font-family="system-ui">Text 
      <tspan style="fill: #ff6b6b; font-size: 16px; baseline-shift: bottom;">shifted</tspan>
      </text></svg>
    </div>
    <div class="label">baseline-shift: bottom</div>
  </div>
</div>
</body>
</html>
