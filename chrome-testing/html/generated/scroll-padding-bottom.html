<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>scroll-padding-bottom</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .demo-card { flex: 1; min-width: 200px; }
.snap-item { height: 125px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; scroll-snap-align: end; border-bottom: 1px solid #2a2a4a; }
.snap-item:nth-child(odd) { background: linear-gradient(135deg, #6366f1, #8b5cf6); }
.snap-item:nth-child(even) { background: #22224a; }
.pad-bottom { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(52, 211, 153, 0.15); border-top: 2px dashed #34d399; pointer-events: none; z-index: 2; }
.note { font-size: 10px; color: #6b7280; margin-top: 4px; }
</style>
</head>
<body>
<h1>Scroll Padding Bottom</h1>
<p class="prop-name">scroll-padding-bottom</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area" style="position: relative; border-radius: 10px; overflow: hidden;">
      <div style="width: 100%; height: 250px; overflow-y: auto; border: 2px solid #333; border-radius: 10px; background: #16213e; scroll-snap-type: y mandatory; scroll-padding-bottom: auto;"><div class="snap-item">1</div><div class="snap-item">2</div><div class="snap-item">3</div><div class="snap-item">4</div><div class="snap-item">5</div></div>
    </div>
    <div class="label">scroll-padding-bottom: auto</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="position: relative; border-radius: 10px; overflow: hidden;">
      <div style="width: 100%; height: 250px; overflow-y: auto; border: 2px solid #333; border-radius: 10px; background: #16213e; scroll-snap-type: y mandatory; scroll-padding-bottom: 10px;"><div class="snap-item">1</div><div class="snap-item">2</div><div class="snap-item">3</div><div class="snap-item">4</div><div class="snap-item">5</div></div>
    </div>
    <div class="label">scroll-padding-bottom: 10px</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="position: relative; border-radius: 10px; overflow: hidden;">
      <div style="width: 100%; height: 250px; overflow-y: auto; border: 2px solid #333; border-radius: 10px; background: #16213e; scroll-snap-type: y mandatory; scroll-padding-bottom: 25%;"><div class="snap-item">1</div><div class="snap-item">2</div><div class="snap-item">3</div><div class="snap-item">4</div><div class="snap-item">5</div></div>
    </div>
    <div class="label">scroll-padding-bottom: 25%</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="position: relative; border-radius: 10px; overflow: hidden;">
      <div style="width: 100%; height: 250px; overflow-y: auto; border: 2px solid #333; border-radius: 10px; background: #16213e; scroll-snap-type: y mandatory; scroll-padding-bottom: 50%;"><div class="snap-item">1</div><div class="snap-item">2</div><div class="snap-item">3</div><div class="snap-item">4</div><div class="snap-item">5</div></div>
    </div>
    <div class="label">scroll-padding-bottom: 50%</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="position: relative; border-radius: 10px; overflow: hidden;">
      <div style="width: 100%; height: 250px; overflow-y: auto; border: 2px solid #333; border-radius: 10px; background: #16213e; scroll-snap-type: y mandatory; scroll-padding-bottom: 100%;"><div class="snap-item">1</div><div class="snap-item">2</div><div class="snap-item">3</div><div class="snap-item">4</div><div class="snap-item">5</div></div>
    </div>
    <div class="label">scroll-padding-bottom: 100%</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="position: relative; border-radius: 10px; overflow: hidden;">
      <div style="width: 100%; height: 250px; overflow-y: auto; border: 2px solid #333; border-radius: 10px; background: #16213e; scroll-snap-type: y mandatory; scroll-padding-bottom: 0;"><div class="snap-item">1</div><div class="snap-item">2</div><div class="snap-item">3</div><div class="snap-item">4</div><div class="snap-item">5</div></div>
    </div>
    <div class="label">scroll-padding-bottom: 0</div>
  </div>
</div>
</body>
</html>
