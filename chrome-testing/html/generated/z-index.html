<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>z-index</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
  .stack-box { position: absolute; width: 120px; height: 80px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: monospace; font-weight: 700; font-size: 16px; color: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.4); border: 2px solid rgba(255,255,255,0.15); }
.z-label { font-size: 10px; font-weight: 400; opacity: 0.8; margin-top: 4px; }
</style>
</head>
<body>
<h1>Z-Index</h1>
<p class="prop-name">z-index</p>
<div class="demos">
  <div class="demo-box" data-css-prop="z-index" data-value="auto">
    <div class="demo-area" style="position: relative; height: 280px; background: #0f1a30; border-radius: 8px; border: 1px solid #2a2a4a; overflow: hidden; width: 360px;">
      <div class="stack-box" style="z-index: -5; background: #374151; top: 20px; left: 20px;">A<span class="z-label">z: -5</span></div>
      <div class="stack-box" style="z-index: 0; background: #6b7280; top: 45px; left: 50px;">B<span class="z-label">z: 0</span></div>
      <div style="position: absolute; width: 140px; height: 100px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: monospace; font-weight: 700; font-size: 16px; color: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.4); border: 2px solid rgba(255,255,255,0.2); background: #e94560; top: 70px; left: 80px; z-index: auto;"><span>target</span><span class="z-label">z-index: ?</span></div>
      <div class="stack-box" style="z-index: 10; background: #533483; top: 120px; left: 160px;">C<span class="z-label">z: 10</span></div>
      <div class="stack-box" style="z-index: 50; background: #0ea5e9; top: 150px; left: 190px;">D<span class="z-label">z: 50</span></div>
    </div>
    <div class="label">z-index: auto</div>
  </div>
  <div class="demo-box" data-css-prop="z-index" data-value="-1">
    <div class="demo-area" style="position: relative; height: 280px; background: #0f1a30; border-radius: 8px; border: 1px solid #2a2a4a; overflow: hidden; width: 360px;">
      <div class="stack-box" style="z-index: -5; background: #374151; top: 20px; left: 20px;">A<span class="z-label">z: -5</span></div>
      <div class="stack-box" style="z-index: 0; background: #6b7280; top: 45px; left: 50px;">B<span class="z-label">z: 0</span></div>
      <div style="position: absolute; width: 140px; height: 100px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: monospace; font-weight: 700; font-size: 16px; color: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.4); border: 2px solid rgba(255,255,255,0.2); background: #e94560; top: 70px; left: 80px; z-index: -1;"><span>target</span><span class="z-label">z-index: ?</span></div>
      <div class="stack-box" style="z-index: 10; background: #533483; top: 120px; left: 160px;">C<span class="z-label">z: 10</span></div>
      <div class="stack-box" style="z-index: 50; background: #0ea5e9; top: 150px; left: 190px;">D<span class="z-label">z: 50</span></div>
    </div>
    <div class="label">z-index: -1</div>
  </div>
  <div class="demo-box" data-css-prop="z-index" data-value="5">
    <div class="demo-area" style="position: relative; height: 280px; background: #0f1a30; border-radius: 8px; border: 1px solid #2a2a4a; overflow: hidden; width: 360px;">
      <div class="stack-box" style="z-index: -5; background: #374151; top: 20px; left: 20px;">A<span class="z-label">z: -5</span></div>
      <div class="stack-box" style="z-index: 0; background: #6b7280; top: 45px; left: 50px;">B<span class="z-label">z: 0</span></div>
      <div style="position: absolute; width: 140px; height: 100px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: monospace; font-weight: 700; font-size: 16px; color: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.4); border: 2px solid rgba(255,255,255,0.2); background: #e94560; top: 70px; left: 80px; z-index: 5;"><span>target</span><span class="z-label">z-index: ?</span></div>
      <div class="stack-box" style="z-index: 10; background: #533483; top: 120px; left: 160px;">C<span class="z-label">z: 10</span></div>
      <div class="stack-box" style="z-index: 50; background: #0ea5e9; top: 150px; left: 190px;">D<span class="z-label">z: 50</span></div>
    </div>
    <div class="label">z-index: 5</div>
  </div>
  <div class="demo-box" data-css-prop="z-index" data-value="100">
    <div class="demo-area" style="position: relative; height: 280px; background: #0f1a30; border-radius: 8px; border: 1px solid #2a2a4a; overflow: hidden; width: 360px;">
      <div class="stack-box" style="z-index: -5; background: #374151; top: 20px; left: 20px;">A<span class="z-label">z: -5</span></div>
      <div class="stack-box" style="z-index: 0; background: #6b7280; top: 45px; left: 50px;">B<span class="z-label">z: 0</span></div>
      <div style="position: absolute; width: 140px; height: 100px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: monospace; font-weight: 700; font-size: 16px; color: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.4); border: 2px solid rgba(255,255,255,0.2); background: #e94560; top: 70px; left: 80px; z-index: 100;"><span>target</span><span class="z-label">z-index: ?</span></div>
      <div class="stack-box" style="z-index: 10; background: #533483; top: 120px; left: 160px;">C<span class="z-label">z: 10</span></div>
      <div class="stack-box" style="z-index: 50; background: #0ea5e9; top: 150px; left: 190px;">D<span class="z-label">z: 50</span></div>
    </div>
    <div class="label">z-index: 100</div>
  </div>
</div>
<div id="control-bar"></div>
<script src="../interactive.js"></script>
</body>
</html>
