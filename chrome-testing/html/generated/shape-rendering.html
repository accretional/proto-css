<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>shape-rendering</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
  .demos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
.label { font-size: 11px; font-family: monospace; color: #a78bfa; margin-bottom: 16px; background: #1a1a2e; display: inline-block; padding: 3px 8px; border-radius: 4px; }
.note { font-size: 10px; color: #6b7280; margin-top: 12px; }
</style>
</head>
<body>
<h1>Shape Rendering</h1>
<p class="prop-name">shape-rendering</p>
<div class="demos">
  <div class="demo-box" data-css-prop="shape-rendering" data-value="auto">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 20px; border: 1px solid #2a2a4a; text-align: center;">
      <svg style="display: block; margin: 0 auto; shape-rendering: auto;"><circle cx="110" cy="60" r="45" fill="none" stroke="#8b5cf6" stroke-width="2"/><rect x="40" y="130" width="140" height="80" rx="4" fill="none" stroke="#6366f1" stroke-width="2"/><polygon points="110,240 160,320 60,320" fill="none" stroke="#a78bfa" stroke-width="2"/><ellipse cx="110" cy="380" rx="70" ry="40" fill="none" stroke="#7c3aed" stroke-width="2"/><line x1="30" y1="450" x2="190" y2="510" stroke="#c4b5fd" stroke-width="2"/><path d="M30,470 Q110,430 190,470" fill="none" stroke="#ddd6fe" stroke-width="2"/></svg>
    </div>
    <div class="label">shape-rendering: auto</div>
  </div>
  <div class="demo-box" data-css-prop="shape-rendering" data-value="optimizeSpeed">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 20px; border: 1px solid #2a2a4a; text-align: center;">
      <svg style="display: block; margin: 0 auto; shape-rendering: optimizeSpeed;"><circle cx="110" cy="60" r="45" fill="none" stroke="#8b5cf6" stroke-width="2"/><rect x="40" y="130" width="140" height="80" rx="4" fill="none" stroke="#6366f1" stroke-width="2"/><polygon points="110,240 160,320 60,320" fill="none" stroke="#a78bfa" stroke-width="2"/><ellipse cx="110" cy="380" rx="70" ry="40" fill="none" stroke="#7c3aed" stroke-width="2"/><line x1="30" y1="450" x2="190" y2="510" stroke="#c4b5fd" stroke-width="2"/><path d="M30,470 Q110,430 190,470" fill="none" stroke="#ddd6fe" stroke-width="2"/></svg>
    </div>
    <div class="label">shape-rendering: optimizeSpeed</div>
  </div>
  <div class="demo-box" data-css-prop="shape-rendering" data-value="crispEdges">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 20px; border: 1px solid #2a2a4a; text-align: center;">
      <svg style="display: block; margin: 0 auto; shape-rendering: crispEdges;"><circle cx="110" cy="60" r="45" fill="none" stroke="#8b5cf6" stroke-width="2"/><rect x="40" y="130" width="140" height="80" rx="4" fill="none" stroke="#6366f1" stroke-width="2"/><polygon points="110,240 160,320 60,320" fill="none" stroke="#a78bfa" stroke-width="2"/><ellipse cx="110" cy="380" rx="70" ry="40" fill="none" stroke="#7c3aed" stroke-width="2"/><line x1="30" y1="450" x2="190" y2="510" stroke="#c4b5fd" stroke-width="2"/><path d="M30,470 Q110,430 190,470" fill="none" stroke="#ddd6fe" stroke-width="2"/></svg>
    </div>
    <div class="label">shape-rendering: crispEdges</div>
  </div>
  <div class="demo-box" data-css-prop="shape-rendering" data-value="geometricPrecision">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 20px; border: 1px solid #2a2a4a; text-align: center;">
      <svg style="display: block; margin: 0 auto; shape-rendering: geometricPrecision;"><circle cx="110" cy="60" r="45" fill="none" stroke="#8b5cf6" stroke-width="2"/><rect x="40" y="130" width="140" height="80" rx="4" fill="none" stroke="#6366f1" stroke-width="2"/><polygon points="110,240 160,320 60,320" fill="none" stroke="#a78bfa" stroke-width="2"/><ellipse cx="110" cy="380" rx="70" ry="40" fill="none" stroke="#7c3aed" stroke-width="2"/><line x1="30" y1="450" x2="190" y2="510" stroke="#c4b5fd" stroke-width="2"/><path d="M30,470 Q110,430 190,470" fill="none" stroke="#ddd6fe" stroke-width="2"/></svg>
    </div>
    <div class="label">shape-rendering: geometricPrecision</div>
  </div>
</div>
<div id="control-bar"></div>
<script src="../interactive.js"></script>
</body>
</html>
