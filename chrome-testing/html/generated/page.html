<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>page</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
  .page-content { padding: 16px; text-align: center; }
.page-content h3 { font-size: 12px; color: #333; margin-bottom: 6px; }
.page-content p { font-size: 10px; color: #666; line-height: 1.5; }
</style>
</head>
<body>
<h1>Page</h1>
<p class="prop-name">page</p>
<div class="demos">
  <div class="demo-box" data-css-prop="page" data-value="auto">
    <div class="demo-area">
      <div style="border-radius: 6px; background: #f5f5f5; box-shadow: 0 4px 16px rgba(0,0,0,0.3); width: 160px; height: 210px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; page: auto;"><div class="page-content"><h3>Page Content</h3><p>This element uses a named page type for print layout.</p></div></div>
    </div>
    <div class="label">page: auto</div>
  </div>
  <div class="demo-box" data-css-prop="page" data-value="my-custom">
    <div class="demo-area">
      <div style="border-radius: 6px; background: #f5f5f5; box-shadow: 0 4px 16px rgba(0,0,0,0.3); width: 160px; height: 210px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; page: my-custom;"><div class="page-content"><h3>Page Content</h3><p>This element uses a named page type for print layout.</p></div></div>
    </div>
    <div class="label">page: my-custom</div>
  </div>
</div>
<div id="control-bar"></div>
<script src="../interactive.js"></script>
</body>
</html>
