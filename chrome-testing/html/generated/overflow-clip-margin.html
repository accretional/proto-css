<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>overflow-clip-margin</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
  .overflow-content { position: absolute; top: -30px; left: -30px; width: 180px; height: 180px; background: linear-gradient(135deg, #e94560 0%, #a855f7 100%); border-radius: 12px; opacity: 0.85; }
</style>
</head>
<body>
<div id="control-bar"></div>
<h1>Overflow Clip Margin</h1>
<p class="prop-name">overflow-clip-margin</p>
<div class="demos">
  <div class="demo-box" data-css-prop="overflow-clip-margin" data-value="content-box">
    <div class="demo-area" style="width: 200px; height: 200px; display: flex; align-items: center; justify-content: center; position: relative;">
      <div style="position: relative; width: 120px; height: 120px; overflow: clip; background: #0f3460; border: 3px solid #4fc3f7; border-radius: 6px; overflow-clip-margin: content-box;"><div class="overflow-content"></div></div>
    </div>
    <div class="label">overflow-clip-margin: content-box</div>
  </div>
  <div class="demo-box" data-css-prop="overflow-clip-margin" data-value="0">
    <div class="demo-area" style="width: 200px; height: 200px; display: flex; align-items: center; justify-content: center; position: relative;">
      <div style="position: relative; width: 120px; height: 120px; overflow: clip; background: #0f3460; border: 3px solid #4fc3f7; border-radius: 6px; overflow-clip-margin: 0;"><div class="overflow-content"></div></div>
    </div>
    <div class="label">overflow-clip-margin: 0</div>
  </div>
  <div class="demo-box" data-css-prop="overflow-clip-margin" data-value="padding-box">
    <div class="demo-area" style="width: 200px; height: 200px; display: flex; align-items: center; justify-content: center; position: relative;">
      <div style="position: relative; width: 120px; height: 120px; overflow: clip; background: #0f3460; border: 3px solid #4fc3f7; border-radius: 6px; overflow-clip-margin: padding-box;"><div class="overflow-content"></div></div>
    </div>
    <div class="label">overflow-clip-margin: padding-box</div>
  </div>
  <div class="demo-box" data-css-prop="overflow-clip-margin" data-value="0cap">
    <div class="demo-area" style="width: 200px; height: 200px; display: flex; align-items: center; justify-content: center; position: relative;">
      <div style="position: relative; width: 120px; height: 120px; overflow: clip; background: #0f3460; border: 3px solid #4fc3f7; border-radius: 6px; overflow-clip-margin: 0cap;"><div class="overflow-content"></div></div>
    </div>
    <div class="label">overflow-clip-margin: 0cap</div>
  </div>
  <div class="demo-box" data-css-prop="overflow-clip-margin" data-value="border-box">
    <div class="demo-area" style="width: 200px; height: 200px; display: flex; align-items: center; justify-content: center; position: relative;">
      <div style="position: relative; width: 120px; height: 120px; overflow: clip; background: #0f3460; border: 3px solid #4fc3f7; border-radius: 6px; overflow-clip-margin: border-box;"><div class="overflow-content"></div></div>
    </div>
    <div class="label">overflow-clip-margin: border-box</div>
  </div>
  <div class="demo-box" data-css-prop="overflow-clip-margin" data-value="+0cap">
    <div class="demo-area" style="width: 200px; height: 200px; display: flex; align-items: center; justify-content: center; position: relative;">
      <div style="position: relative; width: 120px; height: 120px; overflow: clip; background: #0f3460; border: 3px solid #4fc3f7; border-radius: 6px; overflow-clip-margin: +0cap;"><div class="overflow-content"></div></div>
    </div>
    <div class="label">overflow-clip-margin: +0cap</div>
  </div>
</div>
<script src="../interactive.js"></script>
</body>
</html>
