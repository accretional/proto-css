<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>forced-color-adjust</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
  .btn { display: inline-block; padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; margin-right: 6px; margin-bottom: 6px; }
.btn-primary { background: #7c3aed; color: #fff; }
.btn-success { background: #10b981; color: #fff; }
.btn-danger { background: #ef4444; color: #fff; }
.status-bar { display: flex; gap: 8px; margin-bottom: 12px; }
.status-dot { width: 12px; height: 12px; border-radius: 50%; }
.dot-red { background: #ef4444; }
.dot-yellow { background: #f59e0b; }
.dot-green { background: #10b981; }
.gradient-box { height: 32px; border-radius: 6px; margin-bottom: 12px; background: linear-gradient(90deg, #7c3aed, #ec4899, #f59e0b); }
.text-styled { font-size: 14px; line-height: 1.5; }
.highlight { background: #f59e0b33; color: #f59e0b; padding: 1px 4px; border-radius: 3px; }
</style>
</head>
<body>
<h1>Forced Color Adjust</h1>
<p class="prop-name">forced-color-adjust</p>
<div class="demos">
  <div class="demo-box" data-css-prop="forced-color-adjust" data-value="auto">
    <div class="demo-area">
      <div style="background: #0f172a; padding: 14px; border-radius: 8px; forced-color-adjust: auto;"><div class="status-bar"><div class="status-dot dot-red"></div><div class="status-dot dot-yellow"></div><div class="status-dot dot-green"></div></div><div class="gradient-box"></div><div><span class="btn btn-primary">Primary</span><span class="btn btn-success">Success</span><span class="btn btn-danger">Danger</span></div><p class="text-styled" style="margin-top: 10px; color: #e0e0e0;">Text with <span class="highlight">highlighted</span> content</p></div>
    </div>
    <div class="label">forced-color-adjust: auto</div>
  </div>
  <div class="demo-box" data-css-prop="forced-color-adjust" data-value="none">
    <div class="demo-area">
      <div style="background: #0f172a; padding: 14px; border-radius: 8px; forced-color-adjust: none;"><div class="status-bar"><div class="status-dot dot-red"></div><div class="status-dot dot-yellow"></div><div class="status-dot dot-green"></div></div><div class="gradient-box"></div><div><span class="btn btn-primary">Primary</span><span class="btn btn-success">Success</span><span class="btn btn-danger">Danger</span></div><p class="text-styled" style="margin-top: 10px; color: #e0e0e0;">Text with <span class="highlight">highlighted</span> content</p></div>
    </div>
    <div class="label">forced-color-adjust: none</div>
  </div>
  <div class="demo-box" data-css-prop="forced-color-adjust" data-value="preserve-parent-color">
    <div class="demo-area">
      <div style="background: #0f172a; padding: 14px; border-radius: 8px; forced-color-adjust: preserve-parent-color;"><div class="status-bar"><div class="status-dot dot-red"></div><div class="status-dot dot-yellow"></div><div class="status-dot dot-green"></div></div><div class="gradient-box"></div><div><span class="btn btn-primary">Primary</span><span class="btn btn-success">Success</span><span class="btn btn-danger">Danger</span></div><p class="text-styled" style="margin-top: 10px; color: #e0e0e0;">Text with <span class="highlight">highlighted</span> content</p></div>
    </div>
    <div class="label">forced-color-adjust: preserve-parent-color</div>
  </div>
</div>
<div id="control-bar"></div>
<script src="../interactive.js"></script>
</body>
</html>
