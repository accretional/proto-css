<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>position-try-fallbacks</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
  .anchor-el { padding: 6px 16px; background: linear-gradient(135deg, #0f3460, #1a5276); border: 2px solid #3498db; border-radius: 8px; font-size: 11px; font-weight: 600; color: #7ec8e3; }
</style>
</head>
<body>
<h1>Position Try Fallbacks</h1>
<p class="prop-name">position-try-fallbacks</p>
<div class="demos">
  <div class="demo-box" data-css-prop="position-try-fallbacks" data-value="none">
    <div class="demo-area" style="width: 320px; height: 200px; position: relative; border: 2px solid rgba(255,255,255,0.1); border-radius: 8px; background: rgba(0,0,0,0.2);">
      <div class="anchor-el" style="position: absolute; top: 85px; left: 120px;">Anchor</div>
      <div style="position: absolute; padding: 5px 12px; border-radius: 6px; font-size: 10px; font-weight: 600; white-space: nowrap; background: #e94560; color: #fff; border: 2px solid rgba(255,255,255,0.3); top: 55px; left: 120px; position-try-fallbacks: none;">fallback</div>
    </div>
    <div class="label">position-try-fallbacks: none</div>
  </div>
  <div class="demo-box" data-css-prop="position-try-fallbacks" data-value="--my-var">
    <div class="demo-area" style="width: 320px; height: 200px; position: relative; border: 2px solid rgba(255,255,255,0.1); border-radius: 8px; background: rgba(0,0,0,0.2);">
      <div class="anchor-el" style="position: absolute; top: 85px; left: 120px;">Anchor</div>
      <div style="position: absolute; padding: 5px 12px; border-radius: 6px; font-size: 10px; font-weight: 600; white-space: nowrap; background: #e94560; color: #fff; border: 2px solid rgba(255,255,255,0.3); top: 55px; left: 120px; position-try-fallbacks: --my-var;">fallback</div>
    </div>
    <div class="label">position-try-fallbacks: --my-var</div>
  </div>
  <div class="demo-box" data-css-prop="position-try-fallbacks" data-value="left">
    <div class="demo-area" style="width: 320px; height: 200px; position: relative; border: 2px solid rgba(255,255,255,0.1); border-radius: 8px; background: rgba(0,0,0,0.2);">
      <div class="anchor-el" style="position: absolute; top: 85px; left: 120px;">Anchor</div>
      <div style="position: absolute; padding: 5px 12px; border-radius: 6px; font-size: 10px; font-weight: 600; white-space: nowrap; background: #e94560; color: #fff; border: 2px solid rgba(255,255,255,0.3); top: 55px; left: 120px; position-try-fallbacks: left;">fallback</div>
    </div>
    <div class="label">position-try-fallbacks: left</div>
  </div>
  <div class="demo-box" data-css-prop="position-try-fallbacks" data-value="flip-block">
    <div class="demo-area" style="width: 320px; height: 200px; position: relative; border: 2px solid rgba(255,255,255,0.1); border-radius: 8px; background: rgba(0,0,0,0.2);">
      <div class="anchor-el" style="position: absolute; top: 85px; left: 120px;">Anchor</div>
      <div style="position: absolute; padding: 5px 12px; border-radius: 6px; font-size: 10px; font-weight: 600; white-space: nowrap; background: #e94560; color: #fff; border: 2px solid rgba(255,255,255,0.3); top: 55px; left: 120px; position-try-fallbacks: flip-block;">fallback</div>
    </div>
    <div class="label">position-try-fallbacks: flip-block</div>
  </div>
</div>
<div id="control-bar"></div>
<script src="../interactive.js"></script>
</body>
</html>
