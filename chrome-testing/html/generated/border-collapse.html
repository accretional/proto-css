<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>border-collapse</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 48px; }
    .demo-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    table {
      border: 2px solid #e94560;
      border-spacing: 8px;
    }
    td {
      border: 2px solid #0f3460;
      padding: 12px 20px;
      background: #16213e;
      font-size: 13px;
      color: #ccc;
    }
    th {
      border: 2px solid #0f3460;
      padding: 10px 20px;
      background: #0a1628;
      font-size: 12px;
      color: #e94560;
      font-weight: 600;
    }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 12px; text-align: center; }
  </style>
</head>
<body>
  <h1>Border Collapse</h1>
  <p class="prop-name">border-collapse</p>
  <div class="demos">
    <div class="demo-item">
      <table style="border-collapse: separate ! important; border-spacing: 8px;">
        <tr><th>A</th><th>B</th><th>C</th></tr>
        <tr><td>1</td><td>2</td><td>3</td></tr>
        <tr><td>4</td><td>5</td><td>6</td></tr>
        <tr><td>7</td><td>8</td><td>9</td></tr>
      </table>
      <div class="label">border-collapse: separate ! important</div>
    </div>
    <div class="demo-item">
      <table style="border-collapse: separate ! important;">
        <tr><th>A</th><th>B</th><th>C</th></tr>
        <tr><td>1</td><td>2</td><td>3</td></tr>
        <tr><td>4</td><td>5</td><td>6</td></tr>
        <tr><td>7</td><td>8</td><td>9</td></tr>
      </table>
      <div class="label">border-collapse: separate ! important</div>
    </div>
  </div>
</body>
</html>
