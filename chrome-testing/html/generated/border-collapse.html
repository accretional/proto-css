<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>border-collapse</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
  table { border: 2px solid #e94560; border-spacing: 8px; }
td { border: 2px solid #0f3460; padding: 12px 20px; background: #16213e; font-size: 13px; color: #ccc; }
th { border: 2px solid #0f3460; padding: 10px 20px; background: #0a1628; font-size: 12px; color: #e94560; font-weight: 600; }
</style>
</head>
<body>
<div id="control-bar"></div>
<h1>Border Collapse</h1>
<p class="prop-name">border-collapse</p>
<div class="demos">
  <div class="demo-box" data-css-prop="border-collapse" data-value="separate">
    <div class="demo-area">
      <table style="border-spacing: 8px; border-collapse: separate;"><tr><th>A</th><th>B</th><th>C</th></tr><tr><td>1</td><td>2</td><td>3</td></tr><tr><td>4</td><td>5</td><td>6</td></tr></table>
    </div>
    <div class="label">border-collapse: separate</div>
  </div>
  <div class="demo-box" data-css-prop="border-collapse" data-value="collapse">
    <div class="demo-area">
      <table style="border-spacing: 8px; border-collapse: collapse;"><tr><th>A</th><th>B</th><th>C</th></tr><tr><td>1</td><td>2</td><td>3</td></tr><tr><td>4</td><td>5</td><td>6</td></tr></table>
    </div>
    <div class="label">border-collapse: collapse</div>
  </div>
</div>
<script src="../interactive.js"></script>
</body>
</html>
