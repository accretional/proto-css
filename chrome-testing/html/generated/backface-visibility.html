<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>backface-visibility</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-face { position: absolute; inset: 0; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; }
.card-front { background: linear-gradient(135deg, #e94560, #533bdb); color: #fff; }
.card-back { background: linear-gradient(135deg, #0ea5e9, #10b981); color: #fff; transform: rotateY(180deg); }
</style>
</head>
<body>
<h1>Backface Visibility</h1>
<p class="prop-name">backface-visibility</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area" style="width: 110px; height: 140px; perspective: 600px;">
      <div style="width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transform: rotateY(135deg); backface-visibility: visible;"><div class="card-face card-front">FRONT</div><div class="card-face card-back">BACK</div></div>
    </div>
    <div class="label">backface-visibility: visible</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="width: 110px; height: 140px; perspective: 600px;">
      <div style="width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transform: rotateY(135deg); backface-visibility: hidden;"><div class="card-face card-front">FRONT</div><div class="card-face card-back">BACK</div></div>
    </div>
    <div class="label">backface-visibility: hidden</div>
  </div>
</div>
</body>
</html>
