<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>backface-visibility</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
</style>
</head>
<body>
<h1>Backface Visibility</h1>
<p class="prop-name">backface-visibility</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area" style="width: 140px; height: 170px; perspective: 600px; display: flex; align-items: center; justify-content: center;">
      <div style="width: 110px; height: 140px; border-radius: 10px; background: linear-gradient(135deg, #e94560, #533bdb); color: #fff; font-weight: 700; font-size: 18px; display: flex; align-items: center; justify-content: center; transform: rotateY(180deg); backface-visibility: visible;">HELLO</div>
    </div>
    <div class="label">backface-visibility: visible</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="width: 140px; height: 170px; perspective: 600px; display: flex; align-items: center; justify-content: center;">
      <div style="width: 110px; height: 140px; border-radius: 10px; background: linear-gradient(135deg, #e94560, #533bdb); color: #fff; font-weight: 700; font-size: 18px; display: flex; align-items: center; justify-content: center; transform: rotateY(180deg); backface-visibility: hidden;">HELLO</div>
    </div>
    <div class="label">backface-visibility: hidden</div>
  </div>
</div>
</body>
</html>
