<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>animation-play-state</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .status { font-size: 13px; font-weight: 600; margin-bottom: 20px; padding: 4px 12px; border-radius: 20px; }
.status-running { background: #064e3b; color: #6ee7b7; }
.status-paused { background: #78350f; color: #fcd34d; }
.track { width: 100%; height: 60px; background: #0f3460; border-radius: 8px; position: relative; overflow: hidden; }
@keyframes moveAcross {
  0% { left: 0; }
  100% { left: calc(100% - 50px); }
}
</style>
</head>
<body>
<h1>Animation Play State</h1>
<p class="prop-name">animation-play-state</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 32px 40px; display: flex; flex-direction: column; align-items: center; flex: 1;">
      <div style="width: 50px; height: 50px; background: #e94560; border-radius: 50%; position: absolute; top: 5px; left: 0; animation: moveAcross 2s ease-in-out infinite alternate; animation-play-state: running;"></div>
    </div>
    <div class="label">animation-play-state: running</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 32px 40px; display: flex; flex-direction: column; align-items: center; flex: 1;">
      <div style="width: 50px; height: 50px; background: #e94560; border-radius: 50%; position: absolute; top: 5px; left: 0; animation: moveAcross 2s ease-in-out infinite alternate; animation-play-state: running, running;"></div>
    </div>
    <div class="label">animation-play-state: running, running</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 32px 40px; display: flex; flex-direction: column; align-items: center; flex: 1;">
      <div style="width: 50px; height: 50px; background: #e94560; border-radius: 50%; position: absolute; top: 5px; left: 0; animation: moveAcross 2s ease-in-out infinite alternate; animation-play-state: running, paused;"></div>
    </div>
    <div class="label">animation-play-state: running, paused</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 32px 40px; display: flex; flex-direction: column; align-items: center; flex: 1;">
      <div style="width: 50px; height: 50px; background: #e94560; border-radius: 50%; position: absolute; top: 5px; left: 0; animation: moveAcross 2s ease-in-out infinite alternate; animation-play-state: paused;"></div>
    </div>
    <div class="label">animation-play-state: paused</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 32px 40px; display: flex; flex-direction: column; align-items: center; flex: 1;">
      <div style="width: 50px; height: 50px; background: #e94560; border-radius: 50%; position: absolute; top: 5px; left: 0; animation: moveAcross 2s ease-in-out infinite alternate; animation-play-state: paused, running;"></div>
    </div>
    <div class="label">animation-play-state: paused, running</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 32px 40px; display: flex; flex-direction: column; align-items: center; flex: 1;">
      <div style="width: 50px; height: 50px; background: #e94560; border-radius: 50%; position: absolute; top: 5px; left: 0; animation: moveAcross 2s ease-in-out infinite alternate; animation-play-state: paused, paused;"></div>
    </div>
    <div class="label">animation-play-state: paused, paused</div>
  </div>
</div>
</body>
</html>
