<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>animation-play-state</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
  @keyframes moveAcross {
  0% { left: 0; }
  100% { left: calc(100% - 50px); }
}
</style>
</head>
<body>
<h1>Animation Play State</h1>
<p class="prop-name">animation-play-state</p>
<div class="demos">
  <div class="demo-box" data-css-prop="animation-play-state" data-value="running">
    <div class="demo-area" style="position: relative; height: 64px; background: #0f3460; border-radius: 8px; overflow: hidden;">
      <div style="width: 50px; height: 50px; background: #e94560; border-radius: 50%; position: absolute; top: 50%; left: 0; transform: translateY(-50%); animation: moveAcross 2s ease-in-out infinite alternate; animation-delay: -0.3s; animation-play-state: running;"></div>
    </div>
    <div class="label">animation-play-state: running</div>
  </div>
  <div class="demo-box" data-css-prop="animation-play-state" data-value="paused">
    <div class="demo-area" style="position: relative; height: 64px; background: #0f3460; border-radius: 8px; overflow: hidden;">
      <div style="width: 50px; height: 50px; background: #e94560; border-radius: 50%; position: absolute; top: 50%; left: 0; transform: translateY(-50%); animation: moveAcross 2s ease-in-out infinite alternate; animation-delay: -0.3s; animation-play-state: paused;"></div>
    </div>
    <div class="label">animation-play-state: paused</div>
  </div>
  <div class="demo-box" data-css-prop="animation-play-state" data-value="running, running">
    <div class="demo-area" style="position: relative; height: 64px; background: #0f3460; border-radius: 8px; overflow: hidden;">
      <div style="width: 50px; height: 50px; background: #e94560; border-radius: 50%; position: absolute; top: 50%; left: 0; transform: translateY(-50%); animation: moveAcross 2s ease-in-out infinite alternate; animation-delay: -0.3s; animation-play-state: running, running;"></div>
    </div>
    <div class="label">animation-play-state: running, running</div>
  </div>
  <div class="demo-box" data-css-prop="animation-play-state" data-value="paused, running">
    <div class="demo-area" style="position: relative; height: 64px; background: #0f3460; border-radius: 8px; overflow: hidden;">
      <div style="width: 50px; height: 50px; background: #e94560; border-radius: 50%; position: absolute; top: 50%; left: 0; transform: translateY(-50%); animation: moveAcross 2s ease-in-out infinite alternate; animation-delay: -0.3s; animation-play-state: paused, running;"></div>
    </div>
    <div class="label">animation-play-state: paused, running</div>
  </div>
</div>
<div id="control-bar"></div>
<script src="../interactive.js"></script>
</body>
</html>
