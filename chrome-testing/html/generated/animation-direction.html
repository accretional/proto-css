<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>animation-direction</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  @keyframes moveCorner {
  0% { top: 10px; left: 10px; background: #e94560; }
  100% { top: 60px; left: calc(100% - 60px); background: #3498db; }
}
</style>
</head>
<body>
<h1>Animation Direction</h1>
<p class="prop-name">animation-direction</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area" style="position: relative; background: #0f3460; border-radius: 8px; width: 100%; height: 120px;">
      <div style="width: 50px; height: 50px; border-radius: 8px; position: absolute; animation: moveCorner 2s linear infinite; animation-delay: -0.5s; background: #e94560; animation-direction: normal;"></div>
    </div>
    <div class="label">animation-direction: normal</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="position: relative; background: #0f3460; border-radius: 8px; width: 100%; height: 120px;">
      <div style="width: 50px; height: 50px; border-radius: 8px; position: absolute; animation: moveCorner 2s linear infinite; animation-delay: -0.5s; background: #e94560; animation-direction: reverse;"></div>
    </div>
    <div class="label">animation-direction: reverse</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="position: relative; background: #0f3460; border-radius: 8px; width: 100%; height: 120px;">
      <div style="width: 50px; height: 50px; border-radius: 8px; position: absolute; animation: moveCorner 2s linear infinite; animation-delay: -0.5s; background: #e94560; animation-direction: alternate;"></div>
    </div>
    <div class="label">animation-direction: alternate</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="position: relative; background: #0f3460; border-radius: 8px; width: 100%; height: 120px;">
      <div style="width: 50px; height: 50px; border-radius: 8px; position: absolute; animation: moveCorner 2s linear infinite; animation-delay: -0.5s; background: #e94560; animation-direction: alternate-reverse;"></div>
    </div>
    <div class="label">animation-direction: alternate-reverse</div>
  </div>
</div>
</body>
</html>
