<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>margin-inline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 18px; }
    .demo-card { background: #16213e; border-radius: 12px; padding: 16px; width: 370px; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 10px; text-align: center; }
    .outer { background: #0f3460; border-radius: 8px; overflow: hidden; padding: 8px 0; }
    .target { background: #e94560; padding: 14px; font-size: 12px; font-weight: 600; color: #fff; text-align: center; }
  </style>
</head>
<body>
  <h1>Margin Inline</h1>
  <p class="prop-name">margin-inline</p>
  <div class="demos">
    <div class="demo-card">
      <div class="outer">
        <div class="target" style="margin-inline: auto ! important;">Target</div>
      </div>
      <div class="label">margin-inline: auto ! important</div>
    </div>
    <div class="demo-card">
      <div class="outer">
        <div class="target" style="margin-inline: anchor-size(--w, abs(var(--__, -1%) /)) anchor-size(--琨, 0);">Target</div>
      </div>
      <div class="label">margin-inline: anchor-size(--w, abs(var(--__, -1%) /)) anchor-size(--琨, 0)</div>
    </div>
    <div class="demo-card">
      <div class="outer">
        <div class="target" style="margin-inline: anchor(--_ꆉ end,) auto;">Target</div>
      </div>
      <div class="label">margin-inline: anchor(--_ꆉ end,) auto</div>
    </div>
    <div class="demo-card">
      <div class="outer">
        <div class="target" style="margin-inline: 0;">Target</div>
      </div>
      <div class="label">margin-inline: 0</div>
    </div>
    <div class="demo-card">
      <div class="outer">
        <div class="target" style="margin-inline: auto; width: 50%;">Target</div>
      </div>
      <div class="label">margin-inline: env(_-, +98.5dppx)</div>
    </div>
  </div>
</body>
</html>
