<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>math-shift</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
</style>
</head>
<body>
<h1>Math Shift</h1>
<p class="prop-name">math-shift</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area">
      <math style="display: block; font-size: 48px; background: #0f3460; border-radius: 8px; padding: 32px 40px; color: #e0e0e0; math-shift: normal;"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>3</mn></msup><mo>=</mo><msup><mi>z</mi><mn>n</mn></msup></math>
    </div>
    <div class="label">math-shift: normal</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <math style="display: block; font-size: 48px; background: #0f3460; border-radius: 8px; padding: 32px 40px; color: #e0e0e0; math-shift: compact;"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>3</mn></msup><mo>=</mo><msup><mi>z</mi><mn>n</mn></msup></math>
    </div>
    <div class="label">math-shift: compact</div>
  </div>
</div>
</body>
</html>
