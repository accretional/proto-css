<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>math-shift</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  math { font-size: 36px; color: #e0e0e0; }
.math-row { display: flex; align-items: baseline; gap: 16px; }
.guide-line { width: 100%; border-top: 1px dashed #4fc3f744; margin-top: 4px; }
</style>
</head>
<body>
<h1>Math Shift</h1>
<p class="prop-name">math-shift</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area">
      <div style="background: #0f3460; border-radius: 8px; padding: 28px 36px; display: flex; flex-direction: column; align-items: center; gap: 24px; width: 100%; math-shift: normal;"><div class="math-row"><math display="block"><msup><mi>x</mi><mn>2</mn></msup></math><math display="block"><msup><mi>e</mi><mrow><mi>i</mi><mi>&pi;</mi></mrow></msup></math><math display="block"><msup><mn>2</mn><mn>10</mn></msup></math></div><div class="guide-line"></div><div class="math-row"><math display="block"><msup><mi>a</mi><mrow><mi>b</mi><mo>+</mo><mi>c</mi></mrow></msup></math><math display="block"><msup><mi>y</mi><mfrac><mn>1</mn><mn>2</mn></mfrac></msup></math></div></div>
    </div>
    <div class="label">math-shift: normal</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="background: #0f3460; border-radius: 8px; padding: 28px 36px; display: flex; flex-direction: column; align-items: center; gap: 24px; width: 100%; math-shift: compact;"><div class="math-row"><math display="block"><msup><mi>x</mi><mn>2</mn></msup></math><math display="block"><msup><mi>e</mi><mrow><mi>i</mi><mi>&pi;</mi></mrow></msup></math><math display="block"><msup><mn>2</mn><mn>10</mn></msup></math></div><div class="guide-line"></div><div class="math-row"><math display="block"><msup><mi>a</mi><mrow><mi>b</mi><mo>+</mo><mi>c</mi></mrow></msup></math><math display="block"><msup><mi>y</mi><mfrac><mn>1</mn><mn>2</mn></mfrac></msup></math></div></div>
    </div>
    <div class="label">math-shift: compact</div>
  </div>
</div>
</body>
</html>
