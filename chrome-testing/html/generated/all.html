<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>all</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
  .demo-area > div { background: #e94560; color: #fff; padding: 16px 24px; border-radius: 8px; font-size: 18px; font-weight: bold; border: 4px solid #f39c12; letter-spacing: 2px; text-transform: uppercase; box-shadow: 0 4px 16px rgba(233, 69, 96, 0.6); display: inline-block; }
.demo-area { background: #2ecc71; padding: 8px; border-radius: 4px; }
</style>
</head>
<body>
<div id="control-bar"></div>
<h1>All (Property Reset)</h1>
<p class="prop-name">all</p>
<div class="demos">
  <div class="demo-box" data-css-prop="all" data-value="initial">
    <div class="demo-area">
      <div style=" all: initial;">Styled Box</div>
    </div>
    <div class="label">all: initial</div>
  </div>
  <div class="demo-box" data-css-prop="all" data-value="inherit">
    <div class="demo-area">
      <div style=" all: inherit;">Styled Box</div>
    </div>
    <div class="label">all: inherit</div>
  </div>
  <div class="demo-box" data-css-prop="all" data-value="unset">
    <div class="demo-area">
      <div style=" all: unset;">Styled Box</div>
    </div>
    <div class="label">all: unset</div>
  </div>
  <div class="demo-box" data-css-prop="all" data-value="revert">
    <div class="demo-area">
      <div style=" all: revert;">Styled Box</div>
    </div>
    <div class="label">all: revert</div>
  </div>
  <div class="demo-box" data-css-prop="all" data-value="revert-layer">
    <div class="demo-area">
      <div style=" all: revert-layer;">Styled Box</div>
    </div>
    <div class="label">all: revert-layer</div>
  </div>
  <div class="demo-box" data-css-prop="all" data-value="revert-rule">
    <div class="demo-area">
      <div style=" all: revert-rule;">Styled Box</div>
    </div>
    <div class="label">all: revert-rule</div>
  </div>
</div>
<script src="../interactive.js"></script>
</body>
</html>
