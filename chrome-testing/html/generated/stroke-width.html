<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>stroke-width</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
  svg { width: 160px; height: 160px; }
</style>
</head>
<body>
<div id="control-bar"></div>
<h1>Stroke Width</h1>
<p class="prop-name">stroke-width</p>
<div class="demos">
  <div class="demo-box" data-css-prop="stroke-width" data-value="10px" data-target-selector=" circle.target" data-target-id="t0">
    <div class="demo-area" style="display: flex; flex-direction: column; align-items: center; background: #16213e; border-radius: 12px; padding: 24px;">
      <style>#t0  circle.target { stroke-width: 10px; }</style>
      <svg id="t0" style="display: block;"><circle class="target" cx="80" cy="80" r="50" fill="none" stroke="#06b6d4"/></svg>
    </div>
    <div class="label">stroke-width: 10px</div>
  </div>
  <div class="demo-box" data-css-prop="stroke-width" data-value="1" data-target-selector=" circle.target" data-target-id="t1">
    <div class="demo-area" style="display: flex; flex-direction: column; align-items: center; background: #16213e; border-radius: 12px; padding: 24px;">
      <style>#t1  circle.target { stroke-width: 1; }</style>
      <svg id="t1" style="display: block;"><circle class="target" cx="80" cy="80" r="50" fill="none" stroke="#06b6d4"/></svg>
    </div>
    <div class="label">stroke-width: 1</div>
  </div>
  <div class="demo-box" data-css-prop="stroke-width" data-value="25%" data-target-selector=" circle.target" data-target-id="t2">
    <div class="demo-area" style="display: flex; flex-direction: column; align-items: center; background: #16213e; border-radius: 12px; padding: 24px;">
      <style>#t2  circle.target { stroke-width: 25%; }</style>
      <svg id="t2" style="display: block;"><circle class="target" cx="80" cy="80" r="50" fill="none" stroke="#06b6d4"/></svg>
    </div>
    <div class="label">stroke-width: 25%</div>
  </div>
  <div class="demo-box" data-css-prop="stroke-width" data-value="hairline" data-target-selector=" circle.target" data-target-id="t3">
    <div class="demo-area" style="display: flex; flex-direction: column; align-items: center; background: #16213e; border-radius: 12px; padding: 24px;">
      <style>#t3  circle.target { stroke-width: hairline; }</style>
      <svg id="t3" style="display: block;"><circle class="target" cx="80" cy="80" r="50" fill="none" stroke="#06b6d4"/></svg>
    </div>
    <div class="label">stroke-width: hairline</div>
  </div>
  <div class="demo-box" data-css-prop="stroke-width" data-value="0.5" data-target-selector=" circle.target" data-target-id="t4">
    <div class="demo-area" style="display: flex; flex-direction: column; align-items: center; background: #16213e; border-radius: 12px; padding: 24px;">
      <style>#t4  circle.target { stroke-width: 0.5; }</style>
      <svg id="t4" style="display: block;"><circle class="target" cx="80" cy="80" r="50" fill="none" stroke="#06b6d4"/></svg>
    </div>
    <div class="label">stroke-width: 0.5</div>
  </div>
  <div class="demo-box" data-css-prop="stroke-width" data-value="50%" data-target-selector=" circle.target" data-target-id="t5">
    <div class="demo-area" style="display: flex; flex-direction: column; align-items: center; background: #16213e; border-radius: 12px; padding: 24px;">
      <style>#t5  circle.target { stroke-width: 50%; }</style>
      <svg id="t5" style="display: block;"><circle class="target" cx="80" cy="80" r="50" fill="none" stroke="#06b6d4"/></svg>
    </div>
    <div class="label">stroke-width: 50%</div>
  </div>
</div>
<script src="../interactive.js"></script>
</body>
</html>
