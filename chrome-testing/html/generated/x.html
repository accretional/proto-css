<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>x</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-direction: column; gap: 20px; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; }
    .svg-container { background: #0f1a30; border: 1px solid #2a2a4a; border-radius: 10px; padding: 20px; }
    .section-title { font-size: 14px; color: #a78bfa; margin-bottom: 12px; font-family: monospace; }
  </style>
</head>
<body>
  <h1>X (SVG Attribute)</h1>
  <p class="prop-name">x</p>
  <div class="demos">

    <div class="svg-container">
      <p class="section-title">SVG &lt;rect&gt; with different x values</p>
      <svg width="900" height="200" viewBox="0 0 900 200">
        <!-- Grid lines -->
        <line x1="0" y1="0" x2="0" y2="200" stroke="#2a2a4a" stroke-width="1" stroke-dasharray="4"/>
        <line x1="100" y1="0" x2="100" y2="200" stroke="#2a2a4a" stroke-width="1" stroke-dasharray="4"/>
        <line x1="200" y1="0" x2="200" y2="200" stroke="#2a2a4a" stroke-width="1" stroke-dasharray="4"/>
        <line x1="300" y1="0" x2="300" y2="200" stroke="#2a2a4a" stroke-width="1" stroke-dasharray="4"/>
        <line x1="400" y1="0" x2="400" y2="200" stroke="#2a2a4a" stroke-width="1" stroke-dasharray="4"/>
        <line x1="500" y1="0" x2="500" y2="200" stroke="#2a2a4a" stroke-width="1" stroke-dasharray="4"/>
        <!-- Axis labels -->
        <text x="0" y="195" fill="#4a4a6a" font-size="10" font-family="monospace">0</text>
        <text x="100" y="195" fill="#4a4a6a" font-size="10" font-family="monospace">100</text>
        <text x="200" y="195" fill="#4a4a6a" font-size="10" font-family="monospace">200</text>
        <text x="300" y="195" fill="#4a4a6a" font-size="10" font-family="monospace">300</text>
        <text x="400" y="195" fill="#4a4a6a" font-size="10" font-family="monospace">400</text>
        <text x="500" y="195" fill="#4a4a6a" font-size="10" font-family="monospace">500</text>

        <!-- Rects at different x positions -->
        <rect x="0" y="10" width="60" height="28" rx="4" fill="#e94560"/>
        <text x="5" y="29" fill="#fff" font-size="11" font-family="monospace">x="0"</text>

        <rect x="20" y="48" width="60" height="28" rx="4" fill="#533483"/>
        <text x="25" y="67" fill="#fff" font-size="11" font-family="monospace">x="20"</text>

        <rect x="50" y="86" width="60" height="28" rx="4" fill="#0f3460"/>
        <text x="55" y="105" fill="#fff" font-size="11" font-family="monospace">x="50"</text>

        <rect x="100" y="124" width="60" height="28" rx="4" fill="#c23152"/>
        <text x="105" y="143" fill="#fff" font-size="11" font-family="monospace">x="100"</text>

        <rect x="200" y="10" width="60" height="28" rx="4" fill="#16a085"/>
        <text x="205" y="29" fill="#fff" font-size="11" font-family="monospace">x="200"</text>
      </svg>
    </div>

    <div class="svg-container">
      <p class="section-title">SVG &lt;text&gt; with different x values</p>
      <svg width="900" height="160" viewBox="0 0 900 160">
        <!-- Grid lines -->
        <line x1="0" y1="0" x2="0" y2="160" stroke="#2a2a4a" stroke-width="1" stroke-dasharray="4"/>
        <line x1="100" y1="0" x2="100" y2="160" stroke="#2a2a4a" stroke-width="1" stroke-dasharray="4"/>
        <line x1="200" y1="0" x2="200" y2="160" stroke="#2a2a4a" stroke-width="1" stroke-dasharray="4"/>
        <line x1="300" y1="0" x2="300" y2="160" stroke="#2a2a4a" stroke-width="1" stroke-dasharray="4"/>
        <line x1="400" y1="0" x2="400" y2="160" stroke="#2a2a4a" stroke-width="1" stroke-dasharray="4"/>
        <line x1="500" y1="0" x2="500" y2="160" stroke="#2a2a4a" stroke-width="1" stroke-dasharray="4"/>

        <text x="0" y="30" fill="#e94560" font-size="14" font-family="monospace">x="0" Hello</text>
        <text x="20" y="60" fill="#533483" font-size="14" font-family="monospace">x="20" Hello</text>
        <text x="50" y="90" fill="#0f3460" font-size="14" font-family="monospace">x="50" Hello</text>
        <text x="100" y="120" fill="#c23152" font-size="14" font-family="monospace">x="100" Hello</text>
        <text x="200" y="150" fill="#16a085" font-size="14" font-family="monospace">x="200" Hello</text>
      </svg>
    </div>

  </div>
</body>
</html>
