<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>overflow-x</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .wide-content { width: 800px; white-space: nowrap; display: flex; gap: 8px; align-items: center; }
.block { min-width: 120px; height: 60px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; color: #fff; }
.b1 { background: #e94560; }
.b2 { background: #0077ff; }
.b3 { background: #00cc66; }
.b4 { background: #f5a623; }
.b5 { background: #7b68ee; }
.b6 { background: #00d2ff; }
</style>
</head>
<body>
<h1>Overflow X</h1>
<p class="prop-name">overflow-x</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area">
      <div style="width: 100%; height: 100px; background: #0f3460; border-radius: 6px; border: 2px solid #3a3a5c; padding: 12px; overflow-y: hidden; overflow-x: visible;"><div class="wide-content"><div class="block b1">A</div><div class="block b2">B</div><div class="block b3">C</div><div class="block b4">D</div><div class="block b5">E</div><div class="block b6">F</div></div></div>
    </div>
    <div class="label">overflow-x: visible</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="width: 100%; height: 100px; background: #0f3460; border-radius: 6px; border: 2px solid #3a3a5c; padding: 12px; overflow-y: hidden; overflow-x: hidden;"><div class="wide-content"><div class="block b1">A</div><div class="block b2">B</div><div class="block b3">C</div><div class="block b4">D</div><div class="block b5">E</div><div class="block b6">F</div></div></div>
    </div>
    <div class="label">overflow-x: hidden</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="width: 100%; height: 100px; background: #0f3460; border-radius: 6px; border: 2px solid #3a3a5c; padding: 12px; overflow-y: hidden; overflow-x: clip;"><div class="wide-content"><div class="block b1">A</div><div class="block b2">B</div><div class="block b3">C</div><div class="block b4">D</div><div class="block b5">E</div><div class="block b6">F</div></div></div>
    </div>
    <div class="label">overflow-x: clip</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="width: 100%; height: 100px; background: #0f3460; border-radius: 6px; border: 2px solid #3a3a5c; padding: 12px; overflow-y: hidden; overflow-x: scroll;"><div class="wide-content"><div class="block b1">A</div><div class="block b2">B</div><div class="block b3">C</div><div class="block b4">D</div><div class="block b5">E</div><div class="block b6">F</div></div></div>
    </div>
    <div class="label">overflow-x: scroll</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="width: 100%; height: 100px; background: #0f3460; border-radius: 6px; border: 2px solid #3a3a5c; padding: 12px; overflow-y: hidden; overflow-x: auto;"><div class="wide-content"><div class="block b1">A</div><div class="block b2">B</div><div class="block b3">C</div><div class="block b4">D</div><div class="block b5">E</div><div class="block b6">F</div></div></div>
    </div>
    <div class="label">overflow-x: auto</div>
  </div>
</div>
</body>
</html>
