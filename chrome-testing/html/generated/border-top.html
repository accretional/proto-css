<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>border-top</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 24px; }
    .demo-box { display: flex; flex-direction: column; align-items: center; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; max-width: 180px; text-align: center; }
    .box {
      width: 180px;
      height: 90px;
      background: #0f3460;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }
    .bt1 { border-top: currentcolor ! important; }
    .bt2 { border-top: #5cB9c3a3 ! important; }
    .bt3 { border-top: var(--_Y) ! important; }
    .bt4 { border-top: hairline ! important; }
    .bt5 { border-top: ridge device-cmyk(none none var(--I-) var(--鍜, 2%) / 3%) thin; }
    .bt6 { border-top: groove; }
  </style>
</head>
<body>
  <h1>Border Top</h1>
  <p class="prop-name">border-top</p>
  <div class="demos">
    <div class="demo-box">
      <div class="box bt1"></div>
      <span class="label">border-top: currentcolor ! important</span>
    </div>
    <div class="demo-box">
      <div class="box bt2"></div>
      <span class="label">border-top: #5cB9c3a3 ! important</span>
    </div>
    <div class="demo-box">
      <div class="box bt3"></div>
      <span class="label">border-top: var(--_Y) ! important</span>
    </div>
    <div class="demo-box">
      <div class="box bt4"></div>
      <span class="label">border-top: hairline ! important</span>
    </div>
    <div class="demo-box">
      <div class="box bt5"></div>
      <span class="label">border-top: ridge device-cmyk(none none var(--I-) var(--鍜, 2%) / 3%) thin</span>
    </div>
    <div class="demo-box">
      <div class="box bt6"></div>
      <span class="label">border-top: groove</span>
    </div>
  </div>
</body>
</html>
