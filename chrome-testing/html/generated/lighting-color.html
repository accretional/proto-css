<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>lighting-color</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
</style>
</head>
<body>
<h1>Lighting Color</h1>
<p class="prop-name">lighting-color</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; align-items: center;">
      <style>#t0  feDiffuseLighting { lighting-color: red; }</style>
      <svg id="t0" style="width: 200px; height: 140px;"><defs><filter id="lightF-0" x="0" y="0" width="100%" height="100%"><feDiffuseLighting in="SourceGraphic" result="light" surfaceScale="8" diffuseConstant="1.2"><fePointLight x="100" y="70" z="150"/></feDiffuseLighting><feComposite in="SourceGraphic" in2="light" operator="arithmetic" k1="1" k2="0.2" k3="0" k4="0"/></filter></defs><rect x="10" y="10" width="180" height="120" rx="12" fill="#e0e0e0" filter="url(#lightF-0)"/></svg>
    </div>
    <div class="label">lighting-color: red</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; align-items: center;">
      <style>#t1  feDiffuseLighting { lighting-color: currentcolor; }</style>
      <svg id="t1" style="width: 200px; height: 140px;"><defs><filter id="lightF-1" x="0" y="0" width="100%" height="100%"><feDiffuseLighting in="SourceGraphic" result="light" surfaceScale="8" diffuseConstant="1.2"><fePointLight x="100" y="70" z="150"/></feDiffuseLighting><feComposite in="SourceGraphic" in2="light" operator="arithmetic" k1="1" k2="0.2" k3="0" k4="0"/></filter></defs><rect x="10" y="10" width="180" height="120" rx="12" fill="#e0e0e0" filter="url(#lightF-1)"/></svg>
    </div>
    <div class="label">lighting-color: currentcolor</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; align-items: center;">
      <style>#t2  feDiffuseLighting { lighting-color: Canvas; }</style>
      <svg id="t2" style="width: 200px; height: 140px;"><defs><filter id="lightF-2" x="0" y="0" width="100%" height="100%"><feDiffuseLighting in="SourceGraphic" result="light" surfaceScale="8" diffuseConstant="1.2"><fePointLight x="100" y="70" z="150"/></feDiffuseLighting><feComposite in="SourceGraphic" in2="light" operator="arithmetic" k1="1" k2="0.2" k3="0" k4="0"/></filter></defs><rect x="10" y="10" width="180" height="120" rx="12" fill="#e0e0e0" filter="url(#lightF-2)"/></svg>
    </div>
    <div class="label">lighting-color: Canvas</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; align-items: center;">
      <style>#t3  feDiffuseLighting { lighting-color: contrast-color(red); }</style>
      <svg id="t3" style="width: 200px; height: 140px;"><defs><filter id="lightF-3" x="0" y="0" width="100%" height="100%"><feDiffuseLighting in="SourceGraphic" result="light" surfaceScale="8" diffuseConstant="1.2"><fePointLight x="100" y="70" z="150"/></feDiffuseLighting><feComposite in="SourceGraphic" in2="light" operator="arithmetic" k1="1" k2="0.2" k3="0" k4="0"/></filter></defs><rect x="10" y="10" width="180" height="120" rx="12" fill="#e0e0e0" filter="url(#lightF-3)"/></svg>
    </div>
    <div class="label">lighting-color: contrast-color(red)</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; align-items: center;">
      <style>#t4  feDiffuseLighting { lighting-color: device-cmyk(0, 0.7, 1, 0); }</style>
      <svg id="t4" style="width: 200px; height: 140px;"><defs><filter id="lightF-4" x="0" y="0" width="100%" height="100%"><feDiffuseLighting in="SourceGraphic" result="light" surfaceScale="8" diffuseConstant="1.2"><fePointLight x="100" y="70" z="150"/></feDiffuseLighting><feComposite in="SourceGraphic" in2="light" operator="arithmetic" k1="1" k2="0.2" k3="0" k4="0"/></filter></defs><rect x="10" y="10" width="180" height="120" rx="12" fill="#e0e0e0" filter="url(#lightF-4)"/></svg>
    </div>
    <div class="label">lighting-color: device-cmyk(0, 0.7, 1, 0)</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; align-items: center;">
      <style>#t5  feDiffuseLighting { lighting-color: light-dark(red, blue); }</style>
      <svg id="t5" style="width: 200px; height: 140px;"><defs><filter id="lightF-5" x="0" y="0" width="100%" height="100%"><feDiffuseLighting in="SourceGraphic" result="light" surfaceScale="8" diffuseConstant="1.2"><fePointLight x="100" y="70" z="150"/></feDiffuseLighting><feComposite in="SourceGraphic" in2="light" operator="arithmetic" k1="1" k2="0.2" k3="0" k4="0"/></filter></defs><rect x="10" y="10" width="180" height="120" rx="12" fill="#e0e0e0" filter="url(#lightF-5)"/></svg>
    </div>
    <div class="label">lighting-color: light-dark(red, blue)</div>
  </div>
</div>
</body>
</html>
