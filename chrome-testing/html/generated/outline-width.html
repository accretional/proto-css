<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>outline-width</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 24px; justify-content: center; }
    .demo-box { background: #16213e; border-radius: 10px; padding: 24px; width: 185px; text-align: center; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 16px; }
    .outlined {
      width: 110px; height: 80px; background: #0f3460; border-radius: 8px;
      margin: 16px auto 0;
      outline-style: solid; outline-color: #e94560;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; color: #c0c0d0;
    }
    .d1 .outlined { outline-width: hairline; }
    .d2 .outlined { outline-width: thick ! important; }
    .d3 .outlined { outline-width: thick; }
    .d4 .outlined { outline-width: thin ! important; }
    .d5 .outlined { outline-width: var(--_, #5d5dCC2A) ! important; }
    .d6 .outlined { outline-width: hairline ! important; }
  </style>
</head>
<body>
  <h1>Outline Width</h1>
  <p class="prop-name">outline-width</p>
  <div class="demos">
    <div class="demo-box d1">
      <div class="outlined">thin</div>
      <div class="label">outline-width: hairline</div>
    </div>
    <div class="demo-box d2">
      <div class="outlined">medium</div>
      <div class="label">outline-width: thick ! important</div>
    </div>
    <div class="demo-box d3">
      <div class="outlined">thick</div>
      <div class="label">outline-width: thick</div>
    </div>
    <div class="demo-box d4">
      <div class="outlined">1px</div>
      <div class="label">outline-width: thin ! important</div>
    </div>
    <div class="demo-box d5">
      <div class="outlined">3px</div>
      <div class="label">outline-width: var(--_, #5d5dCC2A) ! important</div>
    </div>
    <div class="demo-box d6">
      <div class="outlined">8px</div>
      <div class="label">outline-width: hairline ! important</div>
    </div>
  </div>
</body>
</html>
