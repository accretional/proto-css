<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>field-sizing</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
</style>
</head>
<body>
<h1>Field Sizing</h1>
<p class="prop-name">field-sizing</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 24px; flex: 1;">
      <textarea style="background: #0f3460; border: 2px solid #4fc3f7; border-radius: 8px; color: #e0e0e0; font-family: system-ui, sans-serif; font-size: 14px; padding: 10px 14px; outline: none; display: block; width: 100%; min-height: 36px; max-height: 200px; resize: none; field-sizing: fixed;">This textarea has enough content to demonstrate field-sizing. With field-sizing: content, the textarea grows to fit all this text. With field-sizing: fixed, it stays at the minimum height regardless of content length.</textarea>
    </div>
    <div class="label">field-sizing: fixed</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 24px; flex: 1;">
      <textarea style="background: #0f3460; border: 2px solid #4fc3f7; border-radius: 8px; color: #e0e0e0; font-family: system-ui, sans-serif; font-size: 14px; padding: 10px 14px; outline: none; display: block; width: 100%; min-height: 36px; max-height: 200px; resize: none; field-sizing: content;">This textarea has enough content to demonstrate field-sizing. With field-sizing: content, the textarea grows to fit all this text. With field-sizing: fixed, it stays at the minimum height regardless of content length.</textarea>
    </div>
    <div class="label">field-sizing: content</div>
  </div>
</div>
</body>
</html>
