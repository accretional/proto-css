<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>border-spacing</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 24px; }
    .demo-box { display: flex; flex-direction: column; align-items: center; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; }
    table {
      border-collapse: separate;
      background: #16213e;
    }
    td {
      width: 40px;
      height: 30px;
      background: #0f3460;
      border: 2px solid #e94560;
      text-align: center;
      font-size: 11px;
      color: #e0e0e0;
    }
    .s0 { border-spacing: 20.11e34vmax ! important; }
    .s5 { border-spacing: 0 0; }
    .s10 { border-spacing: var(--_Y) ! important; }
    .s20 { border-spacing: 0 ! important; }
    .s2v { border-spacing: var(--_Y) ! important 30px; }
  </style>
</head>
<body>
  <h1>Border Spacing</h1>
  <p class="prop-name">border-spacing</p>
  <div class="demos">
    <div class="demo-box">
      <table class="s0">
        <tr><td>A</td><td>B</td><td>C</td></tr>
        <tr><td>D</td><td>E</td><td>F</td></tr>
        <tr><td>G</td><td>H</td><td>I</td></tr>
      </table>
      <span class="label">border-spacing: 20.11e34vmax ! important</span>
    </div>
    <div class="demo-box">
      <table class="s5">
        <tr><td>A</td><td>B</td><td>C</td></tr>
        <tr><td>D</td><td>E</td><td>F</td></tr>
        <tr><td>G</td><td>H</td><td>I</td></tr>
      </table>
      <span class="label">border-spacing: 0 0</span>
    </div>
    <div class="demo-box">
      <table class="s10">
        <tr><td>A</td><td>B</td><td>C</td></tr>
        <tr><td>D</td><td>E</td><td>F</td></tr>
        <tr><td>G</td><td>H</td><td>I</td></tr>
      </table>
      <span class="label">border-spacing: var(--_Y) ! important</span>
    </div>
    <div class="demo-box">
      <table class="s20">
        <tr><td>A</td><td>B</td><td>C</td></tr>
        <tr><td>D</td><td>E</td><td>F</td></tr>
        <tr><td>G</td><td>H</td><td>I</td></tr>
      </table>
      <span class="label">border-spacing: 0 ! important</span>
    </div>
    <div class="demo-box">
      <table class="s2v">
        <tr><td>A</td><td>B</td><td>C</td></tr>
        <tr><td>D</td><td>E</td><td>F</td></tr>
        <tr><td>G</td><td>H</td><td>I</td></tr>
      </table>
      <span class="label">border-spacing: var(--_Y) ! important 30px</span>
    </div>
  </div>
</body>
</html>
