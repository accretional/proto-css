<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>direction</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
</style>
</head>
<body>
<h1>Text Direction</h1>
<p class="prop-name">direction</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 24px;">
      <div style="background: #0f3460; padding: 16px; border-radius: 8px; font-size: 16px; border-left: 3px solid #e94560; line-height: 1.8; direction: ltr;">Hello World! Price: $29.99</div>
    </div>
    <div class="label">direction: ltr</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 24px;">
      <div style="background: #0f3460; padding: 16px; border-radius: 8px; font-size: 16px; border-left: 3px solid #e94560; line-height: 1.8; direction: rtl;">Hello World! Price: $29.99</div>
    </div>
    <div class="label">direction: rtl</div>
  </div>
</div>
</body>
</html>
