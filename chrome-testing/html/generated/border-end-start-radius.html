<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>border-end-start-radius</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
</style>
</head>
<body>
<h1>Border End Start Radius</h1>
<p class="prop-name">border-end-start-radius</p>
<div class="demos">
  <div class="demo-box" data-css-prop="border-end-start-radius" data-value="4px">
    <div class="demo-area">
      <div style="width: 110px; height: 110px; background: #16213e; border: 4px solid #53d8fb; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #ccc; font-family: monospace; border-end-start-radius: 4px;"></div>
    </div>
    <div class="label">border-end-start-radius: 4px</div>
  </div>
  <div class="demo-box" data-css-prop="border-end-start-radius" data-value="10px">
    <div class="demo-area">
      <div style="width: 110px; height: 110px; background: #16213e; border: 4px solid #53d8fb; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #ccc; font-family: monospace; border-end-start-radius: 10px;"></div>
    </div>
    <div class="label">border-end-start-radius: 10px</div>
  </div>
  <div class="demo-box" data-css-prop="border-end-start-radius" data-value="20px">
    <div class="demo-area">
      <div style="width: 110px; height: 110px; background: #16213e; border: 4px solid #53d8fb; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #ccc; font-family: monospace; border-end-start-radius: 20px;"></div>
    </div>
    <div class="label">border-end-start-radius: 20px</div>
  </div>
  <div class="demo-box" data-css-prop="border-end-start-radius" data-value="50%">
    <div class="demo-area">
      <div style="width: 110px; height: 110px; background: #16213e; border: 4px solid #53d8fb; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #ccc; font-family: monospace; border-end-start-radius: 50%;"></div>
    </div>
    <div class="label">border-end-start-radius: 50%</div>
  </div>
  <div class="demo-box" data-css-prop="border-end-start-radius" data-value="30px 10px">
    <div class="demo-area">
      <div style="width: 110px; height: 110px; background: #16213e; border: 4px solid #53d8fb; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #ccc; font-family: monospace; border-end-start-radius: 30px 10px;"></div>
    </div>
    <div class="label">border-end-start-radius: 30px 10px</div>
  </div>
  <div class="demo-box" data-css-prop="border-end-start-radius" data-value="0">
    <div class="demo-area">
      <div style="width: 110px; height: 110px; background: #16213e; border: 4px solid #53d8fb; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #ccc; font-family: monospace; border-end-start-radius: 0;"></div>
    </div>
    <div class="label">border-end-start-radius: 0</div>
  </div>
</div>
<div id="control-bar"></div>
<script src="../interactive.js"></script>
</body>
</html>
