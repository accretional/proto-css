<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ry</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
</style>
</head>
<body>
<h1>SVG Vertical Radius</h1>
<p class="prop-name">ry</p>
<div class="demos">
  <div class="demo-box" data-css-prop="ry" data-value="10px">
    <div class="demo-area" style="display: flex; flex-direction: column; align-items: center;">
      <svg width="140" height="140"><line x1="70" y1="0" x2="70" y2="140" stroke="#3a4a5e" stroke-width="1" stroke-dasharray="4 3"/><line x1="0" y1="70" x2="140" y2="70" stroke="#3a4a5e" stroke-width="1" stroke-dasharray="4 3"/>
      <ellipse style="fill: #818cf8; opacity: 0.85; rx: 50px; cx: 70px; cy: 70px; ry: 10px;"></ellipse>
      </svg>
    </div>
    <div class="label">ry: 10px</div>
  </div>
  <div class="demo-box" data-css-prop="ry" data-value="auto">
    <div class="demo-area" style="display: flex; flex-direction: column; align-items: center;">
      <svg width="140" height="140"><line x1="70" y1="0" x2="70" y2="140" stroke="#3a4a5e" stroke-width="1" stroke-dasharray="4 3"/><line x1="0" y1="70" x2="140" y2="70" stroke="#3a4a5e" stroke-width="1" stroke-dasharray="4 3"/>
      <ellipse style="fill: #818cf8; opacity: 0.85; rx: 50px; cx: 70px; cy: 70px; ry: auto;"></ellipse>
      </svg>
    </div>
    <div class="label">ry: auto</div>
  </div>
  <div class="demo-box" data-css-prop="ry" data-value="25%">
    <div class="demo-area" style="display: flex; flex-direction: column; align-items: center;">
      <svg width="140" height="140"><line x1="70" y1="0" x2="70" y2="140" stroke="#3a4a5e" stroke-width="1" stroke-dasharray="4 3"/><line x1="0" y1="70" x2="140" y2="70" stroke="#3a4a5e" stroke-width="1" stroke-dasharray="4 3"/>
      <ellipse style="fill: #818cf8; opacity: 0.85; rx: 50px; cx: 70px; cy: 70px; ry: 25%;"></ellipse>
      </svg>
    </div>
    <div class="label">ry: 25%</div>
  </div>
  <div class="demo-box" data-css-prop="ry" data-value="50%">
    <div class="demo-area" style="display: flex; flex-direction: column; align-items: center;">
      <svg width="140" height="140"><line x1="70" y1="0" x2="70" y2="140" stroke="#3a4a5e" stroke-width="1" stroke-dasharray="4 3"/><line x1="0" y1="70" x2="140" y2="70" stroke="#3a4a5e" stroke-width="1" stroke-dasharray="4 3"/>
      <ellipse style="fill: #818cf8; opacity: 0.85; rx: 50px; cx: 70px; cy: 70px; ry: 50%;"></ellipse>
      </svg>
    </div>
    <div class="label">ry: 50%</div>
  </div>
  <div class="demo-box" data-css-prop="ry" data-value="100%">
    <div class="demo-area" style="display: flex; flex-direction: column; align-items: center;">
      <svg width="140" height="140"><line x1="70" y1="0" x2="70" y2="140" stroke="#3a4a5e" stroke-width="1" stroke-dasharray="4 3"/><line x1="0" y1="70" x2="140" y2="70" stroke="#3a4a5e" stroke-width="1" stroke-dasharray="4 3"/>
      <ellipse style="fill: #818cf8; opacity: 0.85; rx: 50px; cx: 70px; cy: 70px; ry: 100%;"></ellipse>
      </svg>
    </div>
    <div class="label">ry: 100%</div>
  </div>
  <div class="demo-box" data-css-prop="ry" data-value="0">
    <div class="demo-area" style="display: flex; flex-direction: column; align-items: center;">
      <svg width="140" height="140"><line x1="70" y1="0" x2="70" y2="140" stroke="#3a4a5e" stroke-width="1" stroke-dasharray="4 3"/><line x1="0" y1="70" x2="140" y2="70" stroke="#3a4a5e" stroke-width="1" stroke-dasharray="4 3"/>
      <ellipse style="fill: #818cf8; opacity: 0.85; rx: 50px; cx: 70px; cy: 70px; ry: 0;"></ellipse>
      </svg>
    </div>
    <div class="label">ry: 0</div>
  </div>
</div>
<div id="control-bar"></div>
<script src="../interactive.js"></script>
</body>
</html>
