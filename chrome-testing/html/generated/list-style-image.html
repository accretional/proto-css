<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>list-style-image</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
</style>
</head>
<body>
<h1>List Style Image</h1>
<p class="prop-name">list-style-image</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area" style="background: #0f3460; border-radius: 8px; padding: 16px; overflow: hidden;">
      <ul style="font-size: 14px; line-height: 2.5; color: #e0e0e0; padding-left: 30px; margin: 0; list-style-image: url(clown.jpg);"><li>First item</li><li>Second item</li><li>Third item</li></ul>
    </div>
    <div class="label">list-style-image: url(clown.jpg)</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #0f3460; border-radius: 8px; padding: 16px; overflow: hidden;">
      <ul style="font-size: 14px; line-height: 2.5; color: #e0e0e0; padding-left: 30px; margin: 0; list-style-image: none;"><li>First item</li><li>Second item</li><li>Third item</li></ul>
    </div>
    <div class="label">list-style-image: none</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #0f3460; border-radius: 8px; padding: 16px; overflow: hidden;">
      <ul style="font-size: 14px; line-height: 2.5; color: #e0e0e0; padding-left: 30px; margin: 0; list-style-image: image(url(clown.jpg));"><li>First item</li><li>Second item</li><li>Third item</li></ul>
    </div>
    <div class="label">list-style-image: image(url(clown.jpg))</div>
  </div>
</div>
</body>
</html>
