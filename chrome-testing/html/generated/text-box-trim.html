<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>text-box-trim</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .demo-area { background: #0f1a30; border-radius: 6px; display: inline-block; border: 2px solid #3b82f6; }
</style>
</head>
<body>
<h1>Text Box Trim</h1>
<p class="prop-name">text-box-trim</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 24px; min-width: 260px; flex: 1; display: flex; flex-direction: column; align-items: flex-start;">
      <span style="font-size: 42px; line-height: 1.5; display: block; text-box-edge: cap alphabetic; text-box-trim: none;">Hgpq</span>
    </div>
    <div class="label">text-box-trim: none</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 24px; min-width: 260px; flex: 1; display: flex; flex-direction: column; align-items: flex-start;">
      <span style="font-size: 42px; line-height: 1.5; display: block; text-box-edge: cap alphabetic; text-box-trim: trim-start;">Hgpq</span>
    </div>
    <div class="label">text-box-trim: trim-start</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 24px; min-width: 260px; flex: 1; display: flex; flex-direction: column; align-items: flex-start;">
      <span style="font-size: 42px; line-height: 1.5; display: block; text-box-edge: cap alphabetic; text-box-trim: trim-end;">Hgpq</span>
    </div>
    <div class="label">text-box-trim: trim-end</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 24px; min-width: 260px; flex: 1; display: flex; flex-direction: column; align-items: flex-start;">
      <span style="font-size: 42px; line-height: 1.5; display: block; text-box-edge: cap alphabetic; text-box-trim: trim-both;">Hgpq</span>
    </div>
    <div class="label">text-box-trim: trim-both</div>
  </div>
</div>
</body>
</html>
