<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>text-box-trim</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 20px; }
    .demo-card { background: #16213e; border-radius: 12px; padding: 24px; min-width: 260px; flex: 1; display: flex; flex-direction: column; align-items: flex-start; }
    .text-wrapper { background: #0f1a30; border-radius: 6px; display: inline-block; border: 2px solid #3b82f6; }
    .text-wrapper span { font-size: 42px; line-height: 1.5; display: block; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 12px; }
  </style>
</head>
<body>
  <h1>Text Box Trim</h1>
  <p class="prop-name">text-box-trim</p>
  <div class="demos">
    <div class="demo-card">
      <div class="text-wrapper" style="border-color: #6366f1;">
        <span style="text-box-trim: trim-both ! important; text-box-edge: cap alphabetic;">Hgpq</span>
      </div>
      <p class="label">text-box-trim: trim-both ! important</p>
    </div>
    <div class="demo-card">
      <div class="text-wrapper" style="border-color: #ef4444;">
        <span style="text-box-trim: none ! important; text-box-edge: cap alphabetic;">Hgpq</span>
      </div>
      <p class="label">text-box-trim: none ! important</p>
    </div>
    <div class="demo-card">
      <div class="text-wrapper" style="border-color: #10b981;">
        <span style="text-box-trim: trim-start ! important; text-box-edge: cap alphabetic;">Hgpq</span>
      </div>
      <p class="label">text-box-trim: trim-start ! important</p>
    </div>
    <div class="demo-card">
      <div class="text-wrapper" style="border-color: #f59e0b;">
        <span style="text-box-trim: trim-both ! important; text-box-edge: cap alphabetic;">Hgpq</span>
      </div>
      <p class="label">text-box-trim: trim-both ! important</p>
    </div>
  </div>
</body>
</html>
