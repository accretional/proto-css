<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>marker</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
  svg { width: 340px; height: 90px; }
</style>
</head>
<body>
<h1>Marker</h1>
<p class="prop-name">marker</p>
<div class="demos">
  <div class="demo-box" data-css-prop="marker" data-value="none">
    <div class="demo-area" style="background: #16213e; border-radius: 10px; padding: 20px; display: flex; justify-content: center;">
      <svg style="display: block; marker: none;"><defs><marker id="arrow1" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e94560"/></marker></defs><polyline points="30,70 100,20 170,70 240,20 310,70" fill="none" stroke="#e94560" stroke-width="2.5" /></svg>
    </div>
    <div class="label">marker: none</div>
  </div>
  <div class="demo-box" data-css-prop="marker" data-value="url(#arrow1)">
    <div class="demo-area" style="background: #16213e; border-radius: 10px; padding: 20px; display: flex; justify-content: center;">
      <svg style="display: block; marker: url(#arrow1);"><defs><marker id="arrow1" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e94560"/></marker></defs><polyline points="30,70 100,20 170,70 240,20 310,70" fill="none" stroke="#e94560" stroke-width="2.5" /></svg>
    </div>
    <div class="label">marker: url(#arrow1)</div>
  </div>
  <div class="demo-box" data-css-prop="marker" data-value="url(#dot1)">
    <div class="demo-area" style="background: #16213e; border-radius: 10px; padding: 20px; display: flex; justify-content: center;">
      <svg style="display: block; marker: url(#dot1);"><defs><marker id="arrow1" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e94560"/></marker></defs><polyline points="30,70 100,20 170,70 240,20 310,70" fill="none" stroke="#e94560" stroke-width="2.5" /></svg>
    </div>
    <div class="label">marker: url(#dot1)</div>
  </div>
</div>
<div id="control-bar"></div>
<script src="../interactive.js"></script>
</body>
</html>
