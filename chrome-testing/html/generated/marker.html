<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>marker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 24px; }
    .demo-card { background: #16213e; border-radius: 10px; padding: 20px; width: 380px; }
    .demo-card h3 { font-size: 13px; color: #e2e8f0; margin-bottom: 12px; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; }
    svg { display: block; }
  </style>
</head>
<body>
  <h1>Marker</h1>
  <p class="prop-name">marker (SVG shorthand)</p>
  <div class="demos">

    <div class="demo-card">
      <h3>Arrow Markers</h3>
      <svg width="340" height="100" viewBox="0 0 340 100">
        <defs>
          <marker id="arrow1" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#e94560"/>
          </marker>
        </defs>
        <polyline points="20,80 100,20 180,80 260,20 320,50" fill="none" stroke="#e94560" stroke-width="2.5" marker="url(#arrow1)"/>
      </svg>
      <p class="label">marker: url('俢') ! important</p>
    </div>

    <div class="demo-card">
      <h3>Circle Markers</h3>
      <svg width="340" height="100" viewBox="0 0 340 100">
        <defs>
          <marker id="circle1" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7">
            <circle cx="5" cy="5" r="4" fill="#00d2ff" stroke="#16213e" stroke-width="1"/>
          </marker>
        </defs>
        <polyline points="20,50 80,20 140,70 200,30 260,60 320,25" fill="none" stroke="#00d2ff" stroke-width="2" marker="url(#circle1)"/>
      </svg>
      <p class="label">marker: revert-rule ! important</p>
    </div>

    <div class="demo-card">
      <h3>Diamond Markers</h3>
      <svg width="340" height="100" viewBox="0 0 340 100">
        <defs>
          <marker id="diamond1" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8">
            <polygon points="5,0 10,5 5,10 0,5" fill="#f9a825"/>
          </marker>
        </defs>
        <polyline points="20,60 90,20 160,70 230,30 300,60" fill="none" stroke="#f9a825" stroke-width="2" marker="url(#diamond1)"/>
      </svg>
      <p class="label">marker: url('󇍼')</p>
    </div>

    <div class="demo-card">
      <h3>Square Markers</h3>
      <svg width="340" height="100" viewBox="0 0 340 100">
        <defs>
          <marker id="square1" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
            <rect x="1" y="1" width="8" height="8" fill="#a855f7"/>
          </marker>
        </defs>
        <polyline points="20,70 100,20 180,60 260,30 320,70" fill="none" stroke="#a855f7" stroke-width="2" marker="url(#square1)"/>
      </svg>
      <p class="label">marker: revert-rule</p>
    </div>

    <div class="demo-card">
      <h3>Cross Markers</h3>
      <svg width="340" height="100" viewBox="0 0 340 100">
        <defs>
          <marker id="cross1" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8">
            <line x1="2" y1="2" x2="8" y2="8" stroke="#4ade80" stroke-width="2"/>
            <line x1="8" y1="2" x2="2" y2="8" stroke="#4ade80" stroke-width="2"/>
          </marker>
        </defs>
        <polyline points="20,50 80,20 150,75 220,25 290,65 330,40" fill="none" stroke="#4ade80" stroke-width="2" marker="url(#cross1)"/>
      </svg>
      <p class="label">marker: url("") ! important</p>
    </div>

    <div class="demo-card">
      <h3>No Markers (none)</h3>
      <svg width="340" height="100" viewBox="0 0 340 100">
        <polyline points="20,70 100,20 180,60 260,30 320,70" fill="none" stroke="#6b7280" stroke-width="2"/>
      </svg>
      <p class="label">marker: revert-rule</p>
    </div>

  </div>
</body>
</html>
