<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>flex-grow</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .item { background: #0f3460; border: 2px solid #4cc9f0; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-family: monospace; color: #4cc9f0; flex-basis: 0; padding: 0 6px; }
.item.target { background: #023e8a; border-color: #4cc9f0; color: #fff; font-weight: 700; }
</style>
</head>
<body>
<h1>Flex Grow</h1>
<p class="prop-name">flex-grow</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area" style="display: flex; background: #16213e; border-radius: 8px; padding: 12px; height: 80px; align-items: stretch; gap: 8px;">
      <div style="background: #023e8a; border-color: #4cc9f0; color: #fff; font-weight: 700; flex-basis: 0; flex-grow: 1;"></div>
      <div class="item" style="flex-grow: 1;">grow: 1</div>
      <div class="item" style="flex-grow: 1;">grow: 1</div>
    </div>
    <div class="label">flex-grow: 1</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="display: flex; background: #16213e; border-radius: 8px; padding: 12px; height: 80px; align-items: stretch; gap: 8px;">
      <div style="background: #023e8a; border-color: #4cc9f0; color: #fff; font-weight: 700; flex-basis: 0; flex-grow: 0.5;"></div>
      <div class="item" style="flex-grow: 1;">grow: 1</div>
      <div class="item" style="flex-grow: 1;">grow: 1</div>
    </div>
    <div class="label">flex-grow: 0.5</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="display: flex; background: #16213e; border-radius: 8px; padding: 12px; height: 80px; align-items: stretch; gap: 8px;">
      <div style="background: #023e8a; border-color: #4cc9f0; color: #fff; font-weight: 700; flex-basis: 0; flex-grow: 2;"></div>
      <div class="item" style="flex-grow: 1;">grow: 1</div>
      <div class="item" style="flex-grow: 1;">grow: 1</div>
    </div>
    <div class="label">flex-grow: 2</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="display: flex; background: #16213e; border-radius: 8px; padding: 12px; height: 80px; align-items: stretch; gap: 8px;">
      <div style="background: #023e8a; border-color: #4cc9f0; color: #fff; font-weight: 700; flex-basis: 0; flex-grow: 0;"></div>
      <div class="item" style="flex-grow: 1;">grow: 1</div>
      <div class="item" style="flex-grow: 1;">grow: 1</div>
    </div>
    <div class="label">flex-grow: 0</div>
  </div>
</div>
</body>
</html>
