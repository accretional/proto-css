<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>grid-template-areas</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .cell { border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; padding: 8px; background: #0f3460; color: #e94560; }
</style>
</head>
<body>
<h1>Grid Template Areas</h1>
<p class="prop-name">grid-template-areas</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area">
      <div style="display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: 50px 50px; gap: 6px; grid-template-areas: none;"><div class="cell">1</div><div class="cell">2</div><div class="cell">3</div><div class="cell">4</div><div class="cell">5</div><div class="cell">6</div></div>
    </div>
    <div class="label">grid-template-areas: none</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: 50px 50px; gap: 6px; grid-template-areas: &#34;example&#34;;"><div class="cell">1</div><div class="cell">2</div><div class="cell">3</div><div class="cell">4</div><div class="cell">5</div><div class="cell">6</div></div>
    </div>
    <div class="label">grid-template-areas: &#34;example&#34;</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: 50px 50px; gap: 6px; grid-template-areas: &#34;example&#34; &#34;example&#34;;"><div class="cell">1</div><div class="cell">2</div><div class="cell">3</div><div class="cell">4</div><div class="cell">5</div><div class="cell">6</div></div>
    </div>
    <div class="label">grid-template-areas: &#34;example&#34; &#34;example&#34;</div>
  </div>
</div>
</body>
</html>
