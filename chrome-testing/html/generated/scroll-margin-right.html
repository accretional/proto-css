<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>scroll-margin-right</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
  .snap-item { min-width: 280px; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; scroll-snap-align: end; flex-shrink: 0; }
.snap-item:nth-child(1) { background: linear-gradient(135deg, #14b8a6, #06b6d4); }
.snap-item:nth-child(2) { background: #22224a; }
.snap-item:nth-child(3) { background: linear-gradient(135deg, #f59e0b, #f97316); }
.snap-item:nth-child(4) { background: #22224a; }
.snap-item:nth-child(5) { background: linear-gradient(135deg, #6366f1, #8b5cf6); }
</style>
</head>
<body>
<div id="control-bar"></div>
<h1>Scroll Margin Right</h1>
<p class="prop-name">scroll-margin-right</p>
<div class="demos">
  <div class="demo-box" data-css-prop="scroll-margin-right" data-value="10px">
    <div class="demo-area">
      <div style="width: 100%; height: 120px; overflow-x: auto; overflow-y: hidden; border: 2px solid #333; border-radius: 10px; background: #16213e; scroll-snap-type: x mandatory; display: flex; position: relative; scroll-margin-right: 10px;"><div class="snap-item">1</div><div class="snap-item">2</div><div class="snap-item">3</div><div class="snap-item">4</div><div class="snap-item">5</div></div>
    </div>
    <div class="label">scroll-margin-right: 10px</div>
  </div>
  <div class="demo-box" data-css-prop="scroll-margin-right" data-value="20px">
    <div class="demo-area">
      <div style="width: 100%; height: 120px; overflow-x: auto; overflow-y: hidden; border: 2px solid #333; border-radius: 10px; background: #16213e; scroll-snap-type: x mandatory; display: flex; position: relative; scroll-margin-right: 20px;"><div class="snap-item">1</div><div class="snap-item">2</div><div class="snap-item">3</div><div class="snap-item">4</div><div class="snap-item">5</div></div>
    </div>
    <div class="label">scroll-margin-right: 20px</div>
  </div>
  <div class="demo-box" data-css-prop="scroll-margin-right" data-value="50px">
    <div class="demo-area">
      <div style="width: 100%; height: 120px; overflow-x: auto; overflow-y: hidden; border: 2px solid #333; border-radius: 10px; background: #16213e; scroll-snap-type: x mandatory; display: flex; position: relative; scroll-margin-right: 50px;"><div class="snap-item">1</div><div class="snap-item">2</div><div class="snap-item">3</div><div class="snap-item">4</div><div class="snap-item">5</div></div>
    </div>
    <div class="label">scroll-margin-right: 50px</div>
  </div>
  <div class="demo-box" data-css-prop="scroll-margin-right" data-value="4px">
    <div class="demo-area">
      <div style="width: 100%; height: 120px; overflow-x: auto; overflow-y: hidden; border: 2px solid #333; border-radius: 10px; background: #16213e; scroll-snap-type: x mandatory; display: flex; position: relative; scroll-margin-right: 4px;"><div class="snap-item">1</div><div class="snap-item">2</div><div class="snap-item">3</div><div class="snap-item">4</div><div class="snap-item">5</div></div>
    </div>
    <div class="label">scroll-margin-right: 4px</div>
  </div>
  <div class="demo-box" data-css-prop="scroll-margin-right" data-value="2em">
    <div class="demo-area">
      <div style="width: 100%; height: 120px; overflow-x: auto; overflow-y: hidden; border: 2px solid #333; border-radius: 10px; background: #16213e; scroll-snap-type: x mandatory; display: flex; position: relative; scroll-margin-right: 2em;"><div class="snap-item">1</div><div class="snap-item">2</div><div class="snap-item">3</div><div class="snap-item">4</div><div class="snap-item">5</div></div>
    </div>
    <div class="label">scroll-margin-right: 2em</div>
  </div>
  <div class="demo-box" data-css-prop="scroll-margin-right" data-value="0">
    <div class="demo-area">
      <div style="width: 100%; height: 120px; overflow-x: auto; overflow-y: hidden; border: 2px solid #333; border-radius: 10px; background: #16213e; scroll-snap-type: x mandatory; display: flex; position: relative; scroll-margin-right: 0;"><div class="snap-item">1</div><div class="snap-item">2</div><div class="snap-item">3</div><div class="snap-item">4</div><div class="snap-item">5</div></div>
    </div>
    <div class="label">scroll-margin-right: 0</div>
  </div>
</div>
<script src="../interactive.js"></script>
</body>
</html>
