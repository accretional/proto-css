<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>grid-column-start</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
  .cell { background: #0f3460; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #4a5568; font-weight: 600; }
</style>
</head>
<body>
<div id="control-bar"></div>
<h1>Grid Column Start</h1>
<p class="prop-name">grid-column-start</p>
<div class="demos">
  <div class="demo-box" data-css-prop="grid-column-start" data-value="1">
    <div class="demo-area" style="display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: 50px 50px; gap: 6px; background: #0a1a35; border-radius: 8px; padding: 6px;">
      <div style="background: #e94560; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #fff; font-weight: 600; grid-column-start: 1;">Item</div>
      <div class="cell">2</div>
      <div class="cell">3</div>
      <div class="cell">4</div>
      <div class="cell">5</div>
      <div class="cell">6</div>
      <div class="cell">7</div>
    </div>
    <div class="label">grid-column-start: 1</div>
  </div>
  <div class="demo-box" data-css-prop="grid-column-start" data-value="2">
    <div class="demo-area" style="display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: 50px 50px; gap: 6px; background: #0a1a35; border-radius: 8px; padding: 6px;">
      <div style="background: #e94560; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #fff; font-weight: 600; grid-column-start: 2;">Item</div>
      <div class="cell">2</div>
      <div class="cell">3</div>
      <div class="cell">4</div>
      <div class="cell">5</div>
      <div class="cell">6</div>
      <div class="cell">7</div>
    </div>
    <div class="label">grid-column-start: 2</div>
  </div>
  <div class="demo-box" data-css-prop="grid-column-start" data-value="3">
    <div class="demo-area" style="display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: 50px 50px; gap: 6px; background: #0a1a35; border-radius: 8px; padding: 6px;">
      <div style="background: #e94560; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #fff; font-weight: 600; grid-column-start: 3;">Item</div>
      <div class="cell">2</div>
      <div class="cell">3</div>
      <div class="cell">4</div>
      <div class="cell">5</div>
      <div class="cell">6</div>
      <div class="cell">7</div>
    </div>
    <div class="label">grid-column-start: 3</div>
  </div>
  <div class="demo-box" data-css-prop="grid-column-start" data-value="span 2">
    <div class="demo-area" style="display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: 50px 50px; gap: 6px; background: #0a1a35; border-radius: 8px; padding: 6px;">
      <div style="background: #e94560; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #fff; font-weight: 600; grid-column-start: span 2;">Item</div>
      <div class="cell">2</div>
      <div class="cell">3</div>
      <div class="cell">4</div>
      <div class="cell">5</div>
      <div class="cell">6</div>
      <div class="cell">7</div>
    </div>
    <div class="label">grid-column-start: span 2</div>
  </div>
  <div class="demo-box" data-css-prop="grid-column-start" data-value="span 3">
    <div class="demo-area" style="display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: 50px 50px; gap: 6px; background: #0a1a35; border-radius: 8px; padding: 6px;">
      <div style="background: #e94560; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #fff; font-weight: 600; grid-column-start: span 3;">Item</div>
      <div class="cell">2</div>
      <div class="cell">3</div>
      <div class="cell">4</div>
      <div class="cell">5</div>
      <div class="cell">6</div>
      <div class="cell">7</div>
    </div>
    <div class="label">grid-column-start: span 3</div>
  </div>
  <div class="demo-box" data-css-prop="grid-column-start" data-value="auto">
    <div class="demo-area" style="display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: 50px 50px; gap: 6px; background: #0a1a35; border-radius: 8px; padding: 6px;">
      <div style="background: #e94560; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #fff; font-weight: 600; grid-column-start: auto;">Item</div>
      <div class="cell">2</div>
      <div class="cell">3</div>
      <div class="cell">4</div>
      <div class="cell">5</div>
      <div class="cell">6</div>
      <div class="cell">7</div>
    </div>
    <div class="label">grid-column-start: auto</div>
  </div>
</div>
<script src="../interactive.js"></script>
</body>
</html>
