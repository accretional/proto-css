<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>font-kerning</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400..800');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
</style>
</head>
<body>
<h1>Font Kerning</h1>
<p class="prop-name">font-kerning</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area">
      <div style="font-size: 48px; line-height: 1; font-family: &#39;EB Garamond&#39;, Georgia, serif; letter-spacing: 0; font-kerning: auto;">AVATAR WAR Type To Yo</div>
    </div>
    <div class="label">font-kerning: auto</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="font-size: 48px; line-height: 1; font-family: &#39;EB Garamond&#39;, Georgia, serif; letter-spacing: 0; font-kerning: normal;">AVATAR WAR Type To Yo</div>
    </div>
    <div class="label">font-kerning: normal</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="font-size: 48px; line-height: 1; font-family: &#39;EB Garamond&#39;, Georgia, serif; letter-spacing: 0; font-kerning: none;">AVATAR WAR Type To Yo</div>
    </div>
    <div class="label">font-kerning: none</div>
  </div>
</div>
</body>
</html>
