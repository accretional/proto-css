<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>min-height</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
</style>
</head>
<body>
<h1>Min Height</h1>
<p class="prop-name">min-height</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area" style="width: 100%; display: flex; flex-direction: column; align-items: stretch; height: 200px; border-left: 2px dashed #3a4a5e;">
      <div style="width: 100%; background: linear-gradient(180deg, #0f3460, #533483); border: 2px solid #4fc3f7; border-radius: 8px; padding: 10px; font-size: 11px; color: #c8d6e5; display: flex; align-items: flex-start; justify-content: center; min-height: auto;"><span style="font-size: 10px; color: #9ca3af;">short</span></div>
    </div>
    <div class="label">min-height: auto</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="width: 100%; display: flex; flex-direction: column; align-items: stretch; height: 200px; border-left: 2px dashed #3a4a5e;">
      <div style="width: 100%; background: linear-gradient(180deg, #0f3460, #533483); border: 2px solid #4fc3f7; border-radius: 8px; padding: 10px; font-size: 11px; color: #c8d6e5; display: flex; align-items: flex-start; justify-content: center; min-height: 10px;"><span style="font-size: 10px; color: #9ca3af;">short</span></div>
    </div>
    <div class="label">min-height: 10px</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="width: 100%; display: flex; flex-direction: column; align-items: stretch; height: 200px; border-left: 2px dashed #3a4a5e;">
      <div style="width: 100%; background: linear-gradient(180deg, #0f3460, #533483); border: 2px solid #4fc3f7; border-radius: 8px; padding: 10px; font-size: 11px; color: #c8d6e5; display: flex; align-items: flex-start; justify-content: center; min-height: min-content;"><span style="font-size: 10px; color: #9ca3af;">short</span></div>
    </div>
    <div class="label">min-height: min-content</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="width: 100%; display: flex; flex-direction: column; align-items: stretch; height: 200px; border-left: 2px dashed #3a4a5e;">
      <div style="width: 100%; background: linear-gradient(180deg, #0f3460, #533483); border: 2px solid #4fc3f7; border-radius: 8px; padding: 10px; font-size: 11px; color: #c8d6e5; display: flex; align-items: flex-start; justify-content: center; min-height: max-content;"><span style="font-size: 10px; color: #9ca3af;">short</span></div>
    </div>
    <div class="label">min-height: max-content</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="width: 100%; display: flex; flex-direction: column; align-items: stretch; height: 200px; border-left: 2px dashed #3a4a5e;">
      <div style="width: 100%; background: linear-gradient(180deg, #0f3460, #533483); border: 2px solid #4fc3f7; border-radius: 8px; padding: 10px; font-size: 11px; color: #c8d6e5; display: flex; align-items: flex-start; justify-content: center; min-height: fit-content(10px);"><span style="font-size: 10px; color: #9ca3af;">short</span></div>
    </div>
    <div class="label">min-height: fit-content(10px)</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="width: 100%; display: flex; flex-direction: column; align-items: stretch; height: 200px; border-left: 2px dashed #3a4a5e;">
      <div style="width: 100%; background: linear-gradient(180deg, #0f3460, #533483); border: 2px solid #4fc3f7; border-radius: 8px; padding: 10px; font-size: 11px; color: #c8d6e5; display: flex; align-items: flex-start; justify-content: center; min-height: calc-size(auto, 0);"><span style="font-size: 10px; color: #9ca3af;">short</span></div>
    </div>
    <div class="label">min-height: calc-size(auto, 0)</div>
  </div>
</div>
</body>
</html>
