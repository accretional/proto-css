<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ruby-align</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  ruby { font-size: 42px; color: #fff; line-height: 2; }
rt { font-size: 16px; color: #e94560; font-weight: 600; }
</style>
</head>
<body>
<h1>Ruby Align</h1>
<p class="prop-name">ruby-align</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 10px; padding: 28px 24px; width: 420px;">
      <div style="font-size: 42px; color: #fff; line-height: 2; display: flex; gap: 8px; margin-bottom: 8px; ruby-align: start;"><ruby>東京都<rt>とうきょうと</rt></ruby><ruby>北海道<rt>ほっかいどう</rt></ruby></div>
    </div>
    <div class="label">ruby-align: start</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 10px; padding: 28px 24px; width: 420px;">
      <div style="font-size: 42px; color: #fff; line-height: 2; display: flex; gap: 8px; margin-bottom: 8px; ruby-align: center;"><ruby>東京都<rt>とうきょうと</rt></ruby><ruby>北海道<rt>ほっかいどう</rt></ruby></div>
    </div>
    <div class="label">ruby-align: center</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 10px; padding: 28px 24px; width: 420px;">
      <div style="font-size: 42px; color: #fff; line-height: 2; display: flex; gap: 8px; margin-bottom: 8px; ruby-align: space-between;"><ruby>東京都<rt>とうきょうと</rt></ruby><ruby>北海道<rt>ほっかいどう</rt></ruby></div>
    </div>
    <div class="label">ruby-align: space-between</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 10px; padding: 28px 24px; width: 420px;">
      <div style="font-size: 42px; color: #fff; line-height: 2; display: flex; gap: 8px; margin-bottom: 8px; ruby-align: space-around;"><ruby>東京都<rt>とうきょうと</rt></ruby><ruby>北海道<rt>ほっかいどう</rt></ruby></div>
    </div>
    <div class="label">ruby-align: space-around</div>
  </div>
</div>
</body>
</html>
