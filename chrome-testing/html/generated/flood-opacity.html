<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>flood-opacity</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
</style>
</head>
<body>
<h1>Flood Opacity (SVG Filter)</h1>
<p class="prop-name">flood-opacity</p>
<div class="demos">
  <div class="demo-box" data-css-prop="flood-opacity" data-value="1">
    <div class="demo-area" style="display: flex; flex-direction: column; align-items: center;">
      <svg width="220" height="160" viewBox="0 0 220 160"><defs><filter id="fo" x="0" y="0" width="100%" height="100%" filterUnits="objectBoundingBox" primitiveUnits="userSpaceOnUse">
      <feFlood style="flood-color: #00ff88; flood-opacity: 1;"></feFlood>
      <feComposite operator="over" in2="SourceGraphic"/></filter></defs><rect x="10" y="10" width="200" height="140" rx="10" fill="#1a1a2e" stroke="#333" stroke-width="1"/><text x="110" y="90" text-anchor="middle" fill="#444" font-size="13" font-family="monospace">dark background</text><rect x="20" y="20" width="180" height="120" rx="8" fill="#0a0a0a" filter="url(#fo)"/></svg>
    </div>
    <div class="label">flood-opacity: 1</div>
  </div>
  <div class="demo-box" data-css-prop="flood-opacity" data-value="25%">
    <div class="demo-area" style="display: flex; flex-direction: column; align-items: center;">
      <svg width="220" height="160" viewBox="0 0 220 160"><defs><filter id="fo" x="0" y="0" width="100%" height="100%" filterUnits="objectBoundingBox" primitiveUnits="userSpaceOnUse">
      <feFlood style="flood-color: #00ff88; flood-opacity: 25%;"></feFlood>
      <feComposite operator="over" in2="SourceGraphic"/></filter></defs><rect x="10" y="10" width="200" height="140" rx="10" fill="#1a1a2e" stroke="#333" stroke-width="1"/><text x="110" y="90" text-anchor="middle" fill="#444" font-size="13" font-family="monospace">dark background</text><rect x="20" y="20" width="180" height="120" rx="8" fill="#0a0a0a" filter="url(#fo)"/></svg>
    </div>
    <div class="label">flood-opacity: 25%</div>
  </div>
  <div class="demo-box" data-css-prop="flood-opacity" data-value="0.5">
    <div class="demo-area" style="display: flex; flex-direction: column; align-items: center;">
      <svg width="220" height="160" viewBox="0 0 220 160"><defs><filter id="fo" x="0" y="0" width="100%" height="100%" filterUnits="objectBoundingBox" primitiveUnits="userSpaceOnUse">
      <feFlood style="flood-color: #00ff88; flood-opacity: 0.5;"></feFlood>
      <feComposite operator="over" in2="SourceGraphic"/></filter></defs><rect x="10" y="10" width="200" height="140" rx="10" fill="#1a1a2e" stroke="#333" stroke-width="1"/><text x="110" y="90" text-anchor="middle" fill="#444" font-size="13" font-family="monospace">dark background</text><rect x="20" y="20" width="180" height="120" rx="8" fill="#0a0a0a" filter="url(#fo)"/></svg>
    </div>
    <div class="label">flood-opacity: 0.5</div>
  </div>
  <div class="demo-box" data-css-prop="flood-opacity" data-value="50%">
    <div class="demo-area" style="display: flex; flex-direction: column; align-items: center;">
      <svg width="220" height="160" viewBox="0 0 220 160"><defs><filter id="fo" x="0" y="0" width="100%" height="100%" filterUnits="objectBoundingBox" primitiveUnits="userSpaceOnUse">
      <feFlood style="flood-color: #00ff88; flood-opacity: 50%;"></feFlood>
      <feComposite operator="over" in2="SourceGraphic"/></filter></defs><rect x="10" y="10" width="200" height="140" rx="10" fill="#1a1a2e" stroke="#333" stroke-width="1"/><text x="110" y="90" text-anchor="middle" fill="#444" font-size="13" font-family="monospace">dark background</text><rect x="20" y="20" width="180" height="120" rx="8" fill="#0a0a0a" filter="url(#fo)"/></svg>
    </div>
    <div class="label">flood-opacity: 50%</div>
  </div>
  <div class="demo-box" data-css-prop="flood-opacity" data-value="2">
    <div class="demo-area" style="display: flex; flex-direction: column; align-items: center;">
      <svg width="220" height="160" viewBox="0 0 220 160"><defs><filter id="fo" x="0" y="0" width="100%" height="100%" filterUnits="objectBoundingBox" primitiveUnits="userSpaceOnUse">
      <feFlood style="flood-color: #00ff88; flood-opacity: 2;"></feFlood>
      <feComposite operator="over" in2="SourceGraphic"/></filter></defs><rect x="10" y="10" width="200" height="140" rx="10" fill="#1a1a2e" stroke="#333" stroke-width="1"/><text x="110" y="90" text-anchor="middle" fill="#444" font-size="13" font-family="monospace">dark background</text><rect x="20" y="20" width="180" height="120" rx="8" fill="#0a0a0a" filter="url(#fo)"/></svg>
    </div>
    <div class="label">flood-opacity: 2</div>
  </div>
  <div class="demo-box" data-css-prop="flood-opacity" data-value="75%">
    <div class="demo-area" style="display: flex; flex-direction: column; align-items: center;">
      <svg width="220" height="160" viewBox="0 0 220 160"><defs><filter id="fo" x="0" y="0" width="100%" height="100%" filterUnits="objectBoundingBox" primitiveUnits="userSpaceOnUse">
      <feFlood style="flood-color: #00ff88; flood-opacity: 75%;"></feFlood>
      <feComposite operator="over" in2="SourceGraphic"/></filter></defs><rect x="10" y="10" width="200" height="140" rx="10" fill="#1a1a2e" stroke="#333" stroke-width="1"/><text x="110" y="90" text-anchor="middle" fill="#444" font-size="13" font-family="monospace">dark background</text><rect x="20" y="20" width="180" height="120" rx="8" fill="#0a0a0a" filter="url(#fo)"/></svg>
    </div>
    <div class="label">flood-opacity: 75%</div>
  </div>
</div>
<div id="control-bar"></div>
<script src="../interactive.js"></script>
</body>
</html>
