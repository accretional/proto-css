<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>anchor-name</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
  .tooltip { position: absolute; background: #22c55e; color: #000; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; position-anchor: --my-anchor; bottom: anchor(top); left: anchor(center); translate: -50% -8px; }
.tooltip::after { content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); border: 6px solid transparent; border-top-color: #22c55e; }
</style>
</head>
<body>
<h1>Anchor Name</h1>
<p class="prop-name">anchor-name</p>
<div class="demos">
  <div class="demo-box" data-css-prop="anchor-name" data-value="none">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 24px; width: 340px; height: 260px; position: relative;">
      <button style="background: #e94560; color: #fff; border: none; padding: 12px 24px; border-radius: 8px; font-size: 14px; font-weight: bold; position: absolute; top: 100px; left: 80px; anchor-name: none;">Anchor</button>
      <div class="tooltip">Tooltip</div>
    </div>
    <div class="label">anchor-name: none</div>
  </div>
  <div class="demo-box" data-css-prop="anchor-name" data-value="--my-anchor">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 24px; width: 340px; height: 260px; position: relative;">
      <button style="background: #e94560; color: #fff; border: none; padding: 12px 24px; border-radius: 8px; font-size: 14px; font-weight: bold; position: absolute; top: 100px; left: 80px; anchor-name: --my-anchor;">Anchor</button>
      <div class="tooltip">Tooltip</div>
    </div>
    <div class="label">anchor-name: --my-anchor</div>
  </div>
  <div class="demo-box" data-css-prop="anchor-name" data-value="--my-anchor, --my-anchor">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 24px; width: 340px; height: 260px; position: relative;">
      <button style="background: #e94560; color: #fff; border: none; padding: 12px 24px; border-radius: 8px; font-size: 14px; font-weight: bold; position: absolute; top: 100px; left: 80px; anchor-name: --my-anchor, --my-anchor;">Anchor</button>
      <div class="tooltip">Tooltip</div>
    </div>
    <div class="label">anchor-name: --my-anchor, --my-anchor</div>
  </div>
</div>
<div id="control-bar"></div>
<script src="../interactive.js"></script>
</body>
</html>
