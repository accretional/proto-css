<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>empty-cells</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
  th { background: #e94560; color: #fff; padding: 10px 14px; font-size: 13px; border-radius: 4px; text-align: left; }
td { background: #0f3460; padding: 10px 14px; font-size: 13px; border-radius: 4px; border: 2px solid #233d6e; }
</style>
</head>
<body>
<h1>Empty Table Cells</h1>
<p class="prop-name">empty-cells</p>
<div class="demos">
  <div class="demo-box" data-css-prop="empty-cells" data-value="show">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 24px; flex: 1;">
      <table style="border-collapse: separate; border-spacing: 6px; width: 100%; empty-cells: show;"><tr><th>Name</th><th>Email</th><th>Phone</th></tr><tr><td>Alice</td><td>alice@mail.com</td><td>555-0101</td></tr><tr><td>Bob</td><td></td><td>555-0202</td></tr><tr><td></td><td>carol@mail.com</td><td></td></tr><tr><td>Dave</td><td></td><td></td></tr></table>
    </div>
    <div class="label">empty-cells: show</div>
  </div>
  <div class="demo-box" data-css-prop="empty-cells" data-value="hide">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 24px; flex: 1;">
      <table style="border-collapse: separate; border-spacing: 6px; width: 100%; empty-cells: hide;"><tr><th>Name</th><th>Email</th><th>Phone</th></tr><tr><td>Alice</td><td>alice@mail.com</td><td>555-0101</td></tr><tr><td>Bob</td><td></td><td>555-0202</td></tr><tr><td></td><td>carol@mail.com</td><td></td></tr><tr><td>Dave</td><td></td><td></td></tr></table>
    </div>
    <div class="label">empty-cells: hide</div>
  </div>
</div>
<div id="control-bar"></div>
<script src="../interactive.js"></script>
</body>
</html>
