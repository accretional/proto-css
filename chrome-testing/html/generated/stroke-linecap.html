<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>stroke-linecap</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
  svg { width: 240px; height: 100px; }
.guide { stroke: #f43f5e; stroke-width: 1; stroke-dasharray: 3 3; }
</style>
</head>
<body>
<h1>Stroke Line Cap</h1>
<p class="prop-name">stroke-linecap</p>
<div class="demos">
  <div class="demo-box" data-css-prop="stroke-linecap" data-value="butt" data-target-selector=" line.target" data-target-id="t0">
    <div class="demo-area" style="display: flex; flex-direction: column; align-items: center; background: #16213e; border-radius: 12px; padding: 24px;">
      <style>#t0  line.target { stroke-linecap: butt; }</style>
      <svg id="t0" style="display: block;"><line class="target" x1="40" y1="50" x2="200" y2="50" stroke="#06b6d4" stroke-width="20"/><line class="guide" x1="40" y1="10" x2="40" y2="90"/><line class="guide" x1="200" y1="10" x2="200" y2="90"/></svg>
    </div>
    <div class="label">stroke-linecap: butt</div>
  </div>
  <div class="demo-box" data-css-prop="stroke-linecap" data-value="round" data-target-selector=" line.target" data-target-id="t1">
    <div class="demo-area" style="display: flex; flex-direction: column; align-items: center; background: #16213e; border-radius: 12px; padding: 24px;">
      <style>#t1  line.target { stroke-linecap: round; }</style>
      <svg id="t1" style="display: block;"><line class="target" x1="40" y1="50" x2="200" y2="50" stroke="#06b6d4" stroke-width="20"/><line class="guide" x1="40" y1="10" x2="40" y2="90"/><line class="guide" x1="200" y1="10" x2="200" y2="90"/></svg>
    </div>
    <div class="label">stroke-linecap: round</div>
  </div>
  <div class="demo-box" data-css-prop="stroke-linecap" data-value="square" data-target-selector=" line.target" data-target-id="t2">
    <div class="demo-area" style="display: flex; flex-direction: column; align-items: center; background: #16213e; border-radius: 12px; padding: 24px;">
      <style>#t2  line.target { stroke-linecap: square; }</style>
      <svg id="t2" style="display: block;"><line class="target" x1="40" y1="50" x2="200" y2="50" stroke="#06b6d4" stroke-width="20"/><line class="guide" x1="40" y1="10" x2="40" y2="90"/><line class="guide" x1="200" y1="10" x2="200" y2="90"/></svg>
    </div>
    <div class="label">stroke-linecap: square</div>
  </div>
</div>
<div id="control-bar"></div>
<script src="../interactive.js"></script>
</body>
</html>
