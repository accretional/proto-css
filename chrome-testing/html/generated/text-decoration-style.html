<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>text-decoration-style</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
</style>
</head>
<body>
<h1>Text Decoration Style</h1>
<p class="prop-name">text-decoration-style</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area">
      <div style="font-size: 26px; padding: 16px; background: #0f1a30; border-radius: 8px; border: 1px solid #2a2a4a; text-decoration-line: underline; text-decoration-color: #10b981; text-decoration-thickness: 3px; text-decoration-style: solid;">Styled Text</div>
    </div>
    <div class="label">text-decoration-style: solid</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="font-size: 26px; padding: 16px; background: #0f1a30; border-radius: 8px; border: 1px solid #2a2a4a; text-decoration-line: underline; text-decoration-color: #10b981; text-decoration-thickness: 3px; text-decoration-style: double;">Styled Text</div>
    </div>
    <div class="label">text-decoration-style: double</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="font-size: 26px; padding: 16px; background: #0f1a30; border-radius: 8px; border: 1px solid #2a2a4a; text-decoration-line: underline; text-decoration-color: #10b981; text-decoration-thickness: 3px; text-decoration-style: dotted;">Styled Text</div>
    </div>
    <div class="label">text-decoration-style: dotted</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="font-size: 26px; padding: 16px; background: #0f1a30; border-radius: 8px; border: 1px solid #2a2a4a; text-decoration-line: underline; text-decoration-color: #10b981; text-decoration-thickness: 3px; text-decoration-style: dashed;">Styled Text</div>
    </div>
    <div class="label">text-decoration-style: dashed</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="font-size: 26px; padding: 16px; background: #0f1a30; border-radius: 8px; border: 1px solid #2a2a4a; text-decoration-line: underline; text-decoration-color: #10b981; text-decoration-thickness: 3px; text-decoration-style: wavy;">Styled Text</div>
    </div>
    <div class="label">text-decoration-style: wavy</div>
  </div>
</div>
</body>
</html>
