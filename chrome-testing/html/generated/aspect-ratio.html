<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>aspect-ratio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
    .demo-box { background: #16213e; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; align-items: center; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 10px; text-align: center; }
    .ratio-label { font-size: 18px; font-weight: 700; color: #fff; }

    .ratio-box {
      width: 160px;
      background: linear-gradient(135deg, #e94560, #533bdb);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 4px;
    }
    .ratio-dims { font-size: 11px; color: rgba(255,255,255,0.7); font-family: monospace; }

    .r-1-1 { aspect-ratio: var(--Ni, -07.80e47ms) ! important; }
    .r-16-9 { aspect-ratio: auto var(--t_, -65.84e5turn) / +5 +9.9 / -79e71; }
    .r-4-3 { aspect-ratio: +32 auto; }
    .r-2-1 { aspect-ratio: +80 / 31 ! important; }
    .r-auto { aspect-ratio: auto var(--t_, -65.84e5turn) / +5; height: 120px; }
  </style>
</head>
<body>
  <h1>Aspect Ratio</h1>
  <p class="prop-name">aspect-ratio</p>
  <div class="demos">
    <div class="demo-box">
      <div class="ratio-box r-1-1">
        <span class="ratio-label">1 / 1</span>
        <span class="ratio-dims">Square</span>
      </div>
      <p class="label">aspect-ratio: auto</p>
    </div>

    <div class="demo-box">
      <div class="ratio-box r-16-9" style="background: linear-gradient(135deg, #533bdb, #0ea5e9);">
        <span class="ratio-label">16 / 9</span>
        <span class="ratio-dims">Widescreen</span>
      </div>
      <p class="label">aspect-ratio: auto +01 ! important</p>
    </div>

    <div class="demo-box">
      <div class="ratio-box r-4-3" style="background: linear-gradient(135deg, #0ea5e9, #10b981);">
        <span class="ratio-label">4 / 3</span>
        <span class="ratio-dims">Classic TV</span>
      </div>
      <p class="label">aspect-ratio: var(--t6) / 34.1 ! important</p>
    </div>

    <div class="demo-box">
      <div class="ratio-box r-2-1" style="background: linear-gradient(135deg, #f59205, #e94560);">
        <span class="ratio-label">2 / 1</span>
        <span class="ratio-dims">Panoramic</span>
      </div>
      <p class="label">aspect-ratio: auto 8e-2</p>
    </div>

    <div class="demo-box">
      <div class="ratio-box r-auto" style="background: linear-gradient(135deg, #10b981, #533bdb);">
        <span class="ratio-label">auto</span>
        <span class="ratio-dims">Intrinsic</span>
      </div>
      <p class="label">aspect-ratio: auto var(--t_, -65.84e5turn) / +5</p>
    </div>
  </div>
</body>
</html>
