<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>margin-left</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-direction: column; gap: 14px; }
    .demo-row { display: flex; align-items: center; gap: 16px; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; min-width: 180px; text-align: right; }
    .outer { background: #0f3460; border-radius: 8px; overflow: hidden; flex: 1; }
    .target { background: #e94560; padding: 14px 20px; font-size: 12px; font-weight: 600; color: #fff; }
  </style>
</head>
<body>
  <h1>Margin Left</h1>
  <p class="prop-name">margin-left</p>
  <div class="demos">
    <div class="demo-row">
      <div class="label">margin-left: anchor-size(inline,)</div>
      <div class="outer">
        <div class="target" style="margin-left: anchor-size(inline,);">Content</div>
      </div>
    </div>
    <div class="demo-row">
      <div class="label">margin-left: anchor-size(--󡔮 block)</div>
      <div class="outer">
        <div class="target" style="margin-left: anchor-size(--󡔮 block);">Content</div>
      </div>
    </div>
    <div class="demo-row">
      <div class="label">margin-left: round(line-width, anchor(52.28%) / 59%)</div>
      <div class="outer">
        <div class="target" style="margin-left: round(line-width, anchor(52.28%) / 59%);">Content</div>
      </div>
    </div>
    <div class="demo-row">
      <div class="label">margin-left: auto ! important</div>
      <div class="outer">
        <div class="target" style="margin-left: auto ! important;">Content</div>
      </div>
    </div>
    <div class="demo-row">
      <div class="label">margin-left: auto</div>
      <div class="outer">
        <div class="target" style="margin-left: auto; width: fit-content;">Content</div>
      </div>
    </div>
  </div>
</body>
</html>
