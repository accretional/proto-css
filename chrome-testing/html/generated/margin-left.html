<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>margin-left</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
</style>
</head>
<body>
<h1>Margin Left</h1>
<p class="prop-name">margin-left</p>
<div class="demos">
  <div class="demo-box" data-css-prop="margin-left" data-value="10px">
    <div class="demo-area" style="background: #0f3460; border-radius: 8px; overflow: hidden;">
      <div style="background: #e94560; padding: 14px 20px; font-size: 12px; font-weight: 600; color: #fff; margin-left: 10px;">Content</div>
    </div>
    <div class="label">margin-left: 10px</div>
  </div>
  <div class="demo-box" data-css-prop="margin-left" data-value="auto">
    <div class="demo-area" style="background: #0f3460; border-radius: 8px; overflow: hidden;">
      <div style="background: #e94560; padding: 14px 20px; font-size: 12px; font-weight: 600; color: #fff; margin-left: auto;">Content</div>
    </div>
    <div class="label">margin-left: auto</div>
  </div>
  <div class="demo-box" data-css-prop="margin-left" data-value="anchor-size(width)">
    <div class="demo-area" style="background: #0f3460; border-radius: 8px; overflow: hidden;">
      <div style="background: #e94560; padding: 14px 20px; font-size: 12px; font-weight: 600; color: #fff; margin-left: anchor-size(width);">Content</div>
    </div>
    <div class="label">margin-left: anchor-size(width)</div>
  </div>
  <div class="demo-box" data-css-prop="margin-left" data-value="25%">
    <div class="demo-area" style="background: #0f3460; border-radius: 8px; overflow: hidden;">
      <div style="background: #e94560; padding: 14px 20px; font-size: 12px; font-weight: 600; color: #fff; margin-left: 25%;">Content</div>
    </div>
    <div class="label">margin-left: 25%</div>
  </div>
  <div class="demo-box" data-css-prop="margin-left" data-value="anchor-size(height)">
    <div class="demo-area" style="background: #0f3460; border-radius: 8px; overflow: hidden;">
      <div style="background: #e94560; padding: 14px 20px; font-size: 12px; font-weight: 600; color: #fff; margin-left: anchor-size(height);">Content</div>
    </div>
    <div class="label">margin-left: anchor-size(height)</div>
  </div>
  <div class="demo-box" data-css-prop="margin-left" data-value="50%">
    <div class="demo-area" style="background: #0f3460; border-radius: 8px; overflow: hidden;">
      <div style="background: #e94560; padding: 14px 20px; font-size: 12px; font-weight: 600; color: #fff; margin-left: 50%;">Content</div>
    </div>
    <div class="label">margin-left: 50%</div>
  </div>
  <div class="demo-box" data-css-prop="margin-left" data-value="100%">
    <div class="demo-area" style="background: #0f3460; border-radius: 8px; overflow: hidden;">
      <div style="background: #e94560; padding: 14px 20px; font-size: 12px; font-weight: 600; color: #fff; margin-left: 100%;">Content</div>
    </div>
    <div class="label">margin-left: 100%</div>
  </div>
  <div class="demo-box" data-css-prop="margin-left" data-value="0">
    <div class="demo-area" style="background: #0f3460; border-radius: 8px; overflow: hidden;">
      <div style="background: #e94560; padding: 14px 20px; font-size: 12px; font-weight: 600; color: #fff; margin-left: 0;">Content</div>
    </div>
    <div class="label">margin-left: 0</div>
  </div>
</div>
<div id="control-bar"></div>
<script src="../interactive.js"></script>
</body>
</html>
