<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>box-direction</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
  .child { -webkit-box-flex: 1; height: 100%; background: #e94560; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; color: #fff; }
.child:nth-child(2) { background: #0f3460; }
.child:nth-child(3) { background: #53d769; color: #1a1a2e; }
.child:nth-child(4) { background: #fbbf24; color: #1a1a2e; }
</style>
</head>
<body>
<h1>Box Direction (deprecated)</h1>
<p class="prop-name">box-direction</p>
<div class="demos">
  <div class="demo-box" data-css-prop="-webkit-box-direction" data-value="normal">
    <div class="demo-area">
      <div style="display: -webkit-box; -webkit-box-orient: horizontal; width: 400px; height: 100px; background: #16213e; border: 2px solid #333; padding: 8px; gap: 8px; -webkit-box-direction: normal;"><div class="child">1</div><div class="child">2</div><div class="child">3</div><div class="child">4</div></div>
    </div>
    <div class="label">box-direction: normal</div>
  </div>
  <div class="demo-box" data-css-prop="-webkit-box-direction" data-value="reverse">
    <div class="demo-area">
      <div style="display: -webkit-box; -webkit-box-orient: horizontal; width: 400px; height: 100px; background: #16213e; border: 2px solid #333; padding: 8px; gap: 8px; -webkit-box-direction: reverse;"><div class="child">1</div><div class="child">2</div><div class="child">3</div><div class="child">4</div></div>
    </div>
    <div class="label">box-direction: reverse</div>
  </div>
</div>
<div id="control-bar"></div>
<script src="../interactive.js"></script>
</body>
</html>
