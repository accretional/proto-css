<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>stroke-linejoin</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
</style>
</head>
<body>
<h1>Stroke Line Join</h1>
<p class="prop-name">stroke-linejoin</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area" style="display: flex; flex-direction: column; align-items: center; background: #16213e; border-radius: 12px; padding: 28px 36px;">
      <svg width="280" height="230">
      <path style="fill: none; stroke: #06b6d4; stroke-width: 24; stroke-linecap: butt; d: path(&#39;M 20,200 L 60,30 L 100,200 L 140,30 L 180,200 L 220,30 L 260,200&#39;); stroke-linejoin: miter;"></path>
      <path d="M 20,200 L 60,30 L 100,200 L 140,30 L 180,200 L 220,30 L 260,200" fill="none" stroke="#f43f5e" stroke-width="1" stroke-dasharray="4 3"/></svg>
    </div>
    <div class="label">stroke-linejoin: miter</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="display: flex; flex-direction: column; align-items: center; background: #16213e; border-radius: 12px; padding: 28px 36px;">
      <svg width="280" height="230">
      <path style="fill: none; stroke: #06b6d4; stroke-width: 24; stroke-linecap: butt; d: path(&#39;M 20,200 L 60,30 L 100,200 L 140,30 L 180,200 L 220,30 L 260,200&#39;); stroke-linejoin: round;"></path>
      <path d="M 20,200 L 60,30 L 100,200 L 140,30 L 180,200 L 220,30 L 260,200" fill="none" stroke="#f43f5e" stroke-width="1" stroke-dasharray="4 3"/></svg>
    </div>
    <div class="label">stroke-linejoin: round</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="display: flex; flex-direction: column; align-items: center; background: #16213e; border-radius: 12px; padding: 28px 36px;">
      <svg width="280" height="230">
      <path style="fill: none; stroke: #06b6d4; stroke-width: 24; stroke-linecap: butt; d: path(&#39;M 20,200 L 60,30 L 100,200 L 140,30 L 180,200 L 220,30 L 260,200&#39;); stroke-linejoin: bevel;"></path>
      <path d="M 20,200 L 60,30 L 100,200 L 140,30 L 180,200 L 220,30 L 260,200" fill="none" stroke="#f43f5e" stroke-width="1" stroke-dasharray="4 3"/></svg>
    </div>
    <div class="label">stroke-linejoin: bevel</div>
  </div>
</div>
</body>
</html>
