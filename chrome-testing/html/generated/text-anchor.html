<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>text-anchor</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  svg { width: 340px; height: 120px; }
</style>
</head>
<body>
<h1>Text Anchor</h1>
<p class="prop-name">text-anchor</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; align-items: center;">
      <style>#t0  text.target { text-anchor: start; }</style>
      <svg id="t0" style="display: block;"><line x1="170" y1="10" x2="170" y2="110" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4"/><circle cx="170" cy="60" r="4" fill="#ef4444"/><text class="target" x="170" y="60" fill="#e0e0e0" font-size="20" font-family="system-ui, sans-serif">Hello World</text></svg>
    </div>
    <div class="label">text-anchor: start</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; align-items: center;">
      <style>#t1  text.target { text-anchor: middle; }</style>
      <svg id="t1" style="display: block;"><line x1="170" y1="10" x2="170" y2="110" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4"/><circle cx="170" cy="60" r="4" fill="#ef4444"/><text class="target" x="170" y="60" fill="#e0e0e0" font-size="20" font-family="system-ui, sans-serif">Hello World</text></svg>
    </div>
    <div class="label">text-anchor: middle</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; align-items: center;">
      <style>#t2  text.target { text-anchor: end; }</style>
      <svg id="t2" style="display: block;"><line x1="170" y1="10" x2="170" y2="110" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4"/><circle cx="170" cy="60" r="4" fill="#ef4444"/><text class="target" x="170" y="60" fill="#e0e0e0" font-size="20" font-family="system-ui, sans-serif">Hello World</text></svg>
    </div>
    <div class="label">text-anchor: end</div>
  </div>
</div>
</body>
</html>
