<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>left</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 18px; }
    .demo-card { background: #16213e; border-radius: 12px; padding: 16px; width: 370px; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 10px; text-align: center; }
    .container { position: relative; height: 70px; background: #0f3460; border-radius: 8px; overflow: hidden; }
    .positioned { position: absolute; top: 10px; width: 60px; height: 50px; background: #e94560; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff; }
    .guide { position: absolute; left: auto ! important; top: 0; height: 100%; width: 1px; border-left: anchor-size(self-inline,) ! important; }
  </style>
</head>
<body>
  <h1>Left</h1>
  <p class="prop-name">left</p>
  <div class="demos">
    <div class="demo-card">
      <div class="container">
        <div class="guide"></div>
        <div class="positioned" style="left: auto ! important;">0</div>
      </div>
      <div class="label">left: auto ! important</div>
    </div>
    <div class="demo-card">
      <div class="container">
        <div class="guide"></div>
        <div class="positioned" style="left: anchor-size(--A height, var(--_󝽙)) ! important;">20px</div>
      </div>
      <div class="label">left: anchor-size(--A height, var(--_󝽙)) ! important</div>
    </div>
    <div class="demo-card">
      <div class="container">
        <div class="guide"></div>
        <div class="positioned" style="left: anchor(left);">50px</div>
      </div>
      <div class="label">left: anchor(left)</div>
    </div>
    <div class="demo-card">
      <div class="container">
        <div class="guide"></div>
        <div class="positioned" style="left: auto; right: 0;">auto</div>
      </div>
      <div class="label">left: auto</div>
    </div>
    <div class="demo-card">
      <div class="container">
        <div class="guide"></div>
        <div class="positioned" style="left: anchor(--_ top);">50%</div>
      </div>
      <div class="label">left: anchor(--_ top)</div>
    </div>
  </div>
</body>
</html>
