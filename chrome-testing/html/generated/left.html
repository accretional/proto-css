<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>left</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
  .guide { position: absolute; left: 0; top: 0; height: 100%; width: 1px; border-left: 1px dashed rgba(255,255,255,0.15); }
</style>
</head>
<body>
<div id="control-bar"></div>
<h1>Left</h1>
<p class="prop-name">left</p>
<div class="demos">
  <div class="demo-box" data-css-prop="left" data-value="auto">
    <div class="demo-area" style="position: relative; height: 70px; background: #0f3460; border-radius: 8px; overflow: hidden;">
      <div class="guide"></div>
      <div style="position: absolute; top: 10px; width: 60px; height: 50px; background: #e94560; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff; left: auto;"></div>
    </div>
    <div class="label">left: auto</div>
  </div>
  <div class="demo-box" data-css-prop="left" data-value="10px">
    <div class="demo-area" style="position: relative; height: 70px; background: #0f3460; border-radius: 8px; overflow: hidden;">
      <div class="guide"></div>
      <div style="position: absolute; top: 10px; width: 60px; height: 50px; background: #e94560; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff; left: 10px;"></div>
    </div>
    <div class="label">left: 10px</div>
  </div>
  <div class="demo-box" data-css-prop="left" data-value="anchor(top)">
    <div class="demo-area" style="position: relative; height: 70px; background: #0f3460; border-radius: 8px; overflow: hidden;">
      <div class="guide"></div>
      <div style="position: absolute; top: 10px; width: 60px; height: 50px; background: #e94560; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff; left: anchor(top);"></div>
    </div>
    <div class="label">left: anchor(top)</div>
  </div>
  <div class="demo-box" data-css-prop="left" data-value="anchor-size(width)">
    <div class="demo-area" style="position: relative; height: 70px; background: #0f3460; border-radius: 8px; overflow: hidden;">
      <div class="guide"></div>
      <div style="position: absolute; top: 10px; width: 60px; height: 50px; background: #e94560; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff; left: anchor-size(width);"></div>
    </div>
    <div class="label">left: anchor-size(width)</div>
  </div>
  <div class="demo-box" data-css-prop="left" data-value="25%">
    <div class="demo-area" style="position: relative; height: 70px; background: #0f3460; border-radius: 8px; overflow: hidden;">
      <div class="guide"></div>
      <div style="position: absolute; top: 10px; width: 60px; height: 50px; background: #e94560; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff; left: 25%;"></div>
    </div>
    <div class="label">left: 25%</div>
  </div>
  <div class="demo-box" data-css-prop="left" data-value="anchor(bottom)">
    <div class="demo-area" style="position: relative; height: 70px; background: #0f3460; border-radius: 8px; overflow: hidden;">
      <div class="guide"></div>
      <div style="position: absolute; top: 10px; width: 60px; height: 50px; background: #e94560; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff; left: anchor(bottom);"></div>
    </div>
    <div class="label">left: anchor(bottom)</div>
  </div>
  <div class="demo-box" data-css-prop="left" data-value="anchor-size(height)">
    <div class="demo-area" style="position: relative; height: 70px; background: #0f3460; border-radius: 8px; overflow: hidden;">
      <div class="guide"></div>
      <div style="position: absolute; top: 10px; width: 60px; height: 50px; background: #e94560; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff; left: anchor-size(height);"></div>
    </div>
    <div class="label">left: anchor-size(height)</div>
  </div>
  <div class="demo-box" data-css-prop="left" data-value="50%">
    <div class="demo-area" style="position: relative; height: 70px; background: #0f3460; border-radius: 8px; overflow: hidden;">
      <div class="guide"></div>
      <div style="position: absolute; top: 10px; width: 60px; height: 50px; background: #e94560; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff; left: 50%;"></div>
    </div>
    <div class="label">left: 50%</div>
  </div>
  <div class="demo-box" data-css-prop="left" data-value="100%">
    <div class="demo-area" style="position: relative; height: 70px; background: #0f3460; border-radius: 8px; overflow: hidden;">
      <div class="guide"></div>
      <div style="position: absolute; top: 10px; width: 60px; height: 50px; background: #e94560; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff; left: 100%;"></div>
    </div>
    <div class="label">left: 100%</div>
  </div>
  <div class="demo-box" data-css-prop="left" data-value="0">
    <div class="demo-area" style="position: relative; height: 70px; background: #0f3460; border-radius: 8px; overflow: hidden;">
      <div class="guide"></div>
      <div style="position: absolute; top: 10px; width: 60px; height: 50px; background: #e94560; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff; left: 0;"></div>
    </div>
    <div class="label">left: 0</div>
  </div>
</div>
<script src="../interactive.js"></script>
</body>
</html>
