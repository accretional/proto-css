<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>border-bottom-width</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
</style>
</head>
<body>
<h1>Border Bottom Width</h1>
<p class="prop-name">border-bottom-width</p>
<div class="demos">
  <div class="demo-box" data-css-prop="border-bottom-width" data-value="10px">
    <div class="demo-area">
      <div style="width: 140px; height: 80px; background: #16213e; border-bottom-style: solid; border-bottom-color: #e94560; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #ccc; font-family: monospace; border-bottom-width: 10px;"></div>
    </div>
    <div class="label">border-bottom-width: 10px</div>
  </div>
  <div class="demo-box" data-css-prop="border-bottom-width" data-value="hairline">
    <div class="demo-area">
      <div style="width: 140px; height: 80px; background: #16213e; border-bottom-style: solid; border-bottom-color: #e94560; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #ccc; font-family: monospace; border-bottom-width: hairline;"></div>
    </div>
    <div class="label">border-bottom-width: hairline</div>
  </div>
  <div class="demo-box" data-css-prop="border-bottom-width" data-value="thin">
    <div class="demo-area">
      <div style="width: 140px; height: 80px; background: #16213e; border-bottom-style: solid; border-bottom-color: #e94560; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #ccc; font-family: monospace; border-bottom-width: thin;"></div>
    </div>
    <div class="label">border-bottom-width: thin</div>
  </div>
  <div class="demo-box" data-css-prop="border-bottom-width" data-value="medium">
    <div class="demo-area">
      <div style="width: 140px; height: 80px; background: #16213e; border-bottom-style: solid; border-bottom-color: #e94560; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #ccc; font-family: monospace; border-bottom-width: medium;"></div>
    </div>
    <div class="label">border-bottom-width: medium</div>
  </div>
  <div class="demo-box" data-css-prop="border-bottom-width" data-value="thick">
    <div class="demo-area">
      <div style="width: 140px; height: 80px; background: #16213e; border-bottom-style: solid; border-bottom-color: #e94560; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #ccc; font-family: monospace; border-bottom-width: thick;"></div>
    </div>
    <div class="label">border-bottom-width: thick</div>
  </div>
  <div class="demo-box" data-css-prop="border-bottom-width" data-value="20px">
    <div class="demo-area">
      <div style="width: 140px; height: 80px; background: #16213e; border-bottom-style: solid; border-bottom-color: #e94560; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #ccc; font-family: monospace; border-bottom-width: 20px;"></div>
    </div>
    <div class="label">border-bottom-width: 20px</div>
  </div>
  <div class="demo-box" data-css-prop="border-bottom-width" data-value="50px">
    <div class="demo-area">
      <div style="width: 140px; height: 80px; background: #16213e; border-bottom-style: solid; border-bottom-color: #e94560; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #ccc; font-family: monospace; border-bottom-width: 50px;"></div>
    </div>
    <div class="label">border-bottom-width: 50px</div>
  </div>
  <div class="demo-box" data-css-prop="border-bottom-width" data-value="4px">
    <div class="demo-area">
      <div style="width: 140px; height: 80px; background: #16213e; border-bottom-style: solid; border-bottom-color: #e94560; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #ccc; font-family: monospace; border-bottom-width: 4px;"></div>
    </div>
    <div class="label">border-bottom-width: 4px</div>
  </div>
  <div class="demo-box" data-css-prop="border-bottom-width" data-value="0">
    <div class="demo-area">
      <div style="width: 140px; height: 80px; background: #16213e; border-bottom-style: solid; border-bottom-color: #e94560; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #ccc; font-family: monospace; border-bottom-width: 0;"></div>
    </div>
    <div class="label">border-bottom-width: 0</div>
  </div>
</div>
<div id="control-bar"></div>
<script src="../interactive.js"></script>
</body>
</html>
