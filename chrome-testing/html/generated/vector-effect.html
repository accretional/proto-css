<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>vector-effect</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  svg { width: 260px; height: 160px; overflow: visible; }
</style>
</head>
<body>
<h1>Vector Effect</h1>
<p class="prop-name">vector-effect</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 16px; overflow: hidden; display: flex; justify-content: center;">
      <style>#t0  circle.target { vector-effect: none; }</style>
      <svg id="t0" style="display: block;"><g transform="scale(3)"><circle class="target" cx="40" cy="25" r="15" fill="none" stroke="#06b6d4" stroke-width="2"/></g><line x1="10" y1="145" x2="250" y2="145" stroke="#3a3a5c" stroke-width="1" stroke-dasharray="4 4"/></svg>
    </div>
    <div class="label">vector-effect: none</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 16px; overflow: hidden; display: flex; justify-content: center;">
      <style>#t1  circle.target { vector-effect: non-scaling-stroke; }</style>
      <svg id="t1" style="display: block;"><g transform="scale(3)"><circle class="target" cx="40" cy="25" r="15" fill="none" stroke="#06b6d4" stroke-width="2"/></g><line x1="10" y1="145" x2="250" y2="145" stroke="#3a3a5c" stroke-width="1" stroke-dasharray="4 4"/></svg>
    </div>
    <div class="label">vector-effect: non-scaling-stroke</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 16px; overflow: hidden; display: flex; justify-content: center;">
      <style>#t2  circle.target { vector-effect: non-scaling-size; }</style>
      <svg id="t2" style="display: block;"><g transform="scale(3)"><circle class="target" cx="40" cy="25" r="15" fill="none" stroke="#06b6d4" stroke-width="2"/></g><line x1="10" y1="145" x2="250" y2="145" stroke="#3a3a5c" stroke-width="1" stroke-dasharray="4 4"/></svg>
    </div>
    <div class="label">vector-effect: non-scaling-size</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 16px; overflow: hidden; display: flex; justify-content: center;">
      <style>#t3  circle.target { vector-effect: non-rotation; }</style>
      <svg id="t3" style="display: block;"><g transform="scale(3)"><circle class="target" cx="40" cy="25" r="15" fill="none" stroke="#06b6d4" stroke-width="2"/></g><line x1="10" y1="145" x2="250" y2="145" stroke="#3a3a5c" stroke-width="1" stroke-dasharray="4 4"/></svg>
    </div>
    <div class="label">vector-effect: non-rotation</div>
  </div>
</div>
</body>
</html>
