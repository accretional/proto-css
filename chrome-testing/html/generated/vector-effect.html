<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>vector-effect</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .svg-row { display: flex; align-items: flex-end; gap: 20px; }
.svg-container { text-align: center; }
.scale-label { font-size: 10px; font-family: monospace; color: #6b7280; margin-bottom: 6px; }
.svg-bg { background: #0d1117; border-radius: 8px; padding: 12px; display: inline-block; }
.desc { font-size: 12px; color: #6b7280; margin-bottom: 16px; line-height: 1.5; }
</style>
</head>
<body>
<h1>Vector Effect</h1>
<p class="prop-name">vector-effect</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 24px; width: 580px;">
      <rect style="fill: none; stroke: #e94560; stroke-width: 3; vector-effect: none;"></rect>
    </div>
    <div class="label">vector-effect: none</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 24px; width: 580px;">
      <rect style="fill: none; stroke: #e94560; stroke-width: 3; vector-effect: non-scaling-stroke;"></rect>
    </div>
    <div class="label">vector-effect: non-scaling-stroke</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 24px; width: 580px;">
      <rect style="fill: none; stroke: #e94560; stroke-width: 3; vector-effect: non-scaling-size;"></rect>
    </div>
    <div class="label">vector-effect: non-scaling-size</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 24px; width: 580px;">
      <rect style="fill: none; stroke: #e94560; stroke-width: 3; vector-effect: non-rotation;"></rect>
    </div>
    <div class="label">vector-effect: non-rotation</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 24px; width: 580px;">
      <rect style="fill: none; stroke: #e94560; stroke-width: 3; vector-effect: fixed-position;"></rect>
    </div>
    <div class="label">vector-effect: fixed-position</div>
  </div>
</div>
</body>
</html>
