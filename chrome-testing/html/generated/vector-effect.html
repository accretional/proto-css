<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>vector-effect</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  svg { width: 260px; height: 100px; overflow: hidden; }
</style>
</head>
<body>
<h1>Vector Effect</h1>
<p class="prop-name">vector-effect</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 16px; overflow: hidden; display: flex; justify-content: center;">
      <svg style="display: block; vector-effect: none;"><g transform="scale(2)"><rect x="10" y="10" width="40" height="30" rx="4" fill="none" stroke="#e94560" stroke-width="2" /><circle cx="110" cy="25" r="20" fill="none" stroke="#06b6d4" stroke-width="2" /><line x1="65" y1="10" x2="65" y2="40" stroke="#a78bfa" stroke-width="2" /></g></svg>
    </div>
    <div class="label">vector-effect: none</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 16px; overflow: hidden; display: flex; justify-content: center;">
      <svg style="display: block; vector-effect: non-scaling-stroke;"><g transform="scale(2)"><rect x="10" y="10" width="40" height="30" rx="4" fill="none" stroke="#e94560" stroke-width="2" /><circle cx="110" cy="25" r="20" fill="none" stroke="#06b6d4" stroke-width="2" /><line x1="65" y1="10" x2="65" y2="40" stroke="#a78bfa" stroke-width="2" /></g></svg>
    </div>
    <div class="label">vector-effect: non-scaling-stroke</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 16px; overflow: hidden; display: flex; justify-content: center;">
      <svg style="display: block; vector-effect: non-scaling-size;"><g transform="scale(2)"><rect x="10" y="10" width="40" height="30" rx="4" fill="none" stroke="#e94560" stroke-width="2" /><circle cx="110" cy="25" r="20" fill="none" stroke="#06b6d4" stroke-width="2" /><line x1="65" y1="10" x2="65" y2="40" stroke="#a78bfa" stroke-width="2" /></g></svg>
    </div>
    <div class="label">vector-effect: non-scaling-size</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 16px; overflow: hidden; display: flex; justify-content: center;">
      <svg style="display: block; vector-effect: non-rotation;"><g transform="scale(2)"><rect x="10" y="10" width="40" height="30" rx="4" fill="none" stroke="#e94560" stroke-width="2" /><circle cx="110" cy="25" r="20" fill="none" stroke="#06b6d4" stroke-width="2" /><line x1="65" y1="10" x2="65" y2="40" stroke="#a78bfa" stroke-width="2" /></g></svg>
    </div>
    <div class="label">vector-effect: non-rotation</div>
  </div>
  <div class="demo-box">
    <div class="demo-area" style="background: #16213e; border-radius: 12px; padding: 16px; overflow: hidden; display: flex; justify-content: center;">
      <svg style="display: block; vector-effect: fixed-position;"><g transform="scale(2)"><rect x="10" y="10" width="40" height="30" rx="4" fill="none" stroke="#e94560" stroke-width="2" /><circle cx="110" cy="25" r="20" fill="none" stroke="#06b6d4" stroke-width="2" /><line x1="65" y1="10" x2="65" y2="40" stroke="#a78bfa" stroke-width="2" /></g></svg>
    </div>
    <div class="label">vector-effect: fixed-position</div>
  </div>
</div>
</body>
</html>
