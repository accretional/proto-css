<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>stroke-dashoffset</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
</style>
</head>
<body>
<div id="control-bar"></div>
<h1>Stroke Dash Offset</h1>
<p class="prop-name">stroke-dashoffset</p>
<div class="demos">
  <div class="demo-box" data-css-prop="stroke-dashoffset" data-value="10px" data-target-selector=" line.target" data-target-id="t0">
    <div class="demo-area" style="background: #16213e; border-radius: 8px; padding: 14px 18px; display: flex; flex-direction: column; align-items: center;">
      <style>#t0  line.target { stroke-dashoffset: 10px; }</style>
      <svg id="t0" style="width: 300px; height: 60px;"><rect x="0" y="0" width="300" height="60" fill="#0f3460" rx="6"/><line class="target" x1="10" y1="30" x2="290" y2="30" stroke="#06b6d4" stroke-width="6" stroke-dasharray="30 20" fill="none"/></svg>
    </div>
    <div class="label">stroke-dashoffset: 10px</div>
  </div>
  <div class="demo-box" data-css-prop="stroke-dashoffset" data-value="1" data-target-selector=" line.target" data-target-id="t1">
    <div class="demo-area" style="background: #16213e; border-radius: 8px; padding: 14px 18px; display: flex; flex-direction: column; align-items: center;">
      <style>#t1  line.target { stroke-dashoffset: 1; }</style>
      <svg id="t1" style="width: 300px; height: 60px;"><rect x="0" y="0" width="300" height="60" fill="#0f3460" rx="6"/><line class="target" x1="10" y1="30" x2="290" y2="30" stroke="#06b6d4" stroke-width="6" stroke-dasharray="30 20" fill="none"/></svg>
    </div>
    <div class="label">stroke-dashoffset: 1</div>
  </div>
  <div class="demo-box" data-css-prop="stroke-dashoffset" data-value="25%" data-target-selector=" line.target" data-target-id="t2">
    <div class="demo-area" style="background: #16213e; border-radius: 8px; padding: 14px 18px; display: flex; flex-direction: column; align-items: center;">
      <style>#t2  line.target { stroke-dashoffset: 25%; }</style>
      <svg id="t2" style="width: 300px; height: 60px;"><rect x="0" y="0" width="300" height="60" fill="#0f3460" rx="6"/><line class="target" x1="10" y1="30" x2="290" y2="30" stroke="#06b6d4" stroke-width="6" stroke-dasharray="30 20" fill="none"/></svg>
    </div>
    <div class="label">stroke-dashoffset: 25%</div>
  </div>
  <div class="demo-box" data-css-prop="stroke-dashoffset" data-value="0.5" data-target-selector=" line.target" data-target-id="t3">
    <div class="demo-area" style="background: #16213e; border-radius: 8px; padding: 14px 18px; display: flex; flex-direction: column; align-items: center;">
      <style>#t3  line.target { stroke-dashoffset: 0.5; }</style>
      <svg id="t3" style="width: 300px; height: 60px;"><rect x="0" y="0" width="300" height="60" fill="#0f3460" rx="6"/><line class="target" x1="10" y1="30" x2="290" y2="30" stroke="#06b6d4" stroke-width="6" stroke-dasharray="30 20" fill="none"/></svg>
    </div>
    <div class="label">stroke-dashoffset: 0.5</div>
  </div>
  <div class="demo-box" data-css-prop="stroke-dashoffset" data-value="50%" data-target-selector=" line.target" data-target-id="t4">
    <div class="demo-area" style="background: #16213e; border-radius: 8px; padding: 14px 18px; display: flex; flex-direction: column; align-items: center;">
      <style>#t4  line.target { stroke-dashoffset: 50%; }</style>
      <svg id="t4" style="width: 300px; height: 60px;"><rect x="0" y="0" width="300" height="60" fill="#0f3460" rx="6"/><line class="target" x1="10" y1="30" x2="290" y2="30" stroke="#06b6d4" stroke-width="6" stroke-dasharray="30 20" fill="none"/></svg>
    </div>
    <div class="label">stroke-dashoffset: 50%</div>
  </div>
  <div class="demo-box" data-css-prop="stroke-dashoffset" data-value="2" data-target-selector=" line.target" data-target-id="t5">
    <div class="demo-area" style="background: #16213e; border-radius: 8px; padding: 14px 18px; display: flex; flex-direction: column; align-items: center;">
      <style>#t5  line.target { stroke-dashoffset: 2; }</style>
      <svg id="t5" style="width: 300px; height: 60px;"><rect x="0" y="0" width="300" height="60" fill="#0f3460" rx="6"/><line class="target" x1="10" y1="30" x2="290" y2="30" stroke="#06b6d4" stroke-width="6" stroke-dasharray="30 20" fill="none"/></svg>
    </div>
    <div class="label">stroke-dashoffset: 2</div>
  </div>
  <div class="demo-box" data-css-prop="stroke-dashoffset" data-value="100%" data-target-selector=" line.target" data-target-id="t6">
    <div class="demo-area" style="background: #16213e; border-radius: 8px; padding: 14px 18px; display: flex; flex-direction: column; align-items: center;">
      <style>#t6  line.target { stroke-dashoffset: 100%; }</style>
      <svg id="t6" style="width: 300px; height: 60px;"><rect x="0" y="0" width="300" height="60" fill="#0f3460" rx="6"/><line class="target" x1="10" y1="30" x2="290" y2="30" stroke="#06b6d4" stroke-width="6" stroke-dasharray="30 20" fill="none"/></svg>
    </div>
    <div class="label">stroke-dashoffset: 100%</div>
  </div>
  <div class="demo-box" data-css-prop="stroke-dashoffset" data-value="0" data-target-selector=" line.target" data-target-id="t7">
    <div class="demo-area" style="background: #16213e; border-radius: 8px; padding: 14px 18px; display: flex; flex-direction: column; align-items: center;">
      <style>#t7  line.target { stroke-dashoffset: 0; }</style>
      <svg id="t7" style="width: 300px; height: 60px;"><rect x="0" y="0" width="300" height="60" fill="#0f3460" rx="6"/><line class="target" x1="10" y1="30" x2="290" y2="30" stroke="#06b6d4" stroke-width="6" stroke-dasharray="30 20" fill="none"/></svg>
    </div>
    <div class="label">stroke-dashoffset: 0</div>
  </div>
</div>
<script src="../interactive.js"></script>
</body>
</html>
