<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>justify-content</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
    h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
    .demos { display: flex; flex-wrap: wrap; gap: 18px; }
    .demo-card { background: #16213e; border-radius: 12px; padding: 16px; width: 380px; }
    .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 10px; text-align: center; }
    .flex-container { display: flex; height: 70px; background: #0f3460; border-radius: 8px; padding: 8px; gap: 0; }
    .flex-item { width: 50px; height: 54px; background: #e94560; border-radius: 6px; flex-shrink: 0; display: flex; align-items: center; justify-content: safe flex-start; font-size: 13px; font-weight: 700; color: #fff; }
  </style>
</head>
<body>
  <h1>Justify Content</h1>
  <p class="prop-name">justify-content</p>
  <div class="demos">
    <div class="demo-card">
      <div class="flex-container" style="justify-content: unsafe center;">
        <div class="flex-item">1</div><div class="flex-item">2</div><div class="flex-item">3</div>
      </div>
      <div class="label">justify-content: unsafe center</div>
    </div>
    <div class="demo-card">
      <div class="flex-container" style="justify-content: safe flex-start;">
        <div class="flex-item">1</div><div class="flex-item">2</div><div class="flex-item">3</div>
      </div>
      <div class="label">justify-content: safe flex-start</div>
    </div>
    <div class="demo-card">
      <div class="flex-container" style="justify-content: end;">
        <div class="flex-item">1</div><div class="flex-item">2</div><div class="flex-item">3</div>
      </div>
      <div class="label">justify-content: end</div>
    </div>
    <div class="demo-card">
      <div class="flex-container" style="justify-content: normal ! important;">
        <div class="flex-item">1</div><div class="flex-item">2</div><div class="flex-item">3</div>
      </div>
      <div class="label">justify-content: normal ! important</div>
    </div>
    <div class="demo-card">
      <div class="flex-container" style="justify-content: stretch ! important;">
        <div class="flex-item">1</div><div class="flex-item">2</div><div class="flex-item">3</div>
      </div>
      <div class="label">justify-content: stretch ! important</div>
    </div>
    <div class="demo-card">
      <div class="flex-container" style="justify-content: space-evenly;">
        <div class="flex-item">1</div><div class="flex-item">2</div><div class="flex-item">3</div>
      </div>
      <div class="label">justify-content: space-evenly</div>
    </div>
  </div>
</body>
</html>
