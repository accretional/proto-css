<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>font-variant-emoji</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .demo-box { background: #16213e; border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .emoji-small { font-size: 28px; letter-spacing: 8px; margin-bottom: 6px; }
</style>
</head>
<body>
<h1>Font Variant Emoji</h1>
<p class="prop-name">font-variant-emoji</p>
<div class="demos">
  <div class="demo-box">
    <div class="demo-area">
      <div style="font-size: 48px; line-height: 1.6; letter-spacing: 12px; text-align: center; font-variant-emoji: normal;">☺ ☁ ⭐ ✈ ☎</div>
    </div>
    <div class="label">font-variant-emoji: normal</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="font-size: 48px; line-height: 1.6; letter-spacing: 12px; text-align: center; font-variant-emoji: text;">☺ ☁ ⭐ ✈ ☎</div>
    </div>
    <div class="label">font-variant-emoji: text</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="font-size: 48px; line-height: 1.6; letter-spacing: 12px; text-align: center; font-variant-emoji: emoji;">☺ ☁ ⭐ ✈ ☎</div>
    </div>
    <div class="label">font-variant-emoji: emoji</div>
  </div>
  <div class="demo-box">
    <div class="demo-area">
      <div style="font-size: 48px; line-height: 1.6; letter-spacing: 12px; text-align: center; font-variant-emoji: unicode;">☺ ☁ ⭐ ✈ ☎</div>
    </div>
    <div class="label">font-variant-emoji: unicode</div>
  </div>
</div>
</body>
</html>
