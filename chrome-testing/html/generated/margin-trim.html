<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>margin-trim</title>
<style>
  :root { --bg: #1a1a2e; --card-bg: #16213e; --accent: #4fc3f7; --font: system-ui, sans-serif; --font-size: 1; --gap: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #e0e0e0; font-family: var(--font); padding: 32px; }
  h1 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .prop-name { font-size: 14px; color: #7b8794; font-family: monospace; margin-bottom: 24px; }
  .demos { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); }
  .demo-box { background: var(--card-bg); border-radius: 10px; padding: 16px; }
  .demo-area { width: 100%; }
  .label { font-size: 11px; font-family: monospace; color: #9ca3af; margin-top: 8px; word-break: break-all; }
  .card-iframe { border: none; width: 100%; display: block; }
  .sim-child { background: #e94560; color: #fff; padding: 8px 12px; font-size: 12px; border-radius: 4px; margin: 40px; }
</style>
</head>
<body>
<div id="control-bar"></div>
<h1>Margin Trim</h1>
<p class="prop-name">margin-trim</p>
<div class="demos">
  <div class="demo-box" data-css-prop="margin-trim" data-value="none">
    <div class="demo-area">
      <div style="background: #0f3460; border: 3px dashed #e94560; border-radius: 6px; overflow: hidden; margin-trim: none;"><div class="sim-child">Child 1</div><div class="sim-child">Child 2</div><div class="sim-child">Child 3</div></div>
    </div>
    <div class="label">margin-trim: none</div>
  </div>
  <div class="demo-box" data-css-prop="margin-trim" data-value="block">
    <div class="demo-area">
      <div style="background: #0f3460; border: 3px dashed #e94560; border-radius: 6px; overflow: hidden; margin-trim: block;"><div class="sim-child">Child 1</div><div class="sim-child">Child 2</div><div class="sim-child">Child 3</div></div>
    </div>
    <div class="label">margin-trim: block</div>
  </div>
  <div class="demo-box" data-css-prop="margin-trim" data-value="inline">
    <div class="demo-area">
      <div style="background: #0f3460; border: 3px dashed #e94560; border-radius: 6px; overflow: hidden; margin-trim: inline;"><div class="sim-child">Child 1</div><div class="sim-child">Child 2</div><div class="sim-child">Child 3</div></div>
    </div>
    <div class="label">margin-trim: inline</div>
  </div>
  <div class="demo-box" data-css-prop="margin-trim" data-value="block-start">
    <div class="demo-area">
      <div style="background: #0f3460; border: 3px dashed #e94560; border-radius: 6px; overflow: hidden; margin-trim: block-start;"><div class="sim-child">Child 1</div><div class="sim-child">Child 2</div><div class="sim-child">Child 3</div></div>
    </div>
    <div class="label">margin-trim: block-start</div>
  </div>
</div>
<script src="../interactive.js"></script>
</body>
</html>
